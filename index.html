<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>RG Creator AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#000;
  --surface:#111;
  --surface2:#181818;
  --surface3:#222;
  --border:#2b2b2b;
  --text:#fff;
  --muted:#8a8a8a;
  --accent:#ff3030;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:
    "Söhne",
    "Inter",
    "Segoe UI",
    "Helvetica Neue",
    Arial,
    sans-serif;
  overflow:hidden;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

pre,
code,
.code,
.code-block,
.code-output,
.technical-text{
  font-family:
    "Söhne Mono",
    "Consolas",
    "Monaco",
    monospace;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= APP ================= */

.app{
  width:100%;
  height:100%;
  position:relative;
  background:#000;
}

/* ================= HEADER ================= */

.header{
  height:62px;
  position:relative;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  background:rgba(0,0,0,.94);
  border-bottom:1px solid #171717;
  backdrop-filter:blur(16px);
}

.header-left,
.header-right{
  display:flex;
  align-items:center;
}

.header-left{
  gap:8px;
  min-width:0;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:#191919;
}

.icon{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.logo-title{
  max-width:58vw;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:16px;
  font-weight:600;
}

/* ================= TOP MORE ================= */

.more-menu{
  position:absolute;
  top:56px;
  right:12px;
  z-index:80;
  width:235px;
  padding:7px;
  background:#191919;
  border:1px solid #303030;
  border-radius:17px;
  box-shadow:0 20px 55px rgba(0,0,0,.75);
  display:none;
}

.more-menu.open{
  display:block;
}

.more-item{
  width:100%;
  min-height:44px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 11px;
  text-align:left;
  font-size:14px;
}

.more-item:hover{
  background:#292929;
}

/* ================= MAIN ================= */

.main{
  height:calc(100% - 62px);
  position:relative;
  display:flex;
  flex-direction:column;
}

/* ================= MESSAGES ================= */

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 160px;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:20px;
}

/* ================= WELCOME ================= */

.welcome{
  width:min(760px,100%);
  margin:13vh auto 0;
  text-align:center;
  transition:.2s;
}

.welcome-logo{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:18px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:18px;
}

.welcome h1{
  margin-top:18px;
  font-size:28px;
  letter-spacing:-.8px;
}

.welcome p{
  margin-top:8px;
  color:#777;
  font-size:14px;
}

/* ================= QUICK ACTIONS ================= */

.quick-actions{
  width:min(760px,100%);
  margin:28px auto 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.quick-action{
  min-height:58px;
  padding:10px;
  border:1px solid #252525;
  background:#101010;
  color:#fff;
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:9px;
  text-align:left;
  transition:.18s;
}

.quick-action:hover{
  background:#191919;
  border-color:#383838;
}

.quick-icon{
  font-size:20px;
}

.quick-text strong{
  display:block;
  font-size:13px;
}

.quick-text span{
  display:block;
  margin-top:3px;
  color:#707070;
  font-size:10px;
}

/* ================= MESSAGE ================= */

.message{
  width:min(760px,100%);
  margin:0 auto 27px;
}

.user-message{
  display:flex;
  justify-content:flex-end;
}

.user-bubble{
  max-width:84%;
  padding:12px 15px;
  border-radius:20px 20px 5px 20px;
  background:#252525;
  color:#fff;
  font-size:15px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.ai-message{
  font-size:15px;
  line-height:1.7;
}

.ai-content{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-actions{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:2px;
}

.action-btn{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  color:#858585;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.action-btn:hover{
  background:#181818;
  color:#fff;
}

/* ================= COMPOSER ================= */

.input-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:25;
  padding:9px 11px 16px;
  background:linear-gradient(
    transparent,
    #000 26%
  );
}

.composer{
  width:min(760px,100%);
  margin:auto;
  background:#151515;
  border:1px solid #303030;
  border-radius:24px;
  padding:10px;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
}

.composer textarea{
  width:100%;
  min-height:45px;
  max-height:150px;
  padding:7px 8px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:15px;
  line-height:1.5;
}

.composer textarea::placeholder{
  color:#707070;
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.composer-left,
.composer-right{
  display:flex;
  align-items:center;
  gap:3px;
}

.circle-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
}

.circle-btn:hover{
  background:#252525;
  color:#fff;
}

.send-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.send-btn:hover{
  transform:scale(1.04);
}

/* ================= PLUS MENU ================= */

.plus-wrap{
  position:relative;
}

.plus-menu{
  position:absolute;
  left:0;
  bottom:49px;
  width:215px;
  padding:7px;
  border:1px solid #333;
  background:#1a1a1a;
  border-radius:17px;
  box-shadow:0 18px 55px rgba(0,0,0,.7);
  display:none;
}

.plus-menu.open{
  display:block;
}

.plus-item{
  width:100%;
  height:44px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 11px;
  text-align:left;
}

.plus-item:hover{
  background:#292929;
}

/* ================= ATTACHMENT ================= */

.attachment{
  display:none;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  padding:8px 10px;
  border-radius:11px;
  background:#202020;
  color:#bbb;
  font-size:12px;
}

.attachment.show{
  display:flex;
}

.attachment-preview{
  width:44px;
  height:44px;
  object-fit:cover;
  border-radius:8px;
  display:none;
  flex:none;
}

.attachment-remove{
  margin-left:auto;
  border:0;
  background:transparent;
  color:#aaa;
  font-size:22px;
  line-height:1;
  cursor:pointer;
  padding:2px 6px;
}

.message-image{
  display:block;
  width:min(320px,100%);
  max-height:360px;
  object-fit:contain;
  border-radius:14px;
  margin-bottom:8px;
}

/* ================= SIDEBAR ================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.67);
  display:none;
}

.overlay.show{
  display:block;
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  z-index:100;
  width:min(310px,87vw);
  background:#111;
  border-right:1px solid #292929;
  transform:translateX(-100%);
  transition:.23s ease;
  display:flex;
  flex-direction:column;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-head{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 11px;
  border-bottom:1px solid #242424;
}

.sidebar-title{
  font-size:16px;
  font-weight:700;
}

.new-chat{
  height:45px;
  margin:12px;
  border:1px solid #303030;
  background:#191919;
  color:#fff;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 14px;
  font-size:14px;
}

.new-chat:hover{
  background:#222;
}

.search{
  width:calc(100% - 24px);
  height:42px;
  margin:0 12px 10px;
  padding:0 12px;
  border:1px solid #2b2b2b;
  border-radius:12px;
  outline:none;
  background:#171717;
  color:#fff;
}

.history{
  flex:1;
  overflow-y:auto;
  padding:0 8px 8px;
}

.history-label{
  padding:11px 8px 6px;
  color:#6e6e6e;
  font-size:11px;
  text-transform:uppercase;
}

.history-item{
  min-height:45px;
  padding:0 8px;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#ddd;
}

.history-item:hover{
  background:#1e1e1e;
}

.history-name{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.history-more{
  width:30px;
  height:30px;
  border:0;
  background:transparent;
  color:#777;
  border-radius:8px;
}

.history-more:hover{
  background:#292929;
  color:#fff;
}

/* NORMAL MENU BOTTOM */

.sidebar-bottom{
  margin-top:auto;
  padding:10px;
  border-top:1px solid #252525;
}

.sidebar-bottom-btn{
  width:100%;
  min-height:46px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 11px;
  text-align:left;
  font-size:14px;
}

.sidebar-bottom-btn:hover{
  background:#202020;
}

/* ================= MODAL ================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  max-height:85vh;
  overflow:auto;
  background:#151515;
  border:1px solid #303030;
  border-radius:19px;
  box-shadow:0 25px 70px rgba(0,0,0,.8);
}

.modal-head{
  min-height:58px;
  padding:0 14px 0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #292929;
}

.modal-head h2{
  font-size:16px;
}

.modal-close{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#aaa;
  font-size:24px;
}

.modal-close:hover{
  background:#242424;
  color:#fff;
}

#modalBody{
  padding:18px;
  color:#ccc;
  line-height:1.6;
  font-size:14px;
}

#modalBody input,
#modalBody textarea,
#modalBody select{
  width:100%;
  padding:11px;
  margin-top:7px;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
  background:#0e0e0e;
  color:#fff;
}

#modalBody label{
  display:block;
  margin-top:13px;
  color:#aaa;
}

.modal-primary{
  width:100%;
  min-height:43px;
  margin-top:15px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:600;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  z-index:900;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:10px 14px;
  background:#242424;
  border:1px solid #3a3a3a;
  border-radius:11px;
  color:#fff;
  font-size:12px;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= MOBILE ================= */

@media(max-width:620px){

  .header{
    height:58px;
  }

  .main{
    height:calc(100% - 58px);
  }

  .welcome{
    margin-top:10vh;
  }

  .welcome h1{
    font-size:24px;
  }

  .quick-actions{
    grid-template-columns:repeat(2,1fr);
  }

  .quick-action{
    min-height:54px;
  }

  .user-bubble{
    max-width:90%;
  }

  .messages{
    padding-left:10px;
    padding-right:10px;
  }

  .composer{
    border-radius:21px;
  }

}


/* ================= LOGO ================= */

.brand-logo{
  width:34px;
  height:34px;
  border-radius:10px;
  object-fit:cover;
  display:block;
}

.welcome-brand-logo{
  width:72px;
  height:72px;
  margin:auto;
  border-radius:20px;
  object-fit:cover;
  display:block;
}

</style>
</head>


<body>

<div class="app">


<!-- ================= HEADER ================= -->

<header class="header">

  <div class="header-left">

    <button
      class="icon-btn"
      onclick="openSidebar()"
      aria-label="Menu"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </svg>
    </button>


    <img
      class="brand-logo"
      src="assets/rg-logo.jpg"
      alt="RG Creator AI"
      onerror="this.style.display='none'"
    >


    <div class="logo-title">
      RG Creator AI
    </div>

  </div>


  <div class="header-right">

    <button
      class="icon-btn"
      onclick="toggleMore()"
      aria-label="More"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.2"/>
        <circle cx="12" cy="12" r="1.2"/>
        <circle cx="19" cy="12" r="1.2"/>
      </svg>
    </button>

  </div>

</header>


<!-- ================= MORE MENU ================= -->

<div
  class="more-menu"
  id="moreMenu"
>

  <button
    class="more-item"
    onclick="shareConversation()"
  >
    🔗
    Share
  </button>

  <button
    class="more-item"
    onclick="openSidebar()"
  >
    💬
    Chat History
  </button>

  <button
    class="more-item"
    onclick="showHelp()"
  >
    ❓
    Help
  </button>

  <button
    class="more-item"
    onclick="showFeedback()"
  >
    💡
    Feedback
  </button>

  <button
    class="more-item"
    onclick="showAbout()"
  >
    ℹ️
    About
  </button>

  <button
    class="more-item"
    onclick="deleteConversation()"
  >
    🗑️
    Delete
  </button>

</div>


<!-- ================= MAIN ================= -->

<main class="main">

  <div
    class="messages"
    id="messages"
  >

    <section
      class="welcome"
      id="welcome"
    >

      <img
        class="welcome-brand-logo"
        src="assets/rg-logo.jpg"
        alt="RG Creator AI"
        onerror="this.style.display='none'"
      >

      <h1>
        How can I help you?
      </h1>

      <p>
        Ask anything, create content or build something.
      </p>


      <div class="quick-actions">

        <button
          class="quick-action"
          onclick="openTool('Image.html')"
        >
          <span class="quick-icon">🖼️</span>
          <span class="quick-text">
            <strong>AI Image</strong>
            <span>Create images</span>
          </span>
        </button>


        <button
          class="quick-action"
          onclick="openTool('writer.html')"
        >
          <span class="quick-icon">✍️</span>
          <span class="quick-text">
            <strong>Content Writer</strong>
            <span>Write content</span>
          </span>
        </button>


        <button
          class="quick-action"
          onclick="openTool('Code.html')"
        >
          <span class="quick-icon">💻</span>
          <span class="quick-text">
            <strong>Code Generator</strong>
            <span>Build & fix code</span>
          </span>
        </button>


        <button
          class="quick-action"
          onclick="openTool('youtube.html')"
        >
          <span class="quick-icon">▶️</span>
          <span class="quick-text">
            <strong>YouTube</strong>
            <span>Creator tools</span>
          </span>
        </button>


        <button
          class="quick-action"
          onclick="openTool('Instagram.html')"
        >
          <span class="quick-icon">📸</span>
          <span class="quick-text">
            <strong>Instagram</strong>
            <span>Reels & captions</span>
          </span>
        </button>


        <button
          class="quick-action"
          onclick="focusInput()"
        >
          <span class="quick-icon">💬</span>
          <span class="quick-text">
            <strong>AI Chat</strong>
            <span>Ask anything</span>
          </span>
        </button>

      </div>

    </section>

  </div>


  <!-- ================= INPUT ================= -->

  <div class="input-area">

    <div class="composer">

      <div
        class="attachment"
        id="attachment"
      >
        <img
          id="attachmentPreview"
          class="attachment-preview"
          alt="Selected image"
        >

        <span id="attachmentName"></span>

        <button
          type="button"
          class="attachment-remove"
          onclick="clearAttachment()"
          aria-label="Remove attachment"
        >
          ×
        </button>
      </div>


      <textarea
        id="input"
        rows="1"
        placeholder="Ask anything..."
      ></textarea>


      <div class="composer-bottom">

        <div class="composer-left">

          <div class="plus-wrap">

            <button
              class="circle-btn"
              onclick="togglePlus()"
              aria-label="Attach"
            >
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 5v14"/>
                <path d="M5 12h14"/>
              </svg>
            </button>


            <div
              class="plus-menu"
              id="plusMenu"
            >

              <button
                class="plus-item"
                onclick="pick('imageInput')"
              >
                🖼️
                Image
              </button>

              <button
                class="plus-item"
                onclick="pick('cameraInput')"
              >
                📷
                Camera
              </button>

              <button
                class="plus-item"
                onclick="pick('videoInput')"
              >
                🎥
                Video
              </button>

              <button
                class="plus-item"
                onclick="pick('fileInput')"
              >
                📄
                File
              </button>

              <button
                class="plus-item"
                onclick="pick('pdfInput')"
              >
                📕
                PDF
              </button>

            </div>

          </div>


          <button
            class="circle-btn"
            onclick="startVoice()"
            aria-label="Voice"
          >
            🎤
          </button>

        </div>


        <div class="composer-right">

          <button
            class="send-btn"
            onclick="sendMessage()"
            aria-label="Send"
          >
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M5 12h14"/>
              <path d="m13 6 6 6-6 6"/>
            </svg>
          </button>

        </div>

      </div>

    </div>

  </div>

</main>


<!-- ================= FILE INPUTS ================= -->

<input
  id="imageInput"
  type="file"
  accept="image/*"
  hidden
  onchange="handleFile(this)"
>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  hidden
  onchange="handleFile(this)"
>

<input
  id="videoInput"
  type="file"
  accept="video/*"
  hidden
  onchange="handleFile(this)"
>

<input
  id="fileInput"
  type="file"

<script>

/* =====================================================
   RG CREATOR AI — MAIN HOME + CHAT
===================================================== */


/* ================= STATE ================= */

let conversation =
  JSON.parse(
    localStorage.getItem(
      "rg_creator_conversation"
    ) || "[]"
  );

let currentAttachment = null;


/* ================= ELEMENTS ================= */

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");


/* ================= INIT ================= */

renderConversation();

renderHistory();

autoResize();


/* ================= TOAST ================= */

function toast(text){

  const el =
    document.getElementById("toast");

  el.textContent =
    text;

  el.classList.add("show");

  setTimeout(
    function(){
      el.classList.remove("show");
    },
    2200
  );

}


/* ================= INPUT ================= */

input.addEventListener(
  "input",
  autoResize
);

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


function autoResize(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";

}


function focusInput(){

  input.focus();

}


/* ================= PLUS ================= */

function togglePlus(){

  document
    .getElementById("plusMenu")
    .classList.toggle("open");

}


function closePlus(){

  document
    .getElementById("plusMenu")
    .classList.remove("open");

}


/* ================= FILE ================= */

function pick(id){

  closePlus();

  document
    .getElementById(id)
    .click();

}


function fileToDataURL(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          resolve(
            reader.result
          );

        };

      reader.onerror =
        function(){

          reject(
            new Error(
              "Unable to read file"
            )
          );

        };

      reader.readAsDataURL(
        file
      );

    }
  );

}


async function handleFile(el){

  if(
    !el.files ||
    !el.files.length
  ){

    return;

  }


  currentAttachment =
    el.files[0];


  const box =
    document.getElementById(
      "attachment"
    );

  const name =
    document.getElementById(
      "attachmentName"
    );

  const preview =
    document.getElementById(
      "attachmentPreview"
    );


  name.textContent =
    currentAttachment.name;


  if(
    currentAttachment.type &&
    currentAttachment.type.startsWith(
      "image/"
    )
  ){

    try{

      preview.src =
        await fileToDataURL(
          currentAttachment
        );

      preview.style.display =
        "block";

    }catch(error){

      preview.removeAttribute(
        "src"
      );

      preview.style.display =
        "none";

    }

  }else{

    preview.removeAttribute(
      "src"
    );

    preview.style.display =
      "none";

  }


  box.classList.add(
    "show"
  );


  toast(
    "Attached: " +
    currentAttachment.name
  );

}


/* ================= SEND ================= */

async function sendMessage(){

  const text =
    input.value.trim();

  const attachment =
    currentAttachment;


  if(
    !text &&
    !attachment
  ){

    return;

  }


  let imageData =
    null;


  if(
    attachment &&
    attachment.type &&
    attachment.type.startsWith(
      "image/"
    )
  ){

    try{

      imageData =
        await fileToDataURL(
          attachment
        );

    }catch(error){

      toast(
        "Image could not be read"
      );

      return;

    }

  }


  const userText =
    text ||
    "Please analyze this image.";


  addMessage(
    "user",
    text,
    imageData
  );


  input.value =
    "";

  autoResize();

  clearAttachment();


  const thinkingIndex =
    addMessage(
      "assistant",
      "Thinking..."
    );


  try{

    const history =
      conversation
        .slice(
          0,
          thinkingIndex
        )
        .map(
          function(item){

            return {
              role:item.role,
              content:item.content
            };

          }
        );


    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                userText,

              history:
                history,

              images:
                imageData
                  ? [
                      {
                        mimeType:
                          attachment.type,

                        data:
                          imageData
                            .split(",")[1]
                      }
                    ]
                  : []

            })
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "AI request failed"
      );

    }


    updateMessage(
      thinkingIndex,
      data.reply
    );


  }catch(error){

    updateMessage(
      thinkingIndex,

      "Sorry, I couldn't complete that request.\n\n" +
      (
        error.message ||
        "Server error"
      )
    );

  }

}


/* ================= CONVERSATION ================= */

function addMessage(
  role,
  content,
  image = null
){

  conversation.push({

    role:
      role,

    content:
      content,

    image:
      image,

    time:
      Date.now()

  });


  saveConversation();

  renderConversation();


  return conversation.length - 1;

}


function updateMessage(
  index,
  content
){

  if(
    !conversation[index]
  ){

    return;

  }


  conversation[index].content =
    content;


  saveConversation();

  renderConversation();

}


function saveConversation(){

  localStorage.setItem(
    "rg_creator_conversation",
    JSON.stringify(
      conversation
    )
  );

}


/* ================= RENDER ================= */

function renderConversation(){

  if(
    !conversation.length
  ){

    messages.innerHTML =
      welcome.outerHTML;

    return;

  }


  messages.innerHTML =
    "";


  conversation.forEach(
    function(item,index){

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "message " +
        (
          item.role === "user"
            ? "user-message"
            : "ai-message"
        );


      if(
        item.role === "user"
      ){

        wrapper.innerHTML = `

          <div class="user-bubble">

            ${
              item.image
                ? `
                  <img
                    class="message-image"
                    src="${item.image}"
                    alt="Uploaded image"
                  >
                `
                : ""
            }

            ${
              item.content
                ? `
                  <div>
                    ${escapeHTML(
                      item.content
                    )}
                  </div>
                `
                : ""
            }

          </div>

        `;

      }else{

        wrapper.innerHTML = `

          <div class="ai-content">
            ${formatAI(item.content)}
          </div>

          <div class="message-actions">

            <button
              class="action-btn"
              onclick="copyAI(${index})"
              title="Copy"
            >
              ${copyIcon()}
            </button>

            <button
              class="action-btn"
              onclick="feedback('like')"
              title="Like"
            >
              👍
            </button>

            <button
              class="action-btn"
              onclick="feedback('dislike')"
              title="Dislike"
            >
              👎
            </button>

            <button
              class="action-btn"
              onclick="shareAI(${index})"
              title="Share"
            >
              ${shareIcon()}
            </button>

            <button
              class="action-btn"
              onclick="regenerate(${index})"
              title="Regenerate"
            >
              ${refreshIcon()}
            </button>

            <button
              class="action-btn"
              onclick="aiMore(${index})"
              title="More"
            >
              ${moreIcon()}
            </button>

          </div>

        `;

      }


      messages.appendChild(
        wrapper
      );

    }
  );


  requestAnimationFrame(
    function(){

      messages.scrollTop =
        messages.scrollHeight;

    }
  );

}


/* ================= AI FORMAT ================= */

function formatAI(text){

  return escapeHTML(
    text
  );

}


/* ================= COPY ================= */

async function copyAI(index){

  try{

    await navigator.clipboard.writeText(
      conversation[index].content
    );

    toast(
      "Copied"
    );

  }catch{

    toast(
      "Copy failed"
    );

  }

}


/* ================= FEEDBACK ================= */

function feedback(type){

  toast(
    type === "like"
      ? "Thanks for your feedback 👍"
      : "Thanks for your feedback"
  );

}


/* ================= SHARE ================= */

async function shareAI(index){

  try{

    await navigator.share({

      title:
        "RG Creator AI",

      text:
        conversation[index].content

    });

  }catch{

    copyAI(index);

  }

}


/* ================= REGENERATE ================= */

async function regenerate(index){

  if(
    !conversation[index]
  ){

    return;

  }


  let userIndex =
    index - 1;


  while(
    userIndex >= 0 &&
    conversation[userIndex].role !== "user"
  ){

    userIndex--;

  }


  if(
    userIndex < 0
  ){

    toast(
      "No previous user message found"
    );

    return;

  }


  const userMessage =
    conversation[userIndex].content;


  conversation[index].content =
    "Regenerating...";


  saveConversation();

  renderConversation();


  try{

    const history =
      conversation
        .slice(
          0,
          index
        )
        .map(
          function(item){

            return {
              role:item.role,
              content:item.content
            };

          }
        );


    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                userMessage,

              history:
                history

            })

          }
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Regeneration failed"
      );

    }


    updateMessage(
      index,
      data.reply
    );


  }catch(error){

    updateMessage(
      index,

      "Sorry, regeneration failed.\n\n" +
      (
        error.message ||
        "Server error"
      )
    );

  }

}


/* ================= NEW CHAT ================= */

function newChat(){

  conversation =
    [];

  saveConversation();

  renderConversation();

  closeSidebar();

  focusInput();

}


/* ================= HISTORY ================= */

function renderHistory(){

  const history =
    document.getElementById(
      "history"
    );

  if(!history){

    return;

  }


  const search =
    (
      document.getElementById(
        "historySearch"
      )?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  history.innerHTML =
    "";


  if(
    !conversation.length
  ){

    history.innerHTML = `
      <div
        style="
          padding:20px 10px;
          color:#666;
          font-size:12px;
          text-align:center;
        "
      >
        No chats yet
      </div>
    `;

    return;

  }


  const seen =
    new Set();


  conversation.forEach(
    function(item){

      if(
        item.role !== "user"
      ){

        return;

      }


      const title =
        (
          item.content ||
          "Image conversation"
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();


      if(
        seen.has(title)
      ){

        return;

      }


      seen.add(title);


      if(
        search &&
        !title
          .toLowerCase()
          .includes(search)
      ){

        return;

      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "history-item";


      row.innerHTML = `

        <span>💬</span>

        <span class="history-name">
          ${escapeHTML(title)}
        </span>

        <button
          class="history-more"
          onclick="event.stopPropagation();"
        >
          ⋮
        </button>

      `;


      row.onclick =
        function(){

          closeSidebar();

          renderConversation();

        };


      history.appendChild(
        row
      );

    }
  );

}

function deleteConversation(){

    !conversation.length
  ){

    toast(
      "Nothing to delete"

    return;

  }


  showModal(
    "Delete conversation?",
    `

  renderConversation();

  renderHistory();

  hideModal();

  toast(

  );

}


/* ================= SHARE CONVERSATION ================= */

async function shareConversation(){

  closeMore();

  const text =
    conversation
      .map(
        function(item){

          return (
            item.role.toUpperCase() +
            ":\n" +
            (
              item.content ||
              "[Image]"
            )
          );

        }
      )
      .join(
        "\n\n"
      );


  if(
    !text
  ){

    toast(
      "Nothing to share"
    );

    return;

  }


  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:
          "RG Creator AI",

        text:
          text

      });

    }else{

      await navigator.clipboard.writeText(
        text
      );

      toast(
        "Conversation copied"
      );

    }

  }catch{

    toast(
      "Share cancelled"
    );

  }

}

}

/* ================= ESCAPE ================= */

function escapeHTML(text){

  return String(
    text ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

function openLogin(){

  showModal(
    "Log in / Sign up",
    `
      <p>
        Login will be connected here.
      </p>

      <button
        class="modal-primary"
        onclick="hideModal()"
      >
        Continue
      </button>
    `
  );

}


/* ================= VOICE ================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(
    !SpeechRecognition
  ){

    toast(
      "Voice input is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";

  recognition.interimResults =
    true;

  recognition.continuous =
    false;


  recognition.onstart =
    function(){

      toast(
        "Listening..."
      );

    };


  recognition.onresult =
    function(event){

      let transcript =
        "";

      for(
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ){

        transcript +=
          event.results[i][0].transcript;

      }


      input.value =
        transcript;

      autoResize();

      input.focus();

    };


  recognition.onerror =
    function(){

      toast(
        "Voice input failed"
      );

    };


  recognition.start();

}


/* ================= ATTACHMENT CLEAR ================= */

function clearAttachment(){

  currentAttachment =
    null;


  const box =
    document.getElementById(
      "attachment"
    );

  const preview =
    document.getElementById(
      "attachmentPreview"
    );

  const name =
    document.getElementById(
      "attachmentName"
    );


  box.classList.remove(
    "show"
  );

  preview.removeAttribute(
    "src"
  );

  preview.style.display =
    "none";

  name.textContent =
    "";


  [
    "imageInput",
    "cameraInput",
    "videoInput",
    "fileInput",
    "pdfInput"
  ].forEach(
    function(id){

      const el =
        document.getElementById(
          id
        );

      if(el){

        el.value =
          "";

      }

    }
  );

}
