<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Creator AI</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#000;
  color:#fff;
}

body{
  display:flex;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  background:#000;
}

.sidebar{
  width:270px;
  height:100%;
  background:#050505;
  border-right:1px solid #222;
  display:flex;
  flex-direction:column;
  padding:16px 12px;
  transition:.25s;
  z-index:50;
}

.sidebar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo-wrap{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-wrap img{
  width:42px;
  height:42px;
  border-radius:10px;
  object-fit:cover;
}

.logo-text{
  font-size:18px;
  font-weight:700;
}

.close-sidebar{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#111;
  color:#ccc;
  font-size:20px;
}

.new-chat{
  width:100%;
  height:46px;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-weight:700;
  margin-bottom:12px;
}

.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:#111;
  border:1px solid #222;
  border-radius:12px;
  padding:0 12px;
  height:44px;
  margin-bottom:10px;
}

.search-box input{
  width:100%;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
}

.search-box input::placeholder{
  color:#777;
}

.sidebar-menu{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.menu-item{
  width:100%;
  min-height:44px;
  border-radius:10px;
  background:transparent;
  color:#ccc;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 12px;
  text-align:left;
}

.menu-item:hover,
.menu-item.active{
  background:#151515;
  color:#fff;
}

.menu-icon{
  width:24px;
  text-align:center;
  font-size:20px;
}

.projects-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#888;
  font-size:12px;
  padding:14px 10px 7px;
  text-transform:uppercase;
}

.projects-list{
  max-height:180px;
  overflow:auto;
}

.project-item{
  padding:9px 10px;
  color:#bbb;
  border-radius:9px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.project-item:hover{
  background:#151515;
  color:#fff;
}

.sidebar-bottom{
  margin-top:auto;
  border-top:1px solid #1d1d1d;
  padding-top:10px;
}

.profile-button{
  width:100%;
  min-height:52px;
  border-radius:12px;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 9px;
  text-align:left;
}

.profile-button:hover{
  background:#151515;
}

.profile-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex:none;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info{
  min-width:0;
}

.profile-name{
  font-size:14px;
  font-weight:600;
}

.profile-status{
  font-size:11px;
  color:#777;
  margin-top:2px;
}

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:64px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #171717;
  background:#000;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.mobile-menu{
  display:none;
  width:40px;
  height:40px;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:21px;
}

.page-title{
  font-size:18px;
  font-weight:700;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.top-button{
  width:40px;
  height:40px;
  border-radius:10px;
  background:#111;
  color:#ddd;
  font-size:19px;
}

.chat-area{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:25px 20px 150px;
}

.chat-inner{
  width:min(900px,100%);
  margin:0 auto;
}

.welcome{
  min-height:calc(100vh - 260px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 10px;
}

.welcome-logo{
  width:78px;
  height:78px;
  border-radius:20px;
  object-fit:cover;
  margin-bottom:18px;
}

.welcome h1{
  font-size:32px;
  margin-bottom:10px;
}

.welcome p{
  color:#888;
  max-width:560px;
  line-height:1.6;
}

.quick-actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:28px;
  width:min(620px,100%);
}

.quick-action{
  min-height:70px;
  padding:12px;
  border-radius:14px;
  border:1px solid #222;
  background:#0d0d0d;
  color:#ddd;
  text-align:left;
}

.quick-action:hover{
  border-color:#444;
  background:#151515;
}

.quick-action strong{
  display:block;
  margin-bottom:4px;
  color:#fff;
}

.quick-action span{
  color:#777;
  font-size:12px;
}

.message{
  display:flex;
  flex-direction:column;
  margin-bottom:24px;
}

.message.user{
  align-items:flex-end;
}

.message.ai{
  align-items:flex-start;
}

.message-bubble{
  max-width:82%;
  padding:13px 16px;
  border-radius:16px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user .message-bubble{
  background:#1d1d1d;
  color:#fff;
  border-bottom-right-radius:5px;
}

.message.ai .message-bubble{
  background:transparent;
  color:#eee;
  padding-left:0;
}

.message-image{
  max-width:330px;
  max-height:330px;
  object-fit:contain;
  border-radius:14px;
  margin-bottom:8px;
  border:1px solid #252525;
}

.message-actions{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
  opacity:.8;
}

.message.user .message-actions{
  justify-content:flex-end;
}

.message-action{
  width:31px;
  height:31px;
  border-radius:8px;
  background:#111;
  color:#aaa;
  font-size:15px;
}

.message-action:hover{
  background:#1b1b1b;
  color:#fff;
}

.typing{
  display:flex;
  gap:5px;
  padding:8px 0;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#777;
  animation:blink 1.2s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes blink{
  0%,80%,100%{opacity:.25}
  40%{opacity:1}
}

.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:14px 20px 18px;
  background:linear-gradient(transparent,#000 25%);
}

.composer{
  width:min(900px,100%);
  margin:0 auto;
  position:relative;
}

.attach-preview{
  display:none;
  margin-bottom:8px;
  background:#0d0d0d;
  border:1px solid #222;
  border-radius:12px;
  padding:8px;
  position:relative;
  width:max-content;
  max-width:100%;
}

.attach-preview.show{
  display:block;
}

.attach-preview img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
}

.remove-attachment{
  position:absolute;
  top:3px;
  right:3px;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#000;
  color:#fff;
}

.input-box{
  min-height:64px;
  border:1px solid #292929;
  background:#0c0c0c;
  border-radius:18px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  box-shadow:0 0 30px rgba(0,0,0,.35);
}

.textarea{
  flex:1;
  min-height:45px;
  max-height:180px;
  resize:none;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  padding:11px 8px;
  line-height:1.45;
}

.textarea::placeholder{
  color:#666;
}

.composer-button{
  width:48px;
  height:48px;
  border-radius:13px;
  background:#171717;
  color:#ddd;
  font-size:24px;
  flex:none;
}

.composer-button:hover{
  background:#222;
  color:#fff;
}

.send-button{
  background:#fff;
  color:#000;
  font-size:20px;
}

.send-button:hover{
  background:#ddd;
}

.composer-left{
  display:flex;
  gap:5px;
  align-items:center;
}

.composer-right{
  display:flex;
  gap:5px;
  align-items:center;
}

.plus-menu{
  position:absolute;
  left:0;
  bottom:75px;
  width:245px;
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:7px;
  display:none;
  box-shadow:0 15px 40px rgba(0,0,0,.6);
  z-index:30;
}

.plus-menu.show{
  display:block;
}

.plus-option{
  width:100%;
  min-height:43px;
  border-radius:9px;
  background:transparent;
  color:#ddd;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 10px;
  text-align:left;
}

.plus-option:hover{
  background:#1d1d1d;
}

.plus-option-icon{
  width:25px;
  text-align:center;
  font-size:18px;
}

.think-active{
  color:#fff;
  background:#1b1b1b;
}

.hidden-input{
  display:none;
}

.overlay{
  display:none;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  z-index:100;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(520px,100%);
  background:#111;
  border:1px solid #2a2a2a;
  border-radius:18px;
  padding:20px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-title{
  font-size:18px;
  font-weight:700;
}

.modal-close{
  width:35px;
  height:35px;
  border-radius:9px;
  background:#1b1b1b;
  color:#ccc;
}

.modal-input{
  width:100%;
  height:46px;
  border-radius:10px;
  border:1px solid #292929;
  background:#080808;
  color:#fff;
  outline:0;
  padding:0 12px;
  margin-bottom:12px;
}

.modal-button{
  width:100%;
  height:46px;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-weight:700;
}

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:800px){
  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    bottom:0;
    transition:.25s;
  }

  .sidebar.open{
    left:0;
  }

  .overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:40;
  }

  .mobile-menu{
    display:block;
  }

  .quick-actions{
    grid-template-columns:1fr;
  }

  .chat-area{
    padding-left:12px;
    padding-right:12px;
  }

  .composer-wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .message-bubble{
    max-width:90%;
  }
}

@media(max-width:480px){
  .page-title{
    font-size:16px;
  }

  .welcome h1{
    font-size:26px;
  }

  .top-button{
    width:36px;
    height:36px;
  }

  .composer-button{
    width:46px;
    height:46px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <div class="logo-wrap">
        <img src="assets/rg-logo.jpg" alt="RG Creator AI">
        <div class="logo-text">RG Creator AI</div>
      </div>

      <button class="close-sidebar" id="closeSidebar" aria-label="Close sidebar">
        ×
      </button>
    </div>

    <button class="new-chat" id="newChatButton">
      + New Chat
    </button>

    <div class="search-box">
      <span>⌕</span>
      <input
        id="searchInput"
        type="text"
        placeholder="Search"
        autocomplete="off"
      >
    </div>

    <div class="sidebar-menu">

      <button class="menu-item active" id="chatMenu">
        <span class="menu-icon">💬</span>
        <span>AI Chat</span>
      </button>

      <button class="menu-item" id="imageMenu">
        <span class="menu-icon">🖼️</span>
        <span>AI Image Generator</span>
      </button>

      <button class="menu-item" id="writerMenu">
        <span class="menu-icon">✍️</span>
        <span>Content Writer</span>
      </button>

      <button class="menu-item" id="codeMenu">
        <span class="menu-icon">💻</span>
        <span>Code Generator</span>
      </button>

      <button class="menu-item" id="youtubeMenu">
        <span class="menu-icon">▶</span>
        <span>YouTube Tools</span>
      </button>

      <button class="menu-item" id="instagramMenu">
        <span class="menu-icon">◎</span>
        <span>Instagram Tools</span>
      </button>

      <button class="menu-item" id="projectsMenu">
        <span class="menu-icon">📁</span>
        <span>Projects</span>
      </button>

    </div>

    <div class="projects-title">
      <span>Projects</span>
      <button
        id="addProjectButton"
        style="background:transparent;color:#888;font-size:18px;"
        aria-label="Add project"
      >
        +
      </button>
    </div>

    <div class="projects-list" id="projectsList"></div>

    <div class="sidebar-bottom">

      <button class="profile-button" id="profileButton">

        <div class="profile-avatar">
          <span id="profileInitial">G</span>
        </div>

        <div class="profile-info">
          <div class="profile-name" id="profileName">
            Login / Sign up
          </div>
          <div class="profile-status">
            Account
          </div>
        </div>

      </button>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          class="mobile-menu"
          id="mobileMenu"
          aria-label="Open menu"
        >
          ☰
        </button>

        <div class="page-title" id="pageTitle">
          AI Chat
        </div>

      </div>

      <div class="top-actions">

        <button
          class="top-button"
          id="clearChatButton"
          title="Clear chat"
        >
          ⌫
        </button>

      </div>

    </header>

    <section class="chat-area" id="chatArea">

      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <img
            class="welcome-logo"
            src="assets/rg-logo.jpg"
            alt="RG Creator AI"
          >

          <h1>How can I help you?</h1>

          <p>
            Ask anything, upload an image, write content,
            generate code, or use creator tools.
          </p>

          <div class="quick-actions">

            <button
              class="quick-action"
              data-prompt="Give me 5 viral YouTube Shorts ideas for 2026."
            >
              <strong>🎬 YouTube Ideas</strong>
              <span>Get quick content ideas.</span>
            </button>

            <button
              class="quick-action"
              data-prompt="Give me 5 viral Instagram Reel ideas for 2026."
            >
              <strong>📱 Instagram Ideas</strong>
              <span>Generate Reel ideas.</span>
            </button>

            <button
              class="quick-action"
              data-prompt="Write a short professional caption for a social media post."
            >
              <strong>✍️ Write Content</strong>
              <span>Create captions and posts.</span>
            </button>

            <button
              class="quick-action"
              data-prompt="Explain how to build a simple website step by step."
            >
              <strong>💻 Coding Help</strong>
              <span>Get coding guidance.</span>
            </button>

          </div>

        </div>

      </div>

    </section>

    <div class="composer-wrap">

      <div class="composer">

        <div class="attach-preview" id="attachPreview">

          <img id="previewImage" alt="Selected image">

          <button
            class="remove-attachment"
            id="removeAttachment"
            title="Remove image"
          >
            ×
          </button>

        </div>

        <div class="plus-menu" id="plusMenu">

          <button
            class="plus-option"
            id="uploadImageOption"
          >
            <span class="plus-option-icon">🖼️</span>
            <span>Upload image</span>
          </button>

          <button
            class="plus-option"
            id="thinkOption"
          >
            <span class="plus-option-icon">🧠</span>
            <span>Think</span>
          </button>

          <button
            class="plus-option"
            id="projectOption"
          >
            <span class="plus-option-icon">📁</span>
            <span>Add to project</span>
          </button>

        </div>

        <div class="input-box">

          <div class="composer-left">

            <button
              class="composer-button"
              id="plusButton"
              title="More options"
              aria-label="More options"
            >
              +
            </button>

          </div>

          <textarea
            class="textarea"
            id="messageInput"
            rows="1"
            placeholder="Message RG Creator AI..."
          ></textarea>

          <div class="composer-right">

            <button
              class="composer-button"
              id="voiceButton"
              title="Voice message"
              aria-label="Voice message"
            >
              🎤
            </button>

            <button
              class="composer-button send-button"
              id="sendButton"
              title="Send"
              aria-label="Send"
            >
              ↑
            </button>

          </div>

        </div>

        <input
          class="hidden-input"
          id="imageInput"
          type="file"
          accept="image/*"
        >

      </div>

    </div>

  </main>

</div>

<div class="modal" id="profileModal">

  <div class="modal-card">

    <div class="modal-header">
      <div class="modal-title">Profile</div>

      <button
        class="modal-close"
        id="profileModalClose"
      >
        ×
      </button>
    </div>

    <input
      class="modal-input"
      id="profileNameInput"
      type="text"
      placeholder="Enter your name"
    >

    <button
      class="modal-button"
      id="profileSaveButton"
    >
      Save
    </button>

  </div>

</div>

<div class="modal" id="projectModal">

  <div class="modal-card">

    <div class="modal-header">
      <div class="modal-title">Create Project</div>

      <button
        class="modal-close"
        id="projectModalClose"
      >
        ×
      </button>
    </div>

    <input
      class="modal-input"
      id="projectNameInput"
      type="text"
      placeholder="Project name"
    >

    <button
      class="modal-button"
      id="projectSaveButton"
    >
      Create Project
    </button>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  "use strict";

  const state = {
    messages: [],
    selectedImage: null,
    selectedImageData: null,
    thinking: false,
    currentProject: null,
    projects: []
  };

  const $ = id => document.getElementById(id);

  const sidebar = $("sidebar");
  const sidebarOverlay = $("sidebarOverlay");
  const mobileMenu = $("mobileMenu");
  const closeSidebar = $("closeSidebar");

  const newChatButton = $("newChatButton");
  const clearChatButton = $("clearChatButton");

  const chatArea = $("chatArea");
  const chatInner = $("chatInner");
  const welcome = $("welcome");

  const messageInput = $("messageInput");
  const sendButton = $("sendButton");
  const voiceButton = $("voiceButton");

  const plusButton = $("plusButton");
  const plusMenu = $("plusMenu");

  const imageInput = $("imageInput");
  const uploadImageOption = $("uploadImageOption");
  const attachPreview = $("attachPreview");
  const previewImage = $("previewImage");
  const removeAttachment = $("removeAttachment");

  const thinkOption = $("thinkOption");
  const projectOption = $("projectOption");

  const projectsList = $("projectsList");
  const addProjectButton = $("addProjectButton");

  const profileButton = $("profileButton");
  const profileModal = $("profileModal");
  const profileModalClose = $("profileModalClose");
  const profileNameInput = $("profileNameInput");
  const profileSaveButton = $("profileSaveButton");
  const profileName = $("profileName");
  const profileInitial = $("profileInitial");

  const projectModal = $("projectModal");
  const projectModalClose = $("projectModalClose");
  const projectNameInput = $("projectNameInput");
  const projectSaveButton = $("projectSaveButton");

  const toast = $("toast");

  function showToast(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(function(){
      toast.classList.remove("show");
    },2200);
  }

  function openSidebar(){

    sidebar.classList.add("open");
    sidebarOverlay.classList.add("show");
  }

  function closeSidebarMenu(){

    sidebar.classList.remove("open");
    sidebarOverlay.classList.remove("show");
  }

  mobileMenu.addEventListener("click",openSidebar);

  closeSidebar.addEventListener(
    "click",
    closeSidebarMenu
  );

  sidebarOverlay.addEventListener(
    "click",
    closeSidebarMenu
  );

  function autoResize(){

    messageInput.style.height = "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        180
      ) + "px";
  }

  messageInput.addEventListener(
    "input",
    autoResize
  );

  messageInput.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );

  plusButton.addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      plusMenu.classList.toggle("show");

    }
  );

  document.addEventListener(
    "click",
    function(event){

      if(
        !plusMenu.contains(event.target) &&
        event.target !== plusButton
      ){

        plusMenu.classList.remove("show");

      }

    }
  );

  uploadImageOption.addEventListener(
    "click",
    function(){

      plusMenu.classList.remove("show");

      imageInput.click();

    }
  );

  imageInput.addEventListener(
    "change",
    handleImageSelect
  );

  function handleImageSelect(event){

    const file =
      event.target.files &&
      event.target.files[0];

    if(!file){
      return;
    }

    if(
      !file.type ||
      !file.type.startsWith("image/")
    ){

      showToast("Please select an image.");

      imageInput.value = "";

      return;

    }

    const reader =
      new FileReader();

    reader.onload = function(){

      const result =
        reader.result;

      if(
        typeof result !== "string"
      ){
        return;
      }

      state.selectedImage = file;

      state.selectedImageData = {
        mimeType:
          file.type || "image/jpeg",

        data:
          result.split(",")[1] || ""
      };

      previewImage.src = result;

      attachPreview.classList.add(
        "show"
      );

      showToast("Image selected.");

    };

    reader.onerror = function(){

      showToast(
        "Could not read the image."
      );

    };

    reader.readAsDataURL(file);

  }

  removeAttachment.addEventListener(
    "click",
    clearAttachment
  );

  function clearAttachment(){

    state.selectedImage = null;
    state.selectedImageData = null;

    previewImage.removeAttribute("src");

    attachPreview.classList.remove(
      "show"
    );

    imageInput.value = "";

  }

  thinkOption.addEventListener(
    "click",
    function(){

      state.thinking =
        !state.thinking;

      thinkOption.classList.toggle(
        "think-active",
        state.thinking
      );

      plusMenu.classList.remove(
        "show"
      );

      showToast(
        state.thinking
          ? "Think mode enabled"
          : "Think mode disabled"
      );

    }
  );

  function createMessageElement(
    role,
    text,
    imageData
  ){

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " +
      (role === "user"
        ? "user"
        : "ai");

    if(
      imageData &&
      imageData.data
    ){

      const img =
        document.createElement("img");

      img.className =
        "message-image";

      img.src =
        imageData.preview ||
        (
          "data:" +
          imageData.mimeType +
          ";base64," +
          imageData.data
        );

      img.alt =
        "Uploaded image";

      wrapper.appendChild(img);

    }

    if(text){

      const bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble";

      bubble.textContent =
        text;

      wrapper.appendChild(
        bubble
      );

    }

    const actions =
      document.createElement("div");

    actions.className =
      "message-actions";

    const copy =
      document.createElement("button");

    copy.className =
      "message-action";

    copy.title =
      "Copy";

    copy.textContent =
      "⧉";

    copy.addEventListener(
      "click",
      function(){

        navigator.clipboard
          .writeText(text || "")
          .then(
            function(){
              showToast("Copied");
            }
          )
          .catch(
            function(){
              showToast(
                "Copy failed"
              );
            }
          );

      }
    );

    actions.appendChild(copy);

    if(role === "user"){

      const edit =
        document.createElement("button");

      edit.className =
        "message-action";

      edit.title =
        "Edit";

      edit.textContent =
        "✎";

      edit.addEventListener(
        "click",
        function(){

          messageInput.value =
            text || "";

          autoResize();

          messageInput.focus();

          showToast(
            "Message loaded for editing"
          );

        }
      );

      actions.appendChild(edit);

    }

    wrapper.appendChild(
      actions
    );

    chatInner.appendChild(
      wrapper
    );

    chatArea.scrollTop =
      chatArea.scrollHeight;

    return wrapper;

  }

  function showTyping(){

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message ai";

    wrapper.id =
      "typingMessage";

    const typing =
      document.createElement("div");

    typing.className =
      "typing";

    typing.innerHTML =
      "<span></span><span></span><span></span>";

    wrapper.appendChild(
      typing
    );

    chatInner.appendChild(
      wrapper
    );

    chatArea.scrollTop =
      chatArea.scrollHeight;

  }

  function hideTyping(){

    const typing =
      $("typingMessage");

    if(typing){
      typing.remove();
    }

  }

  function clearWelcome(){

    if(welcome){

      welcome.style.display =
        "none";

    }

  }

  function resetWelcome(){

    if(welcome){

      welcome.style.display =
        "flex";

    }

  }

  function getHistory(){

    return state.messages.map(
      function(item){

        return {
          role:
            item.role,

          content:
            item.content
        };

      }
    );

  }

  async function sendMessage(){

    const text =
      messageInput.value.trim();

    const image =
      state.selectedImageData;

    if(
      !text &&
      !image
    ){

      showToast(
        "Write a message or select an image."
      );

      return;

    }

    clearWelcome();

    const imageForDisplay =
      image
        ? {
            mimeType:
              image.mimeType,

            data:
              image.data,

            preview:
              previewImage.src
          }
        : null;

    createMessageElement(
      "user",
      text,
      imageForDisplay
    );

    state.messages.push({
      role:
        "user",

      content:
        text,

      image:
        imageForDisplay
    });

    messageInput.value = "";

    autoResize();

    clearAttachment();

    sendButton.disabled = true;

    voiceButton.disabled = true;

    showTyping();

    try{

      const payload = {
        message:
          text,

        history:
          getHistory(),

        thinking:
          state.thinking,

        images:
          image
            ? [
                {
                  mimeType:
                    image.mimeType,

                  data:
                    image.data
                }
              ]
            : []
      };

      const response =
        await fetch(
          "/api/chat",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(payload)
          }
        );

      let data = null;

      try{

        data =
          await response.json();

      }catch(error){

        data = null;

      }

      hideTyping();

      if(
        !response.ok ||
        !data ||
        !data.ok
      ){

        throw new Error(
          data?.error ||
          "AI request failed."
        );

      }

      const reply =
        typeof data.reply === "string"
          ? data.reply
          : "";

      if(!reply){

        throw new Error(
          "AI returned an empty response."
        );

      }

      createMessageElement(
        "ai",
        reply,
        null
      );

      state.messages.push({
        role:
          "assistant",

        content:
          reply
      });

      saveCurrentProject();

    }catch(error){

      hideTyping();

      const errorText =
        error?.message ||
        "Something went wrong.";

      createMessageElement(
        "ai",
        "Sorry, something went wrong.\n\n" +
        errorText,
        null
      );

      showToast(
        errorText
      );

    }finally{

      sendButton.disabled =
        false;

      voiceButton.disabled =
        false;

      messageInput.focus();

    }

  }

  sendButton.addEventListener(
    "click",
    sendMessage
  );

  function startNewChat(){

    state.messages = [];

    state.selectedImage = null;
    state.selectedImageData = null;

    clearAttachment();

    const messages =
      chatInner.querySelectorAll(
        ".message"
      );

    messages.forEach(
      function(item){
        item.remove();
      }
    );

    resetWelcome();

    messageInput.value = "";

    autoResize();

    plusMenu.classList.remove(
      "show"
    );

    chatArea.scrollTop = 0;

    showToast(
      "New chat started"
    );

  }

  newChatButton.addEventListener(
    "click",
    function(){

      startNewChat();

      closeSidebarMenu();

    }
  );

  clearChatButton.addEventListener(
    "click",
    startNewChat
  );

  document.querySelectorAll(
    ".quick-action"
  ).forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          const prompt =
            button.dataset.prompt ||
            "";

          messageInput.value =
            prompt;

          autoResize();

          messageInput.focus();

        }
      );

    }
  );

  function showComingSoon(name){

    showToast(
      name + " is ready to be connected."
    );

  }

  $("imageMenu").addEventListener(
    "click",
    function(){
      showComingSoon(
        "AI Image Generator"
      );
    }
  );

  $("writerMenu").addEventListener(
    "click",
    function(){
      showComingSoon(
        "Content Writer"
      );
    }
  );

  $("codeMenu").addEventListener(
    "click",
    function(){
      showComingSoon(
        "Code Generator"
      );
    }
  );

  $("youtubeMenu").addEventListener(
    "click",
    function(){
      showComingSoon(
        "YouTube Tools"
      );
    }
  );

  $("instagramMenu").addEventListener(
    "click",
    function(){
      showComingSoon(
        "Instagram Tools"
      );
    }
  );

  $("chatMenu").addEventListener(
    "click",
    function(){

      closeSidebarMenu();

      messageInput.focus();

    }
  );

  $("projectsMenu").addEventListener(
    "click",
    function(){

      openProjectModal();

      closeSidebarMenu();

    }
  );

  function loadProjects(){

    try{

      const stored =
        localStorage.getItem(
          "rg_creator_ai_projects"
        );

      if(stored){

        const parsed =
          JSON.parse(stored);

        if(Array.isArray(parsed)){

          state.projects =
            parsed;

        }

      }

    }catch(error){

      state.projects = [];

    }

    renderProjects();

  }

  function saveProjects(){

    try{

      localStorage.setItem(
        "rg_creator_ai_projects",
        JSON.stringify(
          state.projects
        )
      );

    }catch(error){

      console.error(
        error
      );

    }

  }

  function renderProjects(){

    projectsList.innerHTML = "";

    state.projects.forEach(
      function(project,index){

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "project-item";

        item.textContent =
          project.name;

        item.title =
          project.name;

        item.addEventListener(
          "click",
          function(){

            state.currentProject =
              index;

            loadProject(
              project
            );

          }
        );

        projectsList.appendChild(
          item
        );

      }
    );

  }

  function openProjectModal(){

    projectNameInput.value = "";

    projectModal.classList.add(
      "show"
    );

    setTimeout(
      function(){
        projectNameInput.focus();
      },
      50
    );

  }

  function closeProjectModal(){

    projectModal.classList.remove(
      "show"
    );

  }

  addProjectButton.addEventListener(
    "click",
    openProjectModal
  );

  projectOption.addEventListener(
    "click",
    function(){

      plusMenu.classList.remove(
        "show"
      );

      openProjectModal();

    }
  );

  projectModalClose.addEventListener(
    "click",
    closeProjectModal
  );

  projectModal.addEventListener(
    "click",
    function(event){

      if(
        event.target === projectModal
      ){

        closeProjectModal();

      }

    }
  );

  projectSaveButton.addEventListener(
    "click",
    function(){

      const name =
        projectNameInput.value.trim();

      if(!name){

        showToast(
          "Enter a project name."
        );

        return;

      }

      state.projects.push({
        name:
          name,

        messages:
          []
      });

      state.currentProject =
        state.projects.length - 1;

      saveProjects();

      renderProjects();

      closeProjectModal();

      showToast(
        "Project created"
      );

    }
  );

  projectNameInput.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        projectSaveButton.click();

      }

    }
  );

  function loadProject(project){

    startNewChat();

    if(
      !project ||
      !Array.isArray(
        project.messages
      )
    ){

      return;

    }

    clearWelcome();

    project.messages.forEach(
      function(item){

        if(
          item.role !== "user" &&
          item.role !== "assistant"
        ){

          return;

        }

        createMessageElement(
          item.role,
          item.content || "",
          item.image || null
        );

        state.messages.push({
          role:
            item.role,

          content:
            item.content || "",

          image:
            item.image || null
        });

      }
    );

  }

  function saveCurrentProject(){

    if(
      state.currentProject === null ||
      state.currentProject === undefined
    ){

      return;

    }

    const project =
      state.projects[
        state.currentProject
      ];

    if(!project){

      return;

    }

    project.messages =
      state.messages;

    saveProjects();

    renderProjects();

  }

  function loadProfile(){

    const saved =
      localStorage.getItem(
        "rg_creator_ai_profile_name"
      );

    if(saved){

      profileName.textContent =
        saved;

      profileInitial.textContent =
        saved
          .trim()
          .charAt(0)
          .toUpperCase() ||
        "G";

    }

  }

  function openProfileModal(){

    profileNameInput.value =
      profileName.textContent ===
      "Login / Sign up"
        ? ""
        : profileName.textContent;

    profileModal.classList.add(
      "show"
    );

    setTimeout(
      function(){
        profileNameInput.focus();
      },
      50
    );

  }

  function closeProfileModal(){

    profileModal.classList.remove(
      "show"
    );

  }

  profileButton.addEventListener(
    "click",
    openProfileModal
  );

  profileModalClose.addEventListener(
    "click",
    closeProfileModal
  );

  profileModal.addEventListener(
    "click",
    function(event){

      if(
        event.target === profileModal
      ){

        closeProfileModal();

      }

    }
  );

  profileSaveButton.addEventListener(
    "click",
    function(){

      const name =
        profileNameInput.value.trim();

      if(!name){

        showToast(
          "Enter your name."
        );

        return;

      }

      localStorage.setItem(
        "rg_creator_ai_profile_name",
        name
      );

      profileName.textContent =
        name;

      profileInitial.textContent =
        name
          .charAt(0)
          .toUpperCase();

      closeProfileModal();

      showToast(
        "Profile saved"
      );

    }
  );

  profileNameInput.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        profileSaveButton.click();

      }

    }
  );

  voiceButton.addEventListener(
    "click",
    function(){

      if(
        !(
          "webkitSpeechRecognition" in window
        ) &&
        !(
          "SpeechRecognition" in window
        )
      ){

        showToast(
          "Voice input is not supported in this browser."
        );

        return;

      }

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      const recognition =
        new SpeechRecognition();

      recognition.lang =
        "en-IN";

      recognition.interimResults =
        false;

      recognition.maxAlternatives =
        1;

      voiceButton.textContent =
        "●";

      recognition.onresult =
        function(event){

          const result =
            event.results?.[0]?.[0]?.transcript ||
            "";

          if(result){

            messageInput.value =
              (
                messageInput.value
                  ? messageInput.value + " "
                  : ""
              ) +
              result;

            autoResize();

          }

        };

      recognition.onerror =
        function(){

          showToast(
            "Could not recognize voice."
          );

        };

      recognition.onend =
        function(){

          voiceButton.textContent =
            "🎤";

        };

      try{

        recognition.start();

      }catch(error){

        voiceButton.textContent =
          "🎤";

      }

    }
  );

  /*
   * Search
   */
  $("searchInput").addEventListener(
    "input",
    function(){

      const query =
        this.value
          .trim()
          .toLowerCase();

      document.querySelectorAll(
        ".project-item"
      ).forEach(
        function(item){

          const visible =
            !query ||
            item.textContent
              .toLowerCase()
              .includes(query);

          item.style.display =
            visible
              ? ""
              : "none";

        }
      );

    }
  );

  /*
   * Initial setup
   */
  loadProjects();

  loadProfile();

  autoResize();

  messageInput.focus();

})();
</script>

</body>
</html>
