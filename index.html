<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>RG Creator AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#000;
  --panel:#111;
  --panel2:#181818;
  --panel3:#222;
  --border:#2b2b2b;
  --text:#fff;
  --muted:#858585;
  --danger:#ff4545;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  overflow:hidden;
  font-family:
    "Söhne",
    Inter,
    "Segoe UI",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button,
input,
textarea{
  font-family:inherit;
}

code,
pre,
.technical-text{
  font-family:
    "Söhne Mono",
    Consolas,
    Monaco,
    monospace;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= APP ================= */

.app{
  width:100%;
  height:100%;
  position:relative;
  background:#000;
}

/* ================= HEADER ================= */

.header{
  height:62px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  position:relative;
  z-index:40;
  background:rgba(0,0,0,.96);
  border-bottom:1px solid #171717;
  backdrop-filter:blur(14px);
}

.header-left,
.header-right{
  display:flex;
  align-items:center;
}

.header-left{
  gap:8px;
  min-width:0;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:#191919;
}

.icon{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.logo-title{
  max-width:65vw;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:16px;
  font-weight:600;
}

/* ================= MAIN ================= */

.main{
  height:calc(100% - 62px);
  position:relative;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 160px;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:20px;
}

/* ================= WELCOME ================= */

.welcome{
  width:min(760px,100%);
  margin:13vh auto 0;
  text-align:center;
}

.welcome-logo{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:18px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:800;
}

.welcome h1{
  margin-top:18px;
  font-size:28px;
  letter-spacing:-.7px;
}

.welcome p{
  margin-top:8px;
  color:#777;
  font-size:14px;
}

/* ================= MESSAGE ================= */

.message{
  width:min(760px,100%);
  margin:0 auto 28px;
}

.user-message{
  display:flex;
  justify-content:flex-end;
}

.user-bubble{
  max-width:85%;
  padding:12px 15px;
  border-radius:20px 20px 5px 20px;
  background:#252525;
  color:#fff;
  font-size:15px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.ai-message{
  font-size:15px;
  line-height:1.7;
}

.ai-content{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-actions{
  display:flex;
  align-items:center;
  gap:2px;
  margin-top:8px;
}

.action-btn,
.user-action-btn{
  width:36px;
  height:34px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#777;
  display:flex;
  align-items:center;
  justify-content:center;
}

.action-btn:hover,
.user-action-btn:hover{
  background:#181818;
  color:#fff;
}

.user-actions{
  width:100%;
  display:flex;
  justify-content:flex-end;
  gap:2px;
  margin-top:5px;
}

/* ================= COMPOSER ================= */

.input-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:9px 11px 16px;
  background:linear-gradient(
    transparent,
    #000 27%
  );
}

.composer{
  width:min(760px,100%);
  margin:auto;
  background:#151515;
  border:1px solid #303030;
  border-radius:24px;
  padding:10px;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
}

.composer textarea{
  width:100%;
  min-height:45px;
  max-height:150px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:#fff;
  padding:7px 8px;
  font-size:15px;
  line-height:1.5;
}

.composer textarea::placeholder{
  color:#707070;
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.composer-left,
.composer-right{
  display:flex;
  align-items:center;
  gap:3px;
}

.plus-wrap{
  position:relative;
}

.circle-btn{
  width:48px;
  height:48px;
  min-width:48px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
}

.circle-btn:hover{
  background:#252525;
  color:#fff;
}

.circle-btn .icon{
  width:26px;
  height:26px;
}

.voice-btn{
  font-size:23px;
}

.send-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.send-btn .icon{
  width:23px;
  height:23px;
}

/* ================= PLUS MENU ================= */

.plus-menu{
  position:absolute;
  left:0;
  bottom:56px;
  width:245px;
  padding:7px;
  border:1px solid #333;
  border-radius:17px;
  background:#1a1a1a;
  box-shadow:0 20px 55px rgba(0,0,0,.75);
  display:none;
}

.plus-menu.open{
  display:block;
}

.plus-item{
  width:100%;
  min-height:46px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 11px;
  text-align:left;
  font-size:14px;
}

.plus-item:hover{
  background:#292929;
}

.think-status{
  margin-left:auto;
  color:#777;
  font-size:11px;
}

/* ================= ATTACHMENT ================= */

.attachment{
  position:relative;
  display:none;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  padding:8px 42px 8px 10px;
  border-radius:11px;
  background:#202020;
  color:#bbb;
  font-size:12px;
}

.attachment.show{
  display:flex;
}

.attachment-close{
  position:absolute;
  right:7px;
  top:50%;
  transform:translateY(-50%);
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:#303030;
  color:#fff;
}

/* ================= MORE MENU ================= */

.more-menu{
  position:absolute;
  top:56px;
  right:12px;
  z-index:80;
  width:235px;
  padding:7px;
  background:#191919;
  border:1px solid #303030;
  border-radius:17px;
  box-shadow:0 20px 55px rgba(0,0,0,.75);
  display:none;
}

.more-menu.open{
  display:block;
}

.more-item{
  width:100%;
  min-height:44px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 11px;
  text-align:left;
  font-size:14px;
}

.more-item:hover{
  background:#292929;
}

/* ================= SIDEBAR ================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.67);
  display:none;
}

.overlay.show{
  display:block;
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  z-index:100;
  width:min(310px,87vw);
  background:#111;
  border-right:1px solid #292929;
  transform:translateX(-100%);
  transition:.23s ease;
  display:flex;
  flex-direction:column;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-head{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 11px;
  border-bottom:1px solid #242424;
}

.sidebar-title{
  font-size:16px;
  font-weight:700;
}

.new-chat{
  height:45px;
  margin:12px;
  border:1px solid #303030;
  background:#191919;
  color:#fff;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 14px;
  font-size:14px;
}

.new-chat:hover{
  background:#222;
}

/* ================= PROJECTS ================= */

.projects-btn{
  width:calc(100% - 24px);
  height:44px;
  margin:0 12px 8px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 10px;
  text-align:left;
  font-size:14px;
}

.projects-btn:hover{
  background:#202020;
}

.project-list{
  display:none;
  padding:0 12px 8px;
}

.project-list.open{
  display:block;
}

.project-item{
  width:100%;
  min-height:40px;
  border:0;
  background:transparent;
  color:#bbb;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
  text-align:left;
  font-size:12px;
}

.project-item:hover{
  background:#202020;
  color:#fff;
}

/* ================= SEARCH ================= */

.search{
  width:calc(100% - 24px);
  height:42px;
  margin:0 12px 10px;
  padding:0 12px;
  border:1px solid #2b2b2b;
  border-radius:12px;
  outline:none;
  background:#171717;
  color:#fff;
}

/* ================= HISTORY ================= */

.history{
  flex:1;
  overflow-y:auto;
  padding:0 8px 8px;
}

.history-label{
  padding:11px 8px 6px;
  color:#6e6e6e;
  font-size:11px;
  text-transform:uppercase;
}

.history-item{
  min-height:45px;
  padding:0 8px;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#ddd;
}

.history-item:hover{
  background:#1e1e1e;
}

.history-name{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.history-more{
  width:30px;
  height:30px;
  border:0;
  background:transparent;
  color:#777;
  border-radius:8px;
}

.history-more:hover{
  background:#292929;
  color:#fff;
}

/* ================= SIDEBAR BOTTOM ================= */

.sidebar-bottom{
  margin-top:auto;
  padding:10px;
  border-top:1px solid #252525;
}

.sidebar-bottom-btn{
  width:100%;
  min-height:46px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 11px;
  text-align:left;
  font-size:14px;
}

.sidebar-bottom-btn:hover{
  background:#202020;
}

/* ================= PROFILE ================= */

.profile-row{
  width:100%;
  min-height:58px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:7px 10px;
  text-align:left;
}

.profile-row:hover{
  background:#202020;
}

.profile-avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  background:#292929;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:18px;
  font-weight:700;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info{
  min-width:0;
  flex:1;
}

.profile-name{
  display:block;
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-sub{
  display:block;
  margin-top:2px;
  color:#777;
  font-size:11px;
}

/* ================= MODAL ================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(430px,100%);
  max-height:85vh;
  overflow:auto;
  padding:18px;
  border:1px solid #333;
  border-radius:20px;
  background:#111;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  font-size:20px;
}

.modal-close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#202020;
  color:#fff;
  font-size:20px;
}

.modal-text{
  color:#999;
  font-size:14px;
  line-height:1.6;
  margin-bottom:15px;
}

.modal-btn{
  width:100%;
  min-height:45px;
  margin-top:8px;
  border:1px solid #303030;
  border-radius:11px;
  background:#181818;
  color:#fff;
}

.modal-btn.primary{
  background:#fff;
  color:#000;
  border:0;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  z-index:600;
  transform:translate(-50%,10px);
  padding:10px 15px;
  border:1px solid #333;
  border-radius:12px;
  background:#222;
  color:#fff;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .welcome{
    margin-top:12vh;
  }

  .welcome h1{
    font-size:25px;
  }

  .messages{
    padding-bottom:150px;
  }

  .user-bubble{
    max-width:89%;
  }

  .circle-btn{
    width:49px;
    height:49px;
    min-width:49px;
  }

  .circle-btn .icon{
    width:27px;
    height:27px;
  }

  .voice-btn{
    font-size:24px;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="header-left">

    <button
      class="icon-btn"
      onclick="openSidebar()"
      aria-label="Menu"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </svg>
    </button>

    <div class="logo-title">
      RG Creator AI
    </div>

  </div>

  <div class="header-right">

    <button
      class="icon-btn"
      onclick="toggleMore()"
      aria-label="More"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1"/>
        <circle cx="12" cy="12" r="1"/>
        <circle cx="19" cy="12" r="1"/>
      </svg>
    </button>

  </div>

</header>


<!-- ================= MORE ================= -->

<div
  class="more-menu"
  id="moreMenu"
>

  <button
    class="more-item"
    onclick="shareConversation()"
  >
    🔗
    Share
  </button>

  <button
    class="more-item"
    onclick="openSidebar()"
  >
    💬
    Chat History
  </button>

  <button
    class="more-item"
    onclick="openSidebar();toggleProjects();"
  >
    📁
    Projects
  </button>

  <button
    class="more-item"
    onclick="showHelp()"
  >
    ❓
    Help
  </button>

  <button
    class="more-item"
    onclick="showFeedback()"
  >
    💡
    Feedback
  </button>

  <button
    class="more-item"
    onclick="showAbout()"
  >
    ℹ️
    About
  </button>

  <button
    class="more-item"
    onclick="deleteConversation()"
  >
    🗑️
    Delete
  </button>

</div>


<!-- ================= MAIN ================= -->

<main class="main">

  <div
    class="messages"
    id="messages"
  >

    <section
      class="welcome"
      id="welcome"
    >

      <div class="welcome-logo">
        RG
      </div>

      <h1>
        How can I help you?
      </h1>

      <p>
        Ask anything, create content or build something.
      </p>

    </section>

  </div>


  <!-- ================= COMPOSER ================= -->

  <div class="input-area">

    <div class="composer">

      <div
        class="attachment"
        id="attachment"
      >

        📎

        <span id="attachmentName"></span>

        <button
          class="attachment-close"
          onclick="clearAttachment()"
        >
          ×
        </button>

      </div>


      <textarea
        id="input"
        rows="1"
        placeholder="Ask anything..."
      ></textarea>


      <div class="composer-bottom">

        <div class="composer-left">

          <div class="plus-wrap">

            <button
              class="circle-btn"
              onclick="togglePlus()"
              aria-label="Add"
            >

              <svg
                class="icon"
                viewBox="0 0 24 24"
              >
                <path d="M12 5v14"/>
                <path d="M5 12h14"/>
              </svg>

            </button>


            <!-- ================= PLUS MENU ================= -->

            <div
              class="plus-menu"
              id="plusMenu"
            >

              <button
                class="plus-item"
                onclick="pick('imageInput')"
              >
                🖼️
                Image
              </button>


              <button
                class="plus-item"
                onclick="pick('cameraInput')"
              >
                📷
                Camera
              </button>


              <button
                class="plus-item"
                onclick="pick('videoInput')"
              >
                🎥
                Video
              </button>


              <button
                class="plus-item"
                onclick="pick('fileInput')"
              >
                📄
                File
              </button>


              <button
                class="plus-item"
                onclick="pick('pdfInput')"
              >
                📕
                PDF
              </button>


              <!-- THINK -->

              <button
                class="plus-item"
                onclick="toggleThinkMode()"
              >

                🧠

                <span>
                  Think
                </span>

                <span
                  class="think-status"
                  id="thinkStatus"
                >
                  Off
                </span>

              </button>

            </div>

          </div>


          <!-- VOICE -->

          <button
            class="circle-btn voice-btn"
            onclick="startVoice()"
            aria-label="Voice message"
            title="Voice message"
          >
            🎤
          </button>

        </div>


        <div class="composer-right">

          <button
            class="send-btn"
            onclick="sendMessage()"
            aria-label="Send"
          >

            <svg
              class="icon"
              viewBox="0 0 24 24"
            >
              <path d="M5 12h14"/>
              <path d="m13 6 6 6-6 6"/>
            </svg>

          </button>

        </div>

      </div>

    </div>

  </div>

</main>


<!-- ================= INPUT FILES ================= -->

<input
  id="imageInput"
  type="file"
  accept="image/*"
  hidden
  onchange="handleFile(this)"
>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  hidden
  onchange="handleFile(this)"
>

<input
  id="videoInput"
  type="file"
  accept="video/*"
  hidden
  onchange="handleFile(this)"
>

<input
  id="fileInput"
  type="file"
  accept=".txt,.md,.doc,.docx,.csv,.json,.html,.css,.js,.py,.java,.php,.xml,.sql,.zip,.xlsx,.xls,.ppt,.pptx"
  hidden
  onchange="handleFile(this)"
>

<input
  id="pdfInput"
  type="file"
  accept="application/pdf"
  hidden
  onchange="handleFile(this)"
>


<!-- ================= SIDEBAR ================= -->

<div
  class="overlay"
  id="overlay"
  onclick="closeSidebar()"
></div>


<aside
  class="sidebar"
  id="sidebar"
>

  <div class="sidebar-head">

    <div class="sidebar-title">
      RG Creator AI
    </div>

    <button
      class="icon-btn"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>


  <!-- NEW CHAT -->

  <button
    class="new-chat"
    onclick="newChat()"
  >
    ＋
    New Chat
  </button>


  <!-- PROJECTS -->

  <button
    class="projects-btn"
    onclick="toggleProjects()"
  >
    📁
    Projects
  </button>


  <div
    class="project-list"
    id="projectList"

<script>

/* =========================================================
   RG CREATOR AI
========================================================= */


/* ================= STATE ================= */

let conversation =
  JSON.parse(
    localStorage.getItem(
      "rg_creator_conversation"
    ) || "[]"
  );


let currentAttachment =
  null;


/*
  Think is OFF by default.
*/

let thinkMode =
  localStorage.getItem(
    "rg_think_mode"
  ) === "true";


/* ================= ELEMENTS ================= */

const input =
  document.getElementById(
    "input"
  );

const messages =
  document.getElementById(
    "messages"
  );

const welcome =
  document.getElementById(
    "welcome"
  );


/* ================= INIT ================= */

renderConversation();

renderHistory();

renderProjects();

loadProfile();

updateThinkUI();

autoResize();


/* ================= TOAST ================= */

function toast(text){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    text;

  el.classList.add(
    "show"
  );

  setTimeout(
    () => {

      el.classList.remove(
        "show"
      );

    },
    2200
  );

}


/* ================= INPUT ================= */

input.addEventListener(
  "input",
  autoResize
);


input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


function autoResize(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";

}


/* ================= PLUS ================= */

function togglePlus(){

  document
    .getElementById(
      "plusMenu"

      "open"
    );

}


function closePlus(){

    .getElementById(
      "plusMenu"
    )
    .classList.remove(
      "open"
    );

}


/* ================= THINK ================= */

function toggleThinkMode(){

  thinkMode =
    !thinkMode;


  localStorage.setItem(
    "rg_think_mode",
    String(thinkMode)
  );


  updateThinkUI();


  toast(
    thinkMode

  const status =
    document.getElementById(
      "thinkStatus"
    );


  if(!status){
    return;
  }


  status.textContent =
    thinkMode
      ? "On"
      : "Off";


  status.style.color =
    thinkMode
      ? "#fff"
      : "#777";

}


/* ================= FILE PICKER ================= */

function pick(id){

  closePlus();

  const element =
    document.getElementById(
      id
    );

  if(element){
    element.click();
  }

}


/* ================= FILE ================= */

function handleFile(element){

  if(
    !element.files ||
    !element.files.length
  ){

    return;

  }


  currentAttachment =
    element.files[0];


  document
    .getElementById(
      "attachmentName"
    )
    .textContent =
    currentAttachment.name;


  document
    .getElementById(
      "attachment"
    )
    .classList.add(
      "show"
    );


  toast(
    "Attached: " +
    currentAttachment.name
  );

}


function clearAttachment(){

  currentAttachment =
    null;


  document
    .getElementById(
      "attachment"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "attachmentName"
    )
    .textContent =
    "";

}


/* ================= FILE BASE64 ================= */

function fileToPayload(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          const result =
            String(
              reader.result || ""
            );


          const comma =
            result.indexOf(",");


          resolve({

            name:
              file.name,

            type:
              file.type ||
              "application/octet-stream",

            size:
              file.size,

            data:
              comma >= 0
                ? result.slice(
                    comma + 1
                  )
                : result

          });

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "Could not read attachment"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* ================= SEND ================= */

async function sendMessage(){

  const text =
    input.value.trim();


  if(
    !text &&
    !currentAttachment
  ){

    return;

  }


  let attachment =
    null;


  try{

    if(currentAttachment){

      attachment =
        await fileToPayload(
          currentAttachment
        );

    }

  }catch(error){

    toast(
      "Could not read attachment"
    );

    return;

  }


  const messageText =
    text ||
    "Please analyze the attached file.";


  addMessage(
    "user",
    messageText,
    attachment
  );


  input.value =
    "";

  autoResize();

  clearAttachment();


  const thinkingIndex =
    addMessage(
      "assistant",
      "Thinking..."
    );


  try{

    const history =
      conversation

        .slice(
          0,
          thinkingIndex
        )

        .map(
          item => ({

            role:
              item.role,

            content:
              item.content

          })
        );


    const requestBody = {

      message:
        messageText,

      history:
        history,

      thinkMode:
        thinkMode

    };


    if(attachment){

      requestBody.attachment =
        attachment;

    }


    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              requestBody
            )

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "AI request failed"
      );

    }


    updateMessage(
      thinkingIndex,
      data.reply
    );


  }catch(error){

    updateMessage(

      thinkingIndex,

      "Sorry, I couldn't complete that request.\n\n" +
      (
        error.message ||
        "Server error"
      )

    );

  }

}


/* ================= ADD MESSAGE ================= */

function addMessage(
  role,
  content,
  attachment = null
){

  conversation.push({

    role:
      role,

    content:
      content,

    attachment:
      attachment,

    time:
      Date.now()

  });


  saveConversation();

  renderConversation();

  return conversation.length - 1;

}


/* ================= UPDATE ================= */

function updateMessage(
  index,
  content
){

  if(
    !conversation[index]
  ){

    return;

  }


  conversation[index].content =
    content;


  saveConversation();

  renderConversation();

}


/* ================= SAVE ================= */

function saveConversation(){

  localStorage.setItem(

    "rg_creator_conversation",

    JSON.stringify(
      conversation
    )

  );

}


/* ================= RENDER ================= */

function renderConversation(){

  if(
    !conversation.length
  ){

    messages.innerHTML =
      welcome.outerHTML;

    return;

  }


  messages.innerHTML =
    "";


  conversation.forEach(
    function(item,index){

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "message " +
        (
          item.role === "user"
            ? "user-message"
            : "ai-message"
        );


      if(
        item.role === "user"
      ){

        wrapper.innerHTML = `

          <div style="width:100%;">

            <div class="user-bubble">

              ${escapeHTML(
                item.content
              )}

            </div>


            ${
              item.attachment
                ? `
                  <div
                    style="
                      margin-top:6px;
                      color:#777;
                      font-size:11px;
                      text-align:right;
                    "
                  >
                    📎
                    ${escapeHTML(
                      item.attachment.name ||
                      "Attachment"
                    )}
                  </div>
                `
                : ""
            }


            <div class="user-actions">

              <button
                class="user-action-btn"
                onclick="copyUser(${index})"
                title="Copy"
              >
                ${copyIcon()}
              </button>


              <button
                class="user-action-btn"
                onclick="editUser(${index})"
                title="Edit"
              >
                ✏️
              </button>

            </div>

          </div>

        `;

      }else{

        wrapper.innerHTML = `

          <div class="ai-content">

            ${escapeHTML(
              item.content
            )}

          </div>


          <div class="message-actions">

            <button
              class="action-btn"
              onclick="copyAI(${index})"
              title="Copy"
            >
              ${copyIcon()}
            </button>


            <button
              class="action-btn"
              onclick="feedback('like')"
              title="Like"
            >
              👍
            </button>


            <button
              class="action-btn"
              onclick="feedback('dislike')"
              title="Dislike"
            >
              👎
            </button>


            <button
              class="action-btn"
              onclick="shareAI(${index})"
              title="Share"
            >
              ${shareIcon()}
            </button>


            <button
              class="action-btn"
              onclick="regenerate(${index})"
              title="Regenerate"
            >
              ${refreshIcon()}
            </button>


            <button
              class="action-btn"
              onclick="aiMore(${index})"
              title="More"
            >
              ${moreIcon()}
            </button>

          </div>

        `;

      }


      messages.appendChild(
        wrapper
      );

    }
  );


  requestAnimationFrame(
    () => {

      messages.scrollTop =
        messages.scrollHeight;

    }
  );

}


/* ================= COPY ================= */

async function copyAI(index){

  try{

    await navigator.clipboard.writeText(
      conversation[index].content
    );

    toast("Copied");

  }catch{

    toast("Copy failed");

  }

}


async function copyUser(index){

  try{

    await navigator.clipboard.writeText(
      conversation[index].content
    );

    toast("Copied");

  }catch{

    toast("Copy failed");

  }

}


/* ================= EDIT ================= */

function editUser(index){

  if(
    !conversation[index]
  ){

    return;

  }


  input.value =
    conversation[index].content;


  autoResize();

  input.focus();


  if(
    conversation[index + 1] &&
    conversation[index + 1].role ===
      "assistant"
  ){

    conversation.splice(
      index,
      2
    );

  }else{

    conversation.splice(
      index,
      1
    );

  }


  saveConversation();

  renderConversation();

  renderHistory();

  toast(
    "Message ready to edit"
  );

}


/* ================= FEEDBACK ================= */

function feedback(type){

  toast(
    type === "like"
      ? "Thanks for your feedback"
      : "Thanks for your feedback"
  );

}


/* ================= SHARE ================= */

async function shareAI(index){

  const text =
    conversation[index].content;


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          "RG Creator AI",

        text:
          text

      });

    }catch{}

  }else{

    await copyAI(index);

  }

}


async function shareConversation(){

  if(
    !conversation.length
  ){

    toast(
      "No conversation to share"
    );

    return;

  }


  const text =
    conversation
      .map(
        item =>
          (
            item.role === "user"
              ? "You: "
              : "RG Creator AI: "
          ) +
          item.content
      )
      .join(
        "\n\n"
      );


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          "RG Creator AI",

        text:
          text

      });

    }catch{}

  }else{

    try{

      await navigator.clipboard.writeText(
        text
      );

      toast(
        "Conversation copied"
      );

    }catch{

      toast(
        "Share unavailable"
      );

    }

  }

}


/* ================= REGENERATE ================= */

async function regenerate(index){

  let userMessage =
    "";


  for(
    let i = index - 1;
    i >= 0;
    i--
  ){

    if(
      conversation[i].role ===
      "user"
    ){

      userMessage =
        conversation[i].content;

      break;

    }

  }


  if(!userMessage){

    toast(
      "No previous message found"
    );

    return;

  }


  conversation[index].content =
    "Thinking...";


  saveConversation();

  renderConversation();


  try{

    const history =
      conversation
        .slice(
          0,
          index
        )
        .map(
          item => ({

            role:
              item.role,

            content:
              item.content

          })
        );


    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                userMessage,

              history:
                history,

              thinkMode:
                thinkMode

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Regeneration failed"
      );

    }


    conversation[index].content =
      data.reply;


    saveConversation();

    renderConversation();


  }catch(error){

    conversation[index].content =
      "Unable to regenerate response.\n\n" +
      (
        error.message ||
        "Server error"
      );


    saveConversation();

    renderConversation();

  }

}


/* ================= AI MORE ================= */

function aiMore(index){

  const option =
    prompt(
      "1 = Read aloud\n2 = Copy\n3 = Delete response\n4 = Save"
    );


  if(option === "1"){

    readAloud(
      conversation[index].content
    );

  }

  else if(option === "2"){

    copyAI(index);

  }

  else if(option === "3"){

    conversation.splice(
      index,
      1
    );

    saveConversation();

    renderConversation();

    toast(
      "Response deleted"
    );

  }

  else if(option === "4"){

    localStorage.setItem(

      "rg_saved_" +
      Date.now(),

      conversation[index].content

    );

    toast(
      "Saved"
    );

  }

}


/* ================= READ ALOUD ================= */

function readAloud(text){

  if(
    !window.speechSynthesis
  ){

    toast(
      "Read aloud is not supported"
    );

    return;

  }


  speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.rate =
    1;


  speechSynthesis.speak(
    speech
  );

}


/* ================= NEW CHAT ================= */

function newChat(){

  conversation =
    [];


  localStorage.removeItem(
    "rg_chat_title"
  );


  clearAttachment();

  saveConversation();

  renderConversation();

  renderHistory();

  closeSidebar();

  toast(
    "New chat started"

}


/* ================= DELETE ================= */

function deleteConversation(){

  if(
    !conversation.length
  ){

    toast(
      "No conversation to delete"
    );

    return;

  }


  if(
    !confirm(
      "Delete this conversation?"
    )
  ){

    return;

  }


  conversation =
    [];


  localStorage.removeItem(
    "rg_chat_title"
  );


  saveConversation();

  renderConversation();

  renderHistory();

  closeMore();

  toast(
    "Conversation deleted"
  );

}

/* ================= HISTORY ================= */

function renderHistory(){

  const box =
    document.getElementById(
      "history"
    );


  const search =
    document
      .getElementById(
        "historySearch"
      )
      .value
      .toLowerCase();


  box.innerHTML =
    "";


  if(
    !conversation.length
  ){

    box.innerHTML = `

      <div class="history-label">
        Recent
      </div>

      <div
        style="
          padding:12px 8px;
          color:#666;
          font-size:12px;
        "
      >
        No chats yet
      </div>

    `;

    return;

  }


  const firstUser =
    conversation.find(
      item =>
        item.role === "user"
    );


  const savedTitle =
    localStorage.getItem(
      "rg_chat_title"
    );


  const title =
    savedTitle ||
    (
      firstUser
        ? firstUser.content.slice(
            0,
            45
          )
        : "New Chat"
    );


  if(
    !title
      .toLowerCase()
      .includes(search)
  ){

    return;

  }


  box.innerHTML = `

    <div class="history-label">
      Today
    </div>


    <div
      class="history-item"
      onclick="closeSidebar()"
    >

      💬

      <span class="history-name">
        ${escapeHTML(title)}
      </span>


      <button
        class="history-more"
        onclick="
          event.stopPropagation();
          renameChat();
        "
      >
        ⋯
      </button>

    </div>

  `;

}


function renameChat(){

  const firstUser =
    conversation.find(
      item =>
        item.role === "user"
    );


  const oldName =
    localStorage.getItem(
      "rg_chat_title"
    ) ||
    (
      firstUser
        ? firstUser.content.slice(
            0,
            45
          )
        : "New Chat"
    );


  const name =
    prompt(
      "Chat name:",
      oldName
    );


  if(
    !name ||
    !name.trim()
  ){

    return;

  }


  localStorage.setItem(
    "rg_chat_title",
    name.trim()
  );


  renderHistory();

}


/* ================= PROJECTS ================= */

function getProjects(){

  try{

    return JSON.parse(

      localStorage.getItem(
        "rg_creator_projects"
      ) || "[]"

    );

  }catch{

    return [];

  }

}


function saveProjects(projects){

  localStorage.setItem(

    "rg_creator_projects",

    JSON.stringify(
      projects
    )

  );

}


function toggleProjects(){

  const list =
    document.getElementById(
      "projectList"
    );


  if(!list){
    return;
  }


  list.classList.toggle(
    "open"
  );


  if(
    list.classList.contains(
      "open"
    )
  ){

    renderProjects();

  }

}


function renderProjects(){

  const list =
    document.getElementById(
      "projectList"
    );


  if(!list){
    return;
  }


  const projects =
    getProjects();


  list.innerHTML =
    "";


  projects.forEach(
    function(project,index){

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "project-item";


      button.innerHTML = `

        📁

        <span style="flex:1;">
          ${escapeHTML(
            project.name
          )}
        </span>

      `;


      button.onclick =
        function(){

          openProject(index);

        };


      list.appendChild(
        button
      );

    }
  );


  const create =
    document.createElement(
      "button"
    );


  create.className =
    "project-item";


  create.innerHTML =
    "＋ Create project";


  create.onclick =
    createProject;


  list.appendChild(
    create
  );

}


function createProject(){

  const name =
    prompt(
      "Project name:"
    );


  if(
    !name ||
    !name.trim()
  ){

    return;

  }


  const projects =
    getProjects();


  projects.push({

    id:
      Date.now(),

    name:
      name.trim(),

    notes:
      "",

    createdAt:
      Date.now()

  });


  saveProjects(
    projects
  );


  renderProjects();


  document
    .getElementById(
      "projectList"
    )
    ?.classList.add(
      "open"
    );


  toast(
    "Project created"
  );

}


function openProject(index){

  const project =
    getProjects()[index];


  if(!project){
    return;
  }


  openModal(

    project.name,

    `

      <div class="modal-text">
        Save important notes for this project.
      </div>


      <textarea
        id="projectNotes"
        style="
          width:100%;
          min-height:130px;
          padding:10px;
          border:1px solid #303030;
          border-radius:11px;
          background:#181818;
          color:#fff;
          outline:none;
          resize:vertical;
          font-family:inherit;
        "
        placeholder="Project notes..."
      >${escapeHTML(
        project.notes || ""
      )}</textarea>


      <button
        class="modal-btn primary"
        onclick="saveProjectNotes(${index})"
      >
        Save Project
      </button>


      <button
        class="modal-btn"
        onclick="deleteProject(${index})"
      >
        Delete Project
      </button>

    `

  );

}


function saveProjectNotes(index){

  const projects =
    getProjects();


  const notes =
    document.getElementById(
      "projectNotes"
    );


  if(
    !projects[index] ||
    !notes
  ){

    return;

  }


  projects[index].notes =
    notes.value;


  saveProjects(
    projects
  );


  hideModal();

  toast(
    "Project saved"
  );

}


function deleteProject(index){

  const projects =
    getProjects();


  if(
    !projects[index]
  ){

    return;

  }


  if(
    !confirm(
      "Delete this project?"
    )
  ){

    return;

  }


  projects.splice(
    index,
    1
  );


  saveProjects(
    projects
  );


  hideModal();

  renderProjects();

  toast(
    "Project deleted"
  );

}


/* ================= VOICE ================= */

function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!Recognition){

    toast(
      "Voice input is not supported"
    );

    return;

  }


  const recognition =
    new Recognition();


  recognition.lang =
    "en-IN";


  recognition.interimResults =
    false;


  recognition.onstart =
    function(){

      toast(
        "Listening..."
      );

    };


  recognition.onresult =
    function(event){

      input.value =
        event.results[0][0]
          .transcript;


      autoResize();

      input.focus();

    };


  recognition.onerror =
    function(){

      toast(
        "Voice input failed"
      );

    };


  recognition.start();

}

/* ================= PROFILE ================= */

function getProfile(){

  try{

    return JSON.parse(

      localStorage.getItem(
        "rg_creator_profile"
      ) || "null"

    );

  }catch{

    return null;

  }

}


function loadProfile(){

  const profile =
    getProfile();


  const avatar =
    document.getElementById(
      "sidebarProfileAvatar"
    );


  const name =
    document.getElementById(
      "sidebarProfileName"
    );


  const sub =
    document.getElementById(
      "sidebarProfileSub"
    );


  if(
    !avatar ||
    !name ||
    !sub
  ){

    return;

  }


  if(profile){

    avatar.innerHTML =
      profile.image
        ? `
          <img
            src="${profile.image}"
            alt="Profile"
          >
        `
        : "👤";


    name.textContent =
      profile.name ||
      "User";


    sub.textContent =
      profile.email ||
      "Account";

  }else{

    avatar.textContent =
      "👤";


    name.textContent =
      "Log in / Sign up";


    sub.textContent =
      "Sync your chats";

  }

}


/* ================= LOGIN ================= */

function openLogin(){

  const profile =
    getProfile();


  if(profile){

    openModal(

      "Profile",

      `

        <div
          style="
            text-align:center;
            margin-bottom:15px;
          "
        >

          <div
            class="profile-avatar"
            style="
              width:76px;
              height:76px;
              min-width:76px;
              margin:auto;
              font-size:27px;
            "
          >

            ${
              profile.image
                ? `
                  <img
                    src="${profile.image}"
                    alt="Profile"
                  >
                `
                : "👤"
            }

          </div>

        </div>


        <div
          class="modal-text"
          style="text-align:center;"
        >

          ${escapeHTML(
            profile.name ||
            "User"
          )}

          ${
            profile.email
              ? `
                <br>
                ${escapeHTML(
                  profile.email
                )}
              `
              : ""
          }

        </div>


        <button
          class="modal-btn primary"
          onclick="chooseProfileImage()"
        >
          Change profile image
        </button>


        <button
          class="modal-btn"
          onclick="editProfile()"
        >
          Edit profile
        </button>


        <button
          class="modal-btn"
          onclick="logoutLocal()"
        >
          Log out
        </button>

      `

    );


    return;

  }


  openModal(

    "Log in / Sign up",

    `

      <div class="modal-text">

        Create your local profile now.
        Real Google/Email authentication
        will be connected separately.

      </div>


      <button
        class="modal-btn primary"
        onclick="
          saveLocalProfile();
          hideModal();
        "
      >
        Continue
      </button>

    `

  );

}


function editProfile(){

  const profile =
    getProfile() || {};


  const name =
    prompt(
      "Your name:",
      profile.name || ""
    );


  if(
    !name ||
    !name.trim()
  ){

    return;

  }


  const email =
    prompt(
      "Your email:",
      profile.email || ""
    ) || "";


  localStorage.setItem(

    "rg_creator_profile",

    JSON.stringify({

      name:
        name.trim(),

      email:
        email.trim(),

      image:
        profile.image || ""

    })

  );


  loadProfile();

  hideModal();

  toast(
    "Profile updated"
  );

}


function saveLocalProfile(){

  const old =
    getProfile() || {};


  const name =
    prompt(
      "Your name:"
    );


  if(
    !name ||
    !name.trim()
  ){

    return;

  }


  const email =
    prompt(
      "Your email:"
    ) || "";


  localStorage.setItem(

    "rg_creator_profile",

    JSON.stringify({

      name:
        name.trim(),

      email:
        email.trim(),

      image:
        old.image || ""

    })

  );


  loadProfile();

  toast(
    "Profile saved"
  );

}


function chooseProfileImage(){

  const picker =
    document.createElement(
      "input"
    );


  picker.type =
    "file";


  picker.accept =
    "image/*";


  picker.onchange =
    function(){

      const file =
        picker.files?.[0];


      if(!file){
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(){

          const old =
            getProfile() || {};


          localStorage.setItem(

            "rg_creator_profile",

            JSON.stringify({

              name:
                old.name ||
                "User",

              email:
                old.email ||
                "",

              image:
                String(
                  reader.result || ""
                )

            })

          );


          loadProfile();

          hideModal();

          toast(
            "Profile image updated"
          );

        };


      reader.readAsDataURL(
        file
      );

    };


  picker.click();

}


function logoutLocal(){

  localStorage.removeItem(
    "rg_creator_profile"
  );


  loadProfile();

  hideModal();

  toast(
    "Logged out"
  );

}

/* ================= MODAL ================= */

function openModal(

  html
){

  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
    title;


  document
    .getElementById(
      "modalBody"
    )
    .innerHTML =
    html;


  document
    .getElementById(
      "modalBackdrop"
    )
    .classList.add(
      "show"
    );

}


function hideModal(){

  document
    .getElementById(
      "modalBackdrop"
    )
    .classList.remove(
      "show"
    );

}


function closeModal(event){

  if(
    event.target.id ===
    "modalBackdrop"
  ){

    hideModal();

  }

}

/* ================= ESCAPE ================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ================= OUTSIDE CLICK ================= */

document.addEventListener(
  "click",
  function(event){

    const plus =
      document.querySelector(
        ".plus-wrap"
      );


    const plusMenu =
      document.getElementById(
        "plusMenu"
      );


    if(
      plusMenu &&
      plusMenu.classList.contains(
        "open"
      ) &&
      !plus.contains(
        event.target
      )
    ){

      closePlus();

    }


    const more =
      document.getElementById(
        "moreMenu"
      );


    if(
      more &&
      more.classList.contains(
        "open"
      ) &&
      !event.target.closest(
        ".header-right"
      ) &&
      !event.target.closest(
        ".more-menu"
      )
    ){

      closeMore();

    }

  }
);
