<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RG Creator AI - Chat Test</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
    }

    button {
      margin-top: 12px;
      padding: 14px 20px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 600;
    }

    pre {
      white-space: pre-wrap;
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h2>RG Creator AI — Gemini Test</h2>

  <textarea id="message">Hello, introduce yourself in one sentence.</textarea>

  <br>

  <button id="testButton">Test Gemini</button>

  <pre id="result">Waiting for test...</pre>

  <script>
    const button = document.getElementById("testButton");
    const message = document.getElementById("message");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Connecting to Gemini...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message.value
          })
        });

        const data = await response.json();

        result.textContent =
          JSON.stringify(data, null, 2);

      } catch (error) {
        result.textContent =
          "Request failed:\n" + error.message;
      }

      button.disabled = false;
    });
  </script>

</body>
</html>
