<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#000000">
  <meta name="description" content="RG Creator AI - AI Chat">

  <link rel="icon" href="assets/rg-logo.jpg">

  <title>AI Chat - RG Creator AI</title>

  <style>
    :root {
      --bg: #000000;
      --surface: #101010;
      --surface-2: #181818;
      --surface-3: #222222;
      --border: #292929;

      --text: #ffffff;
      --secondary: #b8b8b8;
      --muted: #777777;

      --accent: #ff0000;

      --font:
        "Söhne",
        Inter,
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;

      --mono:
        "Söhne Mono",
        Consolas,
        Monaco,
        monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      background: #000;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 275px;
      height: 100%;
      flex-shrink: 0;
      background: #090909;
      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      z-index: 1000;
    }

    .sidebar-header {
      height: 62px;
      padding: 0 13px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      min-width: 0;
    }

    .brand-logo {
      width: 34px;
      height: 34px;

      border-radius: 9px;

      object-fit: cover;

      border: 1px solid var(--border);

      background: #111;

      flex-shrink: 0;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 650;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-sidebar {
      display: none;

      width: 34px;
      height: 34px;

      border-radius: 8px;

      background: transparent;
      color: var(--secondary);

      font-size: 20px;
    }

    .new-chat {
      margin: 0 12px 11px;

      height: 43px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--surface);
      color: white;

      display: flex;
      align-items: center;

      padding: 0 12px;

      gap: 9px;

      font-size: 13px;
    }

    .new-chat:hover {
      background: var(--surface-2);
    }

    /* SEARCH */

    .search {
      margin: 0 12px 12px;

      height: 39px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface);

      display: flex;
      align-items: center;

      padding: 0 10px;

      gap: 7px;
    }

    .search span {
      color: var(--muted);
    }

    .search input {
      width: 100%;

      border: none;
      outline: none;

      background: transparent;

      color: white;

      font-size: 12px;
    }

    .search input::placeholder {
      color: var(--muted);
    }

    /* HISTORY */

    .history {
      flex: 1;

      overflow-y: auto;

      padding: 3px 8px 12px;
    }

    .history-title {
      padding: 6px 8px;

      color: var(--muted);

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: .7px;
    }

    .history-item {
      width: 100%;

      min-height: 39px;

      padding: 0 8px;

      display: flex;
      align-items: center;

      border-radius: 8px;

      background: transparent;

      color: var(--secondary);

      text-align: left;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--surface);

      color: white;
    }

    .history-name {
      flex: 1;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      font-size: 12px;
    }

    .history-more {
      width: 26px;
      height: 26px;

      background: transparent;

      color: var(--muted);

      border-radius: 7px;

      opacity: 0;
    }

    .history-item:hover .history-more {
      opacity: 1;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);

      padding: 10px 12px 14px;
    }

    .settings-btn {
      width: 100%;

      height: 38px;

      border-radius: 9px;

      background: transparent;

      color: var(--secondary);

      text-align: left;

      padding: 0 9px;

      font-size: 12px;
    }

    .settings-btn:hover {
      background: var(--surface);

      color: white;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;

      min-width: 0;

      height: 100%;

      position: relative;

      display: flex;

      flex-direction: column;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 62px;

      flex-shrink: 0;

      border-bottom: 1px solid var(--border);

      background: rgba(0, 0, 0, .94);

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 14px;

      z-index: 20;
    }

    .top-left,
    .top-right {
      display: flex;

      align-items: center;

      gap: 4px;
    }

    .mobile-menu {
      display: none;
    }

    .model-button {
      height: 39px;

      padding: 0 9px;

      border-radius: 10px;

      background: transparent;

      color: white;

      display: flex;

      align-items: center;

      gap: 7px;

      font-size: 13px;

      font-weight: 600;
    }

    .model-button:hover {
      background: var(--surface);
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--accent);
    }

    .top-button {
      width: 38px;
      height: 38px;

      border-radius: 9px;

      background: transparent;

      color: var(--secondary);

      font-size: 18px;
    }

    .top-button:hover {
      background: var(--surface);

      color: white;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1;

      overflow-y: auto;

      scroll-behavior: smooth;
    }

    .messages-inner {
      width: min(850px, 100%);

      margin: auto;

      padding: 30px 20px 170px;
    }

    /* EMPTY */

    .empty {
      min-height: calc(100dvh - 230px);

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    .empty-logo {
      width: 60px;
      height: 60px;

      border-radius: 17px;

      object-fit: cover;

      border: 1px solid var(--border);

      margin-bottom: 17px;
    }

    .empty h1 {
      font-size: 25px;

      letter-spacing: -.6px;

      margin-bottom: 8px;
    }

    .empty p {
      max-width: 420px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;
    }

    .suggestions {
      width: min(650px, 100%);

      margin-top: 25px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 9px;
    }

    .suggestion {
      min-height: 70px;

      padding: 12px;

      border: 1px solid var(--border);

      border-radius: 12px;

      background: var(--surface);

      color: var(--secondary);

      text-align: left;
    }

    .suggestion:hover {
      background: var(--surface-2);

      color: white;
    }

    .suggestion strong {
      display: block;

      color: white;

      font-size: 12px;

      margin-bottom: 4px;
    }

    .suggestion span {
      font-size: 11px;

      line-height: 1.4;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      margin-bottom: 28px;

      display: flex;

      flex-direction: column;
    }

    .user-message {
      align-items: flex-end;
    }

    .ai-message {
      align-items: flex-start;
    }

    /* USER */

    .user-bubble {
      max-width: 82%;

      padding: 11px 14px;

      border-radius: 17px 17px 4px 17px;

      background: #191919;

      border: 1px solid #292929;

      color: white;

      font-size: 14px;

      line-height: 1.55;

      white-space: pre-wrap;

      word-break: break-word;
    }

    /* AI */

    .ai-response {
      width: 100%;

      color: white;

      font-size: 14px;

      line-height: 1.7;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .ai-response pre {
      margin: 12px 0;

      padding: 14px;

      background: #080808;

      border: 1px solid var(--border);

      border-radius: 11px;

      overflow-x: auto;
    }

    .ai-response code {
      font-family: var(--mono);

      font-size: 12px;
    }

    /* ACTIONS */

    .actions {
      display: flex;

      align-items: center;

      gap: 2px;

      margin-top: 7px;
    }

    .action {
      width: 29px;
      height: 29px;

      border-radius: 7px;

      background: transparent;

      color: var(--muted);

      display: grid;

      place-items: center;

      font-size: 14px;
    }

    .action:hover {
      background: var(--surface);

      color: white;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      display: none;

      align-items: center;

      gap: 5px;

      margin-bottom: 28px;
    }

    .typing.show {
      display: flex;
    }

    .typing span {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #999;

      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: .25;
      }

      30% {
        opacity: 1;
      }
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding: 12px 16px 15px;

      background:
        linear-gradient(
          to top,
          #000 65%,
          rgba(0,0,0,.92) 82%,
          transparent
        );

      z-index: 30;
    }

    .composer-wrap {
      width: min(850px, 100%);

      margin: auto;
    }

    .composer {
      border: 1px solid var(--border);

      border-radius: 19px;

      background: var(--surface);

      padding: 9px 10px 9px 12px;
    }

    .composer:focus-within {
      border-color: #414141;
    }

    textarea {
      display: block;

      width: 100%;

      min-height: 42px;

      max-height: 170px;

      resize: none;

      outline: none;

      border: none;

      background: transparent;

      color: white;

      font-size: 14px;

      line-height: 1.5;

      padding: 4px 2px 9px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .composer-toolbar {
      min-height: 37px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .composer-left {
      display: flex;

      align-items: center;
    }

    .composer-button {
      min-width: 35px;
      height: 34px;

      border-radius: 9px;

      background: transparent;

      color: var(--secondary);

      padding: 0 8px;
    }

    .composer-button:hover {
      background: var(--surface-2);

      color: white;
    }

    .send {
      width: 36px;
      height: 36px;

      border-radius: 10px;

      background: white;

      color: black;

      font-size: 16px;
    }

    .send:disabled {
      opacity: .35;

      cursor: default;
    }

    .note {
      text-align: center;

      color: #555;

      font-size: 9px;

      padding-top: 7px;
    }

    /* =========================
       ATTACHMENTS
    ========================= */

    .attachments {
      display: none;

      flex-wrap: wrap;

      gap: 7px;

      padding-bottom: 7px;
    }

    .attachments.show {
      display: flex;
    }

    .attachment {
      display: flex;

      align-items: center;

      gap: 6px;

      max-width: 200px;

      padding: 6px 8px;

      border: 1px solid var(--border);

      border-radius: 8px;

      background: var(--surface-2);

      color: var(--secondary);

      font-size: 10px;
    }

    .attachment-name {
      max-width: 150px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .remove-file {
      width: 20px;
      height: 20px;

      background: transparent;

      color: var(--muted);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {

      .sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        width: min(86vw, 310px);

        transform: translateX(-105%);

        transition: transform .22s ease;

        box-shadow: 20px 0 50px rgba(0,0,0,.5);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .close-sidebar {
        display: grid;

        place-items: center;
      }

      .overlay {
        display: none;

        position: fixed;

        inset: 0;

        background: rgba(0,0,0,.6);

        z-index: 900;
      }

      .overlay.show {
        display: block;
      }

      .mobile-menu {
        display: grid;

        place-items: center;
      }

      .topbar {
        height: 58px;

        padding: 0 8px;
      }

      .messages-inner {
        padding: 22px 14px 165px;
      }

      .empty {
        min-height: calc(100dvh - 230px);
      }

      .empty h1 {
        font-size: 22px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .suggestion {
        min-height: 58px;
      }

      .user-bubble {
        max-width: 88%;

        font-size: 13px;
      }

      .ai-response {
        font-size: 13px;
      }

      .composer-area {
        padding:
          9px
          9px
          calc(9px + env(safe-area-inset-bottom));
      }

      .composer {
        border-radius: 17px;
      }

      .note {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside id="sidebar" class="sidebar">

      <div class="sidebar-header">

        <a href="index.html" class="brand">

          <img
            src="assets/rg-logo.jpg"
            class="brand-logo"
            alt="RG Creator AI"
          >

          <span class="brand-name">
            RG Creator AI
          </span>

        </a>

        <button
          id="closeSidebar"
          class="close-sidebar"
          type="button"
        >
          ×
        </button>

      </div>

      <button
        id="newChat"
        class="new-chat"
        type="button"
      >
        ＋
        <span>New Chat</span>
      </button>

      <div class="search">

        <span>⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search chats"
        >

      </div>

      <div id="history" class="history">

        <div class="history-title">
          Today
        </div>

        <button
          class="history-item"
          type="button"
        >
          <span class="history-name">
            YouTube Shorts Ideas
          </span>

          <span class="history-more">
            ⋯
          </span>
        </button>

        <button
          class="history-item"
          type="button"
        >
          <span class="history-name">
            Website Code
          </span>

          <span class="history-more">
            ⋯
          </span>
        </button>

        <div class="history-title">
          Yesterday
        </div>

        <button
          class="history-item"
          type="button"
        >
          <span class="history-name">
            Instagram Caption
          </span>

          <span class="history-more">
            ⋯
          </span>
        </button>

        <div class="history-title">
          Previous 7 Days
        </div>

        <button
          class="history-item"
          type="button"
        >
          <span class="history-name">
            Image Prompt
          </span>

          <span class="history-more">
            ⋯
          </span>
        </button>

      </div>

      <div class="sidebar-bottom">

        <button
          class="settings-btn"
          type="button"
          onclick="alert('Settings will be connected later.')"
        >
          ⚙ Settings
        </button>

      </div>

    </aside>

    <div
      id="overlay"
      class="overlay"
    ></div>

    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

      <header class="topbar">

        <div class="top-left">

          <button
            id="openSidebar"
            class="top-button mobile-menu"
            type="button"
          >
            ☰
          </button>

          <button
            id="modelButton"
            class="model-button"
            type="button"
          >
            <span class="status-dot"></span>

            <span>
              RG AI
            </span>

            <span>
              ▾
            </span>
          </button>

        </div>

        <div class="top-right">

          <button
            id="newChatTop"
            class="top-button"
            type="button"
            title="New Chat"
          >
            ＋
          </button>

          <button
            id="moreButton"
            class="top-button"
            type="button"
            title="More"
          >
            ⋯
          </button>

        </div>

      </header>

      <!-- =========================
           MESSAGES
      ========================= -->

      <section
        id="messages"
        class="messages"
      >

        <div
          id="messagesInner"
          class="messages-inner"
        >

          <div
            id="emptyState"
            class="empty"
          >

            <img
              src="assets/rg-logo.jpg"
              class="empty-logo"
              alt="RG Creator AI"
            >

            <h1>
              How can I help you?
            </h1>

            <p>
              Ask anything, write content,
              generate code, or create something new.
            </p>

            <div class="suggestions">

              <button
                class="suggestion"
                data-prompt="Give me 5 creative YouTube Shorts ideas."
              >
                <strong>
                  💡 Get ideas
                </strong>

                <span>
                  Get creative ideas for your content.
                </span>
              </button>

              <button
                class="suggestion"
                data-prompt="Write an engaging Instagram caption for a dance reel."
              >
                <strong>
                  📸 Write content
                </strong>

                <span>
                  Create captions, scripts and posts.
                </span>
              </button>

              <button
                class="suggestion"
                data-prompt="Create a responsive login page using HTML and CSS."
              >
                <strong>
                  💻 Write code
                </strong>

                <span>
                  Generate, explain or fix code.
                </span>
              </button>

              <button
                class="suggestion"
                data-prompt="Create a cinematic image prompt for a futuristic city."
              >
                <strong>
                  🖼️ Create an image
                </strong>

                <span>
                  Create prompts for image generation.
                </span>
              </button>

            </div>

          </div>

          <div
            id="typing"
            class="typing"
          >
            <span></span>
            <span></span>
            <span></span>
          </div>

        </div>

      </section>

      <!-- =========================
           COMPOSER
      ========================= -->

      <div class="composer-area">

        <div class="composer-wrap">

          <div class="composer">

            <div
              id="attachments"
              class="attachments"
            ></div>

            <textarea
              id="messageInput"
              rows="1"
              maxlength="12000"
              placeholder="Ask anything..."
            ></textarea>

            <div class="composer-toolbar">

              <div class="composer-left">

                <button
                  id="attachButton"
                  class="composer-button"
                  type="button"
                  title="Attach"
                >
                  ＋
                </button>

                <button
                  id="voiceButton"
                  class="composer-button"
                  type="button"
                  title="Voice"
                >
                  🎤
                </button>

                <input
                  id="fileInput"
                  type="file"
                  hidden
                  multiple
                  accept="image/*,.pdf,.txt,.csv,.doc,.docx"
                >

              </div>

              <button
                id="sendButton"
                class="send"
                type="button"
                title="Send"
              >
                ➤
              </button>

            </div>

          </div>

          <div class="note">
            RG Creator AI can make mistakes. Check important information.
          </div>

        </div>

      </div>

    </main>

  </div>

  <script>
    /* =========================================================
       ELEMENTS
    ========================================================= */

    const sidebar =
      document.getElementById("sidebar");

    const overlay =
      document.getElementById("overlay");

    const openSidebar =
      document.getElementById("openSidebar");

    const closeSidebar =
      document.getElementById("closeSidebar");

    const newChat =
      document.getElementById("newChat");

    const newChatTop =
      document.getElementById("newChatTop");

    const modelButton =
      document.getElementById("modelButton");

    const moreButton =
      document.getElementById("moreButton");

    const messages =
      document.getElementById("messages");

    const messagesInner =
      document.getElementById("messagesInner");

    const emptyState =
      document.getElementById("emptyState");

    const typing =
      document.getElementById("typing");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const attachButton =
      document.getElementById("attachButton");

    const voiceButton =
      document.getElementById("voiceButton");

    const fileInput =
      document.getElementById("fileInput");

    const attachments =
      document.getElementById("attachments");

    const searchInput =
      document.getElementById("searchInput");

    let selectedFiles = [];

    let busy = false;

    /* =========================================================
       SIDEBAR
    ========================================================= */

    function showSidebar() {
      sidebar.classList.add("open");
      overlay.classList.add("show");
    }

    function hideSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    }

    openSidebar.addEventListener(
      "click",
      showSidebar
    );

    closeSidebar.addEventListener(
      "click",
      hideSidebar
    );

    overlay.addEventListener(
      "click",
      hideSidebar
    );

    /* =========================================================
       NEW CHAT
    ========================================================= */

    function startNewChat() {

      document
        .querySelectorAll(".message")
        .forEach((item) => item.remove());

      emptyState.style.display = "flex";

      messageInput.value = "";

      selectedFiles = [];

      renderFiles();

      resizeInput();

      messageInput.focus();

      hideSidebar();
    }

    newChat.addEventListener(
      "click",
      startNewChat
    );

    newChatTop.addEventListener(
      "click",
      startNewChat
    );

    /* =========================================================
       MODEL
    ========================================================= */

    modelButton.addEventListener(
      "click",
      () => {
        alert(
          "RG AI will use the Gemini model connected to the secure backend."
        );
      }
    );

    /* =========================================================
       MORE
    ========================================================= */

    moreButton.addEventListener(
      "click",
      () => {
        alert(
          "More chat options will be connected later."
        );
      }
    );

    /* =========================================================
       SUGGESTIONS
    ========================================================= */

    document
      .querySelectorAll(".suggestion")
      .forEach((button) => {

        button.addEventListener(
          "click",
          () => {

            messageInput.value =
              button.dataset.prompt || "";

            resizeInput();

            messageInput.focus();

          }
        );

      });

    /* =========================================================
       INPUT RESIZE
    ========================================================= */

    function resizeInput() {

      messageInput.style.height = "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          170
        ) + "px";

    }

    messageInput.addEventListener(
      "input",
      resizeInput
    );

    /* =========================================================
       ENTER
    ========================================================= */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

    /* =========================================================
       SEND
    ========================================================= */

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    async function sendMessage() {

      if (busy) {
        return;
      }

      const message =
        messageInput.value.trim();

      if (!message) {

        messageInput.focus();

        return;

      }

      /* Clear composer */

      messageInput.value = "";

      resizeInput();

      emptyState.style.display = "none";

      /* User message */

      addUserMessage(message);

      /* Loading */

      setLoading(true);

      try {

        /*
         * IMPORTANT:
         *
         * The API key is NOT placed inside this HTML file.
         *
         * The browser calls:
         *
         * /api/chat
         *
         * The Vercel backend is responsible for
         * communicating with Gemini.
         */

        const response =
          await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });

        let data = null;

        try {

          data = await response.json();

        } catch (jsonError) {

          data = null;

        }

        if (!response.ok) {

          const errorMessage =
            data?.error ||
            data?.message ||
            "The AI server returned an error.";

          throw new Error(
            errorMessage
          );

        }

        const aiText =
          data?.reply ||
          data?.response ||
          data?.text ||
          data?.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!aiText) {

          throw new Error(
            "No AI response was returned."
          );

        }

        addAIMessage(
          String(aiText)
        );

      } catch (error) {

        console.error(
          "RG Creator AI chat error:",
          error
        );

        addAIMessage(
          "Sorry, I couldn't get a response right now.\n\n" +
          "Please check the Gemini API connection and try again."
        );

      } finally {

        setLoading(false);

      }

    }

    /* =========================================================
       LOADING
    ========================================================= */

    function setLoading(value) {

      busy = value;

      sendButton.disabled = value;

      if (value) {

        typing.classList.add("show");

      } else {

        typing.classList.remove("show");

      }

      scrollBottom();

    }

    /* =========================================================
       USER MESSAGE
    ========================================================= */

    function addUserMessage(text) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message user-message";

      const bubble =
        document.createElement("div");

      bubble.className =
        "user-bubble";

      bubble.textContent =
        text;

      const actions =
        document.createElement("div");

      actions.className =
        "actions";

      const copy =
        actionButton(
          "⧉",
          "Copy",
          () => copyText(text)
        );

      const edit =
        actionButton(
          "✎",
          "Edit",
          () => {

            messageInput.value = text;

            resizeInput();

            messageInput.focus();

            wrapper.remove();

          }
        );

      actions.appendChild(copy);
      actions.appendChild(edit);

      wrapper.appendChild(bubble);
      wrapper.appendChild(actions);

      messagesInner.insertBefore(
        wrapper,
        typing
      );

      scrollBottom();

    }

    /* =========================================================
       AI MESSAGE
    ========================================================= */

    function addAIMessage(text) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message ai-message";

      const response =
        document.createElement("div");

      response.className =
        "ai-response";

      response.textContent =
        text;

      const actions =
        document.createElement("div");

      actions.className =
        "actions";

      const copy =
        actionButton(
          "⧉",
          "Copy",
          () => copyText(text)
        );

      const like =
        actionButton(
          "♡",
          "Like",
          () => {

            like.classList.toggle(
              "active"
            );

          }
        );

      const unlike =
        actionButton(
          "♧",
          "Unlike",
          () => {

            unlike.classList.toggle(
              "active"
            );

          }
        );

      const share =
        actionButton(
          "↗",
          "Share",
          () => shareText(text)
        );

      const regenerate =
        actionButton(
          "↻",
          "Regenerate",
          () => {

            /*
             * Regeneration will use the
             * previous user prompt.
             */

            const previous =
              wrapper.previousElementSibling;

            if (
              previous &&
              previous.classList.contains(
                "user-message"
              )
            ) {

              const bubble =
                previous.querySelector(
                  ".user-bubble"
                );

              if (bubble) {

                messageInput.value =
                  bubble.textContent;

                resizeInput();

                sendMessage();

              }

            }

          }
        );

      const more =
        actionButton(
          "⋯",
          "More",
          () => {

            const menu =
              document.createElement(
                "div"
              );

            menu.style.position =
              "fixed";

            menu.style.right =
              "15px";

            menu.style.bottom =
              "90px";

            menu.style.background =
              "#111";

            menu.style.border =
              "1px solid #292929";

            menu.style.borderRadius =
              "10px";

            menu.style.padding =
              "7px";

            menu.style.zIndex =
              "9999";

            const read =
              document.createElement(
                "button"
              );

            read.textContent =
              "Read aloud";

            read.style.display =
              "block";

            read.style.width =
              "100%";

            read.style.padding =
              "9px 12px";

            read.style.background =
              "transparent";

            read.style.color =
              "white";

            read.style.border =
              "none";

            read.onclick =
              () => {

                readAloud(text);

                menu.remove();

              };

            menu.appendChild(read);

            document.body.appendChild(
              menu
            );

            document.addEventListener(
              "click",
              function removeMenu(event) {

                if (
                  !menu.contains(
                    event.target
                  ) &&
                  event.target !== more
                ) {

                  menu.remove();

                  document.removeEventListener(
                    "click",
                    removeMenu
                  );

                }

              }
            );

          }
        );

      actions.appendChild(copy);
      actions.appendChild(like);
      actions.appendChild(unlike);
      actions.appendChild(share);
      actions.appendChild(regenerate);
      actions.appendChild(more);

      wrapper.appendChild(response);
      wrapper.appendChild(actions);

      messagesInner.insertBefore(
        wrapper,
        typing
      );

      scrollBottom();

    }

    /* =========================================================
       ACTION BUTTON
    ========================================================= */

    function actionButton(
      icon,
      title,
      callback
    ) {

      const button =
        document.createElement(
          "button"
        );

      button.type = "button";

      button.className =
        "action";

      button.textContent =
        icon;

      button.title =
        title;

      button.setAttribute(
        "aria-label",
        title
      );

      button.addEventListener(
        "click",
        callback
      );

      return button;

    }

    /* =========================================================
       COPY
    ========================================================= */

    async function copyText(text) {

      try {

        await navigator.clipboard.writeText(
          text
        );

      } catch {

        const area =
          document.createElement(
            "textarea"
          );

        area.value = text;

        document.body.appendChild(
          area
        );

        area.select();

        document.execCommand(
          "copy"
        );

        area.remove();

      }

    }

    /* =========================================================
       SHARE
    ========================================================= */

    async function shareText(text) {

      if (
        navigator.share
      ) {

        try {

          await navigator.share({
            title: "RG Creator AI",
            text: text
          });

        } catch {}

        return;

      }

      await copyText(text);

    }

    /* =========================================================
       READ ALOUD
    ========================================================= */

    function readAloud(text) {

      if (
        !window.speechSynthesis
      ) {

        return;

      }

      window.speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(
          text
        );

      speech.rate = 1;

      speech.pitch = 1;

      window.speechSynthesis.speak(
        speech
      );

    }

    /* =========================================================
       SCROLL
    ========================================================= */

    function scrollBottom() {

      requestAnimationFrame(
        () => {

          messages.scrollTo({
            top:
              messages.scrollHeight,
            behavior:
              "smooth"
          });

        }
      );

    }

    /* =========================================================
       FILE ATTACHMENT
    ========================================================= */

    attachButton.addEventListener(
      "click",
      () => {

        fileInput.click();

      }
    );

    fileInput.addEventListener(
      "change",
      () => {

        const files =
          Array.from(
            fileInput.files || []
          );

        selectedFiles =
          selectedFiles.concat(
            files
          );

        renderFiles();

        fileInput.value = "";

      }
    );

    function renderFiles() {

      attachments.innerHTML = "";

      if (
        selectedFiles.length === 0
      ) {

        attachments.classList.remove(
          "show"
        );

        return;

      }

      attachments.classList.add(
        "show"
      );

      selectedFiles.forEach(
        (file, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "attachment";

          const icon =
            document.createElement(
              "span"
            );

          icon.textContent =
            file.type.startsWith(
              "image/"
            )
              ? "🖼️"
              : "📄";

          const name =
            document.createElement(
              "span"
            );

          name.className =
            "attachment-name";

          name.textContent =
            file.name;

          const remove =
            document.createElement(
              "button"
            );

          remove.className =
            "remove-file";

          remove.type =
            "button";

          remove.textContent =
            "×";

          remove.onclick =
            () => {

              selectedFiles.splice(
                index,
                1
              );

              renderFiles();

            };

          item.appendChild(icon);
          item.appendChild(name);
          item.appendChild(remove);

          attachments.appendChild(
            item
          );

        }
      );

    }

    /* =========================================================
       VOICE INPUT
    ========================================================= */

    voiceButton.addEventListener(
      "click",
      () => {

        const SpeechRecognition =
          window.SpeechRecognition ||
          window.webkitSpeechRecognition;

        if (
          !SpeechRecognition
        ) {

          alert(
            "Voice input is not supported by this browser."
          );

          return;

        }

        const recognition =
          new SpeechRecognition();

        recognition.lang =
          "en-US";

        recognition.interimResults =
          false;

        recognition.maxAlternatives =
          1;

        recognition.onresult =
          (event) => {

            const text =
              event
                .results[0][0]
                .transcript;

            messageInput.value =
              messageInput.value
                ? messageInput.value +
                  " " +
                  text
                : text;

            resizeInput();

          };

        recognition.start();

      }
    );

    /* =========================================================
       SEARCH HISTORY
    ========================================================= */

    searchInput.addEventListener(
      "input",
      () => {

        const query =
          searchInput.value
            .toLowerCase()
            .trim();

        document
          .querySelectorAll(
            ".history-item"
          )
          .forEach(
            (item) => {

              const name =
                item
                  .querySelector(
                    ".history-name"
                  )
                  ?.textContent
                  .toLowerCase() || "";

              item.style.display =
                !query ||
                name.includes(query)
                  ? "flex"
                  : "none";

            }
          );

      }
    );

    /* =========================================================
       HISTORY ITEM
    ========================================================= */

    document
      .querySelectorAll(
        ".history-item"
      )
      .forEach(
        (item) => {

          item.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".history-item"
                )
                .forEach(
                  (x) =>
                    x.classList.remove(
                      "active"
                    )
                );

              item.classList.add(
                "active"
              );

              hideSidebar();

            }
          );

        }
      );

    /* =========================================================
       INITIALIZE
    ========================================================= */

    resizeInput();

  </script>

</body>
</html>
