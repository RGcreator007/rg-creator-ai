<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RG Creator AI Chat</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  flex-direction:column;
}

/* TOP BAR */
.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #222;
  flex-shrink:0;
}

.menu-btn,
.more-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  border-radius:50%;
  cursor:pointer;
}

.menu-btn:active,
.more-btn:active{
  background:#222;
}

.title{
  font-size:17px;
  font-weight:600;
}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 15px 150px;
  scroll-behavior:smooth;
}

.message-row{
  width:100%;
  margin:0 0 24px;
}

.user-row{
  display:flex;
  justify-content:flex-end;
}

.ai-row{
  display:block;
}

/* USER MESSAGE BOX */
.user-message{
  max-width:82%;
  background:#2a2a2a;
  border-radius:18px;
  padding:11px 14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

/* AI WITHOUT BOX */
.ai-message{
  width:100%;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:16px;
}

/* IMAGE */
.message-image{
  max-width:260px;
  max-height:280px;
  border-radius:14px;
  display:block;
  margin-bottom:8px;
  object-fit:cover;
}

/* ACTIONS */
.actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:9px;
}

.action-btn{
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#aaa;
  cursor:pointer;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.action-btn svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action-btn:hover{
  color:#fff;
  background:#181818;
}

/* TOOLTIP ONLY ON HOLD/HOVER */
.action-btn::after{
  content:attr(data-label);
  position:absolute;
  bottom:42px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  font-size:11px;
  padding:5px 8px;
  border-radius:6px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:.15s;
}

.action-btn:hover::after,
.action-btn:active::after{
  opacity:1;
}

/* INPUT AREA */
.input-area{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px 12px 14px;
  background:linear-gradient(
    to top,
    #000 75%,
    rgba(0,0,0,.85)
  );
  z-index:20;
}

/* IMAGE PREVIEW */
.preview{
  display:none;
  position:relative;
  width:max-content;
  max-width:100%;
  margin:0 0 8px 4px;
}

.preview img{
  width:76px;
  height:76px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #333;
}

.remove-preview{
  position:absolute;
  top:-7px;
  right:-7px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:#333;
  color:#fff;
  cursor:pointer;
}

/* INPUT BOX */
.input-box{
  display:flex;
  align-items:flex-end;
  gap:7px;
  width:100%;
  min-height:58px;
  border:1px solid #333;
  background:#171717;
  border-radius:25px;
  padding:8px 8px 8px 12px;
}

#prompt{
  flex:1;
  min-height:38px;
  max-height:130px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:16px;
  line-height:1.4;
  padding:8px 2px;
}

#prompt::placeholder{
  color:#777;
}

.icon-btn{
  flex-shrink:0;
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#ccc;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:#292929;
  color:#fff;
}

.icon-btn svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.send-btn{
  background:#fff;
  color:#000;
}

.send-btn:hover{
  background:#ddd;
  color:#000;
}

/* HIDDEN FILE INPUT */
#imageInput{
  display:none;
}

/* CAPABILITIES */
.capabilities{
  display:none;
  position:fixed;
  left:12px;
  right:12px;
  bottom:82px;
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:18px;
  padding:10px;
  z-index:30;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.capability{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 10px;
  border-radius:12px;
  cursor:pointer;
}

.capability:hover{
  background:#292929;
}

.capability-icon{
  width:28px;
  text-align:center;
  font-size:20px;
}

.capability-name{
  font-size:15px;
}

/* MENU */
.side-menu{
  position:fixed;
  top:0;
  left:-290px;
  width:280px;
  height:100%;
  background:#111;
  border-right:1px solid #292929;
  z-index:50;
  transition:.25s;
  padding:18px 14px;
}

.side-menu.open{
  left:0;
}

.menu-title{
  font-size:18px;
  font-weight:600;
  margin:8px 8px 22px;
}

.menu-item{
  padding:13px 12px;
  border-radius:10px;
  color:#ddd;
  cursor:pointer;
}

.menu-item:hover{
  background:#222;
}

/* MORE MENU */
.more-menu{
  display:none;
  position:fixed;
  right:12px;
  top:60px;
  width:235px;
  background:#1d1d1d;
  border-radius:18px;
  padding:8px;
  z-index:60;
  box-shadow:0 10px 35px rgba(0,0,0,.55);
}

.more-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:13px 12px;
  border-radius:10px;
  color:#eee;
  cursor:pointer;
}

.more-item:hover{
  background:#2a2a2a;
}

.more-item svg{
  width:21px;
  height:21px;
  stroke:#eee;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* THINKING */
.thinking{
  color:#888;
}

/* MOBILE */
@media(max-width:600px){
  .user-message{
    max-width:88%;
  }

  #chat{
    padding-left:12px;
    padding-right:12px;
  }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

  <button class="menu-btn" onclick="toggleSideMenu()" aria-label="Menu">
    ☰
  </button>

  <div class="title">RG Creator AI</div>

  <button class="more-btn" onclick="toggleMoreMenu()" aria-label="More">
    ⋯
  </button>

</div>


<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">

  <div class="menu-title">RG Creator AI</div>

  <div class="menu-item" onclick="closeSideMenu()">
    💬 New Chat
  </div>

  <div class="menu-item">
    🕘 Chat History
  </div>

  <div class="menu-item">
    ⚙️ Settings
  </div>

</div>


<!-- MORE MENU -->
<div class="more-menu" id="moreMenu">

  <div class="more-item" onclick="shareConversation()">
    <svg viewBox="0 0 24 24">
      <path d="M12 16V3"></path>
      <path d="M7 8l5-5 5 5"></path>
      <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path>
    </svg>
    <span>Share conversation</span>
  </div>

  <div class="more-item" onclick="pinConversation()">
    <svg viewBox="0 0 24 24">
      <path d="M9 3h6"></path>
      <path d="M8 3v7l-3 4h14l-3-4V3"></path>
      <path d="M12 14v7"></path>
    </svg>
    <span>Pin</span>
  </div>

  <div class="more-item" onclick="renameConversation()">
    <svg viewBox="0 0 24 24">
      <path d="M4 20h4L19 9l-4-4L4 16v4z"></path>
    </svg>
    <span>Rename</span>
  </div>

  <div class="more-item" onclick="downloadChat()">
    <svg viewBox="0 0 24 24">
      <path d="M12 3v12"></path>
      <path d="M7 10l5 5 5-5"></path>
      <path d="M5 20h14"></path>
    </svg>
    <span>Download</span>
  </div>

  <div class="more-item" onclick="exportDocs()">
    <svg viewBox="0 0 24 24">
      <path d="M6 3h9l4 4v14H6z"></path>
      <path d="M14 3v5h5"></path>
      <path d="M9 13h6"></path>
      <path d="M9 17h4"></path>
    </svg>
    <span>Export to Docs</span>
  </div>

  <div class="more-item" onclick="deleteChat()">
    <svg viewBox="0 0 24 24">
      <path d="M4 7h16"></path>
      <path d="M10 11v6"></path>
      <path d="M14 11v6"></path>
      <path d="M6 7l1 14h10l1-14"></path>
      <path d="M9 7V4h6v3"></path>
    </svg>
    <span>Delete</span>
  </div>

</div>


<!-- CHAT -->
<div id="chat"></div>


<!-- INPUT -->
<div class="input-area">

  <!-- IMAGE PREVIEW -->
  <div class="preview" id="preview">
    <img id="previewImage" src="" alt="Selected image">
    <button class="remove-preview" onclick="removeImage()">×</button>
  </div>


  <div class="input-box">

    <!-- IMAGE -->
    <button
      class="icon-btn"
      onclick="document.getElementById('imageInput').click()"
      data-label="Add image"
      aria-label="Add image"
    >
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <circle cx="8.5" cy="9" r="1.5"></circle>
        <path d="M21 15l-5-5L5 20"></path>
      </svg>
    </button>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      onchange="handleImage(event)"
    >


    <!-- CAPABILITIES -->
    <button
      class="icon-btn"
      onclick="toggleCapabilities()"
      data-label="Capabilities"
      aria-label="Capabilities"
    >
      <svg viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6"></rect>
        <rect x="14" y="4" width="6" height="6"></rect>
        <rect x="4" y="14" width="6" height="6"></rect>
        <rect x="14" y="14" width="6" height="6"></rect>
      </svg>
    </button>


    <!-- TEXT -->
    <textarea
      id="prompt"
      placeholder="Message RG Creator AI..."
      rows="1"
      oninput="autoResize(this)"
      onkeydown="handleEnter(event)"
    ></textarea>


    <!-- VOICE -->
    <button
      class="icon-btn"
      onclick="startVoice()"
      data-label="Voice"
      aria-label="Voice"
    >
      <svg viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="12" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <path d="M12 18v3"></path>
        <path d="M8 21h8"></path>
      </svg>
    </button>


    <!-- SEND -->
    <button
      class="icon-btn send-btn"
      onclick="sendMessage()"
      data-label="Send"
      aria-label="Send"
    >
      <svg viewBox="0 0 24 24">
        <path d="M5 12h13"></path>
        <path d="M13 6l6 6-6 6"></path>
      </svg>
    </button>

  </div>

</div>


<!-- CAPABILITIES PANEL -->
<div class="capabilities" id="capabilities">

  <div class="capability">
    <div class="capability-icon">✍️</div>
    <div class="capability-name">Content Writer</div>
  </div>

  <div class="capability">
    <div class="capability-icon">💻</div>
    <div class="capability-name">Code Generator</div>
  </div>

  <div class="capability">
    <div class="capability-icon">🖼️</div>
    <div class="capability-name">AI Image Generator</div>
  </div>

  <div class="capability">
    <div class="capability-icon">▶️</div>
    <div class="capability-name">YouTube Tools</div>
  </div>

  <div class="capability">
    <div class="capability-icon">📸</div>
    <div class="capability-name">Instagram Tools</div>
  </div>

</div>


<script>

let selectedImageBase64 = null;
let selectedImageMime = null;

let conversationHistory = [];


/* SEND MESSAGE */
async function sendMessage(){

  const input = document.getElementById("prompt");
  const text = input.value.trim();

  if(!text && !selectedImageBase64){
    return;
  }

  const chat = document.getElementById("chat");

  /* USER MESSAGE */
  const userRow = document.createElement("div");
  userRow.className = "message-row user-row";

  const userBox = document.createElement("div");
  userBox.className = "user-message";

  if(selectedImageBase64){

    const img = document.createElement("img");

    img.className = "message-image";

    img.src =
      "data:" +
      selectedImageMime +
      ";base64," +
      selectedImageBase64;

    userBox.appendChild(img);
  }

  if(text){

    const textNode = document.createElement("div");

    textNode.textContent = text;

    userBox.appendChild(textNode);
  }

  userRow.appendChild(userBox);

  /* USER ACTIONS */
  const userActions = document.createElement("div");
  userActions.className = "actions";

  userActions.innerHTML = `
    <button class="action-btn"
      data-label="Copy"
      onclick="copyText(${JSON.stringify(text)})">
      <svg viewBox="0 0 24 24">
        <rect x="8" y="8" width="11" height="11" rx="2"></rect>
        <path d="M5 16H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1"></path>
      </svg>
    </button>

    <button class="action-btn"
      data-label="Edit"
      onclick="editMessage(${JSON.stringify(text)})">
      <svg viewBox="0 0 24 24">
        <path d="M4 20h4L19 9l-4-4L4 16v4z"></path>
      </svg>
    </button>
  `;

  userBox.appendChild(userActions);

  chat.appendChild(userRow);


  /* AI ROW */
  const aiRow = document.createElement("div");

  aiRow.className = "message-row ai-row";

  const aiMessage = document.createElement("div");

  aiMessage.className = "ai-message thinking";

  aiMessage.textContent = "Thinking...";

  aiRow.appendChild(aiMessage);

  chat.appendChild(aiRow);

  chat.scrollTop = chat.scrollHeight;


  const imageToSend = selectedImageBase64;
  const mimeToSend = selectedImageMime;


  /* RESET INPUT */
  input.value = "";

  removeImage();

  autoResize(input);


  try{

    const response = await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        message:text,

        history:conversationHistory,

        image:imageToSend,

        imageMimeType:mimeToSend

      })

    });


    const data = await response.json();


    if(!response.ok){

      aiMessage.classList.remove("thinking");

      aiMessage.textContent =
        "❌ API Error: " +
        (data.details || data.error || "Something went wrong.");

      return;
    }


    const reply =
      data.reply ||
      "Sorry, I couldn't generate a response.";


    aiMessage.classList.remove("thinking");

    aiMessage.textContent = reply;


    /* SAVE HISTORY */
    conversationHistory.push({

      role:"user",

      content:text

    });

    conversationHistory.push({

      role:"assistant",

      content:reply

    });


    /* AI ACTIONS */
    const actions = document.createElement("div");

    actions.className = "actions";


    actions.innerHTML = `

      <button class="action-btn"
        data-label="Like"
        onclick="likeReply(this)">
        <svg viewBox="0 0 24 24">
          <path d="M7 10v11H4V10h3z"></path>
          <path d="M7 10l5-7c1 0 2 1 2 3v4h5c1 0 2 1 2 3l-1 6c0 1-1 2-2 2H7"></path>
        </svg>
      </button>

      <button class="action-btn"
        data-label="Unlike"
        onclick="unlikeReply(this)">
        <svg viewBox="0 0 24 24">
          <path d="M7 14V3H4v11h3z"></path>
          <path d="M7 14l5 7c1 0 2-1 2-3v-4h5c1 0 2-1 2-3l-1-6c0-1-1-2-2-2H7"></path>
        </svg>
      </button>

      <button class="action-btn"
        data-label="Share"
        onclick="shareReply(${JSON.stringify(reply)})">
        <svg viewBox="0 0 24 24">
          <path d="M12 16V3"></path>
          <path d="M7 8l5-5 5 5"></path>
          <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path>
        </svg>
      </button>

      <button class="action-btn"
        data-label="Copy"
        onclick="copyText(${JSON.stringify(reply)})">
        <svg viewBox="0 0 24 24">
          <rect x="8" y="8" width="11" height="11" rx="2"></rect>
          <path d="M5 16H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>

      <button class="action-btn"
        data-label="Regenerate"
        onclick="regenerateReply()">
        <svg viewBox="0 0 24 24">
          <path d="M20 11a8 8 0 0 0-14-5L4 8"></path>
          <path d="M4 4v4h4"></path>
          <path d="M4 13a8 8 0 0 0 14 5l2-2"></path>
          <path d="M20 20v-4h-4"></path>
        </svg>
      </button>

      <button class="action-btn"
        data-label="More"
        onclick="toggleReplyMenu(this)">
        <svg viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1"></circle>
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="19" cy="12" r="1"></circle>
        </svg>
      </button>

    `;


    aiRow.appendChild(actions);


  }catch(error){

    aiMessage.classList.remove("thinking");

    aiMessage.textContent =
      "❌ Connection Error: " +
      error.message;

  }


  chat.scrollTop = chat.scrollHeight;
}


/* IMAGE SELECT */
function handleImage(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){

    alert("Please select an image.");

    return;
  }


  const reader = new FileReader();


  reader.onload = function(e){

    const result = e.target.result;

    selectedImageMime = file.type;

    selectedImageBase64 =
      result.split(",")[1];


    document.getElementById("previewImage").src =
      result;

    document.getElementById("preview").style.display =
      "block";

  };


  reader.readAsDataURL(file);
}


/* REMOVE IMAGE */
function removeImage(){

  selectedImageBase64 = null;

  selectedImageMime = null;

  document.getElementById("preview").style.display =
    "none";

  document.getElementById("previewImage").src = "";

  document.getElementById("imageInput").value = "";
}


/* AUTO RESIZE */
function autoResize(element){

  element.style.height = "auto";

  element.style.height =
    Math.min(element.scrollHeight,130) + "px";
}


/* ENTER */
function handleEnter(event){

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();

    sendMessage();

  }
}


/* COPY */
async function copyText(text){

  if(!text){
    return;
  }

  try{

    await navigator.clipboard.writeText(text);

  }catch(e){

    const area = document.createElement("textarea");

    area.value = text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

  }
}


/* EDIT */
function editMessage(text){

  const input = document.getElementById("prompt");

  input.value = text;

  input.focus();

  autoResize(input);
}


/* LIKE */
function likeReply(button){

  button.style.color = "#fff";

}


/* UNLIKE */
function unlikeReply(button){

  button.style.color = "#fff";

}


/* SHARE */
async function shareReply(text){

  if(navigator.share){

    await navigator.share({

      title:"RG Creator AI",

      text:text

    });

  }else{

    await copyText(text);

  }
}


/* VOICE */
function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert("Voice input is not supported in this browser.");

    return;
  }


  const recognition =
    new SpeechRecognition();

  recognition.lang =
    navigator.language || "en-IN";

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  recognition.start();


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      const input =
        document.getElementById("prompt");

      input.value +=
        (input.value ? " " : "") + text;

      autoResize(input);

    };

}


/* CAPABILITIES */
function toggleCapabilities(){

  const panel =
    document.getElementById("capabilities");

  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";
}


/* SIDE MENU */
function toggleSideMenu(){

  document
    .getElementById("sideMenu")
    .classList.toggle("open");
}


function closeSideMenu(){

  document
    .getElementById("sideMenu")
    .classList.remove("open");
}


/* MORE MENU */
function toggleMoreMenu(){

  const menu =
    document.getElementById("moreMenu");

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";
}


/* MORE ACTIONS */
async function shareConversation(){

  const text =
    document.getElementById("chat").innerText;

  if(navigator.share){

    await navigator.share({

      title:"RG Creator AI Conversation",

      text:text

    });

  }else{

    await copyText(text);

  }

}


function pinConversation(){

  alert("Conversation pinned.");

}


function renameConversation(){

  const name =
    prompt("Enter conversation name:");

  if(name){

    document.querySelector(".title").textContent =
      name;

  }

}


function downloadChat(){

  const text =
    document.getElementById("chat").innerText;

  const blob =
    new Blob([text],{
      type:"text/plain"
    });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = "RG-Creator-AI-Chat.txt";

  a.click();

  URL.revokeObjectURL(url);

}


function exportDocs(){

  downloadChat();

}


function deleteChat(){

  if(confirm("Delete this conversation?")){

    document.getElementById("chat").innerHTML = "";

    conversationHistory = [];

  }

}


/* REGENERATE */
function regenerateReply(){

  sendMessage();

}


/* REPLY MORE */
function toggleReplyMenu(button){

  const menu =
    document.createElement("div");

  menu.style.position = "absolute";
  menu.style.background = "#1d1d1d";
  menu.style.padding = "7px";
  menu.style.borderRadius = "14px";
  menu.style.boxShadow =
    "0 10px 30px rgba(0,0,0,.5)";
  menu.style.zIndex = "100";

  menu.innerHTML = `
    <div style="padding:12px;cursor:pointer"
      onclick="downloadChat();this.parentElement.remove()">
      ⬇️ Download
    </div>

    <div style="padding:12px;cursor:pointer"
      onclick="this.parentElement.remove()">
      ✂️ Cut
    </div>
  `;

  document.body.appendChild(menu);

  const rect =
    button.getBoundingClientRect();

  menu.style.left =
    rect.left + "px";

  menu.style.top =
    (rect.top - 100) + "px";

}


/* CLOSE MENUS WHEN CLICKING OUTSIDE */
document.addEventListener("click",function(event){

  const more =
    document.getElementById("moreMenu");

  const moreButton =
    document.querySelector(".more-btn");

  if(
    more.style.display === "block" &&
    !more.contains(event.target) &&
    !moreButton.contains(event.target)
  ){

    more.style.display = "none";

  }

});


</script>
