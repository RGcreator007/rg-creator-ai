<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RG Creator AI — Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#000;
  --panel:#111;
  --panel2:#181818;
  --panel3:#222;
  --border:#2d2d2d;
  --text:#fff;
  --muted:#888;
  --accent:#ff3030;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;

  /* RG Creator AI normal font system */
  font-family:
    "Söhne",
    "Inter",
    "Segoe UI",
    "Helvetica Neue",
    Arial,
    sans-serif;

  overflow:hidden;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

pre,
code,
.code,
.code-block,
.code-output,
.technical-text{
  font-family:
    "Söhne Mono",
    "Consolas",
    "Monaco",
    monospace;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  position:relative;
}

/* ================= HEADER ================= */

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(0,0,0,.95);
  border-bottom:1px solid #181818;
  backdrop-filter:blur(15px);
  position:relative;
  z-index:30;
}

.header-left,
.header-right{
  display:flex;
  align-items:center;
}

.header-left{
  gap:9px;
  min-width:0;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:#181818;
}

.icon{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.title{
  max-width:55vw;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:16px;
  font-weight:600;
}

/* ================= CHAT AREA ================= */

.chat-area{
  height:calc(100% - 64px);
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 15px 155px;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:10px;
}

/* ================= WELCOME ================= */

.welcome{
  max-width:760px;
  margin:14vh auto 0;
  text-align:center;
}

.welcome-logo{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:18px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:800;
}

.welcome h1{
  margin-top:18px;
  font-size:28px;
  letter-spacing:-1px;
}

.welcome p{
  margin-top:8px;
  color:#777;
  font-size:14px;
}

/* ================= MESSAGES ================= */

.message{
  width:100%;
  max-width:760px;
  margin:0 auto 28px;
}

.user-message{
  display:flex;
  justify-content:flex-end;
}

.user-bubble{
  max-width:84%;
  padding:12px 15px;
  background:#252525;
  border-radius:20px 20px 5px 20px;
  font-size:15px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.ai-message{
  font-size:15px;
  line-height:1.7;
}

.ai-content{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-actions{
  display:flex;
  align-items:center;
  gap:2px;
  margin-top:9px;
}

.action-btn{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  color:#888;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.action-btn:hover{
  background:#181818;
  color:#fff;
}

.action-btn .icon{
  width:18px;
  height:18px;
}

/* ================= INPUT ================= */

.input-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 12px 17px;
  background:linear-gradient(
    transparent,
    #000 25%
  );
  z-index:20;
}

.composer{
  width:min(760px,100%);
  margin:auto;
  padding:10px;
  background:#151515;
  border:1px solid #303030;
  border-radius:24px;
  box-shadow:0 -8px 35px rgba(0,0,0,.45);
}

.attachment-preview{
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  margin-bottom:8px;
  border-radius:12px;
  background:#202020;
  color:#bbb;
  font-size:12px;
}

.attachment-preview.show{
  display:flex;
}

.composer textarea{
  width:100%;
  min-height:46px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:7px 8px;
  font-size:15px;
  line-height:1.5;
}

.composer textarea::placeholder{
  color:#6f6f6f;
}

.composer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.composer-left,
.composer-right{
  display:flex;
  align-items:center;
  gap:3px;
}

.circle{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
}

.circle:hover{
  background:#242424;
  color:#fff;
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.send:hover{
  transform:scale(1.04);
}

/* ================= PLUS MENU ================= */

.plus-wrap{
  position:relative;
}

.plus-menu{
  position:absolute;
  left:0;
  bottom:49px;
  width:210px;
  padding:7px;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:18px;
  display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.7);
  z-index:100;
}

.plus-menu.open{
  display:block;
}

.menu-item{
  width:100%;
  height:44px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 11px;
  border-radius:11px;
  text-align:left;
}

.menu-item:hover{
  background:#282828;
}

.menu-item .icon{
  width:20px;
  height:20px;
}

/* ================= SIDEBAR ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:90;
  display:none;
}

.overlay.show{
  display:block;
}

.sidebar{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(310px,86vw);
  background:#111;
  border-right:1px solid #292929;
  z-index:100;
  transform:translateX(-100%);
  transition:.22s ease;
  display:flex;
  flex-direction:column;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-head{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #242424;
}

.sidebar-title{
  font-weight:700;
}

.new-chat{
  margin:13px;
  height:45px;
  border:1px solid #303030;
  background:#1a1a1a;
  color:#fff;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  font-size:14px;
}

.search{
  margin:0 13px 12px;
  height:42px;
  width:calc(100% - 26px);
  padding:0 12px;
  border:1px solid #292929;
  background:#171717;
  border-radius:12px;
  color:#fff;
  outline:none;
}

.history{
  flex:1;
  overflow-y:auto;
  padding:0 8px 10px;
}

.history-title{
  color:#777;
  font-size:11px;
  padding:12px 8px 6px;
  text-transform:uppercase;
}

.chat-history-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 9px;
  border-radius:11px;
  color:#ddd;
}

.chat-history-item:hover{
  background:#1e1e1e;
}

.chat-name{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.history-more{
  width:28px;
  height:28px;
  border:0;
  background:transparent;
  color:#777;
  border-radius:8px;
}

.history-more:hover{
  background:#292929;
  color:#fff;
}

/* SETTINGS + LOGIN AT NORMAL MENU BOTTOM */

.sidebar-bottom{
  margin-top:auto;
  padding:10px;
  border-top:1px solid #242424;
  background:#111;
}

.sidebar-bottom-item{
  width:100%;
  min-height:46px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 12px;
  font-size:14px;
  text-align:left;
}

.sidebar-bottom-item:hover{
  background:#202020;
}

/* ================= COMMON MORE MENU ================= */

.more-menu{
  position:absolute;
  top:57px;
  right:12px;
  width:235px;
  padding:7px;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:17px;
  display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.7);
  z-index:70;
}

.more-menu.open{
  display:block;
}

.more-row{
  width:100%;
  height:45px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 11px;
  border-radius:11px;
  text-align:left;
}

.more-row:hover{
  background:#282828;
}

.more-row .icon{
  width:20px;
  height:20px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%) translateY(10px);
  padding:10px 15px;
  background:#222;
  border:1px solid #333;
  border-radius:12px;
  color:#fff;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:400;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MODAL ================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:500;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(420px,100%);
  max-height:85vh;
  overflow:auto;
  background:#111;
  border:1px solid #333;
  border-radius:20px;
  padding:18px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  font-size:20px;
}

.modal-close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#202020;
  color:#fff;
  font-size:20px;
}

.modal-text{
  color:#999;
  font-size:14px;
  line-height:1.6;
  margin-bottom:15px;
}

.modal-input{
  width:100%;
  height:46px;
  margin-bottom:9px;
  padding:0 12px;
  border:1px solid #303030;
  border-radius:11px;
  background:#181818;
  color:#fff;
  outline:none;
}

.modal-button{
  width:100%;
  min-height:45px;
  margin-top:8px;
  border-radius:11px;
  border:1px solid #303030;
  background:#181818;
  color:#fff;
}

.modal-button.primary{
  background:#fff;
  color:#000;
  border:0;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .header{
    height:60px;
  }

  .chat-area{
    height:calc(100% - 60px);
  }

  .messages{
    padding:16px 13px 145px;
  }

  .welcome{
    margin-top:18vh;
  }

  .welcome h1{
    font-size:25px;
  }

  .user-bubble{
    max-width:88%;
  }

  .input-area{
    padding:8px 9px 12px;
  }

  .composer{
    border-radius:21px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="header-left">

    <button
      class="icon-btn"
      onclick="openSidebar()"
      aria-label="Open menu"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <div
      class="title"
      id="chatTitle"
    >
      RG Creator AI
    </div>

  </div>

  <div class="header-right">

    <button
      class="icon-btn"
      onclick="toggleTopMenu()"
      aria-label="More"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1"/>
        <circle cx="12" cy="12" r="1"/>
        <circle cx="19" cy="12" r="1"/>
      </svg>
    </button>

  </div>

</header>


<!-- ================= COMMON MORE MENU ================= -->

<div
  class="more-menu"
  id="topMenu"
>

  <button
    class="more-row"
    onclick="shareConversation();closeTopMenu()"
  >
    🔗
    Share
  </button>

  <button
    class="more-row"
    onclick="openSidebar();closeTopMenu()"
  >
    💬
    Chat History
  </button>

  <button
    class="more-row"
    onclick="showHelp();closeTopMenu()"
  >
    ❓
    Help
  </button>

  <button
    class="more-row"
    onclick="showFeedback();closeTopMenu()"
  >
    💡
    Feedback
  </button>

  <button
    class="more-row"
    onclick="showAbout();closeTopMenu()"
  >
    ℹ️
    About
  </button>

  <button
    class="more-row"
    onclick="deleteConversation();closeTopMenu()"
  >
    🗑️
    Delete
  </button>

</div>


<!-- ================= CHAT ================= -->

<main class="chat-area">

  <div
    class="messages"
    id="messages"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-logo">
        RG
      </div>

      <h1>
        How can I help you?
      </h1>

      <p>
        Ask anything, create content or build something.
      </p>

    </div>

  </div>

</main>


<!-- ================= INPUT ================= -->

<div class="input-area">

  <div class="composer">

    <div
      class="attachment-preview"
      id="attachmentPreview"
    >
      <span>📎</span>
      <span id="attachmentName"></span>
    </div>


    <textarea
      id="messageInput"
      placeholder="Ask anything..."
      rows="1"
    ></textarea>


    <div class="composer-bottom">

      <div class="composer-left">

        <div class="plus-wrap">

          <button
            class="circle"
            onclick="togglePlus()"
            aria-label="Attach"
          >
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>


          <div
            class="plus-menu"
            id="plusMenu"
          >

            <button
              class="menu-item"
              onclick="chooseImage()"
            >
              🖼️
              Image
            </button>

            <button
              class="menu-item"
              onclick="chooseCamera()"
            >
              📷
              Camera
            </button>

            <button
              class="menu-item"
              onclick="chooseVideo()"
            >
              🎥
              Video
            </button>

            <button
              class="menu-item"
              onclick="chooseFile()"
            >
              📄
              File
            </button>

            <button
              class="menu-item"
              onclick="choosePDF()"
            >
              📕
              PDF
            </button>

          </div>

        </div>


        <button
          class="circle"
          onclick="startVoice()"
          aria-label="Voice"
        >
          🎤
        </button>

      </div>


      <div class="composer-right">

        <button
          class="send"
          onclick="sendMessage()"
          aria-label="Send"
        >
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M5 12h14"/>
            <path d="m13 6 6 6-6 6"/>
          </svg>
        </button>

      </div>

    </div>

  </div>

</div>


<!-- ================= FILE INPUTS ================= -->

<input
  type="file"
  id="imageInput"
  accept="image/*"
  hidden
  onchange="handleAttachment(this)"
>

<input
  type="file"
  id="cameraInput"
  accept="image/*"
  capture="environment"
  hidden
  onchange="handleAttachment(this)"
>

<input
  type="file"
  id="videoInput"
  accept="video/*"
  hidden
  onchange="handleAttachment(this)"
>

<input
  type="file"
  id="fileInput"
  accept=".txt,.doc,.docx,.csv,.json,.html,.css,.js,.py,.java,.php"
  hidden
  onchange="handleAttachment(this)"
>

<input
  type="file"
  id="pdfInput"
  accept="application/pdf"
  hidden
  onchange="handleAttachment(this)"
>


<!-- ================= SIDEBAR ================= -->

<div
  class="overlay"
  id="overlay"
  onclick="closeSidebar()"
></div>


<aside
  class="sidebar"
  id="sidebar"
>

  <div class="sidebar-head">

    <div class="sidebar-title">
      Chats
    </div>

    <button
      class="icon-btn"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>


  <button
    class="new-chat"
    onclick="newChat()"
  >
    +
    New chat
  </button>


  <input
    class="search"
    id="chatSearch"
    placeholder="Search chats..."
    oninput="searchChats()"
  >


  <div
    class="history"
    id="history"
  ></div>


  <!-- NORMAL MENU BOTTOM -->

  <div class="sidebar-bottom">

    <button
      class="sidebar-bottom-item"
      onclick="openSettings()"
    >
      ⚙️
      Settings
    </button>


    <button
      class="sidebar-bottom-item"
      onclick="openLogin()"
    >
      👤
      Log in / Sign up
    </button>

  </div>

</aside>


<!-- ================= MODAL ================= -->

<div
  class="modal-backdrop"
  id="modalBackdrop"
  onclick="closeModal(event)"
>

  <div
    class="modal"
    onclick="event.stopPropagation()"
  >

    <div class="modal-head">

      <h2 id="modalTitle">
        RG Creator AI
      </h2>

      <button
        class="modal-close"
        onclick="hideModal()"
      >
        ×
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =====================================================
   RG CREATOR AI CHAT
===================================================== */

let messagesData =
  JSON.parse(
    localStorage.getItem("rg_messages") || "[]"
  );

let chatName =
  localStorage.getItem("rg_chat_name") ||
  "RG Creator AI";

let lastUserMessage = "";


/* ================= ELEMENTS ================= */

const messagesEl =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const welcome =
  document.getElementById("welcome");


/* ================= INIT ================= */

document
  .getElementById("chatTitle")
  .textContent = chatName;

renderMessages();
renderHistory();


/* ================= TOAST ================= */

function toast(text){

  const el =
    document.getElementById("toast");

  el.textContent = text;

  el.classList.add("show");

  setTimeout(function(){

    el.classList.remove("show");

  },2200);

}


/* ================= PLUS ================= */

function togglePlus(){

  document
    .getElementById("plusMenu")
    .classList.toggle("open");

}

function closePlus(){

  document
    .getElementById("plusMenu")
    .classList.remove("open");

}


/* ================= ATTACHMENTS ================= */

function chooseImage(){

  closePlus();

  document
    .getElementById("imageInput")
    .click();

}

function chooseCamera(){

  closePlus();

  document
    .getElementById("cameraInput")
    .click();

}

function chooseVideo(){

  closePlus();

  document
    .getElementById("videoInput")
    .click();

}

function chooseFile(){

  closePlus();

  document
    .getElementById("fileInput")
    .click();

}

function choosePDF(){

  closePlus();

  document
    .getElementById("pdfInput")
    .click();

}


function handleAttachment(fileInput){

  if(
    !fileInput.files ||
    !fileInput.files.length
  ){
    return;
  }

  const file =
    fileInput.files[0];

  document
    .getElementById("attachmentName")
    .textContent =
    file.name;

  document
    .getElementById("attachmentPreview")
    .classList.add("show");

  toast(
    "Attachment added: " +
    file.name
  );

}


/* ================= SEND ================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  lastUserMessage = text;

  messagesData.push({
    role:"user",
    text:text,
    time:Date.now()
  });

  saveMessages();

  input.value = "";

  document
    .getElementById("attachmentPreview")
    .classList.remove("show");

  autoResize();

  renderMessages();

  const aiIndex =
    messagesData.length;

  messagesData.push({
    role:"assistant",
    text:"Thinking...",
    time:Date.now()
  });

  renderMessages();

  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:text
            })
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "AI request failed"
      );

    }

    messagesData[aiIndex].text =
      data.reply;

    saveMessages();

    renderMessages();

  }catch(error){

    messagesData[aiIndex].text =
      "Sorry, I couldn't complete that request.\n\n" +
      (
        error.message ||
        "Server error"
      );

    saveMessages();

    renderMessages();

  }

}


/* ================= RENDER ================= */

function renderMessages(){

  if(!messagesData.length){

    welcome.style.display =
      "block";

    return;

  }

  welcome.style.display =
    "none";

  messagesEl.innerHTML = "";

  messagesData.forEach(
    function(message,index){

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message " +
        (
          message.role === "user"
            ? "user-message"
            : "ai-message"
        );


      if(message.role === "user"){

        wrapper.innerHTML = `
          <div class="user-bubble">
            ${escapeHTML(message.text)}
          </div>
        `;

      }else{

        wrapper.innerHTML = `
          <div class="ai-content">
            ${escapeHTML(message.text)}
          </div>

          <div class="message-actions">

            <button
              class="action-btn"
              onclick="copyMessage(${index})"
              title="Copy"
            >
              ${iconCopy()}
            </button>

            <button
              class="action-btn"
              onclick="likeMessage(${index})"
              title="Like"
            >
              ${iconLike()}
            </button>

            <button
              class="action-btn"
              onclick="dislikeMessage(${index})"
              title="Dislike"
            >
              ${iconDislike()}
            </button>

            <button
              class="action-btn"
              onclick="shareMessage(${index})"
              title="Share"
            >
              ${iconShare()}
            </button>

            <button
              class="action-btn"
              onclick="regenerateMessage(${index})"
              title="Regenerate"
            >
              ${iconRefresh()}
            </button>

            <button
              class="action-btn"
              onclick="moreMessage(${index})"
              title="More"
            >
              ${iconMore()}
            </button>

          </div>
        `;

      }

      messagesEl.appendChild(wrapper);

    }
  );

  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* ================= COPY ================= */

async function copyMessage(index){

  const text =
    messagesData[index]?.text || "";

  try{

    await navigator.clipboard.writeText(text);

    toast("Copied");

  }catch{

    toast("Copy failed");

  }

}

/* ================= SHARE ================= */

async function shareMessage(index){

  const text =
    messagesData[index]?.text || "";

  if(navigator.share){

    try{

      await navigator.share({
        title:"RG Creator AI",
        text:text
      });

    }catch{}

  }else{

    try{

      await navigator.clipboard.writeText(text);

      toast("Response copied");

    }catch{

      toast("Share unavailable");

    }

  }

}


/* ================= REGENERATE ================= */

async function regenerateMessage(index){

  let userText =
    lastUserMessage;

  if(!userText){

    for(
      let i=index-1;
      i>=0;
      i--
    ){

      if(
        messagesData[i].role === "user"
      ){

        userText =
          messagesData[i].text;

        break;

      }

    }

  }

  if(!userText){

    toast("No user message found");

    return;

  }

  messagesData[index].text =
    "Regenerating...";

  renderMessages();

  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:userText
            })
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Request failed"
      );

    }

    messagesData[index].text =
      data.reply;

    saveMessages();

    renderMessages();

  }catch(error){

    messagesData[index].text =
      "Unable to regenerate response.\n\n" +
      (
        error.message ||
        "Server error"
      );

    saveMessages();

    renderMessages();

  }

}


/* ================= AI MORE ================= */

function moreMessage(index){

  const choice =
    prompt(
      "Choose an option:\n\n" +
      "1 = Read aloud\n" +
      "2 = Copy\n" +
      "3 = Delete\n" +
      "4 = Save"
    );

  if(choice === "1"){

    speak(
      messagesData[index].text
    );

  }else if(choice === "2"){

    copyMessage(index);

  }else if(choice === "3"){

    messagesData.splice(index,1);

    saveMessages();

    renderMessages();

    toast("Response deleted");

  }else if(choice === "4"){

    localStorage.setItem(
      "rg_saved_" + Date.now(),
      messagesData[index].text
    );

    toast("Saved");

  }

}


/* ================= READ ALOUD ================= */

function speak(text){

  if(
    !("speechSynthesis" in window)
  ){

    toast(
      "Read aloud not supported"
    );

    return;

  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.rate = 1;

  speechSynthesis.speak(
    utterance
  );

}

/* ================= SHARE CONVERSATION ================= */

async function shareConversation(){

  const text =
    messagesData
      .map(
        function(m){

            m.role === "user"
              ? "You: "
              : "RG Creator AI: "
          ) + m.text;

        }
      )
      .join("\n\n");


  if(!text){

      "No conversation to share"
    );

    return;

  }


  if(navigator.share){

    try{

      await navigator.share({
        title:chatName,
        text:text
      });

    }catch{}

  }else{

    try{

      await navigator.clipboard.writeText(text);

      toast(

    }catch{

      toast("Share unavailable");

    }

  }

}


/* ================= DELETE ================= */

function deleteConversation(){

  if(
    !messagesData.length
  ){

    toast(
      "There is no conversation to delete"
    );

    return;

  }


  if(
    !confirm(
      "Delete this conversation?"
    )
  ){

    return;

  }


  messagesData = [];

  localStorage.removeItem(
    "rg_messages"
  );

  renderMessages();

  renderHistory();

  toast(
    "Conversation deleted"
  );

}

/* ================= HISTORY ================= */

function saveMessages(){

  localStorage.setItem(
    "rg_messages",
    JSON.stringify(messagesData)
  );

}


function renderHistory(
  filter=""
){

  const history =
    document.getElementById(
      "history"
    );

  const matches =
    filter.toLowerCase();

  history.innerHTML = "";

  if(
    chatName
      .toLowerCase()
      .includes(matches)
  ){

    const item =
      document.createElement("div");

    item.className =
      "chat-history-item";

    item.innerHTML = `

      <div class="chat-name">
        ${escapeHTML(chatName)}
      </div>

      <button
        class="history-more"
        onclick="event.stopPropagation();renameCurrentChat()"
      >
        ⋯
      </button>

    `;

    item.onclick =
      closeSidebar;

    history.appendChild(item);

  }

}


function searchChats(){

  const value =
    document
      .getElementById("chatSearch")
      .value;

  renderHistory(value);

}


function renameCurrentChat(){

  const name =
    prompt(
      "Enter chat name:",
      chatName
    );

  if(
    !name ||
    !name.trim()
  ){

    return;

  }

  chatName =
    name.trim();

  localStorage.setItem(
    "rg_chat_name",
    chatName
  );

  document
    .getElementById("chatTitle")
    .textContent =
    chatName;

  renderHistory();

  toast("Chat renamed");

}


/* ================= VOICE ================= */

function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){

    toast(
      "Voice input is not supported"
    );

    return;

  }


  const recognition =
    new Recognition();

  recognition.lang =
    "en-IN";

  recognition.interimResults =
    false;

  recognition.onstart =
    function(){

      toast("Listening...");

    };


  recognition.onresult =
    function(event){

      input.value =
        event.results[0][0]
          .transcript;

      autoResize();

    };


  recognition.onerror =
    function(){

      toast(
        "Voice input failed"
      );

    };


  recognition.start();

}

/* ================= SECURITY ================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
