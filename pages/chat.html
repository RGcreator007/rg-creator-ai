<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RG Creator AI Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#080808;
    --panel:#101010;
    --panel2:#151515;
    --border:#292929;
    --text:#f5f5f5;
    --muted:#9b9b9b;
    --user:#202020;
    --ai:#111111;
    --button:#1b1b1b;
}

body.light{
    --bg:#f5f5f5;
    --panel:#ffffff;
    --panel2:#eeeeee;
    --border:#d7d7d7;
    --text:#111111;
    --muted:#666666;
    --user:#e8e8e8;
    --ai:#ffffff;
    --button:#eeeeee;
}

body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    height:100vh;
    overflow:hidden;
    transition:.25s;
}

/* TOP BAR */

.topbar{
    height:64px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:var(--bg);
}

.menu-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:var(--text);
    font-size:24px;
    border-radius:10px;
    cursor:pointer;
}

.logo{
    font-size:18px;
    font-weight:600;
    letter-spacing:.2px;
}

.top-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.icon-btn{
    width:40px;
    height:40px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text);
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}

.icon-btn:hover{
    background:var(--panel2);
    border-color:var(--border);
}

/* SIDE MENU */

.sidebar{
    position:fixed;
    top:0;
    left:-285px;
    width:285px;
    height:100vh;
    background:var(--panel);
    border-right:1px solid var(--border);
    z-index:20;
    transition:.25s ease;
    padding:18px;
}

.sidebar.open{
    left:0;
}

.sidebar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.sidebar-title{
    font-size:18px;
    font-weight:bold;
}

.close-menu{
    background:none;
    border:0;
    color:var(--text);
    font-size:24px;
    cursor:pointer;
}

.new-chat{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    font-size:15px;
    cursor:pointer;
    margin-bottom:18px;
}

.menu-item{
    padding:13px 10px;
    border-radius:9px;
    color:var(--text);
    cursor:pointer;
    margin-bottom:5px;
}

.menu-item:hover{
    background:var(--panel2);
}

.recent-title{
    color:var(--muted);
    font-size:13px;
    margin:22px 5px 10px;
}

/* CHAT */

.main{
    height:calc(100vh - 64px);
    display:flex;
    flex-direction:column;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:25px 16px 150px;
    scroll-behavior:smooth;
}

.chat-inner{
    width:100%;
    max-width:850px;
    margin:auto;
}

.message-row{
    display:flex;
    margin:18px 0;
}

.message-row.user{
    justify-content:flex-end;
}

.message{
    max-width:78%;
    padding:14px 16px;
    border-radius:15px;
    line-height:1.55;
    font-size:15px;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.message.user{
    background:var(--user);
    border:1px solid var(--border);
}

.message.ai{
    background:var(--ai);
    border:1px solid var(--border);
}

/* AI ACTIONS */

.ai-wrapper{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.ai-actions{
    display:flex;
    gap:6px;
    margin-top:7px;
    margin-left:4px;
}

.action-btn{
    position:relative;
    width:38px;
    height:34px;
    border:1px solid var(--border);
    background:var(--button);
    color:var(--text);
    border-radius:9px;
    cursor:pointer;
    font-size:17px;
}

.action-btn:hover{
    background:var(--panel2);
}

/* TOOLTIP */

.action-btn::after{
    content:attr(data-label);
    position:absolute;
    bottom:43px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:5px 8px;
    border-radius:6px;
    font-size:12px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:.15s;
}

.action-btn:hover::after,
.action-btn:focus::after{
    opacity:1;
}

/* TYPING AREA */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    padding:12px 15px 16px;
    background:linear-gradient(
        to top,
        var(--bg) 70%,
        transparent
    );
    z-index:10;
}

.input-inner{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:7px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

#prompt{
    flex:1;
    min-width:0;
    max-height:130px;
    min-height:44px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:var(--text);
    padding:12px 8px;
    font-size:15px;
    font-family:inherit;
}

#prompt::placeholder{
    color:var(--muted);
}

.input-button{
    flex:0 0 auto;
    width:43px;
    height:43px;
    border:0;
    border-radius:12px;
    background:var(--button);
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.input-button:hover{
    background:var(--panel2);
}

#micBtn.recording{
    background:#292929;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.07);}
    100%{transform:scale(1);}
}

.send-btn{
    font-size:20px;
}

/* STATUS */

.status{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:7px 0 0;
}

/* MOBILE */

@media(max-width:600px){

    .topbar{
        height:58px;
        padding:0 10px;
    }

    .main{
        height:calc(100vh - 58px);
    }

    #chat{
        padding:18px 10px 145px;
    }

    .message{
        max-width:88%;
        font-size:14px;
    }

    .input-area{
        padding:8px 9px 12px;
    }

    .input-inner{
        border-radius:15px;
        padding:6px;
    }

    #prompt{
        font-size:15px;
        min-height:42px;
    }

    .input-button{
        width:41px;
        height:41px;
    }

    .logo{
        font-size:16px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<div id="sidebar" class="sidebar">

    <div class="sidebar-header">
        <div class="sidebar-title">RG Creator AI</div>

        <button class="close-menu" onclick="closeSidebar()">×</button>
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ New Chat
    </button>

    <div class="menu-item">
        ✨ Capabilities
    </div>

    <div class="menu-item">
        ⚙ Settings
    </div>

    <div class="recent-title">
        Recent Chats
    </div>

    <div id="recentChats"></div>

</div>


<!-- TOP BAR -->

<header class="topbar">

    <button class="menu-btn" onclick="openSidebar()">
        ☰
    </button>

    <div class="logo">
        RG Creator AI
    </div>

    <div class="top-actions">

        <!-- THEME -->
        <button
            class="icon-btn"
            onclick="toggleTheme()"
            data-label="Theme"
            aria-label="Theme">
            ◐
        </button>

        <!-- DELETE -->
        <button
            class="icon-btn"
            onclick="deleteChat()"
            data-label="Delete chat"
            aria-label="Delete chat">
            ♢
        </button>

    </div>

</header>


<!-- MAIN -->

<main class="main">

    <div id="chat">
        <div class="chat-inner" id="chatInner">

            <div class="message-row">
                <div class="ai-wrapper">

                    <div class="message ai">
                        Hello! How can I help you today?
                    </div>

                    <div class="ai-actions">

                        <button
                            class="action-btn"
                            data-label="Copy"
                            onclick="copyMessage(this)">
                            ⧉
                        </button>

                        <button
                            class="action-btn"
                            data-label="Regenerate"
                            onclick="regenerateMessage(this)">
                            ↻
                        </button>

                    </div>

                </div>
            </div>

        </div>
    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-inner">

            <textarea
                id="prompt"
                rows="1"
                placeholder="Message RG Creator AI..."
                oninput="autoResize(this)"
                onkeydown="handleKey(event)"
            ></textarea>

            <!-- MICROPHONE -->

            <button
                id="micBtn"
                class="input-button"
                onclick="toggleVoice()"
                aria-label="Voice input">
                🎙
            </button>

            <!-- SEND -->

            <button
                class="input-button send-btn"
                onclick="sendMessage()"
                aria-label="Send">
                ↑
            </button>

        </div>

        <div class="status">
            RG Creator AI can make mistakes. Check important information.
        </div>

    </div>

</main>


<script>

/* =========================
   SIDEBAR
========================= */

function openSidebar(){

    document.getElementById("sidebar").classList.add("open");

}

function closeSidebar(){

    document.getElementById("sidebar").classList.remove("open");

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

    document.getElementById("chatInner").innerHTML = "";

    closeSidebar();

    addAIMessage(
        "Hello! How can I help you today?"
    );

    document.getElementById("prompt").focus();

}


/* =========================
   THEME
========================= */

function toggleTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "rgTheme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );

}

if(localStorage.getItem("rgTheme") === "light"){

    document.body.classList.add("light");

}


/* =========================
   DELETE CHAT
========================= */

function deleteChat(){

    if(!confirm("Delete this chat?")) return;

    document.getElementById("chatInner").innerHTML = "";

    addAIMessage(
        "Chat cleared. How can I help you?"
    );

}


/* =========================
   AUTO TEXTAREA
========================= */

function autoResize(element){

    element.style.height = "auto";

    element.style.height =
        Math.min(element.scrollHeight,130) + "px";

}


/* =========================
   ENTER TO SEND
========================= */

function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   ADD USER MESSAGE
========================= */

function addUserMessage(text){

    const row =
        document.createElement("div");

    row.className =
        "message-row user";

    const msg =
        document.createElement("div");

    msg.className =
        "message user";

    msg.textContent = text;

    row.appendChild(msg);

    document
        .getElementById("chatInner")
        .appendChild(row);

}


/* =========================
   ADD AI MESSAGE
========================= */

function addAIMessage(text){

    const row =
        document.createElement("div");

    row.className =
        "message-row";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "ai-wrapper";

    const msg =
        document.createElement("div");

    msg.className =
        "message ai";

    msg.textContent = text;

    const actions =
        document.createElement("div");

    actions.className =
        "ai-actions";

    const copy =
        document.createElement("button");

    copy.className =
        "action-btn";

    copy.dataset.label =
        "Copy";

    copy.textContent =
        "⧉";

    copy.onclick =
        function(){

            copySpecificMessage(msg);

        };


    const regenerate =
        document.createElement("button");

    regenerate.className =
        "action-btn";

    regenerate.dataset.label =
        "Regenerate";

    regenerate.textContent =
        "↻";

    regenerate.onclick =
        function(){

            regenerateSpecificMessage(
                msg,
                regenerate
            );

        };


    actions.appendChild(copy);

    actions.appendChild(regenerate);

    wrapper.appendChild(msg);

    wrapper.appendChild(actions);

    row.appendChild(wrapper);

    document
        .getElementById("chatInner")
        .appendChild(row);

    scrollBottom();

    return msg;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const input =
        document.getElementById("prompt");

    const text =
        input.value.trim();

    if(!text) return;


    addUserMessage(text);

    input.value = "";

    input.style.height = "auto";

    scrollBottom();


    const aiMsg =
        addAIMessage("Thinking...");


    try{

        const response =
            await fetch("/api/chat",{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    message:text
                })

            });


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                data.details ||
                "API Error"
            );

        }


        aiMsg.textContent =
            data.reply ||
            "No response received.";


    }catch(error){

        aiMsg.textContent =
            "❌ API Error: " +
            error.message;

    }


    scrollBottom();

}


/* =========================
   COPY
========================= */

function copySpecificMessage(message){

    navigator.clipboard
        .writeText(message.textContent)
        .then(()=>{

            showCopied();

        });

}

function copyMessage(button){

    const wrapper =
        button.closest(".ai-wrapper");

    const message =
        wrapper.querySelector(".message.ai");

    copySpecificMessage(message);

}

function showCopied(){

    const oldTitle =
        document.title;

    document.title =
        "Copied ✓";

    setTimeout(()=>{

        document.title =
            oldTitle;

    },1000);

}


/* =========================
   REGENERATE
========================= */

async function regenerateSpecificMessage(
    message,
    button
){

    const row =
        message.closest(".message-row");

    const previousRow =
        row.previousElementSibling;

    if(
        !previousRow ||
        !previousRow.classList.contains("user")
    ){

        return;

    }


    const userMessage =
        previousRow
            .querySelector(".message")
            .textContent;


    message.textContent =
        "Thinking...";


    button.disabled =
        true;


    try{

        const response =
            await fetch("/api/chat",{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    message:userMessage
                })

            });


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "API Error"
            );

        }


        message.textContent =
            data.reply ||
            "No response.";

    }catch(error){

        message.textContent =
            "❌ API Error: " +
            error.message;

    }


    button.disabled =
        false;

    scrollBottom();

}


/* =========================
   VOICE INPUT
========================= */

let recognition = null;

let recording = false;


function toggleVoice(){

    const mic =
        document.getElementById("micBtn");


    if(!("webkitSpeechRecognition" in window) &&
       !("SpeechRecognition" in window)){

        alert(
            "Voice input is not supported in this browser. Please use Chrome."
        );

        return;

    }


    if(recording){

        recognition.stop();

        return;

    }


    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
        function(){

            recording = true;

            mic.classList.add("recording");

            mic.textContent =
                "●";

        };


    recognition.onresult =
        function(event){

            let transcript = "";

            for(
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0].transcript;

            }


            document.getElementById("prompt")
                .value = transcript;

            autoResize(
                document.getElementById("prompt")
            );

        };


    recognition.onerror =
        function(event){

            console.log(
                "Voice error:",
                event.error
            );

        };


    recognition.onend =
        function(){

            recording = false;

            mic.classList.remove(
                "recording"
            );

            mic.textContent =
                "🎙";

        };


    recognition.start();

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

    const chat =
        document.getElementById("chat");

    setTimeout(()=>{

        chat.scrollTop =
            chat.scrollHeight;

    },50);

}


/* =========================
   CLOSE MENU ON CHAT CLICK
========================= */

document
    .getElementById("chat")
    .addEventListener(
        "click",
        function(){

            closeSidebar();

        }
    );

</script>

</body>
</html>
