<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Creator AI</title>

<style>
:root{
  --bg:#000;
  --panel:#111;
  --panel2:#181818;
  --text:#f5f5f5;
  --muted:#999;
  --border:#292929;
  --user:#2b2b2b;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow:hidden;
}

/* TOP BAR */

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:relative;
  z-index:20;
}

.top-title{
  font-size:17px;
  font-weight:600;
}

.top-icon{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.top-icon:hover{
  background:var(--panel2);
}

.top-icon svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* CHAT */

#chat{
  position:absolute;
  top:58px;
  left:0;
  right:0;
  bottom:91px;
  overflow-y:auto;
  padding:22px 15px 30px;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:15px;
}

/* MESSAGE */

.message-row{
  margin-bottom:28px;
}

.user-row{
  display:flex;
  justify-content:flex-end;
}

.user-content{
  max-width:84%;
}

.user-message{
  background:var(--user);
  border-radius:18px;
  padding:11px 14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.ai-message{
  width:100%;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.message-image{
  display:block;
  max-width:280px;
  max-height:320px;
  border-radius:14px;
  margin-bottom:8px;
}

/* ACTIONS */

.actions{
  display:flex;
  align-items:center;
  gap:3px;
  margin-top:7px;
}

.action-btn{
  position:relative;
  width:34px;
  height:34px;
  padding:0;
  border:0;
  background:transparent;
  color:#999;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.action-btn:hover{
  color:#fff;
  background:#171717;
}

.action-btn svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ONLY SHOW NAME ON HOVER */

.action-btn::after{
  content:attr(data-label);
  position:absolute;
  bottom:39px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:5px 7px;
  border-radius:6px;
  font-size:11px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:.15s;
}

.action-btn:hover::after{
  opacity:1;
}

/* INPUT */

.input-area{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:8px 11px 13px;
  background:linear-gradient(
    to top,
    var(--bg) 80%,
    transparent
  );
  z-index:25;
}

.input-box{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:flex-end;
  gap:3px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:25px;
  padding:7px 7px 7px 8px;
}

#prompt{
  flex:1;
  min-height:40px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  font-size:16px;
  line-height:1.4;
  padding:8px 4px;
}

#prompt::placeholder{
  color:#777;
}

.input-icon{
  width:40px;
  height:40px;
  flex-shrink:0;
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.input-icon:hover{
  background:#242424;
  color:#fff;
}

.input-icon svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.send{
  background:#fff;
  color:#000;
}

.send:hover{
  background:#ddd;
  color:#000;
}

#imageInput{
  display:none;
}

/* PREVIEW */

.preview{
  display:none;
  position:relative;
  width:max-content;
  margin:0 0 7px 5px;
}

.preview img{
  width:72px;
  height:72px;
  object-fit:cover;
  border-radius:12px;
}

.preview-close{
  position:absolute;
  top:-7px;
  right:-7px;
  width:23px;
  height:23px;
  border:0;
  border-radius:50%;
  background:#333;
  color:#fff;
  cursor:pointer;
}

/* SIDE MENU */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:39;
}

.overlay.show{
  display:block;
}

.side-menu{
  position:fixed;
  left:-285px;
  top:0;
  bottom:0;
  width:275px;
  background:var(--panel);
  border-right:1px solid var(--border);
  z-index:40;
  transition:.22s ease;
  padding:18px 12px;
  overflow-y:auto;
}

.side-menu.open{
  left:0;
}

.menu-heading{
  font-size:18px;
  font-weight:600;
  padding:8px 10px 20px;
}

.menu-item{
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 11px;
  border-radius:11px;
  cursor:pointer;
  color:var(--text);
}

.menu-item:hover{
  background:var(--panel2);
}

.menu-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* HISTORY */

.history-title{
  font-size:13px;
  color:var(--muted);
  padding:18px 10px 7px;
}

.history-item{
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:var(--panel2);
}

/* CAPABILITIES */

.capabilities{
  display:none;
  position:fixed;
  left:12px;
  right:12px;
  bottom:80px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:8px;
  z-index:45;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.capability{
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 10px;
  border-radius:11px;
  cursor:pointer;
}

.capability:hover{
  background:var(--panel2);
}

.capability-icon{
  width:28px;
  text-align:center;
  font-size:19px;
}

.capability-name{
  font-size:15px;
}

/* MORE MENU */

.more-menu{
  display:none;
  position:fixed;
  right:10px;
  top:58px;
  width:240px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:7px;
  z-index:50;
  box-shadow:0 15px 40px rgba(0,0,0,.55);
}

.more-item{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.more-item:hover{
  background:var(--panel2);
}

.more-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* REPLY MORE */

.reply-menu{
  display:none;
  position:absolute;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:6px;
  z-index:60;
  box-shadow:0 12px 35px rgba(0,0,0,.55);
}

.reply-menu div{
  padding:11px 13px;
  border-radius:9px;
  cursor:pointer;
}

.reply-menu div:hover{
  background:var(--panel2);
}

/* DARK/LIGHT */

body.light{
  --bg:#fff;
  --panel:#f5f5f5;
  --panel2:#e8e8e8;
  --text:#111;
  --muted:#666;
  --border:#ddd;
  --user:#e9e9e9;
}

body.light .send{
  background:#111;
  color:#fff;
}

body.light .send:hover{
  background:#333;
}

.thinking{
  color:#888;
}

/* MOBILE */

@media(max-width:600px){

  .user-content{
    max-width:88%;
  }

  #chat{
    padding-left:12px;
    padding-right:12px;
  }

}
</style>
</head>

<script>

/* =========================
   STATE
========================= */

let selectedImageBase64 = null;
let selectedImageMime = null;

let conversationHistory = [];

let lastUserMessage = "";
let lastAIReply = "";

const STORAGE_KEY = "rg_creator_ai_history";
const THEME_KEY = "rg_creator_ai_theme";


/* =========================
   ELEMENTS
========================= */

const chat =
  document.getElementById("chat");

const prompt =
  document.getElementById("prompt");

const sideMenu =
  document.getElementById("sideMenu");

const moreMenu =
  document.getElementById("moreMenu");

const capabilities =
  document.getElementById("capabilities");

const overlay =
  document.getElementById("overlay");

const replyMenu =
  document.getElementById("replyMenu");


/* =========================
   NAVIGATION
========================= */

function goTo(page){

  window.location.href = page;

  closeAllMenus();

}


/* =========================
   MENU
========================= */

function openSideMenu(){

  sideMenu.classList.add("open");

  overlay.classList.add("show");

  moreMenu.style.display = "none";

  capabilities.style.display = "none";
}


function closeSideMenu(){

  sideMenu.classList.remove("open");

  overlay.classList.remove("show");
}


function toggleSideMenu(){

  if(sideMenu.classList.contains("open")){

    closeSideMenu();

  }else{

    openSideMenu();

  }

}


/* =========================
   MORE
========================= */

function toggleMoreMenu(){

  if(moreMenu.style.display === "block"){

    moreMenu.style.display = "none";

  }else{

    closeSideMenu();

    capabilities.style.display = "none";

    moreMenu.style.display = "block";

  }

}


/* =========================
   CAPABILITIES
========================= */

function toggleCapabilities(){

  if(capabilities.style.display === "block"){

    capabilities.style.display = "none";

  }else{

    closeSideMenu();

    moreMenu.style.display = "none";

    capabilities.style.display = "block";

  }

}


/* =========================
   CLOSE EVERYTHING
========================= */

function closeAllMenus(){

  closeSideMenu();

  moreMenu.style.display = "none";

  capabilities.style.display = "none";

  replyMenu.style.display = "none";

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  if(
    conversationHistory.length &&
    !confirm("Start a new chat?")
  ){

    return;

  }

  conversationHistory = [];

  lastUserMessage = "";

  lastAIReply = "";

  saveCurrentChat();

  chat.innerHTML =
    '<div class="empty" id="emptyMessage">How can I help you today?</div>';

  closeAllMenus();

}


/* =========================
   IMAGE
========================= */

document
  .getElementById("imageButton")
  .addEventListener("click",function(){

    document
      .getElementById("imageInput")
      .click();

  });


document
  .getElementById("imageInput")
  .addEventListener("change",function(event){

    const file =
      event.target.files[0];

    if(!file){

      return;

    }

    if(!file.type.startsWith("image/")){

      alert("Please select an image.");

      return;

    }

    const reader =
      new FileReader();

    reader.onload =
      function(e){

        selectedImageMime =
          file.type;

        selectedImageBase64 =
          e.target.result.split(",")[1];

        document
          .getElementById("previewImage")
          .src = e.target.result;

        document
          .getElementById("preview")
          .style.display = "block";

      };

    reader.readAsDataURL(file);

  });


function removeImage(){

  selectedImageBase64 = null;

  selectedImageMime = null;

  document
    .getElementById("preview")
    .style.display = "none";

  document
    .getElementById("previewImage")
    .src = "";

  document
    .getElementById("imageInput")
    .value = "";

}


document
  .getElementById("removeImageButton")
  .addEventListener("click",removeImage);


/* =========================
   INPUT
========================= */

function autoResize(){

  prompt.style.height = "auto";

  prompt.style.height =
    Math.min(prompt.scrollHeight,130) + "px";

}


prompt.addEventListener(
  "input",
  autoResize
);


prompt.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   SEND
========================= */

async function sendMessage(customText=null){

  const text =
    customText !== null
      ? customText.trim()
      : prompt.value.trim();

  if(
    !text &&
    !selectedImageBase64
  ){

    return;

  }


  const image =
    selectedImageBase64;

  const imageMime =
    selectedImageMime;


  lastUserMessage = text;


  removeEmpty();


  addUserMessage(
    text,
    image,
    imageMime
  );


  if(customText === null){

    prompt.value = "";

    autoResize();

  }


  removeImage();


  const aiRow =
    document.createElement("div");

  aiRow.className =
    "message-row ai-row";


  const aiMessage =
    document.createElement("div");

  aiMessage.className =
    "ai-message thinking";

  aiMessage.textContent =
    "Thinking...";


  aiRow.appendChild(aiMessage);

  chat.appendChild(aiRow);

  scrollBottom();


  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          message:text,

          history:conversationHistory,

          image:image,

          imageMimeType:imageMime

        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.details ||
        data.error ||
        "API request failed"
      );

    }


    const reply =
      data.reply ||
      "Sorry, I couldn't generate a response.";


    lastAIReply = reply;


    aiMessage.classList.remove(
      "thinking"
    );

    aiMessage.textContent =
      reply;


    conversationHistory.push({

      role:"user",

      content:text

    });


    conversationHistory.push({

      role:"assistant",

      content:reply

    });


    saveCurrentChat();


    addAIActions(
      aiRow,
      reply
    );


  }catch(error){

    aiMessage.classList.remove(
      "thinking"
    );

    aiMessage.textContent =
      "❌ " + error.message;

  }


  scrollBottom();

}

/* =========================
   COPY
========================= */

async function copyText(text){

  if(!text){

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch(e){

    const area =
      document.createElement("textarea");

    area.value =
      text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

  }

}


/* =========================
   EDIT
========================= */

function editMessage(text){

  prompt.value =
    text;

  prompt.focus();

  autoResize();

}


/* =========================
   LIKE / UNLIKE
========================= */

function likeButton(button){

  button.style.color =
    "#fff";

}


function unlikeButton(button){

  button.style.color =
    "#fff";

}


/* =========================
   SHARE
========================= */

async function shareReply(text){

  if(navigator.share){

    await navigator.share({

      title:"RG Creator AI",

      text:text

    });

  }else{

    await copyText(text);

  }

}


/* =========================
   REGENERATE
========================= */

async function regenerateReply(){

  if(!lastUserMessage){

    return;

  }


  /* Remove last AI message */
  const rows =
    chat.querySelectorAll(".ai-row");

  if(rows.length){

    rows[rows.length-1].remove();

  }


  /* Remove last assistant history entry */
  if(
    conversationHistory.length &&
    conversationHistory[
      conversationHistory.length-1
    ].role === "assistant"
  ){

    conversationHistory.pop();

  }


  await sendMessage(
    lastUserMessage
  );

}


/* =========================
   REPLY MORE
========================= */

function openReplyMenu(
  button,
  reply
){

  replyMenu.style.display =
    "block";


  const rect =
    button.getBoundingClientRect();


  replyMenu.style.left =
    Math.max(
      8,
      rect.left - 100
    ) + "px";


  replyMenu.style.top =
    Math.max(
      65,
      rect.top - 100
    ) + "px";


  replyMenu.dataset.reply =
    reply;

}


function downloadLastReply(){

  const reply =
    replyMenu.dataset.reply ||
    lastAIReply;


  const blob =
    new Blob(
      [reply],
      {type:"text/plain"}
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href =
    url;

  a.download =
    "RG-Creator-AI-Reply.txt";

  a.click();


  URL.revokeObjectURL(url);

  replyMenu.style.display =
    "none";

}


function copyLastReply(){

  copyText(
    replyMenu.dataset.reply ||
    lastAIReply
  );

  replyMenu.style.display =
    "none";

}


/* =========================
   VOICE
========================= */

function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!Recognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;

  }


  const recognition =
    new Recognition();


  recognition.lang =
    navigator.language ||
    "en-IN";


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.start();


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;


      prompt.value +=
        (prompt.value ? " " : "") +
        text;


      autoResize();

    };

}


document
  .getElementById("voiceButton")
  .addEventListener(
    "click",
    startVoice
  );


/* =========================
   HISTORY
========================= */

function saveCurrentChat(){

  try{

    const all =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );


    if(!conversationHistory.length){

      return;

    }


    const title =
      conversationHistory
        .find(x => x.role === "user")
        ?.content ||
      "New Chat";


    const current = {

      id:Date.now(),

      title:title.substring(0,60),

      messages:[
        ...conversationHistory
      ]

    };


    /* Replace current saved chat */
    if(all.length){

      all[0] =
        current;

    }else{

      all.push(current);

    }


    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(all)
    );


  }catch(error){

    console.error(
      "History save error",
      error
    );

  }

}


function loadHistory(){

  const list =
    document.getElementById(
      "historyList"
    );


  list.innerHTML = "";


  let all = [];


  try{

    all =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

  }catch(e){

    all = [];

  }


  if(!all.length){

    return;

  }


  const heading =
    document.createElement("div");

  heading.className =
    "history-title";

  heading.textContent =
    "Recent chats";

  list.appendChild(heading);


  all.forEach(function(item){

    const div =
      document.createElement("div");

    div.className =
      "history-item";

    div.textContent =
      item.title ||
      "Chat";


    div.onclick =
      function(){

        loadSavedChat(item);

      };


    list.appendChild(div);

  });

}


function loadSavedChat(item){

  conversationHistory =
    [...(item.messages || [])];


  chat.innerHTML = "";


  conversationHistory.forEach(
    function(message){

      if(message.role === "user"){

        addUserMessage(
          message.content,
          null,
          null
        );

        lastUserMessage =
          message.content;

      }


      if(message.role === "assistant"){

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "message-row ai-row";


        const msg =
          document.createElement(
            "div"
          );

        msg.className =
          "ai-message";

        msg.textContent =
          message.content;


        row.appendChild(msg);

        chat.appendChild(row);


        addAIActions(
          row,
          message.content
        );


        lastAIReply =
          message.content;

      }

    }
  );


  closeAllMenus();

  scrollBottom();

}


/* =========================
   DELETE
========================= */

function deleteConversation(){

  if(
    !confirm(
      "Delete this conversation?"
    )
  ){

    return;

  }


  conversationHistory = [];

  lastUserMessage = "";

  lastAIReply = "";


  localStorage.removeItem(
    STORAGE_KEY
  );


  chat.innerHTML =
    '<div class="empty" id="emptyMessage">How can I help you today?</div>';


  loadHistory();

  closeAllMenus();

}

/* =========================
   THEME
========================= */

function toggleTheme(){

  document.body.classList.toggle(
    "light"
  );


  localStorage.setItem(
    THEME_KEY,
    document.body.classList.contains(
      "light"
    )
      ? "light"
      : "dark"
  );

}


function loadTheme(){

  const theme =
    localStorage.getItem(
      THEME_KEY
    );


  if(theme === "light"){

    document.body.classList.add(
      "light"
    );

  }

}

   EMPTY MESSAGE
========================= */

function removeEmpty(){

  const empty =
    document.getElementById(

    );


  if(empty){

    empty.remove();

  }

}

   SCROLL
========================= */

function scrollBottom(){

}

/* OUTSIDE TAP */

document.addEventListener(
  "click",
  function(event){

    const clickedInsideSide =
      sideMenu.contains(
        event.target
      );

    const clickedMenuButton =
      document
        .getElementById(
          "menuButton"
        )
        .contains(
          event.target
        );


    const clickedMore =
      moreMenu.contains(
        event.target
      );

    const clickedMoreButton =
      document
        .getElementById(
          "moreButton"
        )
        .contains(
          event.target
        );


    const clickedCapabilities =
      capabilities.contains(
        event.target
      );


    const clickedCapabilityButton =
      document
        .getElementById(
          "capabilityButton"
        )
        .contains(
          event.target
        );


    const clickedReplyMenu =
      replyMenu.contains(
        event.target
      );


    if(
      !clickedInsideSide &&
      !clickedMenuButton
    ){

      closeSideMenu();

    }


    if(
      !clickedMore &&
      !clickedMoreButton
    ){

      moreMenu.style.display =
        "none";

    }


    if(
      !clickedCapabilities &&
      !clickedCapabilityButton
    ){

      capabilities.style.display =
        "none";

    }


    if(
      !clickedReplyMenu &&
      !event.target.closest(
        ".action-btn"
      )
    ){

      replyMenu.style.display =
        "none";

    }

  }
);


/* ESC */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeAllMenus();

    }

  }
);


/* =========================
   STARTUP
========================= */

loadTheme();

loadHistory();
