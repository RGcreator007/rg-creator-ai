<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RG Creator AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#000;
  --panel:#111;
  --panel2:#181818;
  --panel3:#202020;
  --border:#2c2c2c;
  --text:#fff;
  --muted:#999;
  --accent:#ff3030;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  overflow:hidden;
}

button{
  font-family:inherit;
}

.app{
  width:100%;
  height:100%;
  position:relative;
}

/* ================= HEADER ================= */

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #181818;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(15px);
  position:relative;
  z-index:20;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.icon-btn:hover{
  background:#181818;
}

.icon{
  width:22px;
  height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.title{
  font-size:16px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-right{
  display:flex;
  align-items:center;
}

/* ================= CHAT ================= */

.chat-area{
  height:calc(100% - 64px);
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 16px 155px;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:10px;
}

.welcome{
  max-width:760px;
  margin:14vh auto 0;
  text-align:center;
}

.welcome-logo{
  width:58px;
  height:58px;
  border-radius:18px;
  background:#fff;
  color:#000;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:800;
}

.welcome h1{
  font-size:28px;
  margin-top:18px;
  letter-spacing:-1px;
}

.welcome p{
  color:#777;
  margin-top:8px;
  font-size:14px;
}

/* ================= MESSAGE ================= */

.message{
  width:100%;
  max-width:760px;
  margin:0 auto 28px;
}

.user-message{
  display:flex;
  justify-content:flex-end;
}

.user-bubble{
  max-width:82%;
  background:#252525;
  padding:12px 15px;
  border-radius:20px 20px 5px 20px;
  font-size:15px;
  line-height:1.55;
  white-space:pre-wrap;
}

.ai-message{
  font-size:15px;
  line-height:1.7;
}

.ai-content{
  white-space:pre-wrap;
}

.message-actions{
  display:flex;
  align-items:center;
  gap:2px;
  margin-top:9px;
}

.action-btn{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  color:#888;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.action-btn:hover{
  background:#181818;
  color:#fff;
}

.action-btn .icon{
  width:19px;
  height:19px;
}

/* ================= INPUT ================= */

.input-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:12px 14px 18px;
  background:linear-gradient(
    transparent,
    #000 25%
  );
  z-index:15;
}

.composer{
  width:min(760px,100%);
  margin:auto;
  background:#151515;
  border:1px solid #303030;
  border-radius:24px;
  padding:10px;
  box-shadow:0 -8px 35px rgba(0,0,0,.4);
}

.attachment-preview{
  display:none;
  align-items:center;
  gap:8px;
  background:#202020;
  border-radius:12px;
  padding:8px 10px;
  margin-bottom:8px;
  font-size:12px;
  color:#bbb;
}

.attachment-preview.show{
  display:flex;
}

.composer textarea{
  width:100%;
  min-height:46px;
  max-height:150px;
  resize:none;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  padding:7px 8px;
  font-size:15px;
  line-height:1.5;
}

.composer textarea::placeholder{
  color:#6f6f6f;
}

.composer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.composer-left,
.composer-right{
  display:flex;
  align-items:center;
  gap:3px;
}

.circle{
  width:40px;
  height:40px;
  border-radius:50%;
  background:transparent;
  border:0;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.circle:hover{
  background:#242424;
  color:#fff;
}

.send{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  color:#000;
  border:0;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.send:hover{
  transform:scale(1.04);
}

.send .icon{
  width:19px;
  height:19px;
  stroke-width:2.3;
}

/* ================= PLUS MENU ================= */

.plus-wrap{
  position:relative;
}

.plus-menu{
  position:absolute;
  bottom:49px;
  left:0;
  width:210px;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:18px;
  padding:7px;
  display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.7);
}

.plus-menu.open{
  display:block;
}

.menu-item{
  width:100%;
  height:44px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 11px;
  border-radius:11px;
  cursor:pointer;
  text-align:left;
}

.menu-item:hover{
  background:#282828;
}

.menu-item .icon{
  width:20px;
  height:20px;
  color:#ddd;
}

/* ================= SIDEBAR ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:90;
  display:none;
}

.overlay.show{
  display:block;
}

.sidebar{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(310px,85vw);
  background:#111;
  border-right:1px solid #292929;
  z-index:100;
  transform:translateX(-100%);
  transition:.22s ease;
  display:flex;
  flex-direction:column;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-head{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #242424;
}

.sidebar-title{
  font-weight:700;
}

.new-chat{
  margin:13px;
  height:45px;
  border:1px solid #303030;
  background:#1a1a1a;
  color:#fff;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  cursor:pointer;
  font-size:14px;
}

.search{
  margin:0 13px 12px;
  height:42px;
  border:1px solid #292929;
  background:#171717;
  border-radius:12px;
  color:#fff;
  padding:0 12px;
  outline:none;
  width:calc(100% - 26px);
}

.history{
  flex:1;
  overflow-y:auto;
  padding:0 8px 20px;
}

.history-title{
  color:#777;
  font-size:11px;
  padding:12px 8px 6px;
  text-transform:uppercase;
}

.chat-history-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 9px;
  border-radius:11px;
  color:#ddd;
  cursor:pointer;
}

.chat-history-item:hover{
  background:#1e1e1e;
}

.chat-name{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.history-more{
  width:28px;
  height:28px;
  background:transparent;
  border:0;
  color:#777;
  border-radius:8px;
  cursor:pointer;
}

.history-more:hover{
  background:#292929;
  color:#fff;
}

/* ================= TOP MORE ================= */

.more-menu{
  position:absolute;
  top:57px;
  right:12px;
  width:235px;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:17px;
  padding:7px;
  display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.7);
  z-index:50;
}

.more-menu.open{
  display:block;
}

.more-row{
  height:45px;
  width:100%;
  background:transparent;
  color:#fff;
  border:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 11px;
  border-radius:11px;
  cursor:pointer;
  text-align:left;
}

.more-row:hover{
  background:#282828;
}

.more-row .icon{
  width:20px;
  height:20px;
  color:#ddd;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%) translateY(10px);
  background:#222;
  border:1px solid #333;
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:300;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .header{
    height:60px;
  }

  .chat-area{
    height:calc(100% - 60px);
  }

  .messages{
    padding:16px 13px 145px;
  }

  .welcome{
    margin-top:18vh;
  }

  .welcome h1{
    font-size:25px;
  }

  .user-bubble{
    max-width:88%;
  }

  .input-area{
    padding:8px 9px 12px;
  }

  .composer{
    border-radius:21px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="header-left">

    <button class="icon-btn" onclick="openSidebar()">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <div class="title" id="chatTitle">
      RG Creator AI
    </div>

  </div>

  <div class="header-right">

    <button class="icon-btn" onclick="toggleTopMenu()">
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1"/>
        <circle cx="12" cy="12" r="1"/>
        <circle cx="19" cy="12" r="1"/>
      </svg>
    </button>

  </div>

</header>


<!-- ================= TOP MENU ================= -->

<div class="more-menu" id="topMenu">

  <button class="more-row" onclick="shareConversation()">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 16V3"/>
      <path d="m7 8 5-5 5 5"/>
      <path d="M5 13v6h14v-6"/>
    </svg>
    Share conversation
  </button>

  <button class="more-row" onclick="pinChat()">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="m9 3 6 6"/>
      <path d="m8 8-4 4 8 1 4 8 2-2-4-8 4-4"/>
    </svg>
    Pin
  </button>

  <button class="more-row" onclick="renameChat()">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="m4 20 4-1 11-11-3-3L5 16l-1 4z"/>
      <path d="m14 5 3 3"/>
    </svg>
    Rename
  </button>

  <button class="more-row" onclick="downloadConversation()">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 3v12"/>
      <path d="m7 10 5 5 5-5"/>
      <path d="M5 21h14"/>
    </svg>
    Download
  </button>

  <button class="more-row" onclick="deleteConversation()">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M4 7h16"/>
      <path d="M10 11v6M14 11v6"/>
      <path d="M6 7l1 14h10l1-14"/>
      <path d="M9 7V4h6v3"/>
    </svg>
    Delete
  </button>

</div>


<!-- ================= CHAT ================= -->

<main class="chat-area">

  <div class="messages" id="messages">

    <div class="welcome" id="welcome">

      <div class="welcome-logo">
        RG
      </div>

      <h1>How can I help you?</h1>

      <p>Ask anything, create content or build something.</p>

    </div>

  </div>

</main>


<!-- ================= INPUT ================= -->

<div class="input-area">

  <div class="composer">

    <div
      class="attachment-preview"
      id="attachmentPreview"
    >
      <span>📎</span>
      <span id="attachmentName"></span>
    </div>

    <textarea
      id="messageInput"
      placeholder="Ask anything..."
      rows="1"
    ></textarea>

    <div class="composer-bottom">

      <div class="composer-left">

        <div class="plus-wrap">

          <button
            class="circle"
            onclick="togglePlus()"
          >

            <svg class="icon" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"/>
            </svg>

          </button>

          <div class="plus-menu" id="plusMenu">

            <button
              class="menu-item"
              onclick="chooseImage()"
            >
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <circle cx="8" cy="9" r="1.5"/>
                <path d="m4 17 5-5 4 4 2-2 5 5"/>
              </svg>
              Image
            </button>

            <button
              class="menu-item"
              onclick="chooseCamera()"
            >
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M4 7h4l2-2h4l2 2h4v12H4z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              Camera
            </button>

            <button
              class="menu-item"
              onclick="chooseVideo()"
            >
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="6" width="13" height="12" rx="2"/>
                <path d="m16 10 5-3v10l-5-3z"/>
              </svg>
              Video
            </button>

            <button
              class="menu-item"
              onclick="chooseFile()"
            >
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M6 3h9l4 4v14H6z"/>
                <path d="M14 3v5h5"/>
              </svg>
              File
            </button>

            <button
              class="menu-item"
              onclick="choosePDF()"
            >
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M6 3h9l4 4v14H6z"/>
                <path d="M14 3v5h5"/>
                <path d="M9 16h6M9 12h4"/>
              </svg>
              PDF
            </button>

          </div>

        </div>


        <!-- VOICE -->

        <button
          class="circle"
          onclick="startVoice()"
        >

          <svg class="icon" viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0"/>
            <path d="M12 18v3"/>
          </svg>

        </button>

      </div>


      <div class="composer-right">

        <button
          class="send"
          onclick="sendMessage()"
        >

          <svg class="icon" viewBox="0 0 24 24">
            <path d="M5 12h14"/>
            <path d="m13 6 6 6-6 6"/>
          </svg>

        </button>

      </div>

    </div>

  </div>

</div>


<!-- ================= FILE INPUTS ================= -->

<input
  type="file"
  id="imageInput"
  accept="image/*"
  hidden
  onchange="handleAttachment(this)"
>

<input
  type="file"
  id="cameraInput"
  accept="image/*"
  capture="environment"
  hidden
  onchange="handleAttachment(this)"
>

<input
  type="file"
  id="videoInput"
  accept="video/*"
  hidden
  onchange="handleAttachment(this)"
>

<input
  type="file"
  id="fileInput"
  accept=".txt,.doc,.docx,.csv,.json,.html,.css,.js,.py,.java,.php"
  hidden
  onchange="handleAttachment(this)"
>

<input
  type="file"
  id="pdfInput"
  accept="application/pdf"
  hidden
  onchange="handleAttachment(this)"
>


<!-- ================= SIDEBAR ================= -->

<div
  class="overlay"
  id="overlay"
  onclick="closeSidebar()"
></div>

<aside class="sidebar" id="sidebar">

  <div class="sidebar-head">

    <div class="sidebar-title">
      Chats
    </div>

    <button
      class="icon-btn"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>

  <button
    class="new-chat"
    onclick="newChat()"
  >

    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </svg>

    New chat

  </button>

  <input
    class="search"
    id="chatSearch"
    placeholder="Search chats..."
    oninput="searchChats()"
  >

  <div
    class="history"
    id="history"
  ></div>

</aside>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =====================================================
   RG CREATOR AI CHAT
===================================================== */

let messagesData =
  JSON.parse(localStorage.getItem("rg_messages") || "[]");

let chatName =
  localStorage.getItem("rg_chat_name") ||
  "RG Creator AI";

let pinned =
  localStorage.getItem("rg_pinned") === "true";

let lastUserMessage = "";


/* ================= ELEMENTS ================= */

const messagesEl =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const welcome =
  document.getElementById("welcome");


/* ================= INIT ================= */

document.getElementById("chatTitle").textContent =
  chatName;

renderMessages();
renderHistory();


/* ================= TOAST ================= */

function toast(text){

  const el =
    document.getElementById("toast");

  el.textContent = text;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}


/* ================= PLUS ================= */

function togglePlus(){

  document
    .getElementById("plusMenu")
    .classList.toggle("open");

}

function closePlus(){

  document
    .getElementById("plusMenu")
    .classList.remove("open");

}


/* ================= ATTACHMENTS ================= */

function chooseImage(){

  closePlus();

  document
    .getElementById("imageInput")
    .click();

}

function chooseCamera(){

  closePlus();

  document
    .getElementById("cameraInput")
    .click();

}

function chooseVideo(){

  closePlus();

  document
    .getElementById("videoInput")
    .click();

}

function chooseFile(){

  closePlus();

  document
    .getElementById("fileInput")
    .click();

}

function choosePDF(){

  closePlus();

  document
    .getElementById("pdfInput")
    .click();

}


function handleAttachment(inputFile){

  if(!inputFile.files.length)
    return;

  const file =
    inputFile.files[0];

  document
    .getElementById("attachmentName")
    .textContent =
    file.name;

  document
    .getElementById("attachmentPreview")
    .classList.add("show");

  toast("Attachment added");

}


/* ================= SEND ================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text)
    return;

  lastUserMessage = text;

  messagesData.push({
    role:"user",
    text:text,
    time:Date.now()
  });

  saveMessages();

  input.value = "";

  document
    .getElementById("attachmentPreview")
    .classList.remove("show");

  renderMessages();

  const aiIndex =
    messagesData.length;

  messagesData.push({
    role:"assistant",
    text:"Thinking...",
    time:Date.now()
  });

  renderMessages();

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:text
        })

      });

    const data =
      await response.json();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        "AI request failed"
      );

    }

    messagesData[aiIndex].text =
      data.reply;

    saveMessages();

    renderMessages();

  }catch(error){

    messagesData[aiIndex].text =
      "Sorry, I couldn't complete that request.\n\n" +
      (error.message || "Server error");

    saveMessages();

    renderMessages();

  }

}


/* ================= RENDER ================= */

function renderMessages(){

  if(!messagesData.length){

    welcome.style.display =
      "block";

    return;

  }

  welcome.style.display =
    "none";

  messagesEl.innerHTML = "";

  messagesData.forEach(
    (message,index)=>{

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message " +
        (message.role === "user"
          ? "user-message"
          : "ai-message");

      if(message.role === "user"){

        wrapper.innerHTML = `
          <div class="user-bubble">
            ${escapeHTML(message.text)}
          </div>
        `;

      }else{

        wrapper.innerHTML = `
          <div class="ai-content">${escapeHTML(message.text)}</div>

          <div class="message-actions">

            <button class="action-btn"
              onclick="copyMessage(${index})"
              title="Copy">

              ${iconCopy()}

            </button>

            <button class="action-btn"
              onclick="likeMessage(${index})"
              title="Like">

              ${iconLike()}

            </button>

            <button class="action-btn"
              onclick="dislikeMessage(${index})"
              title="Dislike">

              ${iconDislike()}

            </button>

            <button class="action-btn"
              onclick="shareMessage(${index})"
              title="Share">

              ${iconShare()}

            </button>

            <button class="action-btn"
              onclick="regenerateMessage(${index})"
              title="Regenerate">

              ${iconRefresh()}

            </button>

            <button class="action-btn"
              onclick="moreMessage(${index})"
              title="More">

              ${iconMore()}

            </button>

          </div>
        `;

      }

      messagesEl.appendChild(wrapper);

    }
  );

  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* ================= ESCAPE ================= */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================= COPY ================= */

async function copyMessage(index){

  const text =
    messagesData[index]?.text || "";

  await navigator.clipboard.writeText(text);

  toast("Copied");

}


/* ================= LIKE ================= */

function likeMessage(index){

  messagesData[index].liked = true;

  saveMessages();

  toast("Thanks for your feedback");

}


/* ================= DISLIKE ================= */

function dislikeMessage(index){

  messagesData[index].disliked = true;

  saveMessages();

  toast("Feedback saved");

}


/* ================= SHARE ================= */

async function shareMessage(index){

  const text =
    messagesData[index]?.text || "";

  if(navigator.share){

    await navigator.share({
      title:"RG Creator AI",
      text:text
    });

  }else{

    await navigator.clipboard.writeText(text);

    toast("Response copied");

  }

}


/* ================= REGENERATE ================= */

async function regenerateMessage(index){

  if(!lastUserMessage){

    for(let i=index-1;i>=0;i--){

      if(messagesData[i].role==="user"){

        lastUserMessage =
          messagesData[i].text;

        break;

      }

    }

  }

  if(!lastUserMessage)
    return;

  messagesData[index].text =
    "Regenerating...";

  saveMessages();

  renderMessages();

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:lastUserMessage
        })

      });

    const data =
      await response.json();

    if(!response.ok || !data.ok)
      throw new Error(
        data.error ||
        "Request failed"
      );

    messagesData[index].text =
      data.reply;

    saveMessages();

    renderMessages();

  }catch(error){

    messagesData[index].text =
      "Unable to regenerate response.";

    saveMessages();

    renderMessages();

  }

}


/* ================= MORE AI MESSAGE ================= */

function moreMessage(index){

  const choice =
    prompt(
      "Choose:\n\n" +
      "1 = Read aloud\n" +
      "2 = Copy\n" +
      "3 = Delete\n" +
      "4 = Save"
    );

  if(choice==="1"){

    speak(messagesData[index].text);

  }else if(choice==="2"){

    copyMessage(index);

  }else if(choice==="3"){

    messagesData.splice(index,1);

    saveMessages();

    renderMessages();

  }else if(choice==="4"){

    localStorage.setItem(
      "rg_saved_"+Date.now(),
      messagesData[index].text
    );

    toast("Saved");

  }

}


/* ================= READ ALOUD ================= */

function speak(text){

  if(!("speechSynthesis" in window)){

    toast("Read aloud not supported");

    return;

  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.rate = 1;

  speechSynthesis.speak(
    utterance
  );

}


/* ================= TOP MENU ================= */

function toggleTopMenu(){

  document
    .getElementById("topMenu")
    .classList.toggle("open");

}


/* ================= SHARE CONVERSATION ================= */

async function shareConversation(){

  const text =
    messagesData
      .map(m =>
        (m.role==="user"
          ? "You: "
          : "RG Creator AI: ") +
        m.text
      )
      .join("\n\n");

  if(!text){

    toast("No conversation to share");

    return;

  }

  if(navigator.share){

    await navigator.share({
      title:chatName,
      text:text
    });

  }else{

    await navigator.clipboard.writeText(text);

    toast("Conversation copied");

  }

}


/* ================= PIN ================= */

function pinChat(){

  pinned = !pinned;

  localStorage.setItem(
    "rg_pinned",
    pinned
  );

  toast(
    pinned
      ? "Chat pinned"
      : "Chat unpinned"
  );

}


/* ================= RENAME ================= */

function renameChat(){

  const name =
    prompt(
      "Enter chat name:",
      chatName
    );

  if(!name || !name.trim())
    return;

  chatName =
    name.trim();

  localStorage.setItem(
    "rg_chat_name",
    chatName
  );

  document
    .getElementById("chatTitle")
    .textContent =
    chatName;

  renderHistory();

  toast("Chat renamed");

}


/* ================= DOWNLOAD ================= */

function downloadConversation(){

  const text =
    messagesData
      .map(m =>
        (m.role==="user"
          ? "You:\n"
          : "RG Creator AI:\n") +
        m.text
      )
      .join("\n\n----------------\n\n");

  const blob =
    new Blob(
      [text],
      {type:"text/plain"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "RG-Creator-AI-Chat.txt";

  a.click();

  URL.revokeObjectURL(url);

  toast("Conversation downloaded");

}


/* ================= DELETE ================= */

function deleteConversation(){

  if(
    !confirm(
      "Delete this conversation?"
    )
  )
    return;

  messagesData = [];

  saveMessages();

  renderMessages();

  renderHistory();

  toast("Conversation deleted");

}


/* ================= SIDEBAR ================= */

function openSidebar(){

  document
    .getElementById("sidebar")
    .classList.add("open");

  document
    .getElementById("overlay")
    .classList.add("show");

}

function closeSidebar(){

  document
    .getElementById("sidebar")
    .classList.remove("open");

  document
    .getElementById("overlay")
    .classList.remove("show");

}


/* ================= NEW CHAT ================= */

function newChat(){

  messagesData = [];

  chatName =
    "New Chat";

  lastUserMessage = "";

  localStorage.removeItem(
    "rg_messages"
  );

  localStorage.setItem(
    "rg_chat_name",
    chatName
  );

  document
    .getElementById("chatTitle")
    .textContent =
    chatName;

  renderMessages();

  renderHistory();

  closeSidebar();

}


/* ================= HISTORY ================= */

function saveMessages(){

  localStorage.setItem(
    "rg_messages",
    JSON.stringify(messagesData)
  );

}


function renderHistory(
  filter=""
){

  const history =
    document.getElementById("history");

  const matches =
    filter.toLowerCase();

  history.innerHTML = "";

  if(
    chatName
      .toLowerCase()
      .includes(matches)
  ){

    const item =
      document.createElement("div");

    item.className =
      "chat-history-item";

    item.innerHTML = `

      <div class="chat-name">
        ${escapeHTML(chatName)}
      </div>

      <button
        class="history-more"
        onclick="event.stopPropagation(); renameChat()"
      >
        ⋯
      </button>

    `;

    item.onclick =
      closeSidebar;

    history.appendChild(item);

  }

}


function searchChats(){

  const value =
    document
      .getElementById("chatSearch")
      .value;

  renderHistory(value);

}


/* ================= VOICE ================= */

function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){

    toast(
      "Voice input is not supported"
    );

    return;

  }

  const recognition =
    new Recognition();

  recognition.lang =
    "en-IN";

  recognition.interimResults =
    false;

  recognition.onstart =
    function(){

      toast("Listening...");

    };

  recognition.onresult =
    function(event){

      input.value =
        event.results[0][0].transcript;

      autoResize();

    };

  recognition.onerror =
    function(){

      toast("Voice input failed");

    };

  recognition.start();

}


/* ================= INPUT ================= */

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


input.addEventListener(
  "input",
  autoResize
);


function autoResize(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";

}

/* ================= OUTSIDE CLICK ================= */

document.addEventListener(
  "click",
  function(event){

    const plus =
      document.querySelector(".plus-wrap");

    const plusMenu =
      document.getElementById("plusMenu");

    if(
      plusMenu.classList.contains("open") &&
      !plus.contains(event.target)
    ){

      plusMenu.classList.remove("open");

    }

    const topMenu =
      document.getElementById("topMenu");

    if(
      topMenu.classList.contains("open") &&
      !event.target.closest(".header-right") &&
      !event.target.closest(".more-menu")
    ){

      topMenu.classList.remove("open");

    }

  }
);
