<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RG Creator AI</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#000;
  --panel:#0d0d0d;
  --panel2:#151515;
  --text:#f5f5f5;
  --muted:#888;
  --border:#292929;
  --user:#202020;
  --hover:#171717;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow:hidden;
}

button,
textarea,
input{
  font:inherit;
}

button{
  color:inherit;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */

.topbar{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:relative;
  z-index:20;
}

.top-left,
.top-right{
  display:flex;
  align-items:center;
  gap:5px;
}

.brand{
  font-size:17px;
  font-weight:600;
  margin-left:5px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:21px;
  padding:0;
}

.icon-btn:hover{
  background:var(--hover);
}

.icon-btn:active{
  transform:scale(.95);
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  position:relative;
}

.chat{
  height:100%;
  overflow-y:auto;
  padding:20px 14px 160px;
  scroll-behavior:smooth;
}

.chat-inner{
  max-width:780px;
  margin:auto;
}

/* EMPTY */

.empty{
  min-height:calc(100dvh - 250px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  color:var(--muted);
}

.empty h2{
  color:var(--text);
  font-size:24px;
  margin:0 0 8px;
}

.empty p{
  margin:0;
  font-size:14px;
}

/* MESSAGE */

.message-row{
  margin:0 auto 26px;
  max-width:780px;
}

.user-row{
  display:flex;
  justify-content:flex-end;
}

.user-message{
  max-width:85%;
  background:var(--user);
  border-radius:18px;
  padding:11px 14px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.ai-message{
  width:100%;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  color:var(--text);
}

/* ATTACHMENT */

.attachment-preview{
  margin-top:8px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.attachment-chip{
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  padding:8px 10px;
  font-size:12px;
  color:#bbb;
}

.attachment-image{
  max-width:260px;
  max-height:220px;
  border-radius:14px;
  display:block;
}

/* MESSAGE ACTIONS */

.message-actions{
  display:flex;
  align-items:center;
  gap:3px;
  margin-top:7px;
  opacity:.85;
}

.action-icon{
  border:0;
  background:transparent;
  color:var(--muted);
  width:34px;
  height:32px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  cursor:pointer;
  font-size:17px;
  position:relative;
}

.action-icon:hover{
  color:var(--text);
  background:var(--hover);
}

.action-icon[data-tip]::after{
  content:attr(data-tip);
  position:absolute;
  bottom:calc(100% + 7px);
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  font-size:11px;
  white-space:nowrap;
  padding:6px 8px;
  border-radius:7px;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  z-index:100;
}

.action-icon:hover::after,
.action-icon:focus-visible::after{
  opacity:1;
}

/* INPUT AREA */

.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 12px 14px;
  background:linear-gradient(
    to bottom,
    transparent,
    var(--bg) 24%
  );
  z-index:15;
}

.composer{
  max-width:780px;
  margin:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:22px;
  padding:8px 9px 8px;
}

#prompt{
  width:100%;
  min-height:46px;
  max-height:170px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:8px 8px 6px;
  line-height:1.5;
}

#prompt::placeholder{
  color:#666;
}

/* COMPOSER TOOLS */

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
}

.composer-left,
.composer-right{
  display:flex;
  align-items:center;
  gap:2px;
}

.send-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  cursor:pointer;
  font-size:17px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.send-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* MENUS */

.popup{
  position:absolute;
  background:#151515;
  border:1px solid #2b2b2b;
  border-radius:16px;
  padding:6px;
  min-width:210px;
  box-shadow:0 15px 45px rgba(0,0,0,.55);
  z-index:200;
}

.popup.hidden{
  display:none;
}

.popup-item{
  width:100%;
  border:0;
  background:transparent;
  color:#eee;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
}

.popup-item:hover{
  background:#222;
}

.popup-divider{
  height:1px;
  background:#292929;
  margin:5px 4px;
}

/* CAPABILITIES */

.capabilities{
  position:absolute;
  left:12px;
  right:12px;
  bottom:92px;
  max-width:780px;
  margin:auto;
  background:#111;
  border:1px solid var(--border);
  border-radius:18px;
  padding:8px;
  z-index:100;
  box-shadow:0 15px 45px rgba(0,0,0,.5);
}

.capabilities.hidden{
  display:none;
}

.capability{
  width:100%;
  border:0;
  background:transparent;
  color:#eee;
  text-align:left;
  padding:12px;
  border-radius:11px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:11px;
}

.capability:hover{
  background:#1b1b1b;
}

.capability-icon{
  width:25px;
  text-align:center;
}

/* HISTORY */

.history-panel{
  position:absolute;
  top:0;
  left:0;
  bottom:0;
  width:min(320px,85vw);
  background:#0b0b0b;
  border-right:1px solid var(--border);
  z-index:300;
  transform:translateX(-100%);
  transition:transform .2s ease;
  display:flex;
  flex-direction:column;
}

.history-panel.open{
  transform:translateX(0);
}

.history-head{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  border-bottom:1px solid var(--border);
}

.history-list{
  flex:1;
  overflow-y:auto;
  padding:8px;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  color:#ddd;
  padding:11px;
  border-radius:10px;
  text-align:left;
  cursor:pointer;
  margin-bottom:3px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#171717;
}

/* OVERLAY */

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:250;
}

.overlay.hidden{
  display:none;
}

/* FILE INPUT */

#fileInput{
  display:none;
}

/* RESPONSIVE */

@media(max-width:600px){

  .chat{
    padding-left:10px;
    padding-right:10px;
    padding-bottom:150px;
  }

  .user-message{
    max-width:88%;
  }

  .composer-wrap{
    padding-left:8px;
    padding-right:8px;
    bottom:0;
  }

  .composer{
    border-radius:20px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->

  <header class="topbar">

    <div class="top-left">

      <button
        id="historyBtn"
        class="icon-btn"
        data-tip="History"
        aria-label="History"
      >
        ☰
      </button>

      <div class="brand">
        RG Creator AI
      </div>

    </div>

    <div class="top-right">

      <button
        id="newChatBtn"
        class="icon-btn"
        data-tip="New chat"
        aria-label="New chat"
      >
        ＋
      </button>

      <button
        id="mainMenuBtn"
        class="icon-btn"
        data-tip="More"
        aria-label="More"
      >
        ⋯
      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main class="main">

    <div
      id="chat"
      class="chat"
    >

      <div
        id="chatInner"
        class="chat-inner"
      >

        <div
          id="emptyState"
          class="empty"
        >
          <h2>How can I help you?</h2>
          <p>Ask RG Creator AI anything.</p>
        </div>

      </div>

    </div>


    <!-- MAIN MENU -->

    <div
      id="mainMenu"
      class="popup hidden"
      style="top:10px;right:10px;"
    >

      <button
        class="popup-item"
        onclick="openCapabilities()"
      >
        ✨ Capabilities
      </button>

      <button
        class="popup-item"
        onclick="toggleTheme()"
      >
        ◐ Theme
      </button>

      <div class="popup-divider"></div>

      <button
        class="popup-item"
        onclick="newChat()"
      >
        ＋ New chat
      </button>

      <button
        class="popup-item"
        onclick="deleteCurrentChat()"
      >
        🗑 Delete chat
      </button>

    </div>


    <!-- CAPABILITIES -->

    <div
      id="capabilities"
      class="capabilities hidden"
    >

      <button
        class="capability"
        onclick="openTool('writer')"
      >
        <span class="capability-icon">✍️</span>
        <span>Content Writer</span>
      </button>

      <button
        class="capability"
        onclick="openTool('code')"
      >
        <span class="capability-icon">💻</span>
        <span>Code Generator</span>
      </button>

      <button
        class="capability"
        onclick="openTool('image')"
      >
        <span class="capability-icon">🖼️</span>
        <span>AI Image Generator</span>
      </button>

      <button
        class="capability"
        onclick="openTool('youtube')"
      >
        <span class="capability-icon">▶️</span>
        <span>YouTube Tools</span>
      </button>

      <button
        class="capability"
        onclick="openTool('instagram')"
      >
        <span class="capability-icon">📸</span>
        <span>Instagram Tools</span>
      </button>

    </div>


    <!-- OVERLAY -->

    <div
      id="overlay"
      class="overlay hidden"
    ></div>


    <!-- HISTORY -->

    <aside
      id="historyPanel"
      class="history-panel"
    >

      <div class="history-head">

        <strong>History</strong>

        <button
          id="closeHistoryBtn"
          class="icon-btn"
          aria-label="Close history"
        >
          ×
        </button>

      </div>

      <div
        id="historyList"
        class="history-list"
      ></div>

    </aside>


    <!-- COMPOSER -->

    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="prompt"
          rows="1"
          placeholder="Message RG Creator AI..."
        ></textarea>


        <div class="composer-bottom">

          <div class="composer-left">

            <!-- ATTACH -->

            <button
              id="attachBtn"
              class="icon-btn"
              data-tip="Attach"
              aria-label="Attach file"
            >
              ＋
            </button>

            <input
              id="fileInput"
              type="file"
              accept="image/*,video/*,.pdf,.txt,.doc,.docx"
              multiple
            >


            <!-- VOICE -->

            <button
              id="voiceBtn"
              class="icon-btn"
              data-tip="Voice"
              aria-label="Voice input"
            >
              ♫
            </button>


            <!-- CAPABILITIES -->

            <button
              id="capabilityBtn"
              class="icon-btn"
              data-tip="Capabilities"
              aria-label="Capabilities"
            >
              ✨
            </button>

          </div>


          <div class="composer-right">

            <button
              id="sendBtn"
              class="send-btn"
              aria-label="Send"
            >
              ↑
            </button>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

let conversationHistory = [];
let currentAttachments = [];
let recognition = null;
let isRecording = false;

const STORAGE_KEY =
  "rg_creator_ai_history_v1";

const THEME_KEY =
  "rg_creator_ai_theme_v1";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
  document.getElementById("chat");

const chatInner =
  document.getElementById("chatInner");

const emptyState =
  document.getElementById("emptyState");

const prompt =
  document.getElementById("prompt");

const sendBtn =
  document.getElementById("sendBtn");

const fileInput =
  document.getElementById("fileInput");

const attachBtn =
  document.getElementById("attachBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const historyBtn =
  document.getElementById("historyBtn");

const historyPanel =
  document.getElementById("historyPanel");

const closeHistoryBtn =
  document.getElementById("closeHistoryBtn");

const historyList =
  document.getElementById("historyList");

const overlay =
  document.getElementById("overlay");

const mainMenu =
  document.getElementById("mainMenu");

const mainMenuBtn =
  document.getElementById("mainMenuBtn");

const capabilities =
  document.getElementById("capabilities");

const capabilityBtn =
  document.getElementById("capabilityBtn");

const newChatBtn =
  document.getElementById("newChatBtn");


/* =========================================================
   THEME
========================================================= */

function applyTheme(){

  const saved =
    localStorage.getItem(THEME_KEY);

  if(saved === "light"){

    document.documentElement.style.setProperty(
      "--bg",
      "#ffffff"
    );

    document.documentElement.style.setProperty(
      "--panel",
      "#f5f5f5"
    );

    document.documentElement.style.setProperty(
      "--panel2",
      "#eeeeee"
    );

    document.documentElement.style.setProperty(
      "--text",
      "#111111"
    );

    document.documentElement.style.setProperty(
      "--muted",
      "#666666"
    );

    document.documentElement.style.setProperty(
      "--border",
      "#dddddd"
    );

    document.documentElement.style.setProperty(
      "--user",
      "#eeeeee"
    );

    document.documentElement.style.setProperty(
      "--hover",
      "#e9e9e9"
    );

  }else{

    document.documentElement.style.setProperty(
      "--bg",
      "#000"
    );

    document.documentElement.style.setProperty(
      "--panel",
      "#0d0d0d"
    );

    document.documentElement.style.setProperty(
      "--panel2",
      "#151515"
    );

    document.documentElement.style.setProperty(
      "--text",
      "#f5f5f5"
    );

    document.documentElement.style.setProperty(
      "--muted",
      "#888"
    );

    document.documentElement.style.setProperty(
      "--border",
      "#292929"
    );

    document.documentElement.style.setProperty(
      "--user",
      "#202020"
    );

    document.documentElement.style.setProperty(
      "--hover",
      "#171717"
    );

  }

}


function toggleTheme(){

  const current =
    localStorage.getItem(THEME_KEY) ||
    "dark";

  localStorage.setItem(
    THEME_KEY,
    current === "dark"
      ? "light"
      : "dark"
  );

  applyTheme();

  closeAllMenus();

}


/* =========================================================
   HISTORY STORAGE
========================================================= */

function saveCurrentConversation(){

  if(!conversationHistory.length){
    return;
  }

  const all =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) ||
      "[]"
    );

  const id =
    conversationHistory[0]?.id ||
    Date.now().toString();

  const existing =
    all.findIndex(
      item => item.id === id
    );

  const record = {
    id,
    title:
      conversationHistory
        .find(item => item.role === "user")
        ?.text
        ?.slice(0,50) ||
      "New conversation",

    messages:
      conversationHistory,

    updatedAt:
      Date.now()
  };

  if(existing >= 0){

    all[existing] = record;

  }else{

    all.unshift(record);

  }

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(all.slice(0,50))
  );

  renderHistory();

}


function renderHistory(){

  historyList.innerHTML = "";

  const all =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) ||
      "[]"
    );

  if(!all.length){

    historyList.innerHTML =
      `<div style="
        color:#777;
        padding:14px;
        font-size:13px;
      ">
        No chat history yet.
      </div>`;

    return;

  }


  all
    .sort(
      (a,b) =>
        (b.updatedAt || 0) -
        (a.updatedAt || 0)
    )
    .forEach(item => {

      const button =
        document.createElement("button");

      button.className =
        "history-item";

      button.textContent =
        item.title || "Conversation";

      button.onclick =
        () => loadConversation(item.id);

      historyList.appendChild(button);

    });

}


function loadConversation(id){

  const all =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) ||
      "[]"
    );

  const record =
    all.find(
      item => item.id === id
    );

  if(!record){
    return;
  }

  conversationHistory =
    JSON.parse(
      JSON.stringify(record.messages || [])
    );

  currentAttachments = [];

  renderConversation();

  closeHistory();

}


function renderConversation(){

  chatInner.innerHTML = "";

  if(!conversationHistory.length){

    chatInner.appendChild(
      createEmptyState()
    );

    return;

  }

  conversationHistory.forEach(
    message => {

      if(message.role === "user"){

        addUserMessage(
          message.text,
          message.attachments || [],
          false
        );

      }else{

        addAIMessage(
          message.text,
          false
        );

      }

    }
  );

  scrollBottom();

}


function createEmptyState(){

  const div =
    document.createElement("div");

  div.className =
    "empty";

  div.innerHTML = `
    <h2>How can I help you?</h2>
    <p>Ask RG Creator AI anything.</p>
  `;

  return div;

}


/* =========================================================
   NEW / DELETE
========================================================= */

function newChat(){

  saveCurrentConversation();

  conversationHistory = [];

  currentAttachments = [];

  chatInner.innerHTML = "";

  chatInner.appendChild(
    createEmptyState()
  );

  closeAllMenus();

}


function deleteCurrentChat(){

  if(!conversationHistory.length){

    closeAllMenus();

    return;

  }

  const firstUser =
    conversationHistory.find(
      item => item.role === "user"
    );

  const id =
    firstUser?.id;

  const all =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) ||
      "[]"
    );

  const filtered =
    all.filter(
      item =>
        item.id !== id
    );

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(filtered)
  );

  conversationHistory = [];

  currentAttachments = [];

  chatInner.innerHTML = "";

  chatInner.appendChild(
    createEmptyState()
  );

  renderHistory();

  closeAllMenus();

}


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(
  text,
  attachments = [],
  save = true
){

  emptyState?.remove();

  const row =
    document.createElement("div");

  row.className =
    "message-row user-row";

  const wrapper =
    document.createElement("div");

  wrapper.style.maxWidth = "85%";


  const bubble =
    document.createElement("div");

  bubble.className =
    "user-message";

  bubble.textContent =
    text;


  /* Attachments */

  if(attachments.length){

    const attachmentBox =
      document.createElement("div");

    attachmentBox.className =
      "attachment-preview";

    attachments.forEach(
      file => {

        const chip =
          document.createElement("div");

        chip.className =
          "attachment-chip";

        chip.textContent =
          "📎 " +
          (file.name || "Attachment");

        attachmentBox.appendChild(
          chip
        );

      }
    );

    wrapper.appendChild(
      bubble
    );

    wrapper.appendChild(
      attachmentBox
    );

  }else{

    wrapper.appendChild(
      bubble
    );

  }


  /* User actions */

  const actions =
    document.createElement("div");

  actions.className =
    "message-actions";

  actions.innerHTML = `
    <button
      class="action-icon"
      data-tip="Copy"
      aria-label="Copy"
    >⧉</button>

    <button
      class="action-icon"
      data-tip="Edit"
      aria-label="Edit"
    >✎</button>
  `;


  actions.children[0].onclick =
    () => copyText(text);

  actions.children[1].onclick =
    () => editUserMessage(
      text
    );


  wrapper.appendChild(
    actions
  );

  row.appendChild(
    wrapper
  );

  chatInner.appendChild(
    row
  );

}


/* =========================================================
   ADD AI MESSAGE
========================================================= */

function addAIMessage(
  text,
  save = true
){

  emptyState?.remove();

  const row =
    document.createElement("div");

  row.className =
    "message-row";

  const message =
    document.createElement("div");

  message.className =
    "ai-message";

  message.textContent =
    text;


  row.appendChild(
    message
  );


  const actions =
    document.createElement("div");

  actions.className =
    "message-actions";

  actions.innerHTML = `
    <button
      class="action-icon"
      data-tip="Like"
      aria-label="Like"
    >♡</button>

    <button
      class="action-icon"
      data-tip="Unlike"
      aria-label="Unlike"
    >♧</button>

    <button
      class="action-icon"
      data-tip="Share"
      aria-label="Share"
    >↗</button>

    <button
      class="action-icon"
      data-tip="Copy"
      aria-label="Copy"
    >⧉</button>

    <button
      class="action-icon"
      data-tip="Regenerate"
      aria-label="Regenerate"
    >↻</button>

    <button
      class="action-icon ai-more"
      data-tip="More"
      aria-label="More"
    >⋯</button>
  `;


  const buttons =
    actions.children;


  buttons[0].onclick =
    () => buttons[0].textContent = "♥";

  buttons[1].onclick =
    () => buttons[1].textContent = "♧";

  buttons[2].onclick =
    () => shareText(text);

  buttons[3].onclick =
    () => copyText(text);

  buttons[4].onclick =
    () => regenerateLastReply();

  buttons[5].onclick =
    event =>
      showReplyMoreMenu(
        event.currentTarget,
        text
      );


  row.appendChild(
    actions
  );

  chatInner.appendChild(
    row
  );

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

  const text =
    prompt.value.trim();

  if(!text && !currentAttachments.length){
    return;
  }

  sendBtn.disabled = true;

  const attachments =
    currentAttachments.map(
      file => ({
        name:file.name,
        type:file.type,
        size:file.size
      })
    );


  /* User message */

  addUserMessage(
    text || "Attached files",
    attachments
  );


  const userId =
    Date.now().toString();


  conversationHistory.push({
    id:userId,
    role:"user",
    text:
      text ||
      "Please analyze the attached files.",
    attachments
  });


  prompt.value = "";

  autoResize();

  currentAttachments = [];

  renderAttachmentButton();


  /* Thinking */

  const thinkingRow =
    document.createElement("div");

  thinkingRow.className =
    "message-row";

  const thinking =
    document.createElement("div");

  thinking.className =
    "ai-message";

  thinking.textContent =
    "Thinking...";

  thinkingRow.appendChild(
    thinking
  );

  chatInner.appendChild(
    thinkingRow
  );

  scrollBottom();


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:
              text ||
              "Please analyze the attached files.",

            history:
              conversationHistory
                .slice(-20)
                .map(item => ({
                  role:item.role,
                  text:item.text
                })),

            attachments

          })

        }
      );


    let data;

    try{

      data =
        await response.json();

    }catch{

      throw new Error(
        "Invalid server response."
      );

    }


    if(!response.ok){

      throw new Error(
        data?.details ||
        data?.error ||
        "AI request failed."
      );

    }


    thinkingRow.remove();


    const reply =
      data?.reply ||
      "I couldn't generate a response.";


    addAIMessage(
      reply
    );


    conversationHistory.push({

      id:
        Date.now().toString(),

      role:
        "model",

      text:
        reply

    });


    saveCurrentConversation();

    scrollBottom();


  }catch(error){

    thinking.textContent =
      "Sorry, something went wrong.";

    console.error(
      "Chat error:",
      error
    );

    addAIMessage(
      "Error: " +
      (
        error?.message ||
        "Unable to connect to RG Creator AI."
      )
    );

  }finally{

    sendBtn.disabled = false;

  }

}


/* =========================================================
   REGENERATE
========================================================= */

async function regenerateLastReply(){

  let lastUser = null;

  for(
    let i =
      conversationHistory.length - 1;
    i >= 0;
    i--
  ){

    if(
      conversationHistory[i].role ===
      "user"
    ){

      lastUser =
        conversationHistory[i];

      break;

    }

  }

  if(!lastUser){
    return;
  }


  prompt.value =
    lastUser.text;

  await sendMessage();

}


/* =========================================================
   COPY
========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch{

    const area =
      document.createElement("textarea");

    area.value =
      text;

    document.body.appendChild(
      area
    );

    area.select();

    document.execCommand("copy");

    area.remove();

  }

}


/* =========================================================
   EDIT
========================================================= */

function editUserMessage(text){

  prompt.value =
    text;

  autoResize();

  prompt.focus();

}


/* =========================================================
   SHARE
========================================================= */

async function shareText(text){

  try{

    if(
      navigator.share
    ){

      await navigator.share({
        title:"RG Creator AI",
        text:text
      });

    }else{

      await copyText(text);

    }

  }catch(error){

    console.log(
      "Share cancelled"
    );

  }

}


/* =========================================================
   REPLY MORE
========================================================= */

function showReplyMoreMenu(
  button,
  text
){

  closeReplyMenus();


  const menu =
    document.createElement("div");

  menu.className =
    "popup reply-popup";

  menu.style.position =
    "fixed";

  menu.innerHTML = `
    <button class="popup-item">
      ↓ Download
    </button>

    <button class="popup-item">
      ✂ Cut
    </button>
  `;


  menu.children[0].onclick =
    () => {

      downloadText(text);

      menu.remove();

    };


  menu.children[1].onclick =
    () => {

      copyText(text);

      menu.remove();

    };


  document.body.appendChild(
    menu
  );


  const rect =
    button.getBoundingClientRect();


  menu.style.left =
    Math.max(
      8,
      rect.left - 140
    ) + "px";


  menu.style.top =
    Math.max(
      8,
      rect.top - 100
    ) + "px";


  setTimeout(() => {

    document.addEventListener(
      "click",
      function close(e){

        if(
          !menu.contains(e.target) &&
          e.target !== button
        ){

          menu.remove();

          document.removeEventListener(
            "click",
            close
          );

        }

      }
    );

  },0);

}


function closeReplyMenus(){

  document
    .querySelectorAll(
      ".reply-popup"
    )
    .forEach(
      menu => menu.remove()
    );

}


function downloadText(text){

  const blob =
    new Blob(
      [text],
      {
        type:"text/plain"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href =
    url;

  a.download =
    `rg-creator-ai-${Date.now()}.txt`;

  a.click();

  URL.revokeObjectURL(
    url
  );

}


/* =========================================================
   FILE UPLOAD
========================================================= */

attachBtn.onclick =
  () => fileInput.click();


fileInput.addEventListener(
  "change",
  () => {

    const files =
      Array.from(
        fileInput.files || []
      );

    currentAttachments =
      files;

    renderAttachmentButton();

    fileInput.value = "";

  }
);


function renderAttachmentButton(){

  if(currentAttachments.length){

    attachBtn.textContent =
      "📎";

    attachBtn.setAttribute(
      "data-tip",
      `${currentAttachments.length} file(s) selected`
    );

  }else{

    attachBtn.textContent =
      "+";

    attachBtn.setAttribute(
      "data-tip",
      "Attach"
    );

  }

}


/* =========================================================
   VOICE
========================================================= */

function setupVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    voiceBtn.onclick =
      () => {

        alert(
          "Voice input is not supported in this browser."
        );

      };

    return;

  }


  recognition =
    new SpeechRecognition();

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.lang =
    "hi-IN";


  recognition.onstart =
    () => {

      isRecording = true;

      voiceBtn.textContent =
        "●";

    };


  recognition.onend =
    () => {

      isRecording = false;

      voiceBtn.textContent =
        "♫";

    };


  recognition.onresult =
    event => {

      let finalText = "";

      for(
        let i =
          event.resultIndex;
        i <
          event.results.length;
        i++
      ){

        finalText +=
          event.results[i][0].transcript;

      }

      prompt.value =
        finalText;

      autoResize();

    };

}


voiceBtn.onclick =
  () => {

    if(!recognition){
      return;
    }

    if(isRecording){

      recognition.stop();

    }else{

      recognition.start();

    }

  };


/* =========================================================
   CAPABILITIES
========================================================= */

function openCapabilities(){

  mainMenu.classList.add(
    "hidden"
  );

  capabilities.classList.toggle(
    "hidden"
  );

  overlay.classList.toggle(
    "hidden",
    capabilities.classList.contains(
      "hidden"
    )
  );

}


capabilityBtn.onclick =
  () => {

    capabilities.classList.toggle(
      "hidden"
    );

    overlay.classList.toggle(
      "hidden",
      capabilities.classList.contains(
        "hidden"
      )
    );

  };


function openTool(tool){

  const routes = {

    writer:
      "writer.html",

    code:
      "code.html",

    image:
      "image.html",

    youtube:
      "youtube.html",

    instagram:
      "instagram.html"

  };


  if(routes[tool]){

    window.location.href =
      routes[tool];

  }

}


/* =========================================================
   HISTORY PANEL
========================================================= */

function openHistory(){

  renderHistory();

  historyPanel.classList.add(
    "open"
  );

  overlay.classList.remove(
    "hidden"
  );

}


function closeHistory(){

  historyPanel.classList.remove(
    "open"
  );

  overlay.classList.add(
    "hidden"
  );

}


historyBtn.onclick =
  () => {

    if(
      historyPanel.classList.contains(
        "open"
      )
    ){

      closeHistory();

    }else{

      closeAllMenus();

      openHistory();

    }

  };


closeHistoryBtn.onclick =
  closeHistory;


/* =========================================================
   MAIN MENU
========================================================= */

mainMenuBtn.onclick =
  event => {

    event.stopPropagation();

    capabilities.classList.add(
      "hidden"
    );

    mainMenu.classList.toggle(
      "hidden"
    );

  };


/* =========================================================
   NEW CHAT
========================================================= */

newChatBtn.onclick =
  newChat;


/* =========================================================
   OUTSIDE TAP
========================================================= */

overlay.onclick =
  () => {

    closeAllMenus();

  };


document.addEventListener(
  "click",
  event => {

    if(
      !mainMenu.classList.contains(
        "hidden"
      ) &&
      !mainMenu.contains(
        event.target
      ) &&
      event.target !== mainMenuBtn
    ){

      mainMenu.classList.add(
        "hidden"
      );

    }


    if(
      !capabilities.classList.contains(
        "hidden"
      ) &&
      !capabilities.contains(
        event.target
      ) &&
      event.target !== capabilityBtn
    ){

      capabilities.classList.add(
        "hidden"
      );

      overlay.classList.add(
        "hidden"
      );

    }

  }
);


/* =========================================================
   CLOSE ALL MENUS
========================================================= */

function closeAllMenus(){

  mainMenu.classList.add(
    "hidden"
  );

  capabilities.classList.add(
    "hidden"
  );

  closeHistory();

  overlay.classList.add(
    "hidden"
  );

  closeReplyMenus();

}


/* =========================================================
   TEXTAREA
========================================================= */

function autoResize(){

  prompt.style.height =
    "auto";

  prompt.style.height =
    Math.min(
      prompt.scrollHeight,
      170
    ) + "px";

}


prompt.addEventListener(
  "input",
  autoResize
);


prompt.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =========================================================
   STARTUP
========================================================= */

applyTheme();

renderHistory();

setupVoice();

</script>
