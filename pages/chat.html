<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RG Creator AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#000;
  --panel:#0b0b0b;
  --panel2:#151515;
  --text:#f5f5f5;
  --muted:#929292;
  --line:#252525;
  --accent:#fff;
  --danger:#ff4d4d;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
  overflow:hidden;
}

button,
textarea,
input{
  font:inherit;
}

button{
  border:0;
  outline:0;
  background:none;
  color:inherit;
  cursor:pointer;
}

/* APP */

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#000;
}

/* HEADER */

.header{
  height:60px;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  background:#000;
  position:relative;
  z-index:20;
}

.header-left,
.header-right{
  display:flex;
  align-items:center;
  gap:6px;
}

.logo{
  font-size:17px;
  font-weight:700;
  letter-spacing:-.3px;
}

.header-btn{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#ddd;
}

.header-btn:active{
  background:#181818;
}

.header-btn svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:18px 15px 125px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:#222;
  border-radius:20px;
}

/* WELCOME */

.welcome{
  min-height:70%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.welcome-inner{
  max-width:600px;
}

.welcome h1{
  margin:0 0 10px;
  font-size:30px;
  letter-spacing:-1px;
}

.welcome p{
  margin:0;
  color:var(--muted);
  font-size:15px;
}

/* MESSAGES */

.message-row{
  width:100%;
  margin:0 0 24px;
}

.user-row{
  display:flex;
  justify-content:flex-end;
}

.ai-row{
  display:block;
}

.user-message{
  max-width:min(82%,620px);
  background:#202020;
  border-radius:20px 20px 5px 20px;
  padding:11px 15px;
  font-size:15px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.ai-message{
  width:100%;
  max-width:850px;
  padding:2px 2px 0;
  font-size:16px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

/* AI MARKDOWN */

.ai-message h1,
.ai-message h2,
.ai-message h3{
  margin:18px 0 8px;
  line-height:1.3;
}

.ai-message h1{font-size:24px}
.ai-message h2{font-size:21px}
.ai-message h3{font-size:18px}

.ai-message strong{
  font-weight:700;
}

.ai-message code{
  background:#161616;
  border-radius:6px;
  padding:2px 5px;
  font-size:.9em;
}

.ai-message pre{
  overflow:auto;
  background:#111;
  border:1px solid #242424;
  border-radius:12px;
  padding:14px;
  margin:12px 0;
}

.ai-message pre code{
  background:none;
  padding:0;
}

.ai-message a{
  color:#fff;
  text-decoration:underline;
}

/* MESSAGE ACTIONS */

.message-actions{
  display:flex;
  align-items:center;
  gap:2px;
  margin-top:7px;
  opacity:.85;
}

.user-actions{
  justify-content:flex-end;
}

.action-btn{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#999;
}

.action-btn:active{
  background:#181818;
  color:#fff;
}

.action-btn svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* IMAGE ATTACHMENT PREVIEW */

.attach-preview{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 8px;
}

.preview-item{
  position:relative;
  width:70px;
  height:70px;
  border:1px solid #292929;
  border-radius:12px;
  overflow:hidden;
  background:#111;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-file{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:7px;
  text-align:center;
  font-size:10px;
  color:#aaa;
}

.preview-remove{
  position:absolute;
  top:3px;
  right:3px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#000;
  color:#fff;
  font-size:12px;
}

/* THINKING */

.thinking{
  display:flex;
  align-items:center;
  gap:7px;
  color:#999;
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#999;
  animation:pulse 1.1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes pulse{
  0%,100%{opacity:.25}
  50%{opacity:1}
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(
    to top,
    #000 75%,
    rgba(0,0,0,0)
  );
}

.composer{
  max-width:900px;
  margin:auto;
  border:1px solid #292929;
  background:#101010;
  border-radius:25px;
  padding:8px 8px 8px 10px;
}

.input-line{
  display:flex;
  align-items:flex-end;
  gap:3px;
}

textarea{
  flex:1;
  min-width:0;
  max-height:140px;
  min-height:40px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:9px 7px;
  font-size:16px;
  line-height:1.4;
}

textarea::placeholder{
  color:#777;
}

.icon-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  border-radius:50%;
}

.icon-btn:active{
  background:#1b1b1b;
  color:#fff;
}

.icon-btn svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.send-btn{
  color:#fff;
}

.send-btn:disabled{
  opacity:.3;
}

/* HIDDEN FILE INPUT */

#fileInput{
  display:none;
}

/* MENUS */

.overlay-menu{
  position:fixed;
  z-index:100;
  background:#171717;
  border:1px solid #303030;
  border-radius:15px;
  box-shadow:0 15px 45px rgba(0,0,0,.65);
  min-width:190px;
  overflow:hidden;
}

.menu-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 15px;
  text-align:left;
  color:#eee;
  font-size:14px;
}

.menu-item:active{
  background:#292929;
}

.menu-item svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-title{
  padding:12px 15px 7px;
  color:#777;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

/* SIDE MENU */

.side-menu{
  position:fixed;
  z-index:80;
  top:0;
  bottom:0;
  left:-310px;
  width:290px;
  background:#0b0b0b;
  border-right:1px solid #282828;
  transition:left .22s ease;
  padding:14px;
  overflow-y:auto;
}

.side-menu.open{
  left:0;
}

.side-header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.side-title{
  font-weight:700;
  font-size:17px;
}

.history-list{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.history-item{
  width:100%;
  padding:11px;
  border-radius:10px;
  text-align:left;
  color:#ddd;
  font-size:13px;
}

.history-item:active{
  background:#1b1b1b;
}

.empty-history{
  color:#666;
  font-size:13px;
  padding:15px 5px;
}

/* MENU BACKDROP */

.menu-backdrop{
  position:fixed;
  inset:0;
  z-index:70;
  background:rgba(0,0,0,.35);
  display:none;
}

.menu-backdrop.show{
  display:block;
}

/* CAPABILITY PANEL */

.capabilities{
  position:fixed;
  left:10px;
  right:10px;
  bottom:82px;
  z-index:60;
  max-width:700px;
  margin:auto;
  background:#121212;
  border:1px solid #2c2c2c;
  border-radius:18px;
  padding:10px;
  display:none;
  box-shadow:0 15px 50px rgba(0,0,0,.6);
}

.capabilities.show{
  display:block;
}

.cap-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.cap-item{
  padding:13px;
  border-radius:12px;
  text-align:left;
  background:#191919;
  color:#ddd;
  font-size:13px;
}

.cap-item:active{
  background:#252525;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%) translateY(15px);
  background:#eee;
  color:#111;
  padding:9px 14px;
  border-radius:30px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:600px){
  .chat{
    padding-left:12px;
    padding-right:12px;
  }

  .user-message{
    max-width:88%;
  }

  .welcome h1{
    font-size:26px;
  }

  .ai-message{
    font-size:15.5px;
  }

  .side-menu{
    width:82vw;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

  <div class="header-left">

    <button
      id="menuButton"
      class="header-btn"
      aria-label="Menu"
    >
      <svg viewBox="0 0 24 24">
        <path d="M4 7h16"></path>
        <path d="M4 12h16"></path>
        <path d="M4 17h16"></path>
      </svg>
    </button>

    <div class="logo">RG Creator AI</div>

  </div>

  <div class="header-right">

    <button
      id="newChatButton"
      class="header-btn"
      aria-label="New chat"
    >
      <svg viewBox="0 0 24 24">
        <path d="M12 5v14"></path>
        <path d="M5 12h14"></path>
      </svg>
    </button>

    <button
      id="moreButton"
      class="header-btn"
      aria-label="More"
    >
      <svg viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1"></circle>
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="19" cy="12" r="1"></circle>
      </svg>
    </button>

  </div>

</header>


<!-- SIDE HISTORY -->

<aside id="sideMenu" class="side-menu">

  <div class="side-header">

    <div class="side-title">Chat History</div>

    <button
      id="closeSideButton"
      class="header-btn"
      aria-label="Close"
    >
      ×
    </button>

  </div>

  <button
    id="historyNewButton"
    class="menu-item"
  >
    ＋ New chat
  </button>

  <div id="historyList" class="history-list"></div>

</aside>


<!-- BACKDROP -->

<div id="menuBackdrop" class="menu-backdrop"></div>


<!-- MORE MENU -->

<div
  id="moreMenu"
  class="overlay-menu"
  style="display:none"
>

  <div class="menu-title">Chat</div>

  <button
    class="menu-item"
    data-action="theme"
  >
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8"></circle>
      <path d="M12 4v16"></path>
    </svg>
    Theme
  </button>

  <button
    class="menu-item"
    data-action="clear"
  >
    <svg viewBox="0 0 24 24">
      <path d="M5 7h14"></path>
      <path d="M9 7V4h6v3"></path>
      <path d="M8 7l1 13h6l1-13"></path>
    </svg>
    Delete conversation
  </button>

</div>


<!-- CAPABILITIES -->

<div id="capabilities" class="capabilities">

  <div class="cap-grid">

    <button
      class="cap-item"
      data-tool="image"
    >
      🖼️ AI Image Generator
    </button>

    <button
      class="cap-item"
      data-tool="writer"
    >
      ✍️ Content Writer
    </button>

    <button
      class="cap-item"
      data-tool="code"
    >
      💻 Code Generator
    </button>

    <button
      class="cap-item"
      data-tool="youtube"
    >
      ▶️ YouTube Tools
    </button>

    <button
      class="cap-item"
      data-tool="instagram"
    >
      📸 Instagram Tools
    </button>

  </div>

</div>


<!-- CHAT -->

<main id="chat" class="chat">

  <section
    id="welcome"
    class="welcome"
  >
    <div class="welcome-inner">
      <h1>How can I help you?</h1>
      <p>
        Ask RG Creator AI anything.
      </p>
    </div>
  </section>

</main>


<!-- COMPOSER -->

<div class="composer-wrap">

  <div class="composer">

    <div
      id="attachPreview"
      class="attach-preview"
    ></div>

    <div class="input-line">

      <!-- ATTACH -->

      <button
        id="attachButton"
        class="icon-btn"
        aria-label="Add file"
        data-label="Add file"
      >
        <svg viewBox="0 0 24 24">
          <path d="M21.4 11.6l-8.9 8.9a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.6-8.6"></path>
        </svg>
      </button>

      <input
        type="file"
        id="fileInput"
        multiple
        accept="
          image/*,
          video/*,
          application/pdf,
          text/plain,
          application/msword,
          application/vnd.openxmlformats-officedocument.wordprocessingml.document
        "
      >

      <!-- CAPABILITIES -->

      <button
        id="capabilityButton"
        class="icon-btn"
        aria-label="Capabilities"
        data-label="Capabilities"
      >
        <svg viewBox="0 0 24 24">
          <rect x="4" y="4" width="6" height="6"></rect>
          <rect x="14" y="4" width="6" height="6"></rect>
          <rect x="4" y="14" width="6" height="6"></rect>
          <rect x="14" y="14" width="6" height="6"></rect>
        </svg>
      </button>

      <!-- TEXT -->

      <textarea
        id="prompt"
        rows="1"
        placeholder="Message RG Creator AI..."
      ></textarea>

      <!-- VOICE -->

      <button
        id="voiceButton"
        class="icon-btn"
        aria-label="Voice"
        data-label="Voice"
      >
        <svg viewBox="0 0 24 24">
          <rect
            x="9"
            y="3"
            width="6"
            height="12"
            rx="3"
          ></rect>

          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v3"></path>
          <path d="M8 21h8"></path>
        </svg>
      </button>

      <!-- SEND -->

      <button
        id="sendButton"
        class="icon-btn send-btn"
        aria-label="Send"
        data-label="Send"
      >
        <svg viewBox="0 0 24 24">
          <path d="M5 12h13"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>
"use strict";

/* =========================
   STATE
========================= */

let conversationHistory = [];
let selectedFiles = [];
let isSending = false;

const STORAGE_KEY = "rg_creator_ai_chats_v2";
const CURRENT_KEY = "rg_creator_ai_current_v2";


/* =========================
   ELEMENTS
========================= */

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const prompt = document.getElementById("prompt");

const sendButton = document.getElementById("sendButton");
const attachButton = document.getElementById("attachButton");
const fileInput = document.getElementById("fileInput");
const attachPreview = document.getElementById("attachPreview");

const capabilityButton =
  document.getElementById("capabilityButton");

const capabilities =
  document.getElementById("capabilities");

const menuButton =
  document.getElementById("menuButton");

const moreButton =
  document.getElementById("moreButton");

const moreMenu =
  document.getElementById("moreMenu");

const sideMenu =
  document.getElementById("sideMenu");

const closeSideButton =
  document.getElementById("closeSideButton");

const menuBackdrop =
  document.getElementById("menuBackdrop");

const newChatButton =
  document.getElementById("newChatButton");

const historyNewButton =
  document.getElementById("historyNewButton");

const historyList =
  document.getElementById("historyList");

const voiceButton =
  document.getElementById("voiceButton");

const toast =
  document.getElementById("toast");


/* =========================
   HELPERS
========================= */

function showToast(message){

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {
      toast.classList.remove("show");
    },2200);
}


function scrollBottom(){

  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });

}


function closeAllMenus(){

  moreMenu.style.display = "none";

  capabilities.classList.remove("show");

  sideMenu.classList.remove("open");

  menuBackdrop.classList.remove("show");

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   BASIC MARKDOWN
========================= */

function formatAIText(text){

  let html = escapeHTML(text);

  html = html.replace(
    /```([\s\S]*?)```/g,
    "<pre><code>$1</code></pre>"
  );

  html = html.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  html = html.replace(
    /\n/g,
    "<br>"
  );

  return html;
}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  saveCurrentChat();

  conversationHistory = [];
  selectedFiles = [];

  chat.innerHTML = `
    <section id="welcome" class="welcome">
      <div class="welcome-inner">
        <h1>How can I help you?</h1>
        <p>Ask RG Creator AI anything.</p>
      </div>
    </section>
  `;

  renderAttachmentPreview();
  closeAllMenus();

  localStorage.removeItem(CURRENT_KEY);

  prompt.value = "";

  autoResize();

  showToast("New chat");

}


/* =========================
   SAVE CHAT
========================= */

function saveCurrentChat(){

  if(!conversationHistory.length) return;

  const all =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

  const id =
    localStorage.getItem(CURRENT_KEY) ||
    String(Date.now());

  localStorage.setItem(
    CURRENT_KEY,
    id
  );

  const firstUser =
    conversationHistory.find(
      item => item.role === "user"
    );

  const title =
    firstUser?.content?.slice(0,42) ||
    "New conversation";

  const existing =
    all.find(item => item.id === id);

  const data = {
    id,
    title,
    messages: conversationHistory,
    updatedAt:Date.now()
  };

  if(existing){

    Object.assign(existing,data);

  }else{

    all.unshift(data);

  }

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(all.slice(0,50))
  );

  renderHistory();

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

  const all =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

  historyList.innerHTML = "";

  if(!all.length){

    historyList.innerHTML =
      `<div class="empty-history">
        No conversations yet.
      </div>`;

    return;
  }

  all
    .sort((a,b) => b.updatedAt-a.updatedAt)
    .forEach(item => {

      const button =
        document.createElement("button");

      button.className = "history-item";
      button.textContent = item.title;

      button.addEventListener(
        "click",
        () => loadHistory(item.id)
      );

      historyList.appendChild(button);

    });

}


function loadHistory(id){

  const all =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

  const item =
    all.find(x => x.id === id);

  if(!item) return;

  conversationHistory =
    Array.isArray(item.messages)
      ? item.messages
      : [];

  localStorage.setItem(
    CURRENT_KEY,
    id
  );

  chat.innerHTML = "";

  conversationHistory.forEach(
    message => {

      if(message.role === "user"){

        addUserMessage(
          message.content,
          false
        );

      }else if(message.role === "assistant"){

        addAIMessage(
          message.content,
          false
        );

      }

    }
  );

  closeAllMenus();

  scrollBottom();

}


function deleteConversation(){

  if(!conversationHistory.length){

    showToast("No conversation to delete");
    return;

  }

  if(
    !confirm(
      "Delete this conversation?"
    )
  ) return;

  const id =
    localStorage.getItem(CURRENT_KEY);

  const all =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

  const filtered =
    all.filter(item => item.id !== id);

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(filtered)
  );

  localStorage.removeItem(CURRENT_KEY);

  newChat();

  renderHistory();

  showToast("Conversation deleted");

}

/* =========================
   SEND
========================= */

async function sendMessage(){

  if(isSending) return;

  const text =
    prompt.value.trim();

  if(!text && !selectedFiles.length){

    showToast("Write a message first");
    return;

  }

  isSending = true;
  sendButton.disabled = true;

  addUserMessage(
    text || "Attached file",
    true
  );

  prompt.value = "";

  autoResize();

  const thinking =
    document.createElement("div");

  thinking.className =
    "message-row ai-row";

  thinking.id = "thinkingMessage";

  thinking.innerHTML = `
    <div class="ai-message">
      <div class="thinking">
        <span>Thinking</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  `;

  chat.appendChild(thinking);

  scrollBottom();

  try{

    const attachments =
      await prepareFiles();

    const response =
      await fetch("/api/chat",{
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          message:text,

          history:
            conversationHistory,

          attachments

        })

      });

    let data = {};

    try{
      data = await response.json();
    }catch{
      data = {};
    }

    thinking.remove();

    if(!response.ok){

      throw new Error(
        data?.error ||
        data?.details ||
        `Request failed (${response.status})`
      );

    }

    const reply =
      data.reply ||
      data.text ||
      data.message;

    if(!reply){

      throw new Error(
        "AI did not return a reply."
      );

    }

    addAIMessage(
      reply,
      true
    );

    saveCurrentChat();

    selectedFiles = [];

    renderAttachmentPreview();

  }catch(error){

    thinking.remove();

    addAIMessage(
      "Sorry, I couldn't complete that request.\n\nError: " +
      error.message,
      false
    );

    showToast("Chat request failed");

    console.error(
      "RG Creator AI:",
      error
    );

  }finally{

    isSending = false;
    sendButton.disabled = false;

    prompt.focus();

  }

}


/* =========================
   FILES
========================= */

attachButton.addEventListener(

fileInput.addEventListener(
  "change",
  () => {

    selectedFiles =
      Array.from(fileInput.files || []);

function renderAttachmentPreview(){

  attachPreview.innerHTML = "";

  selectedFiles.forEach(
    (file,index) => {

      const item =
        document.createElement("div");

      item.className =
        "preview-item";

      if(file.type.startsWith("image/")){

        const img =
          document.createElement("img");

        img.src =
          URL.createObjectURL(file);

        item.appendChild(img);

      }else{

        item.innerHTML =
          `<div class="preview-file">
            ${escapeHTML(file.name)}
          </div>`;

      }

      const remove =
        document.createElement("button");

      remove.className =
        "preview-remove";

      remove.textContent = "×";

      remove.addEventListener(
        "click",
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderAttachmentPreview();

        }
      );

      item.appendChild(remove);

      attachPreview.appendChild(item);

    }
  );

}


async function prepareFiles(){

  const result = [];

  for(
    const file of selectedFiles
  ){

    const base64 =
      await fileToBase64(file);

    result.push({

      name:file.name,

      type:
        file.type ||
        "application/octet-stream",

      data:base64

    });

  }

  return result;

}


function fileToBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload = () => {

        const result =
          String(reader.result);

        const comma =
          result.indexOf(",");

        resolve(
          comma >= 0
            ? result.slice(comma+1)
            : result
        );

      };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}

/* OUTSIDE TAP */

document.addEventListener(
  "click",
  event => {

    const insideMore =
      moreMenu.contains(event.target);

    const insideMoreButton =
      moreButton.contains(event.target);

    const insideCapabilities =
      capabilities.contains(event.target);

    const insideCapabilityButton =
      capabilityButton.contains(event.target);

    const insideSide =
      sideMenu.contains(event.target);

    const insideMenuButton =
      menuButton.contains(event.target);

    if(
      !insideMore &&
      !insideMoreButton
    ){

      moreMenu.style.display =
        "none";

    }

    if(
      !insideCapabilities &&
      !insideCapabilityButton
    ){

      capabilities.classList.remove(
        "show"
      );

    }

    if(
      !insideSide &&
      !insideMenuButton
    ){

      sideMenu.classList.remove(
        "open"
      );

    }

    if(
      !insideMore &&
      !insideMoreButton &&
      !insideCapabilities &&
      !insideCapabilityButton &&
      !insideSide &&
      !insideMenuButton
    ){

      menuBackdrop.classList.remove(
        "show"
      );

);

========================= */

    if(!button) return;

    const action =
      button.dataset.action;

      moreMenu.style.display =

      deleteConversation();

    if(action === "theme"){

      moreMenu.style.display =
        "none";

      toggleTheme();

    }

);


/* =========================
   THEME
========================= */

function toggleTheme(){

  const current =
    document.documentElement.dataset.theme;

  if(current === "light"){

    delete document.documentElement.dataset.theme;

    document.body.style.background =
      "#000";

    document.body.style.color =
      "#fff";

    showToast("Dark theme");

  }else{

    document.documentElement.dataset.theme =
      "light";

    document.body.style.background =
      "#fff";

    document.body.style.color =
      "#111";

    showToast("Light theme");

  }

}


/* =========================
   VOICE
========================= */

let recognition = null;

if(
  "SpeechRecognition" in window ||
  "webkitSpeechRecognition" in window
){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {

    voiceButton.style.color =
      "#fff";

    showToast("Listening...");

  };

  recognition.onresult =
    event => {

      let finalText = "";

      for(
        let i=event.resultIndex;
        i<event.results.length;
        i++
      ){

        finalText +=
          event.results[i][0].transcript;

      }

      prompt.value = finalText;

      autoResize();

    };

  recognition.onend = () => {

    voiceButton.style.color =
      "";

  };

  recognition.onerror = () => {

    voiceButton.style.color =
      "";

    showToast(
      "Voice input failed"
    );

  };

}


voiceButton.addEventListener(
  "click",
  () => {

    if(!recognition){

      showToast(
        "Voice input is not supported in this browser"
      );

      return;

    }

    try{
      recognition.start();
    }catch{}

  }
);

========================= */

window.editUserMessage =
function(button){

  const row =
    button.closest(".message-row");

  const message =
    row.querySelector(
      ".user-message"
    );

  if(!message) return;

  prompt.value =
    message.textContent;

  prompt.focus();

  autoResize();

  row.remove();

  const index =
    Array.from(
      chat.children
    ).indexOf(row);

  conversationHistory =
    conversationHistory.filter(
      (item,i) =>
        !(item.role === "user" &&
          item.content ===
          message.textContent)
    );

};


/* =========================
   COPY
========================= */

window.copyText =
async function(button){

  const row =
    button.closest(".message-row");

  const element =
    row.querySelector(
      ".user-message,.ai-message"
    );

  if(!element) return;

  const text =
    element.innerText;

  try{

    await navigator.clipboard.writeText(
      text
    );

    showToast("Copied");

  }catch{

    showToast(
      "Copy failed"
    );

  }

};


/* =========================
   SHARE
========================= */

window.shareAI =
async function(button){

  const row =
    button.closest(".message-row");

  const element =
    row.querySelector(".ai-message");

  const text =
    element?.innerText || "";

  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:"RG Creator AI",
        text
      });

    }catch{}

  }else{

    try{

      await navigator.clipboard.writeText(
        text
      );

      showToast(
        "Reply copied for sharing"
      );

    }catch{

      showToast(
        "Sharing not supported"
      );

    }

  }

};


/* =========================
   REGENERATE
========================= */

window.regenerateReply =
function(){

  if(isSending) return;

  const lastUser =
    [...conversationHistory]
      .reverse()
      .find(
        item => item.role === "user"
      );

  if(!lastUser){

    showToast(
      "Nothing to regenerate"
    );

    return;

  }

  conversationHistory =
    conversationHistory.filter(
      item =>
        item.role !== "assistant" ||
        item !==
        [...conversationHistory]
          .reverse()
          .find(
            x =>
              x.role ===
              "assistant"
          )
    );

  prompt.value =
    lastUser.content;

  sendMessage();

};


/* =========================
   REPLY MORE
========================= */

window.showReplyMenu =
function(button){

  document
    .querySelectorAll(".reply-popup")
    .forEach(
      el => el.remove()
    );

  const popup =
    document.createElement("div");

  popup.className =
    "overlay-menu reply-popup";

  popup.innerHTML = `

    <button
      class="menu-item"
      data-reply-action="copy"
    >
      ${copyIcon()}
      Copy
    </button>

    <button
      class="menu-item"
      data-reply-action="regenerate"
    >
      ${refreshIcon()}
      Regenerate
    </button>

    <button
      class="menu-item"
      data-reply-action="share"
    >
      ${shareIcon()}
      Share
    </button>

  `;

  document.body.appendChild(
    popup
  );

  const rect =
    button.getBoundingClientRect();

  popup.style.right =
    "12px";

  popup.style.bottom =
    `${window.innerHeight - rect.top + 6}px`;

  popup.addEventListener(
    "click",
    event => {

      const action =
        event.target.closest(
          "[data-reply-action]"
        )?.dataset.replyAction;

      if(!action) return;

      if(action === "copy")
        copyText(button);

      if(action === "regenerate")
        regenerateReply();

      if(action === "share")
        shareAI(button);

      popup.remove();

    }
  );

};
