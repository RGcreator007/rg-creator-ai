<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>RG Creator AI - Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #000000;
      --surface: #0d0d0d;
      --surface-2: #151515;
      --border: #292929;
      --text: #ffffff;
      --muted: #9b9b9b;
      --accent: #ff0000;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      height: 58px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      background: #000000;
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .icon-btn,
    .menu-btn,
    .more-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover,
    .menu-btn:hover,
    .more-btn:hover {
      background: #151515;
    }

    .icon-btn svg,
    .menu-btn svg,
    .more-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-symbol {
      font-size: 24px;
      line-height: 1;
    }

    .more-symbol {
      font-size: 25px;
      line-height: 1;
      margin-top: -7px;
    }

    /* =========================
       CHAT AREA
    ========================= */

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 14px 150px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .welcome {
      min-height: calc(100dvh - 220px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 15px;
    }

    .welcome-content {
      max-width: 550px;
    }

    .logo {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      border: 1px solid var(--border);
      font-weight: 800;
      font-size: 20px;
    }

    .welcome h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.2;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    /* =========================
       MESSAGES
    ========================= */

    .message-row {
      display: flex;
      margin: 18px 0;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .user-message {
      max-width: min(82%, 680px);
      padding: 11px 14px;
      border-radius: 17px;
      background: #1b1b1b;
      border: 1px solid #252525;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .assistant-message {
      width: 100%;
      line-height: 1.7;
      color: #eeeeee;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .assistant-message p {
      margin: 0 0 10px;
    }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px;
    }

    .action-btn {
      border: 0;
      background: transparent;
      color: #8e8e8e;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 12px;
    }

    .action-btn:hover {
      color: #ffffff;
      background: #151515;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #999999;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: .25;
      }

      40% {
        opacity: 1;
      }
    }

    /* =========================
       INPUT AREA
    ========================= */

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding:
        8px 10px
        calc(8px + env(safe-area-inset-bottom));
      background:
        linear-gradient(
          to top,
          #000000 70%,
          rgba(0, 0, 0, .92)
        );
    }

    .composer {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #0d0d0d;
    }

    .composer textarea {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      min-height: 40px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ffffff;
      padding: 10px 7px;
      line-height: 1.45;
    }

    .composer textarea::placeholder {
      color: #777777;
    }

    .send-btn {
      background: #ffffff;
      color: #000000;
      border-radius: 12px;
    }

    .send-btn:hover {
      background: #dddddd;
    }

    .send-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .composer-note {
      max-width: 850px;
      margin: 5px auto 0;
      text-align: center;
      color: #666666;
      font-size: 10px;
    }

    /* =========================
       FILE INPUT
    ========================= */

    #fileInput {
      display: none;
    }

    .attachment-preview {
      max-width: 850px;
      margin: 0 auto 6px;
      display: none;
      gap: 7px;
      overflow-x: auto;
    }

    .file-chip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 10px;
      background: #151515;
      border: 1px solid #282828;
      color: #dddddd;
      font-size: 12px;
    }

    .file-chip button {
      border: 0;
      background: transparent;
      color: #888888;
      font-size: 15px;
    }

    /* =========================
       OVERLAYS / MENUS
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      background: rgba(0, 0, 0, .65);
    }

    .overlay.show {
      display: block;
    }

    .drawer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(320px, 88vw);
      background: #080808;
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .drawer-title {
      font-weight: 700;
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: #111111;
      color: #ffffff;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      margin-bottom: 12px;
    }

    .search-box {
      width: 100%;
      border: 1px solid var(--border);
      background: #0f0f0f;
      color: #ffffff;
      border-radius: 10px;
      padding: 10px 12px;
      outline: 0;
      margin-bottom: 14px;
    }

    .history-title {
      color: #777777;
      font-size: 11px;
      margin: 12px 5px 6px;
    }

    .history-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #dddddd;
      text-align: left;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 3px;
    }

    .history-item:hover {
      background: #151515;
    }

    .menu-panel {
      position: fixed;
      z-index: 50;
      top: 54px;
      right: 9px;
      width: 210px;
      display: none;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #0d0d0d;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
    }

    .menu-panel.show {
      display: block;
    }

    .menu-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #dddddd;
      text-align: left;
      padding: 11px 12px;
      border-radius: 9px;
    }

    .menu-item:hover {
      background: #181818;
      color: #ffffff;
    }

    /* =========================
       CAPABILITIES
    ========================= */

    .capability-panel {
      position: fixed;
      z-index: 50;
      left: 10px;
      right: 10px;
      bottom: 82px;
      max-width: 500px;
      margin: auto;
      display: none;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #0d0d0d;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    }

    .capability-panel.show {
      display: block;
    }

    .capability-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .capability {
      border: 1px solid #242424;
      background: #111111;
      color: #eeeeee;
      border-radius: 11px;
      padding: 12px;
      text-align: left;
    }

    .capability strong {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .capability small {
      color: #777777;
      line-height: 1.4;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(15px);
      z-index: 100;
      padding: 9px 13px;
      border-radius: 10px;
      background: #181818;
      border: 1px solid #303030;
      color: #ffffff;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .brand {
        font-size: 15px;
      }

      .chat {
        padding-left: 10px;
        padding-right: 10px;
      }

      .user-message {
        max-width: 88%;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .capability-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="topbar">

    <div class="top-left">

      <button
        id="menuButton"
        class="menu-btn"
        aria-label="Menu"
        type="button"
      >
        <span class="menu-symbol">☰</span>
      </button>

    </div>

    <div class="brand">
      RG Creator AI
    </div>

    <div class="top-right">

      <button
        id="moreButton"
        class="more-btn"
        aria-label="More"
        type="button"
      >
        <span class="more-symbol">⋯</span>
      </button>

    </div>

  </header>


  <!-- CHAT -->
  <main id="chat" class="chat">

    <div class="chat-inner">

      <section id="welcome" class="welcome">

        <div class="welcome-content">

          <div class="logo">
            RG
          </div>

          <h1>
            What can I help you create?
          </h1>

          <p>
            Chat, create content, write code and build ideas with RG Creator AI.
          </p>

        </div>

      </section>

      <div id="messages"></div>

    </div>

  </main>


  <!-- FILE PREVIEW -->
  <div
    id="attachmentPreview"
    class="attachment-preview"
  ></div>


  <!-- COMPOSER -->
  <div class="composer-area">

    <div class="composer">

      <!-- ATTACH -->
      <button
        id="attachButton"
        class="icon-btn"
        aria-label="Add file"
        type="button"
      >
        <svg viewBox="0 0 24 24">
          <path d="M21.4 11.6l-8.9 8.9a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.6-8.6"></path>
        </svg>
      </button>

      <input
        type="file"
        id="fileInput"
        multiple
        accept="
          image/*,
          video/*,
          application/pdf,
          text/plain,
          application/msword,
          application/vnd.openxmlformats-officedocument.wordprocessingml.document,
          text/csv
        "
      >


      <!-- CAPABILITIES -->
      <button
        id="capabilityButton"
        class="icon-btn"
        aria-label="Capabilities"
        type="button"
      >
        <svg viewBox="0 0 24 24">
          <rect x="4" y="4" width="6" height="6"></rect>
          <rect x="14" y="4" width="6" height="6"></rect>
          <rect x="4" y="14" width="6" height="6"></rect>
          <rect x="14" y="14" width="6" height="6"></rect>
        </svg>
      </button>


      <!-- TEXT -->
      <textarea
        id="prompt"
        rows="1"
        placeholder="Message RG Creator AI..."
        autocomplete="off"
      ></textarea>


      <!-- VOICE -->
      <button
        id="voiceButton"
        class="icon-btn"
        aria-label="Voice"
        type="button"
      >
        <svg viewBox="0 0 24 24">

          <rect
            x="9"
            y="3"
            width="6"
            height="12"
            rx="3"
          ></rect>

          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v3"></path>
          <path d="M8 21h8"></path>

        </svg>
      </button>


      <!-- SEND -->
      <button
        id="sendButton"
        class="icon-btn send-btn"
        aria-label="Send"
        type="button"
      >
        <svg viewBox="0 0 24 24">
          <path d="M5 12h13"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>

    </div>

    <div class="composer-note">
      RG Creator AI can make mistakes. Check important information.
    </div>

  </div>


  <!-- SIDEBAR -->
  <div id="sidebarOverlay" class="overlay">

    <aside class="drawer">

      <div class="drawer-header">

        <div class="drawer-title">
          Chat History
        </div>

        <button
          id="closeSidebar"
          class="icon-btn"
          type="button"
        >
          ×
        </button>

      </div>

      <button
        id="newChatButton"
        class="new-chat"
        type="button"
      >
        ＋ New Chat
      </button>

      <input
        id="historySearch"
        class="search-box"
        type="search"
        placeholder="Search chats..."
      >

      <div class="history-title">
        Today
      </div>

      <div id="historyList"></div>

    </aside>

  </div>


  <!-- MORE MENU -->
  <div
    id="morePanel"
    class="menu-panel"
  >

    <button class="menu-item" id="clearChatButton" type="button">
      Clear chat
    </button>

    <button class="menu-item" id="copyAllButton" type="button">
      Copy chat
    </button>

    <button class="menu-item" id="shareChatButton" type="button">
      Share
    </button>

  </div>


  <!-- CAPABILITIES PANEL -->
  <div
    id="capabilityPanel"
    class="capability-panel"
  >

    <div class="capability-grid">

      <button class="capability" type="button">
        <strong>✍️ Content Writer</strong>
        <small>Captions, scripts, ideas and writing.</small>
      </button>

      <button class="capability" type="button">
        <strong>💻 Code Generator</strong>
        <small>Generate, explain and fix code.</small>
      </button>

      <button class="capability" type="button">
        <strong>🖼️ AI Image</strong>
        <small>Create images from prompts.</small>
      </button>

      <button class="capability" type="button">
        <strong>▶️ YouTube</strong>
        <small>Titles, scripts, SEO and ideas.</small>
      </button>

      <button class="capability" type="button">
        <strong>📸 Instagram</strong>
        <small>Captions, hooks and keywords.</small>
      </button>

      <button class="capability" type="button">
        <strong>📄 Documents</strong>
        <small>PDF and document analysis.</small>
      </button>

    </div>

  </div>


  <div id="toast" class="toast"></div>

</div>


<script>
  /* =========================================================
     RG CREATOR AI - CHAT FRONTEND
     Backend endpoint:
     POST /api/chat
  ========================================================= */

  const promptInput =
    document.getElementById("prompt");

  const sendButton =
    document.getElementById("sendButton");

  const attachButton =
    document.getElementById("attachButton");

  const fileInput =
    document.getElementById("fileInput");

  const voiceButton =
    document.getElementById("voiceButton");

  const capabilityButton =
    document.getElementById("capabilityButton");

  const capabilityPanel =
    document.getElementById("capabilityPanel");

  const menuButton =
    document.getElementById("menuButton");

  const moreButton =
    document.getElementById("moreButton");

  const morePanel =
    document.getElementById("morePanel");

  const sidebarOverlay =
    document.getElementById("sidebarOverlay");

  const closeSidebar =
    document.getElementById("closeSidebar");

  const newChatButton =
    document.getElementById("newChatButton");

  const clearChatButton =
    document.getElementById("clearChatButton");

  const copyAllButton =
    document.getElementById("copyAllButton");

  const shareChatButton =
    document.getElementById("shareChatButton");

  const historySearch =
    document.getElementById("historySearch");

  const historyList =
    document.getElementById("historyList");

  const attachmentPreview =
    document.getElementById("attachmentPreview");

  const messages =
    document.getElementById("messages");

  const welcome =
    document.getElementById("welcome");

  const chat =
    document.getElementById("chat");

  const toast =
    document.getElementById("toast");


  let selectedFiles = [];

  let chatMessages = [];

  let sending = false;


  /* =========================================================
     DAILY CHAT LIMIT
     Version 1 local protection.
     Backend enforcement will be added separately.
  ========================================================= */

  const DAILY_CHAT_LIMIT = 20;

  function getTodayKey() {
    const date = new Date();

    return (
      "rg_chat_count_" +
      date.getFullYear() +
      "_" +
      (date.getMonth() + 1) +
      "_" +
      date.getDate()
    );
  }

  function getChatCount() {
    return Number(
      localStorage.getItem(getTodayKey()) || 0
    );
  }

  function increaseChatCount() {
    const count = getChatCount() + 1;

    localStorage.setItem(
      getTodayKey(),
      String(count)
    );

    return count;
  }

  function canSendChat() {
    return getChatCount() < DAILY_CHAT_LIMIT;
  }


  /* =========================================================
     TOAST
  ========================================================= */

  function showToast(text) {
    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
  }


  /* =========================================================
     AUTO RESIZE
  ========================================================= */

  function resizeTextarea() {
    promptInput.style.height = "auto";

    promptInput.style.height =
      Math.min(
        promptInput.scrollHeight,
        150
      ) + "px";
  }

  promptInput.addEventListener(
    "input",
    resizeTextarea
  );


  /* =========================================================
     ESCAPE HTML
  ========================================================= */

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     SCROLL
  ========================================================= */

  function scrollToBottom() {
    setTimeout(() => {
      chat.scrollTop = chat.scrollHeight;
    }, 30);
  }


  /* =========================================================
     ADD USER MESSAGE
  ========================================================= */

  function addUserMessage(text) {
    welcome.style.display = "none";

    const row =
      document.createElement("div");

    row.className =
      "message-row user";

    const bubble =
      document.createElement("div");

    bubble.className =
      "user-message";

    bubble.textContent = text;

    row.appendChild(bubble);

    messages.appendChild(row);

    chatMessages.push({
      role: "user",
      content: text
    });

    scrollToBottom();

    return row;
  }


  /* =========================================================
     ADD ASSISTANT MESSAGE
  ========================================================= */

  function addAssistantMessage(text) {
    const row =
      document.createElement("div");

    row.className =
      "message-row";

    const wrapper =
      document.createElement("div");

    wrapper.style.width = "100%";

    const answer =
      document.createElement("div");

    answer.className =
      "assistant-message";

    answer.textContent = text;

    const actions =
      document.createElement("div");

    actions.className =
      "message-actions";

    const copy =
      createAction(
        "Copy",
        () => copyText(text)
      );

    const like =
      createAction(
        "👍",
        () => showToast("Thanks!")
      );

    const dislike =
      createAction(
        "👎",
        () => showToast("Feedback recorded")
      );

    const share =
      createAction(
        "Share",
        () => shareText(text)
      );

    const regenerate =
      createAction(
        "Regenerate",
        () => regenerateLast()
      );

    actions.append(
      copy,
      like,
      dislike,
      share,
      regenerate
    );

    wrapper.append(
      answer,
      actions
    );

    row.appendChild(wrapper);

    messages.appendChild(row);

    chatMessages.push({
      role: "assistant",
      content: text
    });

    scrollToBottom();

    return row;
  }


  function createAction(label, callback) {
    const button =
      document.createElement("button");

    button.className =
      "action-btn";

    button.type = "button";

    button.textContent = label;

    button.addEventListener(
      "click",
      callback
    );

    return button;
  }


  /* =========================================================
     TYPING
  ========================================================= */

  function showTyping() {
    const row =
      document.createElement("div");

    row.id = "typingRow";

    row.className =
      "message-row";

    row.innerHTML = `
      <div class="assistant-message">
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    `;

    messages.appendChild(row);

    scrollToBottom();
  }


  function removeTyping() {
    const typing =
      document.getElementById(
        "typingRow"
      );

    if (typing) {
      typing.remove();
    }
  }


  /* =========================================================
     API CALL
  ========================================================= */

  async function sendMessage() {

    if (sending) {
      return;
    }

    const text =
      promptInput.value.trim();

    if (!text && selectedFiles.length === 0) {
      return;
    }

    if (!canSendChat()) {
      showToast(
        "Daily 20 chat limit reached. Try again tomorrow."
      );
      return;
    }

    sending = true;

    sendButton.disabled = true;

    const userText =
      text ||
      "Please analyze the attached file.";

    addUserMessage(userText);

    promptInput.value = "";

    resizeTextarea();

    showTyping();

    try {

      /*
        Current backend supports text.

        Files are displayed in the UI now.
        File-to-Gemini multimodal processing
        will be connected in the next backend step.
      */

      const response =
        await fetch("/api/chat", {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: userText
          })
        });

      let data;

      try {
        data =
          await response.json();
      } catch {
        data = {
          ok: false,
          error:
            "Invalid server response"
        };
      }

      removeTyping();

      if (!response.ok || !data.ok) {

        const errorMessage =
          data?.error ||
          "Something went wrong.";

        addAssistantMessage(
          errorMessage
        );

        return;
      }

      increaseChatCount();

      addAssistantMessage(
        data.reply
      );

      saveCurrentChat();

    } catch (error) {

      removeTyping();

      addAssistantMessage(
        "Unable to connect to RG Creator AI. Please try again."
      );

      console.error(
        "Chat request failed:",
        error
      );

    } finally {

      sending = false;

      sendButton.disabled = false;

      promptInput.focus();
    }
  }


  /* =========================================================
     SEND BUTTON
  ========================================================= */

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  /* =========================================================
     ENTER TO SEND
  ========================================================= */

  promptInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }

    }
  );


  /* =========================================================
     ATTACHMENT
  ========================================================= */

  attachButton.addEventListener(
    "click",
    () => {
      fileInput.click();
    }
  );


  fileInput.addEventListener(
    "change",
    () => {

      selectedFiles =
        Array.from(
          fileInput.files || []
        );

      renderFilePreview();

    }
  );


  function renderFilePreview() {

    attachmentPreview.innerHTML = "";

    if (!selectedFiles.length) {

      attachmentPreview.style.display =
        "none";

      return;
    }

    attachmentPreview.style.display =
      "flex";

    selectedFiles.forEach(
      (file, index) => {

        const chip =
          document.createElement("div");

        chip.className =
          "file-chip";

        const name =
          document.createElement("span");

        name.textContent =
          file.name;

        const remove =
          document.createElement("button");

        remove.type = "button";

        remove.textContent = "×";

        remove.addEventListener(
          "click",
          () => {

            selectedFiles.splice(
              index,
              1
            );

            renderFilePreview();

          }
        );

        chip.append(
          name,
          remove
        );

        attachmentPreview.appendChild(
          chip
        );

      }
    );
  }


  /* =========================================================
     CAPABILITIES
  ========================================================= */

  capabilityButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      capabilityPanel.classList.toggle(
        "show"
      );

      morePanel.classList.remove(
        "show"
      );

    }
  );


  /* =========================================================
     MORE
  ========================================================= */

  moreButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      morePanel.classList.toggle(
        "show"
      );

      capabilityPanel.classList.remove(
        "show"
      );

    }
  );


  /* =========================================================
     SIDEBAR
  ========================================================= */

  menuButton.addEventListener(
    "click",
    () => {

      sidebarOverlay.classList.add(
        "show"
      );

      morePanel.classList.remove(
        "show"
      );

      capabilityPanel.classList.remove(
        "show"
      );

    }
  );


  closeSidebar.addEventListener(
    "click",
    () => {
      sidebarOverlay.classList.remove(
        "show"
      );
    }
  );


  sidebarOverlay.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        sidebarOverlay
      ) {
        sidebarOverlay.classList.remove(
          "show"
        );
      }

    }
  );


  /* =========================================================
     NEW CHAT
  ========================================================= */

  newChatButton.addEventListener(
    "click",
    () => {

      messages.innerHTML = "";

      chatMessages = [];

      selectedFiles = [];

      fileInput.value = "";

      renderFilePreview();

      welcome.style.display = "";

      sidebarOverlay.classList.remove(
        "show"
      );

      showToast("New chat started");

      promptInput.focus();

    }
  );


  /* =========================================================
     CLEAR CHAT
  ========================================================= */

  clearChatButton.addEventListener(
    "click",
    () => {

      messages.innerHTML = "";

      chatMessages = [];

      welcome.style.display = "";

      morePanel.classList.remove(
        "show"
      );

      showToast("Chat cleared");

    }
  );


  /* =========================================================
     COPY ALL
  ========================================================= */

  copyAllButton.addEventListener(
    "click",
    async () => {

      const text =
        chatMessages
          .map(
            item =>
              `${item.role.toUpperCase()}:\n${item.content}`
          )
          .join("\n\n");

      if (!text) {

        showToast(
          "Nothing to copy"
        );

        return;
      }

      await copyText(text);

      morePanel.classList.remove(
        "show"
      );

    }
  );


  /* =========================================================
     SHARE
  ========================================================= */

  shareChatButton.addEventListener(
    "click",
    async () => {

      const text =
        chatMessages
          .map(
            item =>
              item.content
          )
          .join("\n\n");

      await shareText(
        text ||
        "RG Creator AI"
      );

      morePanel.classList.remove(
        "show"
      );

    }
  );


  async function copyText(text) {

    try {

      await navigator.clipboard.writeText(
        text
      );

      showToast("Copied");

    } catch {

      showToast(
        "Copy failed"
      );

    }
  }


  async function shareText(text) {

    try {

      if (
        navigator.share
      ) {

        await navigator.share({
          title:
            "RG Creator AI",
          text
        });

      } else {

        await copyText(text);

      }

    } catch {
      // User cancelled share.
    }
  }


  /* =========================================================
     REGENERATE
  ========================================================= */

  async function regenerateLast() {

    const lastUser =
      [...chatMessages]
        .reverse()
        .find(
          item =>
            item.role === "user"
        );

    if (!lastUser) {

      showToast(
        "No message to regenerate"
      );

      return;
    }

    promptInput.value =
      lastUser.content;

    await sendMessage();
  }


  /* =========================================================
     VOICE INPUT
  ========================================================= */

  let recognition = null;

  if (
    "webkitSpeechRecognition" in window
  ) {

    recognition =
      new webkitSpeechRecognition();

    recognition.lang =
      "en-IN";

    recognition.continuous =
      false;

    recognition.interimResults =
      false;

    recognition.onresult =
      event => {

        const text =
          event.results[0][0].transcript;

        promptInput.value =
          text;

        resizeTextarea();

      };

    recognition.onerror =
      () => {

        showToast(
          "Voice input unavailable"
        );

      };

  }


  voiceButton.addEventListener(
    "click",
    () => {

      if (!recognition) {

        showToast(
          "Voice input is not supported in this browser"
        );

        return;
      }

      try {

        recognition.start();

        showToast(
          "Listening..."
        );

      } catch {
        // Already listening.
      }

    }
  );


  /* =========================================================
     LOCAL CHAT HISTORY
  ========================================================= */

  function saveCurrentChat() {

    if (!chatMessages.length) {
      return;
    }

    const history =
      JSON.parse(
        localStorage.getItem(
          "rg_chat_history"
        ) || "[]"
      );

    const firstUser =
      chatMessages.find(
        item =>
          item.role === "user"
      );

    if (!firstUser) {
      return;
    }

    const item = {
      id:
        Date.now(),
      title:
        firstUser.content
          .slice(0, 50),
      messages:
        chatMessages,
      createdAt:
        new Date().toISOString()
    };

    history.unshift(item);

    localStorage.setItem(
      "rg_chat_history",
      JSON.stringify(
        history.slice(0, 50)
      )
    );

    renderHistory();
  }


  function renderHistory() {

    const history =
      JSON.parse(
        localStorage.getItem(
          "rg_chat_history"
        ) || "[]"
      );

    const search =
      historySearch.value
        .trim()
        .toLowerCase();

    historyList.innerHTML = "";

    const filtered =
      history.filter(
        item =>
          !search ||
          item.title
            .toLowerCase()
            .includes(search)
      );

    filtered.forEach(
      item => {

        const button =
          document.createElement(
            "button"
          );

        button.type = "button";

        button.className =
          "history-item";

        button.textContent =
          item.title;

        button.addEventListener(
          "click",
          () => loadHistory(item)
        );

        historyList.appendChild(
          button
        );

      }
    );

  }


  function loadHistory(item) {

    messages.innerHTML = "";

    chatMessages = [];

    welcome.style.display =
      "none";

    item.messages.forEach(
      message => {

        if (
          message.role === "user"
        ) {

          addUserMessage(
            message.content
          );

        } else {

          addAssistantMessage(
            message.content
          );

        }

      }
    );

    sidebarOverlay.classList.remove(
      "show"
    );

  }


  historySearch.addEventListener(
    "input",
    renderHistory
  );


  /* =========================================================
     CLOSE FLOATING MENUS
  ========================================================= */

  document.addEventListener(
    "click",
    event => {

      if (
        !event.target.closest(
          "#moreButton"
        ) &&
        !event.target.closest(
          "#morePanel"
        )
      ) {

        morePanel.classList.remove(
          "show"
        );

      }

      if (
        !event.target.closest(
          "#capabilityButton"
        ) &&
        !event.target.closest(
          "#capabilityPanel"
        )
      ) {

        capabilityPanel.classList.remove(
          "show"
        );

      }

    }
  );


  /* =========================================================
     INITIALIZE
  ========================================================= */

  renderHistory();

  promptInput.focus();

</script>

</body>
</html>
