<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>RG Creator AI</title>

<link rel="icon" type="image/jpeg" href="/assets/rg-logo.jpg">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#000;
  --panel:#111;
  --panel2:#181818;
  --panel3:#222;
  --border:#2c2c2c;
  --text:#fff;
  --muted:#8d8d8d;
  --accent:#ff3030;
  --user:#252525;
}

/* =====================================================
   FONT SYSTEM
===================================================== */

html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;

  font-family:
    "Söhne",
    Inter,
    "Segoe UI",
    "Helvetica Neue",
    Arial,
    sans-serif;

  overflow:hidden;
}

button,
input,
textarea{
  font-family:inherit;
}

code,
pre,
.code-text{
  font-family:
    "Söhne Mono",
    Consolas,
    Monaco,
    monospace;
}

/* =====================================================
   APP
===================================================== */

.app{
  width:100%;
  height:100%;
  position:relative;
}

/* =====================================================
   HEADER
===================================================== */

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  border-bottom:1px solid #181818;
  background:rgba(0,0,0,.96);

  backdrop-filter:blur(15px);

  position:relative;
  z-index:20;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.brand-logo{
  width:34px;
  height:34px;
  border-radius:10px;
  object-fit:cover;
  flex:none;
}

.title{
  font-size:16px;
  font-weight:600;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-right{
  display:flex;
  align-items:center;
}

.icon-btn{
  width:42px;
  height:42px;

  border:0;
  background:transparent;
  color:#fff;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.icon-btn:hover{
  background:#181818;
}

.icon{
  width:21px;
  height:21px;

  stroke:currentColor;
  fill:none;

  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =====================================================
   CHAT
===================================================== */

.chat-area{
  height:calc(100% - 64px);

  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;

  overflow-y:auto;

  padding:20px 16px 160px;

  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:10px;
}

/* =====================================================
   WELCOME
===================================================== */

.welcome{
  max-width:760px;

  margin:14vh auto 0;

  text-align:center;
}

.welcome-logo{
  width:62px;
  height:62px;

  border-radius:18px;

  object-fit:cover;

  margin:auto;

  display:block;
}

.welcome h1{
  font-size:28px;
  margin-top:18px;
  letter-spacing:-1px;
}

.welcome p{
  color:#777;
  margin-top:8px;
  font-size:14px;
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
  width:100%;
  max-width:760px;

  margin:0 auto 28px;
}

.user-message{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.user-bubble{
  max-width:82%;

  background:var(--user);

  padding:12px 15px;

  border-radius:20px 20px 5px 20px;

  font-size:15px;
  line-height:1.55;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.user-attachment{
  max-width:82%;

  margin-top:7px;

  padding:8px 11px;

  background:#181818;

  border:1px solid #292929;

  border-radius:12px;

  color:#aaa;

  font-size:12px;
}

/* =====================================================
   AI
===================================================== */

.ai-message{
  font-size:15px;
  line-height:1.7;
}

.ai-content{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.ai-content pre{
  white-space:pre-wrap;

  background:#111;

  border:1px solid #292929;

  border-radius:12px;

  padding:13px;

  margin:10px 0;
}

/* =====================================================
   MESSAGE ACTIONS
===================================================== */

.message-actions{
  display:flex;
  align-items:center;

  gap:2px;

  margin-top:8px;
}

.user-actions{
  justify-content:flex-end;
}

.action-btn{
  width:34px;
  height:34px;

  border:0;

  background:transparent;

  color:#777;

  border-radius:9px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.action-btn:hover{
  background:#181818;
  color:#fff;
}

.action-btn .icon{
  width:18px;
  height:18px;
}

/* =====================================================
   INPUT
===================================================== */

.input-area{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:12px 14px 18px;

  background:
    linear-gradient(
      transparent,
      #000 25%
    );

  z-index:15;
}

.composer{
  width:min(760px,100%);

  margin:auto;

  background:#151515;

  border:1px solid #303030;

  border-radius:24px;

  padding:10px;

  box-shadow:
    0 -8px 35px rgba(0,0,0,.4);
}

/* =====================================================
   ATTACHMENT PREVIEW
===================================================== */

.attachment-preview{
  display:none;

  align-items:center;

  gap:10px;

  background:#202020;

  border:1px solid #303030;

  border-radius:12px;

  padding:8px 10px;

  margin-bottom:8px;

  font-size:12px;

  color:#bbb;
}

.attachment-preview.show{
  display:flex;
}

.attachment-thumb{
  width:42px;
  height:42px;

  object-fit:cover;

  border-radius:8px;

  display:none;
}

.attachment-thumb.show{
  display:block;
}

.attachment-info{
  flex:1;
  min-width:0;
}

.attachment-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.remove-attachment{
  border:0;
  background:transparent;
  color:#777;
  cursor:pointer;
  font-size:20px;
}

/* =====================================================
   TEXTAREA
===================================================== */

.composer textarea{
  width:100%;

  min-height:46px;
  max-height:150px;

  resize:none;

  background:transparent;

  border:0;
  outline:0;

  color:#fff;

  padding:7px 8px;

  font-size:15px;

  line-height:1.5;
}

.composer textarea::placeholder{
  color:#6f6f6f;
}

/* =====================================================
   COMPOSER BOTTOM
===================================================== */

.composer-bottom{
  display:flex;

  justify-content:space-between;

  align-items:center;
}

.composer-left,
.composer-right{
  display:flex;

  align-items:center;

  gap:3px;
}

.circle{
  width:40px;
  height:40px;

  border-radius:50%;

  background:transparent;

  border:0;

  color:#aaa;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.circle:hover{
  background:#242424;
  color:#fff;
}

.send{
  width:42px;
  height:42px;

  border-radius:50%;

  background:#fff;

  color:#000;

  border:0;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.send:hover{
  transform:scale(1.04);
}

.send .icon{
  width:19px;
  height:19px;
  stroke-width:2.3;
}

/* =====================================================
   PLUS MENU
===================================================== */

.plus-wrap{
  position:relative;
}

.plus-menu{
  position:absolute;

  bottom:49px;
  left:0;

  width:225px;

  background:#1b1b1b;

  border:1px solid #333;

  border-radius:18px;

  padding:7px;

  display:none;

  box-shadow:
    0 18px 50px rgba(0,0,0,.7);

  z-index:60;
}

.plus-menu.open{
  display:block;
}

.menu-item{
  width:100%;
  height:44px;

  border:0;

  background:transparent;

  color:#fff;

  display:flex;

  align-items:center;

  gap:12px;

  padding:0 11px;

  border-radius:11px;

  cursor:pointer;

  text-align:left;
}

.menu-item:hover{
  background:#282828;
}

.menu-item .icon{
  width:20px;
  height:20px;
  color:#ddd;
}

/* =====================================================
   TOP MORE
===================================================== */

.more-menu{
  position:absolute;

  top:57px;
  right:12px;

  width:235px;

  background:#1b1b1b;

  border:1px solid #333;

  border-radius:17px;

  padding:7px;

  display:none;

  box-shadow:
    0 18px 50px rgba(0,0,0,.7);

  z-index:70;
}

.more-menu.open{
  display:block;
}

.more-row{
  height:45px;

  width:100%;

  background:transparent;

  color:#fff;

  border:0;

  display:flex;

  align-items:center;

  gap:12px;

  padding:0 11px;

  border-radius:11px;

  cursor:pointer;

  text-align:left;
}

.more-row:hover{
  background:#282828;
}

.more-row .icon{
  width:20px;
  height:20px;
}

/* =====================================================
   SIDEBAR
===================================================== */

.overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.6);

  z-index:90;

  display:none;
}

.overlay.show{
  display:block;
}

.sidebar{
  position:fixed;

  top:0;
  bottom:0;
  left:0;

  width:min(320px,88vw);

  background:#111;

  border-right:1px solid #292929;

  z-index:100;

  transform:translateX(-100%);

  transition:.22s ease;

  display:flex;

  flex-direction:column;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-head{
  height:64px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 12px;

  border-bottom:1px solid #242424;
}

.sidebar-brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.sidebar-brand img{
  width:32px;
  height:32px;

  border-radius:9px;

  object-fit:cover;
}

.sidebar-title{
  font-weight:700;
}

/* =====================================================
   SIDEBAR BUTTONS
===================================================== */

.new-chat{
  margin:13px;

  height:45px;

  border:1px solid #303030;

  background:#1a1a1a;

  color:#fff;

  border-radius:13px;

  display:flex;

  align-items:center;

  gap:10px;

  padding:0 14px;

  cursor:pointer;

  font-size:14px;
}

.new-chat:hover{
  background:#222;
}

/* =====================================================
   PROJECTS
===================================================== */

.projects-section{
  padding:0 13px 10px;
}

.projects-header{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:6px 5px;

  color:#aaa;

  font-size:13px;
}

.project-add{
  width:30px;
  height:30px;

  border:0;

  background:transparent;

  color:#aaa;

  border-radius:8px;

  cursor:pointer;
}

.project-add:hover{
  background:#252525;
  color:#fff;
}

.project-list{
  display:flex;

  flex-direction:column;

  gap:2px;
}

.project-item{
  width:100%;

  border:0;

  background:transparent;

  color:#ddd;

  min-height:39px;

  display:flex;

  align-items:center;

  gap:9px;

  padding:0 8px;

  border-radius:9px;

  cursor:pointer;

  text-align:left;
}

.project-item:hover{
  background:#1f1f1f;
}

.project-name{
  flex:1;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.project-delete{
  opacity:0;

  border:0;

  background:transparent;

  color:#777;

  cursor:pointer;
}

.project-item:hover .project-delete{
  opacity:1;
}

/* =====================================================
   SEARCH
===================================================== */

.search-wrap{
  position:relative;

  margin:0 13px 12px;
}

.search{
  height:42px;

  border:1px solid #292929;

  background:#171717;

  border-radius:12px;

  color:#fff;

  padding:0 12px 0 38px;

  outline:none;

  width:100%;
}

.search:focus{
  border-color:#444;
}

.search-icon{
  position:absolute;

  left:12px;
  top:50%;

  transform:translateY(-50%);

  color:#777;

  pointer-events:none;
}

/* =====================================================
   HISTORY
===================================================== */

.history{
  flex:1;

  overflow-y:auto;

  padding:0 8px 10px;
}

.history-title{
  color:#777;

  font-size:11px;

  padding:12px 8px 6px;

  text-transform:uppercase;
}

.chat-history-item{
  display:flex;

  align-items:center;

  gap:8px;

  padding:11px 9px;

  border-radius:11px;

  color:#ddd;

  cursor:pointer;
}

.chat-history-item:hover{
  background:#1e1e1e;
}

.chat-name{
  flex:1;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  font-size:13px;
}

.history-more{
  width:28px;
  height:28px;

  background:transparent;

  border:0;

  color:#777;

  border-radius:8px;

  cursor:pointer;
}

.history-more:hover{
  background:#292929;
  color:#fff;
}

/* =====================================================
   SIDEBAR BOTTOM
===================================================== */

.sidebar-bottom{
  border-top:1px solid #252525;

  padding:8px;
}

.bottom-row{
  width:100%;

  min-height:48px;

  border:0;

  background:transparent;

  color:#ddd;

  display:flex;

  align-items:center;

  gap:11px;

  padding:5px 9px;

  border-radius:11px;

  cursor:pointer;

  text-align:left;
}

.bottom-row:hover{
  background:#1f1f1f;
}

.profile-avatar{
  width:34px;
  height:34px;

  border-radius:50%;

  object-fit:cover;

  background:#292929;

  display:flex;

  align-items:center;
  justify-content:center;

  flex:none;
}

.profile-avatar img{
  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;
}

.profile-info{
  min-width:0;
  flex:1;
}

.profile-name{
  font-size:13px;
  font-weight:600;
}

.profile-status{
  color:#777;
  font-size:11px;
}

/* =====================================================
   MODALS
===================================================== */

.modal-overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(8px);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:250;

  padding:18px;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:min(430px,100%);

  background:#151515;

  border:1px solid #303030;

  border-radius:20px;

  padding:20px;

  box-shadow:0 25px 80px rgba(0,0,0,.7);
}

.modal-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:18px;
}

.modal-title{
  font-size:18px;
  font-weight:700;
}

.modal-close{
  border:0;
  background:transparent;
  color:#777;
  font-size:25px;
  cursor:pointer;
}

.modal-input{
  width:100%;

  height:45px;

  margin-top:10px;

  background:#0e0e0e;

  color:#fff;

  border:1px solid #303030;

  border-radius:11px;

  padding:0 12px;

  outline:none;
}

.modal-input:focus{
  border-color:#555;
}

.modal-button{
  width:100%;

  height:45px;

  margin-top:12px;

  border:0;

  border-radius:11px;

  background:#fff;

  color:#000;

  font-weight:600;

  cursor:pointer;
}

.modal-secondary{
  width:100%;

  height:42px;

  margin-top:8px;

  border:1px solid #303030;

  background:#1b1b1b;

  color:#fff;

  border-radius:11px;

  cursor:pointer;
}

/* =====================================================
   PROFILE PREVIEW
===================================================== */

.profile-large{
  width:74px;
  height:74px;

  margin:4px auto 15px;

  border-radius:50%;

  overflow:hidden;

  background:#292929;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:25px;
}

.profile-large img{
  width:100%;
  height:100%;

  object-fit:cover;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;
  bottom:100px;

  transform:
    translateX(-50%)
    translateY(10px);

  background:#222;

  border:1px solid #333;

  color:#fff;

  padding:10px 15px;

  border-radius:12px;

  font-size:12px;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:300;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .header{
    height:60px;
  }

  .chat-area{
    height:calc(100% - 60px);
  }

  .messages{
    padding:16px 13px 150px;
  }

  .welcome{
    margin-top:18vh;
  }

  .welcome h1{
    font-size:25px;
  }

  .user-bubble,
  .user-attachment{
    max-width:88%;
  }

  .input-area{
    padding:8px 9px 12px;
  }

  .composer{
    border-radius:21px;
  }

  .brand-logo{
    width:31px;
    height:31px;
  }

  .title{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="header-left">

    <button
      class="icon-btn"
      onclick="openSidebar()"
      aria-label="Open menu"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <div class="brand">

      <img
        src="/assets/rg-logo.jpg"
        class="brand-logo"
        alt="RG Creator AI"
      >

      <div
        class="title"
        id="chatTitle"
      >
        RG Creator AI
      </div>

    </div>

  </div>

  <div class="header-right">

    <button
      class="icon-btn"
      onclick="toggleTopMenu()"
      aria-label="More"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1"/>
        <circle cx="12" cy="12" r="1"/>
        <circle cx="19" cy="12" r="1"/>
      </svg>
    </button>

  </div>

</header>

<!-- =====================================================
     TOP MORE
===================================================== -->

<div
  class="more-menu"
  id="topMenu"
>

  <button
    class="more-row"
    onclick="shareConversation()"
  >
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 16V3"/>
      <path d="m7 8 5-5 5 5"/>
      <path d="M5 13v6h14v-6"/>
    </svg>
    Share conversation
  </button>

  <button
    class="more-row"
    onclick="pinChat()"
  >
    <svg class="icon" viewBox="0 0 24 24">
      <path d="m9 3 6 6"/>
      <path d="m8 8-4 4 8 1 4 8 2-2-4-8 4-4"/>
    </svg>
    Pin
  </button>

  <button
    class="more-row"
    onclick="renameChat()"
  >
    <svg class="icon" viewBox="0 0 24 24">
      <path d="m4 20 4-1 11-11-3-3L5 16l-1 4z"/>
      <path d="m14 5 3 3"/>
    </svg>
    Rename
  </button>

  <button
    class="more-row"
    onclick="downloadConversation()"
  >
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 3v12"/>
      <path d="m7 10 5 5 5-5"/>
      <path d="M5 21h14"/>
    </svg>
    Download
  </button>

  <button
    class="more-row"
    onclick="deleteConversation()"
  >
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M4 7h16"/>
      <path d="M10 11v6M14 11v6"/>
      <path d="M6 7l1 14h10l1-14"/>
      <path d="M9 7V4h6v3"/>
    </svg>
    Delete
  </button>

</div>

<!-- =====================================================
     CHAT
===================================================== -->

<main class="chat-area">

  <div
    class="messages"
    id="messages"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <img
        src="/assets/rg-logo.jpg"
        class="welcome-logo"
        alt="RG Creator AI"
      >

      <h1>
        How can I help you?
      </h1>

      <p>
        Ask anything, create content or build something.
      </p>

    </div>

  </div>

</main>

<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-area">

  <div class="composer">

    <div
      class="attachment-preview"
      id="attachmentPreview"
    >

      <img
        id="attachmentThumb"
        class="attachment-thumb"
        alt="Attachment"
      >

      <span>📎</span>

      <div class="attachment-info">

        <div
          id="attachmentName"
          class="attachment-name"

<!-- =====================================================
     TOAST
===================================================== -->

<div
  class="toast"
  id="toast"
></div>

<script>

/* =====================================================
   STORAGE
===================================================== */

const CHAT_KEY = "rg_messages";
const CHAT_NAME_KEY = "rg_chat_name";
const PIN_KEY = "rg_pinned";
const PROJECT_KEY = "rg_projects";

let messagesData =
  JSON.parse(
    localStorage.getItem(CHAT_KEY) || "[]"
  );

let chatName =
  localStorage.getItem(CHAT_NAME_KEY) ||
  "RG Creator AI";

let pinned =
  localStorage.getItem(PIN_KEY) === "true";

let projects =
  JSON.parse(
    localStorage.getItem(PROJECT_KEY) || "[]"
  );

let currentAttachment = null;
let lastUserMessage = "";

/* =====================================================
   ELEMENTS
===================================================== */

const messagesEl =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const welcome =
  document.getElementById("welcome");

/* =====================================================
   INIT
===================================================== */

document.getElementById(
  "chatTitle"
).textContent = chatName;

renderMessages();
renderHistory();
renderProjects();
loadProfile();

/* =====================================================
   TOAST
===================================================== */

function toast(text){

  const el =
    document.getElementById("toast");

  el.textContent = text;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

/* =====================================================
   PLUS
===================================================== */

function togglePlus(){

  document
    .getElementById("plusMenu")
    .classList.toggle("open");
}

function closePlus(){

  document
    .getElementById("plusMenu")
    .classList.remove("open");
}

/* =====================================================
   ATTACHMENTS
===================================================== */

function chooseImage(){

  closePlus();

  document
    .getElementById("imageInput")
    .click();
}

function chooseCamera(){

  closePlus();

  document
    .getElementById("cameraInput")
    .click();
}

function chooseVideo(){

  closePlus();

  document
    .getElementById("videoInput")
    .click();
}

function chooseFile(){

  closePlus();

  document
    .getElementById("fileInput")
    .click();
}

function choosePDF(){

  closePlus();

  document
    .getElementById("pdfInput")
    .click();
}

/* =====================================================
   HANDLE ATTACHMENT
===================================================== */

async function handleAttachment(fileInput){

  if(!fileInput.files.length)
    return;

  const file =
    fileInput.files[0];

  const maxImageSize =
    8 * 1024 * 1024;

  if(
    file.type.startsWith("image/") &&
    file.size > maxImageSize
  ){
    toast("Image is too large");
    fileInput.value = "";
    return;
  }

  currentAttachment = {
    file:file,
    name:file.name,
    mimeType:file.type
  };

  document
    .getElementById("attachmentName")
    .textContent =
      file.name;

  document
    .getElementById("attachmentType")
    .textContent =
      file.type || "File";

  const thumb =
    document.getElementById(
      "attachmentThumb"
    );

  if(file.type.startsWith("image/")){

    thumb.src =
      URL.createObjectURL(file);

    thumb.classList.add("show");

  }else{

    thumb.removeAttribute("src");

    thumb.classList.remove("show");
  }

  document
    .getElementById("attachmentPreview")
    .classList.add("show");

  toast("Attachment added");
}

/* =====================================================
   REMOVE ATTACHMENT
===================================================== */

function removeAttachment(){

  currentAttachment = null;

  document
    .getElementById("attachmentPreview")
    .classList.remove("show");

  document
    .getElementById("attachmentThumb")
    .classList.remove("show");

  [
    "imageInput",
    "cameraInput",
    "videoInput",
    "fileInput",
    "pdfInput"
  ].forEach(id=>{
    const el =
      document.getElementById(id);

    if(el)
      el.value = "";
  });
}

/* =====================================================
   FILE TO BASE64
===================================================== */

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => {

          const result =
            reader.result;

          const base64 =
            String(result)
              .split(",")[1];

          resolve(base64);
        };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);
    }
  );
}

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text && !currentAttachment)
    return;

  const attachment =
    currentAttachment;

  let imagePayload = null;

  /*
   * Gemini backend currently accepts
   * image data through body.image.
   */

  if(
    attachment &&
    attachment.mimeType.startsWith("image/")
  ){

    try{

      const base64 =
        await fileToBase64(
          attachment.file
        );

      imagePayload = {
        mimeType:
          attachment.mimeType,

        data:base64
      };

    }catch(error){

      toast("Unable to read image");

      return;
    }
  }

  const userText =
    text ||
    (
      attachment
        ? "Please analyze this file."
        : ""
    );

  lastUserMessage =
    userText;

  messagesData.push({

    role:"user",

    text:userText,

    attachment:
      attachment
        ? {
            name:attachment.name,
            mimeType:attachment.mimeType
          }
        : null,

    time:Date.now()

  });

  saveMessages();

  input.value = "";

  autoResize();

  removeAttachment();

  renderMessages();

  const aiIndex =
    messagesData.length;

  messagesData.push({

    role:"assistant",

    text:"Thinking...",

    time:Date.now()

  });

  renderMessages();

  try{

    /*
     * Send recent conversation context.
     */

    const history =
      messagesData
        .slice(0,-1)
        .slice(-20)
        .map(message=>({

          role:
            message.role === "assistant"
              ? "model"
              : "user",

          text:
            message.text || ""
        }));

    const requestBody = {

      message:userText,

      history:history

    };

    if(imagePayload){

      requestBody.image =
        imagePayload;
    }

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              requestBody
            )
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "AI request failed"
      );
    }

    messagesData[
      aiIndex
    ].text =
      data.reply;

    saveMessages();

    renderMessages();

  }catch(error){

    messagesData[
      aiIndex
    ].text =
      "Sorry, I couldn't complete that request.\n\n" +
      (
        error.message ||
        "Server error"
      );

    saveMessages();

    renderMessages();
  }
}

/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(){

  if(!messagesData.length){

    welcome.style.display =
      "block";

    messagesEl
      .querySelectorAll(".message")
      .forEach(el=>el.remove());

    return;
  }

  welcome.style.display =
    "none";

  messagesEl.innerHTML = "";

  messagesData.forEach(
    (message,index)=>{

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "message " +
        (
          message.role === "user"
            ? "user-message"
            : "ai-message"
        );

      if(
        message.role === "user"
      ){

        const attachmentHTML =
          message.attachment
            ? `
              <div class="user-attachment">
                📎 ${escapeHTML(
                  message.attachment.name
                )}
              </div>
            `
            : "";

        wrapper.innerHTML = `

          <div class="user-bubble">
            ${escapeHTML(
              message.text
            )}
          </div>

          ${attachmentHTML}

          <div class="message-actions user-actions">

            <button
              class="action-btn"
              onclick="copyMessage(${index})"
              title="Copy"
            >
              ${iconCopy()}
            </button>

            <button
              class="action-btn"
              onclick="editUserMessage(${index})"
              title="Edit"
            >
              ${iconEdit()}
            </button>

          </div>
        `;

      }else{

        wrapper.innerHTML = `

          <div class="ai-content">
            ${escapeHTML(
              message.text
            )}
          </div>

          <div class="message-actions">

            <button
              class="action-btn"
              onclick="copyMessage(${index})"
              title="Copy"
            >
              ${iconCopy()}
            </button>

            <button
              class="action-btn"
              onclick="likeMessage(${index})"
              title="Like"
            >
              ${iconLike()}
            </button>

            <button
              class="action-btn"
              onclick="dislikeMessage(${index})"
              title="Dislike"
            >
              ${iconDislike()}
            </button>

            <button
              class="action-btn"
              onclick="shareMessage(${index})"
              title="Share"
            >
              ${iconShare()}
            </button>

            <button
              class="action-btn"
              onclick="regenerateMessage(${index})"
              title="Regenerate"
            >
              ${iconRefresh()}
            </button>

            <button
              class="action-btn"
              onclick="moreMessage(${index})"
              title="More"
            >
              ${iconMore()}
            </button>

          </div>
        `;
      }

      messagesEl.appendChild(
        wrapper
      );
    }
  );

  messagesEl.scrollTop =
    messagesEl.scrollHeight;
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =====================================================
   COPY
===================================================== */

async function copyMessage(index){

  const text =
    messagesData[index]?.text ||
    "";

  if(!text)
    return;

  try{

    await navigator.clipboard
      .writeText(text);

    toast("Copied");

  }catch{

    toast("Copy failed");
  }
}

/* =====================================================
   EDIT USER MESSAGE
===================================================== */

function editUserMessage(index){

  if(
    messagesData[index]?.role !==
    "user"
  )
    return;

  input.value =
    messagesData[index].text;

  autoResize();

  input.focus();

  toast("Message ready to edit");
}

/* =====================================================
   LIKE
===================================================== */

function likeMessage(index){

  messagesData[index].liked =
    !messagesData[index].liked;

  messagesData[index].disliked =
    false;

  saveMessages();

  toast("Thanks for your feedback");
}

/* =====================================================
   DISLIKE
===================================================== */

function dislikeMessage(index){

  messagesData[index].disliked =
    !messagesData[index].disliked;

  messagesData[index].liked =
    false;

  saveMessages();

  toast("Feedback saved");
}

/* =====================================================
   SHARE
===================================================== */

async function shareMessage(index){

  const text =
    messagesData[index]?.text ||
    "";

  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          "RG Creator AI",

        text:text

      });

    }catch{}

  }else{

    await copyMessage(index);

  }
}

/* =====================================================
   REGENERATE
===================================================== */

async function regenerateMessage(index){

  let userIndex =
    -1;

  for(
    let i=index-1;
    i>=0;
    i--
  ){

    if(
      messagesData[i].role ===
      "user"
    ){

      userIndex = i;
      break;
    }
  }

  if(userIndex < 0)
    return;

  const userMessage =
    messagesData[userIndex];

  messagesData[index].text =
    "Regenerating...";

  saveMessages();

  renderMessages();

  try{

    const history =
      messagesData
        .slice(0,index)
        .slice(-20)
        .map(message=>({

          role:
            message.role ===
            "assistant"
              ? "model"
              : "user",

          text:
            message.text || ""
        }));

    const body = {

      message:
        userMessage.text,

      history:
        history
    };

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Request failed"
      );
    }

    messagesData[index].text =
      data.reply;

    saveMessages();

    renderMessages();

  }catch(error){

    messagesData[index].text =
      "Unable to regenerate response.";

    saveMessages();

    renderMessages();

    toast(
      error.message ||
      "Regeneration failed"
    );
  }
}

/* =====================================================
   AI MORE
===================================================== */

function moreMessage(index){

  const choice =
    prompt(
      "Choose:\n\n" +
      "1 = Read aloud\n" +
      "2 = Copy\n" +
      "3 = Delete\n" +
      "4 = Save"
    );

  if(choice === "1"){

    speak(
      messagesData[index].text
    );

  }else if(choice === "2"){

    copyMessage(index);

  }else if(choice === "3"){

    messagesData.splice(
      index,
      1
    );

    saveMessages();

    renderMessages();

    toast("Message deleted");

  }else if(choice === "4"){

    localStorage.setItem(
      "rg_saved_" + Date.now(),
      messagesData[index].text
    );

    toast("Saved");
  }
}

/* =====================================================
   READ ALOUD
===================================================== */

function speak(text){

  if(
    !("speechSynthesis" in window)
  ){

    toast(
      "Read aloud not supported"
    );

    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.rate = 1;

  speechSynthesis.speak(
    utterance
  );
}

/* =====================================================
   TOP MENU
===================================================== */

function toggleTopMenu(){

  document
    .getElementById("topMenu")
    .classList.toggle("open");
}

/* =====================================================
   SHARE CONVERSATION
===================================================== */

async function shareConversation(){

  const text =
    messagesData
      .map(message=>
        (
          message.role === "user"
            ? "You: "
            : "RG Creator AI: "
        ) +
        message.text
      )
      .join("\n\n");

  if(!text){

    toast(
      "No conversation to share"
    );

    return;
  }

  if(navigator.share){

    try{

      await navigator.share({

        title:chatName,

        text:text

      });

    }catch{}

  }else{

    await navigator.clipboard
      .writeText(text);

    toast(
      "Conversation copied"
    );
  }
}

/* =====================================================
   PIN
===================================================== */

function pinChat(){

  pinned =
    !pinned;

  localStorage.setItem(
    PIN_KEY,
    pinned
  );

  toast(
    pinned
      ? "Chat pinned"
      : "Chat unpinned"
  );
}

/* =====================================================
   RENAME
===================================================== */

function renameChat(){

  const name =
    prompt(
      "Enter chat name:",
      chatName
    );

  if(
    !name ||
    !name.trim()
  )
    return;

  chatName =
    name.trim();

  localStorage.setItem(
    CHAT_NAME_KEY,
    chatName
  );

  document
    .getElementById("chatTitle")
    .textContent =
    chatName;

  renderHistory();

  toast("Chat renamed");
}

/* =====================================================
   DOWNLOAD
===================================================== */

function downloadConversation(){

  const text =
    messagesData
      .map(message=>
        (
          message.role === "user"
            ? "You:\n"
            : "RG Creator AI:\n"
        ) +
        message.text
      )
      .join(
        "\n\n----------------\n\n"
      );

  const blob =
    new Blob(
      [text],
      {
        type:"text/plain"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href = url;

  a.download =
    "RG-Creator-AI-Chat.txt";

  a.click();

  URL.revokeObjectURL(
    url
  );

  toast(
    "Conversation downloaded"
  );
}

/* =====================================================
   DELETE
===================================================== */

function deleteConversation(){

/* =====================================================
   HISTORY
===================================================== */

function renderHistory(
  filter=""
){

  const history =
    document.getElementById(
      "history"
    );

  const matches =
    filter.toLowerCase();

  history.innerHTML = "";

  if(
    chatName
      .toLowerCase()
      .includes(matches)
  ){

    const title =
      document.createElement(
        "div"
      );

    title.className =
      "history-title";

    title.textContent =
      "Current";

    history.appendChild(
      title
    );

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "chat-history-item";

    item.innerHTML = `

      <div class="chat-name">
        ${escapeHTML(chatName)}
      </div>

      <button
        class="history-more"
        onclick="event.stopPropagation(); renameChat()"
      >
        ⋯
      </button>
    `;

    item.onclick =
      closeSidebar;

    history.appendChild(
      item
    );
  }
}

function searchChats(){

  const value =
    document
      .getElementById(
        "chatSearch"
      )
      .value;

  renderHistory(
    value
  );
}

/* =====================================================
   PROJECTS
===================================================== */

function saveProjects(){

  localStorage.setItem(
    PROJECT_KEY,
    JSON.stringify(
      projects

  );
}

function renderProjects(){

  const list =
    document.getElementById(
      "projectList"
    );

  list.innerHTML = "";

  projects.forEach(
    (project,index)=>{

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "project-item";

      item.innerHTML = `

        <span>
          📁
        </span>

        <span class="project-name">
          ${escapeHTML(
            project.name
          )}
        </span>

        <button
          class="project-delete"
          onclick="event.stopPropagation(); deleteProject(${index})"
          title="Delete project"

        </button>
      `;

      item.onclick =
        ()=>{
          openProject(
            index
          );
        };

      list.appendChild(
        item
      );
    }

}

function createProject(){

  const name =
    prompt(
      "Enter project name:"
    );

  if(
    !name ||
    !name.trim()
  )
    return;

  projects.push({

    name:
      name.trim(),

    created:
      Date.now(),

    notes:"",

    chats:[]

  });

  saveProjects();

  renderProjects();

  toast(
    "Project created"
  );
}

function openProject(index){

  const project =
    projects[index];

  if(!project)
    return;

  chatName =
    project.name;

  localStorage.setItem(
    CHAT_NAME_KEY,
    chatName
  );

  document
    .getElementById(
      "chatTitle"
    )
    .textContent =
    chatName;

  closeSidebar();

  toast(
    "Project opened"
  );
}

function deleteProject(index){

  if(
    !confirm(
      "Delete this project?"
    )
  )
    return;

  projects.splice(
    index,
    1
  );

  saveProjects();

  renderProjects();

  toast(
    "Project deleted"
  );
}

/* =====================================================
   VOICE
===================================================== */

function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){

    toast(
      "Voice input is not supported"
    );

    return;
  }

  const recognition =
    new Recognition();

  recognition.lang =
    "en-IN";

  recognition.interimResults =
    false;

  recognition.onstart =
    function(){

      toast(
        "Listening..."
      );
    };

  recognition.onresult =
    function(event){

      input.value =
        event.results[0][0]
          .transcript;

      autoResize();
    };

  recognition.onerror =
    function(){

      toast(
        "Voice input failed"
      );
    };

  recognition.start();
}

/* =====================================================
   INPUT
===================================================== */

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);

input.addEventListener(
  "input",
  autoResize
);

function autoResize(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";
}

/* =====================================================
   PROFILE / LOGIN
===================================================== */

function getProfile(){

  return JSON.parse(
    localStorage.getItem(
      "rg_profile"
    ) || "null"
  );
}

function saveProfileData(profile){

  localStorage.setItem(
    "rg_profile",
    JSON.stringify(
      profile
    )
  );
}

function loadProfile(){

  const profile =
    getProfile();

  const avatar =
    document.getElementById(
      "sidebarAvatar"
    );

  const name =
    document.getElementById(
      "sidebarProfileName"
    );

  const status =
    document.getElementById(
      "sidebarProfileStatus"
    );

  if(profile){

    if(profile.image){

      avatar.innerHTML = `
        <img
          src="${profile.image}"
          alt="Profile"
        >
      `;
    }else{

      avatar.textContent =
        (
          profile.name ||
          "U"
        )
        .charAt(0)
        .toUpperCase();
    }

    name.textContent =
      profile.name ||
      "User";

    status.textContent =
      profile.email ||
      "Account";

  }else{

    avatar.textContent =
      "👤";

    name.textContent =
      "Log in / Sign up";

    status.textContent =
      "Account";
  }
}

function openProfile(){

  const profile =
    getProfile();

  if(!profile){

    document
      .getElementById(
        "loginModal"
      )
      .classList.add(
        "show"
      );

    return;
  }

  document
    .getElementById(
      "profileModal"
    )
    .classList.add(
      "show"
    );

  document
    .getElementById(
      "profileNameInput"
    )
    .value =
    profile.name ||
    "";
}

function loginUser(){

  const name =
    document
      .getElementById(
        "loginName"
      )
      .value
      .trim();

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();

  if(!name){

    toast(
      "Enter your name"
    );

    return;
  }

  const profile = {

    name:name,

    email:email,

    image:""

  };

  saveProfileData(
    profile
  );

  closeModal(
    "loginModal"
  );

  loadProfile();

  toast(
    "Welcome to RG Creator AI"
  );
}

function saveProfile(){

  const profile =
    getProfile();

  if(!profile)
    return;

  profile.name =
    document
      .getElementById(
        "profileNameInput"
      )
      .value
      .trim() ||
    profile.name;

  saveProfileData(
    profile
  );

  loadProfile();

  closeModal(
    "profileModal"
  );

  toast(
    "Profile saved"
  );
}

/* =====================================================
   PROFILE IMAGE
===================================================== */

function changeProfileImage(inputFile){

  if(
    !inputFile.files.length
  )
    return;

  const file =
    inputFile.files[0];

  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    toast(
      "Select an image"
    );

    return;
  }

  const reader =
    new FileReader();

  reader.onload =
    function(){

      const profile =
        getProfile() || {

          name:"User",

          email:"",

          image:""
        };

      profile.image =
        reader.result;

      saveProfileData(
        profile
      );

      loadProfile();

      document
        .getElementById(
          "profileLarge"
        )
        .innerHTML = `
          <img
            src="${reader.result}"
            alt="Profile"
          >
        `;

      toast(
        "Profile photo updated"
      );
    };

  reader.readAsDataURL(
    file
  );
}

/* =====================================================
   LOGOUT
===================================================== */

function logoutUser(){

  localStorage.removeItem(
    "rg_profile"
  );

  closeModal(
    "profileModal"
  );

  loadProfile();

  toast(
    "Logged out"
  );
}

/* =====================================================
   OUTSIDE CLICK
===================================================== */

document.addEventListener(
  "click",
  function(event){

    const plus =
      document.querySelector(
        ".plus-wrap"
      );

    const plusMenu =
      document.getElementById(
        "plusMenu"
      );

    if(
      plusMenu.classList.contains(
        "open"
      ) &&
      !plus.contains(
        event.target
      )
    ){

      plusMenu.classList.remove(
        "open"
      );
    }

    const topMenu =
      document.getElementById(
        "topMenu"
      );

    if(
      topMenu.classList.contains(
        "open"
      ) &&
      !event.target.closest(
        ".header-right"
      ) &&
      !event.target.closest(
        ".more-menu"
      )
    ){

      topMenu.classList.remove(
        "open"
      );
    }

  }
);

/* =====================================================
   CLOSE MODAL BY BACKDROP
===================================================== */

document
  .querySelectorAll(
    ".modal-overlay"
  )
  .forEach(modal=>{

    modal.addEventListener(
      "click",
      function(event){

        if(
          event.target === modal
        ){

          modal.classList.remove(
            "show"
          );
        }
      }
    );

  });
