<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>AI Chat — RG Creator AI</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 58px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #1c1c1c;
      background: #000;
      position: relative;
      z-index: 20;
    }

    .top-left,
    .top-right {
      width: 44px;
      display: flex;
      align-items: center;
    }

    .top-right {
      justify-content: flex-end;
    }

    .top-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 60%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 16px;
      font-weight: 600;
    }

    .model-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
    }

    /* =========================
       ICON BUTTON
    ========================= */

    .icon-btn,
    .menu-btn,
    .more-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #d8d8d8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }

    .icon-btn:hover,
    .menu-btn:hover,
    .more-btn:hover {
      background: #151515;
    }

    .icon-btn:active,
    .menu-btn:active,
    .more-btn:active {
      transform: scale(0.95);
    }

    .icon-btn svg,
    .menu-btn svg,
    .more-btn svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       CHAT AREA
    ========================= */

    .chat-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 20px 14px 145px;
    }

    .chat-content {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      min-height: calc(100dvh - 210px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 10px;
    }

    .welcome-logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      border: 1px solid #292929;
      margin-bottom: 18px;
      font-size: 25px;
      font-weight: 800;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 38px);
      line-height: 1.15;
      font-weight: 700;
    }

    .welcome p {
      margin: 10px 0 0;
      color: #929292;
      font-size: 14px;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      width: 100%;
      margin: 0 0 22px;
      display: flex;
      flex-direction: column;
    }

    .message.user {
      align-items: flex-end;
    }

    .user-bubble {
      max-width: min(85%, 680px);
      background: #191919;
      border: 1px solid #292929;
      border-radius: 19px;
      padding: 11px 15px;
      color: #fff;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 6px;
      opacity: 0.85;
    }

    .message-action {
      min-width: 34px;
      height: 32px;
      border: 0;
      background: transparent;
      color: #858585;
      border-radius: 9px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
    }

    .message-action:hover {
      background: #151515;
      color: #fff;
    }

    .message-action svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       AI MESSAGE
    ========================= */

    .message.ai {
      align-items: flex-start;
    }

    .ai-content {
      width: 100%;
      color: #ededed;
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-content.error {
      color: #ff7070;
    }

    .ai-content.loading {
      color: #858585;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .typing span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #888;
      animation: blink 1.1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes blink {
      0%,
      70%,
      100% {
        opacity: 0.25;
      }

      35% {
        opacity: 1;
      }
    }

    /* =========================
       FILE PREVIEW
    ========================= */

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 10px;
    }

    .file-chip {
      max-width: 220px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: #111;
      border: 1px solid #292929;
      color: #ccc;
      font-size: 12px;
    }

    .file-chip .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       BOTTOM COMPOSER
    ========================= */

    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background:
        linear-gradient(
          to top,
          #000 72%,
          rgba(0, 0, 0, 0.94) 86%,
          rgba(0, 0, 0, 0)
        );
    }

    .composer {
      width: min(900px, 100%);
      margin: 0 auto;
      border: 1px solid #303030;
      background: #111;
      border-radius: 21px;
      padding: 8px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
    }

    .selected-files {
      display: none;
      padding: 4px 5px 6px;
    }

    .selected-files.show {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .selected-file {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 180px;
      padding: 6px 8px;
      background: #191919;
      border: 1px solid #292929;
      border-radius: 9px;
      font-size: 11px;
      color: #bbb;
    }

    .selected-file span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-file {
      width: 20px;
      height: 20px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #888;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    #prompt {
      flex: 1;
      min-width: 0;
      max-height: 130px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      padding: 11px 7px;
      font-size: 15px;
      line-height: 1.45;
    }

    #prompt::placeholder {
      color: #777;
    }

    .send-btn {
      color: #fff;
    }

    .send-btn.disabled {
      color: #555;
      pointer-events: none;
    }

    /* =========================
       DRAWER
    ========================= */

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 80;
      display: none;
    }

    .drawer-backdrop.show {
      display: block;
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(320px, 88vw);
      background: #0b0b0b;
      border-right: 1px solid #222;
      z-index: 90;
      transform: translateX(-105%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
    }

    .drawer.show {
      transform: translateX(0);
    }

    .drawer-head {
      height: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 16px;
      border-bottom: 1px solid #202020;
    }

    .drawer-title {
      font-weight: 700;
    }

    .new-chat-btn {
      margin: 14px;
      border: 1px solid #303030;
      background: #161616;
      color: #fff;
      border-radius: 12px;
      min-height: 44px;
      font-weight: 600;
    }

    .new-chat-btn:hover {
      background: #202020;
    }

    .search-box {
      margin: 0 14px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border: 1px solid #282828;
      background: #111;
      border-radius: 11px;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 20px;
    }

    .history-section {
      padding: 10px 9px 5px;
      color: #666;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 10px;
      border-radius: 10px;
      color: #ccc;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .history-item:hover {
      background: #151515;
    }

    .history-text {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-more {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #777;
    }

    .empty-history {
      padding: 25px 12px;
      color: #666;
      font-size: 13px;
      text-align: center;
    }

    /* =========================
       MORE MENU
    ========================= */

    .popup {
      position: fixed;
      right: 10px;
      top: 55px;
      width: 190px;
      padding: 6px;
      border: 1px solid #292929;
      background: #111;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.55);
      z-index: 100;
      display: none;
    }

    .popup.show {
      display: block;
    }

    .popup-item {
      width: 100%;
      min-height: 40px;
      border: 0;
      background: transparent;
      color: #ddd;
      text-align: left;
      padding: 0 11px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
    }

    .popup-item:hover {
      background: #1b1b1b;
    }

    /* =========================
       CAPABILITIES
    ========================= */

    .capabilities {
      position: fixed;
      left: 10px;
      bottom: 78px;
      width: min(330px, calc(100vw - 20px));
      padding: 12px;
      border: 1px solid #292929;
      background: #111;
      border-radius: 16px;
      z-index: 70;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.55);
      display: none;
    }

    .capabilities.show {
      display: block;
    }

    .cap-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .cap-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .cap-item {
      border: 1px solid #292929;
      background: #171717;
      color: #ddd;
      border-radius: 11px;
      padding: 11px 9px;
      text-align: left;
      font-size: 12px;
    }

    .cap-item:hover {
      background: #202020;
    }

    /* =========================
       LIMIT
    ========================= */

    .limit-text {
      text-align: center;
      color: #555;
      font-size: 10px;
      margin-top: 5px;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      transform: translate(-50%, 20px);
      background: #1a1a1a;
      border: 1px solid #303030;
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {
      .chat-area {
        padding-left: 24px;
        padding-right: 24px;
      }

      .composer-wrap {
        padding-left: 24px;
        padding-right: 24px;
      }

      .user-bubble {
        max-width: 70%;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

      <div class="top-left">
        <button
          id="menuButton"
          class="menu-btn"
          aria-label="Menu"
          title="Chat history"
        >
          <svg viewBox="0 0 24 24">
            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>
          </svg>
        </button>
      </div>

      <div class="top-title">
        <span class="model-dot"></span>
        <span>RG Creator AI</span>
      </div>

      <div class="top-right">
        <button
          id="moreButton"
          class="more-btn"
          aria-label="More"
          title="More"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="5" cy="12" r="1.2"></circle>
            <circle cx="12" cy="12" r="1.2"></circle>
            <circle cx="19" cy="12" r="1.2"></circle>
          </svg>
        </button>
      </div>

    </header>


    <!-- =========================
         CHAT
    ========================= -->

    <main id="chatArea" class="chat-area">

      <div id="chatContent" class="chat-content">

        <section id="welcome" class="welcome">

          <div class="welcome-logo">
            RG
          </div>

          <h1>How can I help you?</h1>

          <p>
            Chat, create, write, code and explore with RG Creator AI.
          </p>

        </section>

      </div>

    </main>


    <!-- =========================
         COMPOSER
    ========================= -->

    <div class="composer-wrap">

      <div class="composer">

        <div
          id="selectedFiles"
          class="selected-files"
        ></div>

        <div class="composer-row">

          <!-- ATTACH -->

          <button
            id="attachButton"
            class="icon-btn"
            aria-label="Add file"
            data-label="Add file"
            title="Attach files"
          >
            <svg viewBox="0 0 24 24">
              <path d="M21.4 11.6l-8.9 8.9a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.6-8.6"></path>
            </svg>
          </button>

          <input
            type="file"
            id="fileInput"
            multiple
            hidden
            accept="
              image/*,
              video/*,
              application/pdf,
              text/plain,
              application/msword,
              application/vnd.openxmlformats-officedocument.wordprocessingml.document
            "
          />


          <!-- CAPABILITIES -->

          <button
            id="capabilityButton"
            class="icon-btn"
            aria-label="Capabilities"
            data-label="Capabilities"
            title="Capabilities"
          >
            <svg viewBox="0 0 24 24">
              <rect x="4" y="4" width="6" height="6"></rect>
              <rect x="14" y="4" width="6" height="6"></rect>
              <rect x="4" y="14" width="6" height="6"></rect>
              <rect x="14" y="14" width="6" height="6"></rect>
            </svg>
          </button>


          <!-- TEXT -->

          <textarea
            id="prompt"
            rows="1"
            placeholder="Message RG Creator AI..."
            autocomplete="off"
          ></textarea>


          <!-- VOICE -->

          <button
            id="voiceButton"
            class="icon-btn"
            aria-label="Voice"
            data-label="Voice"
            title="Voice input"
          >
            <svg viewBox="0 0 24 24">
              <rect
                x="9"
                y="3"
                width="6"
                height="12"
                rx="3"
              ></rect>

              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
            </svg>
          </button>


          <!-- SEND -->

          <button
            id="sendButton"
            class="icon-btn send-btn disabled"
            aria-label="Send"
            data-label="Send"
            title="Send"
          >
            <svg viewBox="0 0 24 24">
              <path d="M5 12h13"></path>
              <path d="M13 6l6 6-6 6"></path>
            </svg>
          </button>

        </div>

      </div>

      <div class="limit-text">
        Free usage • 20 chat messages per day
      </div>

    </div>


    <!-- =========================
         SIDEBAR / HISTORY
    ========================= -->

    <div
      id="drawerBackdrop"
      class="drawer-backdrop"
    ></div>

    <aside
      id="drawer"
      class="drawer"
    >

      <div class="drawer-head">

        <div class="drawer-title">
          Chats
        </div>

        <button
          id="closeDrawer"
          class="icon-btn"
          aria-label="Close"
        >
          <svg viewBox="0 0 24 24">
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path>
          </svg>
        </button>

      </div>


      <button
        id="newChatButton"
        class="new-chat-btn"
      >
        ＋ New Chat
      </button>


      <div class="search-box">

        <svg
          viewBox="0 0 24 24"
          width="17"
          height="17"
          fill="none"
          stroke="#777"
          stroke-width="1.8"
        >
          <circle cx="11" cy="11" r="6"></circle>
          <path d="M16 16l5 5"></path>
        </svg>

        <input
          id="historySearch"
          type="text"
          placeholder="Search chats"
        />

      </div>


      <div id="history" class="history">
        <div class="empty-history">
          No previous chats yet.
        </div>
      </div>

    </aside>


    <!-- =========================
         MORE POPUP
    ========================= -->

    <div
      id="morePopup"
      class="popup"
    >

      <button
        class="popup-item"
        data-action="new"
      >
        ＋ New Chat
      </button>

      <button
        class="popup-item"
        data-action="clear"
      >
        Clear current chat
      </button>

      <button
        class="popup-item"
        data-action="export"
      >
        Export chat
      </button>

    </div>


    <!-- =========================
         CAPABILITIES POPUP
    ========================= -->

    <div
      id="capabilities"
      class="capabilities"
    >

      <div class="cap-title">
        What can I help you create?
      </div>

      <div class="cap-grid">

        <button class="cap-item">
          ✍️ Content Writer
        </button>

        <button class="cap-item">
          💻 Code Generator
        </button>

        <button class="cap-item">
          🖼️ AI Image
        </button>

        <button class="cap-item">
          ▶️ YouTube Tools
        </button>

        <button class="cap-item">
          📸 Instagram Tools
        </button>

        <button class="cap-item">
          💬 AI Chat
        </button>

      </div>

    </div>


    <!-- =========================
         TOAST
    ========================= -->

    <div
      id="toast"
      class="toast"
    ></div>

  </div>


  <script>
    /* =========================================================
       RG CREATOR AI — CHAT
       Gemini endpoint: /api/chat
    ========================================================= */

    const API_URL = "/api/chat";

    /*
      Locked daily chat limit.
      This frontend counter is for the current no-login version.
      Real secure server-side limits can be added later.
    */
    const DAILY_CHAT_LIMIT = 20;


    /* =========================
       ELEMENTS
    ========================= */

    const chatArea = document.getElementById("chatArea");
    const chatContent = document.getElementById("chatContent");
    const welcome = document.getElementById("welcome");

    const prompt = document.getElementById("prompt");
    const sendButton = document.getElementById("sendButton");

    const attachButton = document.getElementById("attachButton");
    const fileInput = document.getElementById("fileInput");
    const selectedFiles = document.getElementById("selectedFiles");

    const voiceButton = document.getElementById("voiceButton");

    const menuButton = document.getElementById("menuButton");
    const drawer = document.getElementById("drawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const closeDrawer = document.getElementById("closeDrawer");

    const newChatButton = document.getElementById("newChatButton");

    const moreButton = document.getElementById("moreButton");
    const morePopup = document.getElementById("morePopup");

    const capabilityButton =
      document.getElementById("capabilityButton");

    const capabilities =
      document.getElementById("capabilities");

    const history =
      document.getElementById("history");

    const historySearch =
      document.getElementById("historySearch");

    const toast =
      document.getElementById("toast");


    /* =========================
       STATE
    ========================= */

    let selectedFileList = [];

    let currentChat = [];

    let sending = false;

    let recognition = null;


    /* =========================
       DAILY LIMIT
    ========================= */

    function getTodayKey() {
      const now = new Date();

      return [
        now.getFullYear(),
        now.getMonth() + 1,
        now.getDate()
      ].join("-");
    }


    function getUsage() {
      const key = "rg_creator_ai_chat_usage";

      try {
        const saved =
          JSON.parse(localStorage.getItem(key) || "{}");

        if (saved.date !== getTodayKey()) {
          return {
            date: getTodayKey(),
            count: 0
          };
        }

        return saved;

      } catch {
        return {
          date: getTodayKey(),
          count: 0
        };
      }
    }


    function saveUsage(count) {
      localStorage.setItem(
        "rg_creator_ai_chat_usage",
        JSON.stringify({
          date: getTodayKey(),
          count
        })
      );
    }


    function remainingChats() {
      const usage = getUsage();

      return Math.max(
        0,
        DAILY_CHAT_LIMIT - usage.count
      );
    }


    /* =========================
       TOAST
    ========================= */

    let toastTimer;

    function showToast(message) {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }


    /* =========================
       TEXTAREA
    ========================= */

    function resizePrompt() {
      prompt.style.height = "auto";

      prompt.style.height =
        Math.min(prompt.scrollHeight, 130) + "px";
    }


    function updateSendButton() {
      const hasText =
        prompt.value.trim().length > 0;

      if (hasText && !sending) {
        sendButton.classList.remove("disabled");
      } else {
        sendButton.classList.add("disabled");
      }
    }


    prompt.addEventListener("input", () => {
      resizePrompt();
      updateSendButton();
    });


    prompt.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        sendMessage();
      }
    });


    /* =========================
       FILE ATTACHMENT
    ========================= */

    attachButton.addEventListener("click", () => {
      fileInput.click();
    });


    fileInput.addEventListener("change", () => {

      selectedFileList =
        Array.from(fileInput.files || []);

      renderSelectedFiles();

    });


    function renderSelectedFiles() {

      selectedFiles.innerHTML = "";

      if (!selectedFileList.length) {
        selectedFiles.classList.remove("show");
        return;
      }

      selectedFiles.classList.add("show");

      selectedFileList.forEach((file, index) => {

        const item =
          document.createElement("div");

        item.className = "selected-file";

        const name =
          document.createElement("span");

        name.textContent = file.name;

        const remove =
          document.createElement("button");

        remove.className = "remove-file";
        remove.textContent = "×";
        remove.setAttribute(
          "aria-label",
          "Remove file"
        );

        remove.addEventListener("click", () => {

          selectedFileList.splice(index, 1);

          renderSelectedFiles();

        });

        item.appendChild(name);
        item.appendChild(remove);

        selectedFiles.appendChild(item);

      });
    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addUserMessage(text, files = []) {

      if (welcome) {
        welcome.remove();
      }

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message user";

      if (files.length) {

        const attachments =
          document.createElement("div");

        attachments.className =
          "attachments";

        files.forEach(file => {

          const chip =
            document.createElement("div");

          chip.className =
            "file-chip";

          chip.innerHTML =
            `
              <span>📎</span>
              <span class="file-name"></span>
            `;

          chip.querySelector(".file-name")
            .textContent = file.name;

          attachments.appendChild(chip);

        });

        wrapper.appendChild(attachments);
      }


      const bubble =
        document.createElement("div");

      bubble.className =
        "user-bubble";

      bubble.textContent = text;

      wrapper.appendChild(bubble);


      const actions =
        document.createElement("div");

      actions.className =
        "message-actions";

      const copy =
        createActionButton(
          "Copy",
          "copy",
          () => copyText(text)
        );

      const edit =
        createActionButton(
          "Edit",
          "edit",
          () => {
            prompt.value = text;
            resizePrompt();
            updateSendButton();
            prompt.focus();
          }
        );

      actions.appendChild(copy);
      actions.appendChild(edit);

      wrapper.appendChild(actions);

      chatContent.appendChild(wrapper);

      scrollToBottom();
    }


    /* =========================
       ADD AI MESSAGE
    ========================= */

    function addAIMessage(text, isError = false) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message ai";

      const content =
        document.createElement("div");

      content.className =
        "ai-content" +
        (isError ? " error" : "");

      content.textContent = text;

      wrapper.appendChild(content);


      const actions =
        document.createElement("div");

      actions.className =
        "message-actions";


      actions.appendChild(
        createActionButton(
          "Copy",
          "copy",
          () => copyText(text)
        )
      );


      actions.appendChild(
        createActionButton(
          "Like",
          "like",
          () => showToast("Thanks for the feedback!")
        )
      );


      actions.appendChild(
        createActionButton(
          "Unlike",
          "unlike",
          () => showToast("Thanks for the feedback!")
        )
      );


      actions.appendChild(
        createActionButton(
          "Share",
          "share",
          () => shareText(text)
        )
      );


      actions.appendChild(
        createActionButton(
          "Regenerate",
          "regenerate",
          () => regenerateLast()
        )
      );


      actions.appendChild(
        createActionButton(
          "More",
          "more",
          () => showAIOptions(text)
        )
      );


      wrapper.appendChild(actions);

      chatContent.appendChild(wrapper);

      scrollToBottom();

      return wrapper;
    }


    function addLoadingMessage() {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message ai";

      wrapper.id =
        "loadingMessage";

      const content =
        document.createElement("div");

      content.className =
        "ai-content loading";

      content.innerHTML =
        `
          <span class="typing">
            <span></span>
            <span></span>
            <span></span>
          </span>
        `;

      wrapper.appendChild(content);

      chatContent.appendChild(wrapper);

      scrollToBottom();

      return wrapper;
    }


    /* =========================
       ACTION BUTTON
    ========================= */

    function createActionButton(
      label,
      type,
      callback
    ) {

      const button =
        document.createElement("button");

      button.className =
        "message-action";

      button.title = label;

      button.setAttribute(
        "aria-label",
        label
      );

      const icons = {
        copy:
          "M9 9h10v10H9z M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1",

        edit:
          "M4 20h4L19 9l-4-4L4 16v4z",

        like:
          "M7 10v10 M4 10h3 M10 10l2-6c.2-.6.8-1 1.4-1h.1c.8 0 1.5.7 1.5 1.5V7h4c1.2 0 2 1.1 1.7 2.2l-1.4 7A2.3 2.3 0 0117 18h-7z",

        unlike:
          "M7 14V4 M4 14h3 M10 14l2 6c.2.6.8 1 1.4 1h.1c.8 0 1.5-.7 1.5-1.5V17h4c1.2 0 2-1.1 1.7-2.2l-1.4-7A2.3 2.3 0 0017 6h-7z",

        share:
          "M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7 M12 16V3 M7 8l5-5 5 5",

        regenerate:
          "M20 11a8 8 0 10-2.3 5.6 M20 5v6h-6",

        more:
          "M5 12h.01 M12 12h.01 M19 12h.01"
      };


      const svg =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg"
        );

      svg.setAttribute(
        "viewBox",
        "0 0 24 24"
      );

      const path =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      path.setAttribute(
        "d",
        icons[type] || icons.more
      );

      svg.appendChild(path);

      button.appendChild(svg);

      button.addEventListener(
        "click",
        callback
      );

      return button;
    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      if (sending) return;

      const message =
        prompt.value.trim();

      if (!message) return;


      /* Daily limit */

      if (remainingChats() <= 0) {

        showToast(
          "Today's 20 free chat limit is reached."
        );

        return;
      }


      sending = true;

      updateSendButton();


      const filesForMessage =
        [...selectedFileList];


      addUserMessage(
        message,
        filesForMessage
      );


      currentChat.push({
        role: "user",
        text: message
      });


      prompt.value = "";

      resizePrompt();

      renderSelectedFiles();


      const loading =
        addLoadingMessage();


      try {

        /*
          Current backend accepts:
          POST /api/chat
          {
            "message": "..."
          }

          File/video analysis will be connected
          to a dedicated multimodal backend next.
        */

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message
              })
            }
          );


        let data = null;

        try {
          data = await response.json();
        } catch {
          data = null;
        }


        loading.remove();


        if (!response.ok || !data?.ok) {

          const error =
            data?.error ||
            "Something went wrong.";

          addAIMessage(
            error,
            true
          );

          return;
        }


        const reply =
          typeof data.reply === "string"
            ? data.reply.trim()
            : "";


        if (!reply) {

          addAIMessage(
            "Gemini returned an empty response.",
            true
          );

          return;
        }


        addAIMessage(reply);


        currentChat.push({
          role: "assistant",
          text: reply
        });


        /* Count successful chat */

        const usage =
          getUsage();

        saveUsage(
          usage.count + 1
        );


        saveCurrentChat();

      } catch (error) {

        loading.remove();

        console.error(error);

        addAIMessage(
          "Unable to connect to RG Creator AI. Please try again.",
          true
        );

      } finally {

        sending = false;

        updateSendButton();

      }
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =========================
       COPY
    ========================= */

    async function copyText(text) {

      try {

        await navigator.clipboard.writeText(
          text
        );

        showToast("Copied");

      } catch {

        showToast(
          "Copy is not available."
        );
      }
    }


    /* =========================
       SHARE
    ========================= */

    async function shareText(text) {

      if (
        navigator.share
      ) {

        try {

          await navigator.share({
            title: "RG Creator AI",
            text
          });

        } catch {}

      } else {

        await copyText(text);

      }
    }


    /* =========================
       AI MORE OPTIONS
    ========================= */

    function showAIOptions(text) {

      const action =
        window.prompt(
          "Enter option:\n\n" +
          "1 = Copy\n" +
          "2 = Read aloud\n" +
          "3 = Share\n" +
          "4 = Delete"
        );


      if (action === "1") {
        copyText(text);
      }

      if (action === "2") {
        speakText(text);
      }

      if (action === "3") {
        shareText(text);
      }

      if (action === "4") {
        const messages =
          document.querySelectorAll(
            ".message.ai"
          );

        const last =
          messages[messages.length - 1];

        if (last) {
          last.remove();
        }
      }
    }


    /* =========================
       READ ALOUD
    ========================= */

    function speakText(text) {

      if (
        !("speechSynthesis" in window)
      ) {

        showToast(
          "Read aloud is not supported."
        );

        return;
      }

      window.speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          text
        );

      utterance.rate = 1;

      window.speechSynthesis.speak(
        utterance
      );
    }


    /* =========================
       REGENERATE
    ========================= */

    async function regenerateLast() {

      const lastUser =
        [...currentChat]
          .reverse()
          .find(
            item =>
              item.role === "user"
          );

      if (!lastUser) {

        showToast(
          "Nothing to regenerate."
        );

        return;
      }


      if (remainingChats() <= 0) {

        showToast(
          "Today's free chat limit is reached."
        );

        return;
      }


      prompt.value =
        lastUser.text;

      await sendMessage();

    }


    /* =========================
       VOICE
    ========================= */

    voiceButton.addEventListener(
      "click",
      startVoice
    );


    function startVoice() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        showToast(
          "Voice input is not supported in this browser."
        );

        return;
      }


      if (recognition) {

        recognition.stop();

        recognition = null;

        return;
      }


      recognition =
        new SpeechRecognition();

      recognition.lang =
        "en-IN";

      recognition.interimResults =
        true;

      recognition.continuous =
        false;


      voiceButton.style.color =
        "#ff3b30";


      recognition.onresult =
        event => {

          let result = "";

          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            result +=
              event.results[i][0].transcript;

          }

          prompt.value = result;

          resizePrompt();

          updateSendButton();

        };


      recognition.onerror =
        () => {

          showToast(
            "Voice input failed."
          );

        };


      recognition.onend =
        () => {

          recognition = null;

          voiceButton.style.color =
            "";

        };


      recognition.start();

    }


    /* =========================
       DRAWER
    ========================= */

    function openDrawer() {

      drawer.classList.add("show");

      drawerBackdrop.classList.add(
        "show"
      );

      renderHistory();

    }


    function closeHistoryDrawer() {

      drawer.classList.remove(
        "show"
      );

      drawerBackdrop.classList.remove(
        "show"
      );

    }


    menuButton.addEventListener(
      "click",
      openDrawer
    );


    closeDrawer.addEventListener(
      "click",
      closeHistoryDrawer
    );


    drawerBackdrop.addEventListener(
      "click",
      closeHistoryDrawer
    );


    /* =========================
       NEW CHAT
    ========================= */

    newChatButton.addEventListener(
      "click",
      newChat
    );


    function newChat() {

      currentChat = [];

      chatContent.innerHTML = "";

      const section =
        document.createElement("section");

      section.id = "welcome";

      section.className = "welcome";

      section.innerHTML =
        `
          <div class="welcome-logo">
            RG
          </div>

          <h1>How can I help you?</h1>

          <p>
            Chat, create, write, code and explore with RG Creator AI.
          </p>
        `;

      chatContent.appendChild(
        section
      );

      prompt.value = "";

      selectedFileList = [];

      renderSelectedFiles();

      resizePrompt();

      updateSendButton();

      closeHistoryDrawer();

      showToast("New chat started");

    }


    /* =========================
       MORE BUTTON
    ========================= */

    moreButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        capabilities.classList.remove(
          "show"
        );

        morePopup.classList.toggle(
          "show"
        );

      }
    );


    document.querySelectorAll(
      ".popup-item"
    ).forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const action =
            button.dataset.action;


          if (action === "new") {
            newChat();
          }


          if (action === "clear") {
            clearCurrentChat();
          }


          if (action === "export") {
            exportChat();
          }


          morePopup.classList.remove(
            "show"
          );

        }
      );

    });


    /* =========================
       CAPABILITIES
    ========================= */

    capabilityButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        morePopup.classList.remove(
          "show"
        );

        capabilities.classList.toggle(
          "show"
        );

      }
    );


    document.querySelectorAll(
      ".cap-item"
    ).forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const text =
            button.textContent
              .replace(/[^\w\s]/g, "")
              .trim();

          prompt.value =
            "Help me with " + text;

          resizePrompt();

          updateSendButton();

          capabilities.classList.remove(
            "show"
          );

          prompt.focus();

        }
      );

    });


    document.addEventListener(
      "click",
      () => {

        morePopup.classList.remove(
          "show"
        );

        capabilities.classList.remove(
          "show"
        );

      }
    );


    /* =========================
       CHAT STORAGE
    ========================= */

    function saveCurrentChat() {

      if (!currentChat.length) return;

      try {

        localStorage.setItem(
          "rg_creator_ai_current_chat",
          JSON.stringify(
            currentChat
          )
        );

      } catch {}

    }


    function loadCurrentChat() {

      try {

        const saved =
          JSON.parse(
            localStorage.getItem(
              "rg_creator_ai_current_chat"
            ) || "[]"
          );


        if (
          !Array.isArray(saved) ||
          !saved.length
        ) {
          return;
        }


        if (welcome) {
          welcome.remove();
        }


        currentChat = saved;


        saved.forEach(item => {

          if (item.role === "user") {

            addUserMessage(
              item.text
            );

          } else {

            addAIMessage(
              item.text
            );

          }

        });

      } catch {}

    }


    /* =========================
       HISTORY
    ========================= */

    function renderHistory() {

      history.innerHTML = "";


      const saved =
        localStorage.getItem(
          "rg_creator_ai_current_chat"
        );


      if (!saved) {

        history.innerHTML =
          `
            <div class="empty-history">
              No previous chats yet.
            </div>
          `;

        return;
      }


      let data = [];

      try {
        data = JSON.parse(saved);
      } catch {}


      const firstUser =
        data.find(
          item =>
            item.role === "user"
        );


      if (!firstUser) {

        history.innerHTML =
          `
            <div class="empty-history">
              No previous chats yet.
            </div>
          `;

        return;
      }


      const section =
        document.createElement("div");

      section.className =
        "history-section";

      section.textContent =
        "Recent";

      history.appendChild(section);


      const item =
        document.createElement("div");

      item.className =
        "history-item";


      const text =
        document.createElement("div");

      text.className =
        "history-text";

      text.textContent =
        firstUser.text;


      const more =
        document.createElement("button");

      more.className =
        "history-more";

      more.textContent =
        "⋯";


      item.appendChild(text);

      item.appendChild(more);

      history.appendChild(item);


      item.addEventListener(
        "click",
        () => {

          closeHistoryDrawer();

        }
      );

    }


    historySearch.addEventListener(
      "input",
      () => {

        const query =
          historySearch.value
            .trim()
            .toLowerCase();


        const items =
          document.querySelectorAll(
            ".history-item"
          );


        items.forEach(item => {

          item.style.display =
            item.textContent
              .toLowerCase()
              .includes(query)
              ? "flex"
              : "none";

        });

      }
    );


    /* =========================
       CLEAR CHAT
    ========================= */

    function clearCurrentChat() {

      localStorage.removeItem(
        "rg_creator_ai_current_chat"
      );

      newChat();

      showToast(
        "Chat cleared"
      );

    }


    /* =========================
       EXPORT CHAT
    ========================= */

    function exportChat() {

      if (!currentChat.length) {

        showToast(
          "No chat to export."
        );

        return;
      }


      const text =
        currentChat
          .map(item => {

            const role =
              item.role === "user"
                ? "You"
                : "RG Creator AI";

            return (
              role +
              ":\n" +
              item.text
            );

          })
          .join("\n\n");


      const blob =
        new Blob(
          [text],
          {
            type:
              "text/plain;charset=utf-8"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");

      a.href = url;

      a.download =
        "RG-Creator-AI-Chat.txt";

      a.click();


      URL.revokeObjectURL(url);

      showToast(
        "Chat exported"
      );

    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

      requestAnimationFrame(() => {

        chatArea.scrollTo({
          top: chatArea.scrollHeight,
          behavior: "smooth"
        });

      });

    }


    /* =========================
       INIT
    ========================= */

    resizePrompt();

    updateSendButton();

    loadCurrentChat();

  </script>

</body>
</html>
