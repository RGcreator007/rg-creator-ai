<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>RG Creator AI — Chat</title>
  <meta
    name="description"
    content="RG Creator AI — AI chat for creators, productivity and everyday work."
  />

  <style>
    /* =========================================================
       RG CREATOR AI
       CHAT FRONTEND
       ========================================================= */

    @font-face {
      font-family: "Söhne";
      src: local("Söhne");
      font-display: swap;
    }

    @font-face {
      font-family: "Söhne Mono";
      src: local("Söhne Mono");
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --sidebar: #090909;
      --surface: #111111;
      --card: #171717;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #a0a0a0;
      --muted2: #6f6f6f;
      --accent: #00e5ff;
      --danger: #ff4d4d;
      --success: #22c55e;

      --font-main:
        "Söhne",
        Inter,
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;

      --font-mono:
        "Söhne Mono",
        Consolas,
        Monaco,
        monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =========================================================
       APP
       ========================================================= */

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      background: var(--bg);
    }

    /* =========================================================
       SIDEBAR
       ========================================================= */

    .sidebar {
      width: 280px;
      height: 100%;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .sidebar-top {
      padding: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      object-fit: cover;
      background: #111;
      border: 1px solid var(--border);
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.08);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 650;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted2);
      font-size: 11px;
      white-space: nowrap;
    }

    .new-chat-btn,
    .search-btn {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 13px;
      border-radius: 11px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      margin-bottom: 9px;
      transition: 0.2s ease;
    }

    .new-chat-btn:hover,
    .search-btn:hover {
      background: var(--card);
      border-color: #3a3a3a;
    }

    .new-chat-btn .plus {
      font-size: 21px;
      color: var(--accent);
      line-height: 1;
    }

    .search-icon {
      color: var(--muted);
      font-size: 18px;
    }

    .sidebar-section {
      padding: 4px 10px;
    }

    .sidebar-label {
      color: var(--muted2);
      font-size: 11px;
      padding: 9px 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .menu-item {
      width: 100%;
      height: 42px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 10px;
      color: #d8d8d8;
      background: transparent;
      text-align: left;
      margin-bottom: 2px;
      transition: 0.2s ease;
    }

    .menu-item:hover,
    .menu-item.active {
      background: #171717;
      color: #fff;
    }

    .menu-item.active {
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .menu-icon {
      width: 20px;
      text-align: center;
      color: var(--muted);
    }

    .menu-item.active .menu-icon {
      color: var(--accent);
    }

    .history {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 5px 10px;
    }

    .history-group {
      margin-bottom: 16px;
    }

    .history-title {
      color: var(--muted2);
      font-size: 11px;
      padding: 7px 8px;
    }

    .history-item {
      width: 100%;
      min-height: 39px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      color: #cfcfcf;
      background: transparent;
      text-align: left;
      font-size: 13px;
      transition: 0.2s;
    }

    .history-item:hover {
      background: #151515;
    }

    .history-item span:first-child {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .history-more {
      color: var(--muted2);
      font-size: 16px;
      flex-shrink: 0;
    }

    .sidebar-bottom {
      padding: 10px;
      border-top: 1px solid var(--border);
    }

    /* =========================================================
       MAIN
       ========================================================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(14px);
      z-index: 20;
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mobile-menu-btn {
      display: none;
    }

    .top-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .top-brand-logo {
      width: 29px;
      height: 29px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .top-brand-name {
      font-size: 14px;
      font-weight: 600;
    }

    .model-button {
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      color: #dcdcdc;
      background: transparent;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .model-button:hover {
      background: var(--card);
      border-color: var(--border);
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #bdbdbd;
      background: transparent;
      font-size: 19px;
      transition: 0.2s;
    }

    .icon-button:hover {
      color: #fff;
      background: #171717;
    }

    /* =========================================================
       CHAT
       ========================================================= */

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 30px 18px 180px;
    }

    .chat-container {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .welcome {
      min-height: calc(100dvh - 260px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 15px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 18px;
      box-shadow:
        0 0 25px rgba(0, 229, 255, 0.08),
        0 0 60px rgba(0, 229, 255, 0.04);
    }

    .welcome h1 {
      font-size: clamp(27px, 5vw, 38px);
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .welcome p {
      color: var(--muted);
      margin-top: 9px;
      max-width: 550px;
      line-height: 1.6;
      font-size: 14px;
    }

    .suggestions {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 28px;
    }

    .suggestion {
      min-height: 72px;
      padding: 13px;
      text-align: left;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: #0b0b0b;
      color: #ddd;
      transition: 0.2s;
    }

    .suggestion:hover {
      border-color: rgba(0, 229, 255, 0.4);
      background: #111;
      transform: translateY(-1px);
    }

    .suggestion-title {
      font-size: 13px;
      font-weight: 600;
    }

    .suggestion-text {
      color: var(--muted2);
      font-size: 11px;
      margin-top: 5px;
      line-height: 1.4;
    }

    /* =========================================================
       MESSAGES
       ========================================================= */

    .message {
      width: 100%;
      display: flex;
      margin-bottom: 28px;
      animation: messageIn 0.2s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .user-content {
      max-width: min(78%, 700px);
    }

    .user-bubble {
      display: inline-block;
      padding: 11px 14px;
      background: #191919;
      border: 1px solid #292929;
      border-radius: 17px;
      border-bottom-right-radius: 5px;
      color: #f2f2f2;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ai-content {
      width: 100%;
      max-width: 800px;
    }

    .ai-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .ai-mini-logo {
      width: 25px;
      height: 25px;
      border-radius: 7px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .ai-name {
      color: #d8d8d8;
      font-size: 12px;
      font-weight: 600;
    }

    .ai-response {
      color: #eeeeee;
      line-height: 1.72;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .ai-response p {
      margin-bottom: 12px;
    }

    .ai-response p:last-child {
      margin-bottom: 0;
    }

    .ai-response h1,
    .ai-response h2,
    .ai-response h3 {
      margin: 18px 0 9px;
      line-height: 1.3;
    }

    .ai-response ul,
    .ai-response ol {
      margin: 8px 0 13px 22px;
    }

    .ai-response li {
      margin: 5px 0;
    }

    .ai-response a {
      color: var(--accent);
    }

    .inline-code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: #151515;
      border: 1px solid var(--border);
      padding: 2px 5px;
      border-radius: 5px;
    }

    .code-wrapper {
      margin: 14px 0;
      border: 1px solid var(--border);
      border-radius: 11px;
      overflow: hidden;
      background: #080808;
    }

    .code-header {
      height: 38px;
      padding: 0 10px 0 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .code-copy {
      color: #ccc;
      background: transparent;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
    }

    .code-copy:hover {
      background: #181818;
      color: #fff;
    }

    .code-wrapper pre {
      padding: 14px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.65;
      color: #e7e7e7;
      white-space: pre;
    }

    .message-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 8px;
    }

    .message-action {
      width: 31px;
      height: 30px;
      border-radius: 7px;
      background: transparent;
      color: #777;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.18s;
    }

    .message-action:hover {
      color: #ddd;
      background: #151515;
    }

    .message-action.active {
      color: var(--accent);
    }

    /* =========================================================
       TYPING
       ========================================================= */

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 8px 0;
    }

    .typing span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #aaa;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================================================
       INPUT
       ========================================================= */

    .composer-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 18px max(14px, env(safe-area-inset-bottom));
      background:
        linear-gradient(
          to top,
          #000 68%,
          rgba(0, 0, 0, 0.88) 82%,
          transparent
        );
      z-index: 30;
    }

    .composer-container {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .attachments-preview {
      display: none;
      gap: 8px;
      margin-bottom: 8px;
      overflow-x: auto;
    }

    .attachments-preview.show {
      display: flex;
    }

    .attachment-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 220px;
      padding: 7px 9px;
      background: #141414;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 11px;
      color: #ccc;
    }

    .attachment-chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-remove {
      color: #888;
      background: transparent;
      font-size: 14px;
    }

    .composer {
      min-height: 58px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 9px 8px 11px;
      background: #111;
      border: 1px solid #303030;
      border-radius: 17px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s;
    }

    .composer:focus-within {
      border-color: #3b3b3b;
    }

    .composer textarea {
      flex: 1;
      min-width: 0;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      line-height: 1.5;
      font-size: 14px;
      padding: 8px 3px;
    }

    .composer textarea::placeholder {
      color: #707070;
    }

    .composer-tools {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .composer-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b8b8b;
      background: transparent;
      font-size: 18px;
    }

    .composer-btn:hover {
      color: #fff;
      background: #1c1c1c;
    }

    .send-btn {
      color: #000;
      background: var(--accent);
      font-size: 17px;
    }

    .send-btn:hover {
      color: #000;
      background: #42edff;
    }

    .stop-btn {
      color: #fff;
      background: #292929;
      display: none;
    }

    .stop-btn.show {
      display: flex;
    }

    .send-btn.hide {
      display: none;
    }

    .composer-footer {
      text-align: center;
      color: #555;
      font-size: 10px;
      margin-top: 7px;
    }

    /* =========================================================
       FILE INPUT
       ========================================================= */

    #fileInput {
      display: none;
    }

    /* =========================================================
       MOBILE OVERLAY
       ========================================================= */

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 90;
    }

    /* =========================================================
       TOAST
       ========================================================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      z-index: 500;
      padding: 10px 14px;
      background: #191919;
      border: 1px solid #333;
      border-radius: 9px;
      color: #eee;
      font-size: 12px;
      transition: 0.25s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 850px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 15px 0 50px rgba(0, 0, 0, 0.45);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.show {
        display: block;
      }

      .mobile-menu-btn {
        display: inline-flex;
      }

      .topbar {
        padding: 0 10px;
      }

      .chat-scroll {
        padding-left: 12px;
        padding-right: 12px;
        padding-top: 20px;
      }

      .composer-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      .user-content {
        max-width: 88%;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .top-brand-name {
        display: none;
      }

      .model-button {
        font-size: 12px;
      }

      .welcome {
        min-height: calc(100dvh - 220px);
      }

      .welcome-logo {
        width: 62px;
        height: 62px;
        border-radius: 17px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .welcome p {
        font-size: 13px;
      }

      .user-bubble {
        font-size: 13px;
      }

      .ai-response {
        font-size: 13px;
      }

      .composer {
        border-radius: 15px;
        min-height: 54px;
      }

      .composer-btn {
        width: 35px;
        height: 35px;
      }

      .composer textarea {
        font-size: 13px;
      }
    }

    @media (min-width: 851px) {
      .chat-container {
        padding-left: 25px;
        padding-right: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =======================================================
         SIDEBAR
         ======================================================= -->

    <aside class="sidebar" id="sidebar">

      <div class="sidebar-top">

        <div class="brand">
          <!--
            IMPORTANT:
            Replace /logo.png only if your actual RG Creator AI
            logo has a different filename/path.
          -->
          <img
            class="brand-logo"
            src="/logo.png"
            alt="RG Creator AI logo"
            onerror="this.style.display='none';"
          />

          <div class="brand-text">
            <div class="brand-name">RG Creator AI</div>
            <div class="brand-subtitle">AI tools for creators</div>
          </div>
        </div>

        <button class="new-chat-btn" id="newChatBtn" type="button">
          <span class="plus">＋</span>
          <span>New Chat</span>
        </button>

        <button class="search-btn" id="searchChatsBtn" type="button">
          <span class="search-icon">⌕</span>
          <span>Search Chats</span>
        </button>

      </div>

      <div class="sidebar-section">

        <div class="sidebar-label">Tools</div>

        <button class="menu-item active" type="button">
          <span class="menu-icon">💬</span>
          <span>AI Chat</span>
        </button>

        <button class="menu-item" type="button" data-page="Image.html">
          <span class="menu-icon">▧</span>
          <span>Image Generator</span>
        </button>

        <button class="menu-item" type="button" data-page="code.html">
          <span class="menu-icon">&lt;/&gt;</span>
          <span>Code Generator</span>
        </button>

        <button class="menu-item" type="button" data-page="writer.html">
          <span class="menu-icon">✎</span>
          <span>Content Writer</span>
        </button>

        <button class="menu-item" type="button" data-page="youtube.html">
          <span class="menu-icon">▶</span>
          <span>YouTube Tools</span>
        </button>

        <button class="menu-item" type="button" data-page="Instagram.html">
          <span class="menu-icon">◎</span>
          <span>Instagram Tools</span>
        </button>

      </div>

      <div class="history" id="historyList">

        <div class="history-group">

          <div class="history-title">Today</div>

          <button class="history-item" type="button">
            <span>New conversation</span>
            <span class="history-more">⋯</span>
          </button>

        </div>

        <div class="history-group">

          <div class="history-title">Previous 7 Days</div>

          <button class="history-item" type="button">
            <span>YouTube Shorts Ideas</span>
            <span class="history-more">⋯</span>
          </button>

          <button class="history-item" type="button">
            <span>Instagram Caption</span>
            <span class="history-more">⋯</span>
          </button>

        </div>

      </div>

      <div class="sidebar-bottom">

        <button class="menu-item" type="button">
          <span class="menu-icon">⚙</span>
          <span>Settings</span>
        </button>

        <button class="menu-item" type="button">

  <script>
    /* =========================================================
       RG CREATOR AI — CHAT ENGINE
       ========================================================= */

    const API_ENDPOINT = "/api/chat";

    const chatScroll = document.getElementById("chatScroll");
    const chatContainer = document.getElementById("chatContainer");
    const welcome = document.getElementById("welcome");

    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");

    const attachBtn = document.getElementById("attachBtn");
    const fileInput = document.getElementById("fileInput");
    const attachmentsPreview =
      document.getElementById("attachmentsPreview");

    const newChatBtn = document.getElementById("newChatBtn");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");

    const toast = document.getElementById("toast");

    let controller = null;
    let isGenerating = false;
    let attachedFiles = [];

    let conversation = [];

    /* =========================================================
       TOAST
       ========================================================= */

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /* =========================================================
       SIMPLE MARKDOWN RENDERER
       ========================================================= */

    function renderMarkdown(text) {
      let source = String(text || "");

      const codeBlocks = [];

      source = source.replace(
        /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,
        function (_, language, code) {
          const index = codeBlocks.length;

          codeBlocks.push({
            language: language || "code",
            code: code.trim()
          });

          return `@@CODEBLOCK_${index}@@`;
        }
      );

      source = escapeHTML(source);

      source = source.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
      );

      source = source.replace(
        /`([^`]+)`/g,
        '<span class="inline-code">$1</span>'
      );

      source = source.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
      );

      source = source.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
      );

      source = source.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
      );

      source = source.replace(
        /^\s*[-*] (.*)$/gm,
        "<li>$1</li>"
      );

      source = source.replace(
        /^\s*\d+\. (.*)$/gm,
        "<li>$1</li>"
      );

      source = source.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

      source = source.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
      );

      source = source
        .split(/\n{2,}/)
        .map(block => {
          if (
            block.startsWith("<h1>") ||
            block.startsWith("<h2>") ||
            block.startsWith("<h3>")
          ) {
            return block;
          }

          if (block.includes("<li>")) {
            return `<ul>${block}</ul>`;
          }

          return `<p>${block.replace(/\n/g, "<br>")}</p>`;
        })
        .join("");

      codeBlocks.forEach((block, index) => {
        const safeCode = escapeHTML(block.code);

        const codeHTML = `
          <div class="code-wrapper">
            <div class="code-header">
              <span>${escapeHTML(block.language)}</span>
              <button
                class="code-copy"
                type="button"
                data-code="${encodeURIComponent(block.code)}"
              >
                Copy
              </button>
            </div>
            <pre><code>${safeCode}</code></pre>
          </div>
        `;

        source = source.replace(
          `<p>@@CODEBLOCK_${index}@@</p>`,
          codeHTML
        );

        source = source.replace(
          `@@CODEBLOCK_${index}@@`,
          codeHTML
        );
      });

      return source;
    }

    /* =========================================================
       SCROLL
       ========================================================= */

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatScroll.scrollTop = chatScroll.scrollHeight;
      });
    }

    /* =========================================================
       MESSAGE ELEMENTS
       ========================================================= */

    function createUserMessage(text, id) {
      const wrapper = document.createElement("div");

      wrapper.className = "message user";
      wrapper.dataset.messageId = id;

      wrapper.innerHTML = `
        <div class="user-content">

          <div class="user-bubble">${escapeHTML(text)}</div>

          <div class="message-actions">

            <button
              class="message-action"
              type="button"
              data-action="copy-user"
              title="Copy"
            >
              ⧉
            </button>

            <button
              class="message-action"
              type="button"
              data-action="edit-user"
              title="Edit"
            >
              ✎
            </button>

          </div>

        </div>
      `;

      return wrapper;
    }

    function createAIMessage(id) {
      const wrapper = document.createElement("div");

      wrapper.className = "message ai";
      wrapper.dataset.messageId = id;

      wrapper.innerHTML = `
        <div class="ai-content">

          <div class="ai-header">

            <img
              class="ai-mini-logo"
              src="/logo.png"
              alt="RG Creator AI"
              onerror="this.style.display='none';"
            />

            <span class="ai-name">RG Creator AI</span>

          </div>

          <div class="ai-response">
            <div class="typing">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <div class="message-actions">

            <button
              class="message-action"
              type="button"
              data-action="copy-ai"
              title="Copy"
            >
              ⧉
            </button>

            <button
              class="message-action"
              type="button"
              data-action="like"
              title="Like"
            >
              ♡
            </button>

            <button
              class="message-action"
              type="button"
              data-action="unlike"
              title="Unlike"
            >
              ♧
            </button>

            <button
              class="message-action"
              type="button"
              data-action="share"
              title="Share"
            >
              ↗
            </button>

            <button
              class="message-action"
              type="button"
              data-action="regenerate"
              title="Regenerate"
            >
              ↻
            </button>

            <button
              class="message-action"
              type="button"
              data-action="more"
              title="More"
            >
              ⋯
            </button>

          </div>

        </div>
      `;

      return wrapper;
    }

    /* =========================================================
       SEND MESSAGE
       ========================================================= */

    async function sendMessage(textOverride = null) {

      if (isGenerating) {
        return;
      }

      const text =
        textOverride !== null
          ? textOverride.trim()
          : messageInput.value.trim();

      if (!text) {
        return;
      }

      if (welcome) {
        welcome.remove();
      }

      const userId =
        "user-" +
        Date.now() +
        "-" +
        Math.random().toString(36).slice(2);

      const aiId =
        "ai-" +
        Date.now() +
        "-" +
        Math.random().toString(36).slice(2);

      conversation.push({
        role: "user",
        content: text
      });

      const userElement = createUserMessage(text, userId);
      chatContainer.appendChild(userElement);

      const aiElement = createAIMessage(aiId);
      chatContainer.appendChild(aiElement);

      messageInput.value = "";
      autoResize();

      scrollToBottom();

      setGenerating(true);

      try {

        controller = new AbortController();

        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            conversation: conversation,
            files: attachedFiles.map(file => ({
              name: file.name,
              type: file.type,
              size: file.size
            }))
          }),
          signal: controller.signal
        });

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            `AI request failed (${response.status})`
          );
        }

        const answer =
          data.reply ||
          data.response ||
          data.message ||
          data.text;

        if (!answer) {
          throw new Error(
            "AI returned an empty response."
          );
        }

        const responseBox =
          aiElement.querySelector(".ai-response");

        responseBox.innerHTML = renderMarkdown(answer);

        conversation.push({
          role: "assistant",
          content: answer
        });

        attachCodeCopyEvents(aiElement);

      } catch (error) {

        const responseBox =
          aiElement.querySelector(".ai-response");

        if (error.name === "AbortError") {
          responseBox.innerHTML =
            "<p>Generation stopped.</p>";
        } else {
          responseBox.innerHTML = `
            <p style="color:#ff7070;">
              ${escapeHTML(
                error.message ||
                "Something went wrong while connecting to the AI."
              )}
            </p>
            <p>
              Please try again.
            </p>
          `;
        }

      } finally {

        controller = null;
        setGenerating(false);
        clearAttachments();
        scrollToBottom();

      }
    }

    /* =========================================================
       GENERATING STATE
       ========================================================= */

    function setGenerating(state) {

      isGenerating = state;

      if (state) {
        sendBtn.classList.add("hide");
        stopBtn.classList.add("show");
        messageInput.disabled = true;
      } else {
        sendBtn.classList.remove("hide");
        stopBtn.classList.remove("show");
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    /* =========================================================
       STOP
       ========================================================= */

    stopBtn.addEventListener("click", () => {

      if (controller) {
        controller.abort();
      }

    });

    /* =========================================================
       SEND
       ========================================================= */

    sendBtn.addEventListener("click", () => {
      sendMessage();
    });

    messageInput.addEventListener("keydown", event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }

    });

    /* =========================================================
       TEXTAREA AUTO RESIZE
       ========================================================= */

    function autoResize() {

      messageInput.style.height = "auto";

      messageInput.style.height =
        Math.min(messageInput.scrollHeight, 180) +
        "px";
    }

    messageInput.addEventListener("input", autoResize);

    /* =========================================================
       SUGGESTIONS
       ========================================================= */

    document.querySelectorAll(".suggestion").forEach(button => {

      button.addEventListener("click", () => {

        const prompt =
          button.dataset.prompt || "";

        sendMessage(prompt);

      });

    });

    /* =========================================================
       ATTACHMENTS
       ========================================================= */

    attachBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {

      const files = Array.from(fileInput.files || []);

      if (!files.length) {
        return;
      }

      attachedFiles.push(...files);

      renderAttachments();

    });

    function renderAttachments() {

      attachmentsPreview.innerHTML = "";

      if (!attachedFiles.length) {
        attachmentsPreview.classList.remove("show");
        return;
      }

      attachmentsPreview.classList.add("show");

      attachedFiles.forEach((file, index) => {

        const chip = document.createElement("div");

        chip.className = "attachment-chip";

        chip.innerHTML = `
          <span>📎</span>

          <span class="attachment-chip-name">
            ${escapeHTML(file.name)}
          </span>

          <button
            class="attachment-remove"
            type="button"
            data-index="${index}"
          >
            ×
          </button>
        `;

        attachmentsPreview.appendChild(chip);

      });

      attachmentsPreview
        .querySelectorAll(".attachment-remove")
        .forEach(button => {

          button.addEventListener("click", () => {

            const index =
              Number(button.dataset.index);

            attachedFiles.splice(index, 1);

            renderAttachments();

          });

        });

    }

    function clearAttachments() {

      attachedFiles = [];

      fileInput.value = "";

      renderAttachments();

    }

    /* =========================================================
       CODE COPY
       ========================================================= */

    function attachCodeCopyEvents(root) {

      root
        .querySelectorAll(".code-copy")
        .forEach(button => {

          button.addEventListener("click", async () => {

            try {

              const code =
                decodeURIComponent(
                  button.dataset.code
                );

              await navigator.clipboard.writeText(code);

              button.textContent = "Copied";

              setTimeout(() => {
                button.textContent = "Copy";
              }, 1300);

            } catch {

              showToast("Could not copy code.");

            }

          });

        });

    }

    /* =========================================================
       MESSAGE ACTIONS
       ========================================================= */

    chatContainer.addEventListener("click", async event => {

      const button =
        event.target.closest(".message-action");

      if (!button) {
        return;
      }

      const message =
        button.closest(".message");

      if (!message) {
        return;
      }

      const action =
        button.dataset.action;

      const response =
        message.querySelector(".ai-response");

      const userBubble =
        message.querySelector(".user-bubble");

      if (action === "copy-user") {

        await copyText(
          userBubble?.innerText || ""
        );

        showToast("Message copied.");

      }

      if (action === "edit-user") {

        const text =
          userBubble?.innerText || "";

        messageInput.value = text;

        autoResize();

        message.remove();

        messageInput.focus();

      }

      if (action === "copy-ai") {

        await copyText(
          response?.innerText || ""
        );

        showToast("Response copied.");

      }

      if (action === "like") {

        button.classList.toggle("active");

        showToast("Thanks for the feedback.");

      }

      if (action === "unlike") {

        button.classList.toggle("active");

        showToast("Thanks for the feedback.");

      }

      if (action === "share") {

        const text =
          response?.innerText || "";

        if (
          navigator.share
        ) {

          try {

            await navigator.share({
              title: "RG Creator AI",
              text
            });

          } catch {
            // User cancelled share.
          }

        } else {

          await copyText(text);

          showToast(
            "Response copied for sharing."
          );

        }

      }

      if (action === "regenerate") {

        regenerateMessage(message);

      }

      if (action === "more") {

        showToast(
          "More actions will be available here."
        );

      }

    });

    async function copyText(text) {

      try {

        await navigator.clipboard.writeText(text);

      } catch {

        const temp =
          document.createElement("textarea");

        temp.value = text;

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        temp.remove();

      }

    }

    /* =========================================================
       REGENERATE
       ========================================================= */

    function regenerateMessage(aiMessage) {

      if (isGenerating) {
        return;
      }

      const previous =
        aiMessage.previousElementSibling;

      if (
        !previous ||
        !previous.classList.contains("user")
      ) {
        return;
      }

      const userBubble =
        previous.querySelector(".user-bubble");

      if (!userBubble) {
        return;
      }

      const text =
        userBubble.innerText.trim();

      aiMessage.remove();

      sendMessage(text);

    }

    /* =========================================================
       NEW CHAT
       ========================================================= */

    newChatBtn.addEventListener("click", () => {

      conversation = [];

      chatContainer.innerHTML = `
        <div class="welcome" id="welcome">

          <img
            class="welcome-logo"
            src="/logo.png"
            alt="RG Creator AI logo"
            onerror="this.style.display='none';"
          />

          <h1>How can I help you?</h1>

          <p>
            Create content, write code, generate ideas,
            analyze information, or simply ask RG Creator AI anything.
          </p>

          <div class="suggestions">

            <button
              class="suggestion"
              type="button"
              data-prompt="Give me 10 creative YouTube Shorts ideas."
            >
              <div class="suggestion-title">YouTube Ideas</div>
              <div class="suggestion-text">
                Generate creative Shorts ideas.
              </div>
            </button>

            <button
              class="suggestion"
              type="button"
              data-prompt="Write an engaging Instagram Reel caption with keywords and hashtags."
            >
              <div class="suggestion-title">Instagram Content</div>
              <div class="suggestion-text">
                Create captions, hooks and hashtags.
              </div>
            </button>

            <button
              class="suggestion"
              type="button"
              data-prompt="Create a responsive modern website using HTML, CSS and JavaScript."
            >
              <div class="suggestion-title">Write Code</div>
              <div class="suggestion-text">
                Generate or explain code.
              </div>
            </button>

            <button
              class="suggestion"
              type="button"
              data-prompt="Give me a useful productivity plan for today."
            >
              <div class="suggestion-title">Productivity</div>
              <div class="suggestion-text">
                Plan tasks and organize your day.
              </div>
            </button>

          </div>

        </div>
      `;

      bindSuggestionButtons();

      closeMobileMenu();

      showToast("New chat started.");

    });

    function bindSuggestionButtons() {

      document
        .querySelectorAll(".suggestion")
        .forEach(button => {

          button.addEventListener("click", () => {

            sendMessage(
              button.dataset.prompt || ""
            );

          });

        });

    }

    /* =========================================================
       MOBILE SIDEBAR
       ========================================================= */

    mobileMenuBtn.addEventListener("click", () => {

      sidebar.classList.add("open");
      sidebarOverlay.classList.add("show");

    });

    sidebarOverlay.addEventListener("click", closeMobileMenu);

    function closeMobileMenu() {

      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("show");

    }

    /* =========================================================
       NAVIGATION
       ========================================================= */

    document
      .querySelectorAll(".menu-item[data-page]")
      .forEach(item => {

        item.addEventListener("click", () => {

          const page =
            item.dataset.page;

          if (page) {
            window.location.href = page;
          }

        });

      });

    /* =========================================================
       SEARCH
       ========================================================= */

    document
      .getElementById("searchChatsBtn")
      .addEventListener("click", () => {

        showToast(
          "Chat search will use your saved history."
        );

      });

    /* =========================================================
       TOP MORE
       ========================================================= */

    document
      .getElementById("topMoreBtn")
      .addEventListener("click", () => {

        showToast(
          "Chat options are available here."
        );

      });

    /* =========================================================
       VOICE INPUT
       ========================================================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;

    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();

      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onresult = event => {

        const transcript =
          event.results[0][0].transcript;

        messageInput.value =
          (
            messageInput.value
              ? messageInput.value + " "
              : ""
          ) + transcript;

        autoResize();

      };

      recognition.onerror = () => {
        showToast("Voice input could not start.");
      };

    }

    document
      .getElementById("voiceBtn")
      .addEventListener("click", () => {

        if (!recognition) {

          showToast(
            "Voice input is not supported in this browser."
          );

          return;

        }

        try {

          recognition.start();

          showToast("Listening...");

        } catch {
          // Recognition already running.
        }

      });

    /* =========================================================
       INITIALIZATION
       ========================================================= */

    autoResize();

    </script>
