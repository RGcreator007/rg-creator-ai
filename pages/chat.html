<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RG Creator AI Chat</title>

<style>
*{
  box-sizing:border-box;
}

body{
  background:#0d1117;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

#chat{
  height:60vh;
  overflow-y:auto;
  border:1px solid #333;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  background:#161b22;
}

.message{
  margin:10px 0;
  padding:12px;
  border-radius:10px;
  line-height:1.5;
  word-wrap:break-word;
}

.user{
  background:#2563eb;
  text-align:right;
}

.ai{
  background:#222;
  text-align:left;
}

textarea{
  width:100%;
  height:80px;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#161b22;
  color:white;
  margin-bottom:10px;
  font-size:16px;
  resize:none;
}

button{
  width:100%;
  padding:14px;
  font-size:18px;
  font-weight:bold;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}
</style>

</head>

<body>

<h1>🤖 RG Creator AI Chat</h1>

<div id="chat"></div>

<textarea
  id="prompt"
  placeholder="Type your message..."
></textarea>

<button id="sendButton" onclick="sendMessage()">
  Send
</button>

<script>

async function sendMessage(){

  const input = document.getElementById("prompt");
  const chat = document.getElementById("chat");
  const button = document.getElementById("sendButton");

  const text = input.value.trim();

  if(!text){
    return;
  }

  // Show user message
  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  chat.appendChild(userMessage);

  // Clear input
  input.value = "";

  // Show thinking message
  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.textContent = "Thinking...";
  chat.appendChild(aiMessage);

  chat.scrollTop = chat.scrollHeight;

  // Disable button while waiting
  button.disabled = true;
  button.textContent = "Thinking...";

  try{

    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text
      })
    });

    const data = await response.json();

    // Show actual API error
    if(!response.ok){

      const errorMessage =
        data?.error?.message ||
        data?.error ||
        data?.details ||
        `HTTP Error ${response.status}`;

      aiMessage.textContent = "❌ API Error: " + errorMessage;

    }else{

      aiMessage.textContent =
        data?.reply || "No response from Gemini.";

    }

  }catch(error){

    aiMessage.textContent =
      "❌ Connection Error: " + error.message;

  }

  button.disabled = false;
  button.textContent = "Send";

  chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
