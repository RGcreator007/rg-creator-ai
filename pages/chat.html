<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Creator AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  overflow:hidden;
}

/* APP */
.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#000;
}

/* TOP BAR */
.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  flex-shrink:0;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-btn,
.more-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  cursor:pointer;
}

.menu-btn:active,
.more-btn:active{
  background:#1b1b1b;
}

.logo-title{
  font-size:16px;
  font-weight:600;
}

/* CHAT */
.chat-area{
  flex:1;
  overflow-y:auto;
  padding:10px 14px 150px;
  scroll-behavior:smooth;
}

.chat-container{
  width:100%;
  max-width:850px;
  margin:auto;
}

/* MESSAGE ROW */
.message-row{
  margin:18px 0 26px;
}

/* USER */
.user-row{
  display:flex;
  justify-content:flex-end;
}

.user-content{
  max-width:82%;
}

.user-bubble{
  background:#242424;
  color:#fff;
  padding:11px 15px;
  border-radius:18px;
  border-bottom-right-radius:5px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* AI */
.ai-content{
  max-width:100%;
  line-height:1.65;
  font-size:16px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.thinking{
  color:#8f8f8f;
}

/* ACTIONS */
.actions{
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:8px;
}

.action-btn{
  position:relative;
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#a9a9a9;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  cursor:pointer;
}

.action-btn:hover,
.action-btn.active{
  color:#fff;
  background:#151515;
}

.action-btn svg{
  width:18px;
  height:18px;
  stroke-width:1.8;
}

/* TOOLTIP */
.tooltip{
  position:absolute;
  bottom:42px;
  left:50%;
  transform:translateX(-50%);
  background:#292929;
  color:#fff;
  font-size:12px;
  padding:5px 8px;
  border-radius:6px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  z-index:100;
}

.action-btn.show-tip .tooltip,
.action-btn:hover .tooltip{
  opacity:1;
}

/* ATTACHMENT */
.attachment-preview{
  display:none;
  max-width:850px;
  margin:0 auto 8px;
  padding:8px 10px;
  border:1px solid #303030;
  border-radius:10px;
  background:#111;
  align-items:center;
  gap:10px;
}

.attachment-preview.show{
  display:flex;
}

.file-name{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#ddd;
  font-size:13px;
}

.remove-file{
  background:none;
  border:0;
  color:#999;
  cursor:pointer;
}

/* COMPOSER */
.composer-area{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px 12px 14px;
  background:linear-gradient(
    to top,
    #000 70%,
    rgba(0,0,0,.92) 85%,
    transparent
  );
  z-index:20;
}

.composer{
  max-width:850px;
  margin:auto;
  border:1px solid #3b3b3b;
  background:#111;
  border-radius:22px;
  padding:8px 9px;
  display:flex;
  align-items:flex-end;
  gap:6px;
}

textarea{
  flex:1;
  min-width:0;
  max-height:150px;
  min-height:42px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:16px;
  line-height:1.45;
  padding:10px 5px;
  font-family:inherit;
}

textarea::placeholder{
  color:#777;
}

.composer-btn{
  width:38px;
  height:38px;
  flex-shrink:0;
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.composer-btn:hover{
  color:#fff;
  background:#202020;
}

.composer-btn svg{
  width:20px;
  height:20px;
}

.send-btn{
  background:#fff;
  color:#000;
}

.send-btn:hover{
  background:#ddd;
  color:#000;
}

/* SIDE MENU */
.side-menu{
  position:fixed;
  top:0;
  left:-290px;
  width:280px;
  height:100vh;
  background:#111;
  border-right:1px solid #292929;
  z-index:80;
  transition:.25s ease;
  padding:15px;
}

.side-menu.open{
  left:0;
}

.side-title{
  font-size:18px;
  font-weight:600;
  margin:10px 5px 20px;
}

.new-chat{
  width:100%;
  border:1px solid #333;
  background:#181818;
  color:#fff;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  text-align:left;
}

.capability{
  margin-top:18px;
}

.capability-title{
  color:#777;
  font-size:12px;
  margin:10px 5px;
  text-transform:uppercase;
}

.capability-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 8px;
  border-radius:10px;
  cursor:pointer;
  color:#ddd;
}

.capability-item:hover{
  background:#202020;
}

.capability-item svg{
  width:19px;
  height:19px;
}

/* MORE MENU */
.more-menu{
  position:fixed;
  top:52px;
  right:10px;
  width:260px;
  background:#1d1d1d;
  border-radius:20px;
  padding:10px;
  box-shadow:0 15px 45px rgba(0,0,0,.6);
  border:1px solid #292929;
  display:none;
  z-index:100;
}

.more-menu.open{
  display:block;
}

.more-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:15px;
  padding:13px 12px;
  border:0;
  background:transparent;
  color:#eee;
  border-radius:10px;
  font-size:15px;
  text-align:left;
  cursor:pointer;
}

.more-item:hover{
  background:#292929;
}

.more-item svg{
  width:20px;
  height:20px;
  stroke-width:1.8;
}

.more-item.delete{
  color:#ff7070;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:70;
  display:none;
}

.overlay.show{
  display:block;
}

/* EMPTY */
.empty{
  height:65vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  text-align:center;
  font-size:15px;
}

/* MOBILE */
@media(max-width:600px){

  .topbar{
    height:55px;
  }

  .logo-title{
    font-size:15px;
  }

  .chat-area{
    padding-left:10px;
    padding-right:10px;
  }

  .user-content{
    max-width:86%;
  }

  .ai-content{
    font-size:15.5px;
  }

  .more-menu{
    right:8px;
    width:250px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDE MENU -->
  <aside class="side-menu" id="sideMenu">

    <div class="side-title">RG Creator AI</div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="capability">

      <div class="capability-title">Capabilities</div>

      <div class="capability-item" onclick="useCapability('Content Writer')">
        ✍️
        <span>Content Writer</span>
      </div>

      <div class="capability-item" onclick="useCapability('Code Generator')">
        💻
        <span>Code Generator</span>
      </div>

      <div class="capability-item" onclick="useCapability('AI Image Generator')">
        🖼️
        <span>AI Image Generator</span>
      </div>

      <div class="capability-item" onclick="useCapability('YouTube Tools')">
        ▶️
        <span>YouTube Tools</span>
      </div>

      <div class="capability-item" onclick="useCapability('Instagram')">
        📸
        <span>Instagram</span>
      </div>

    </div>

  </aside>

  <div class="overlay" id="overlay" onclick="closeMenus()"></div>

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="top-left">
      <button class="menu-btn"
        onclick="toggleSideMenu()"
        aria-label="Menu">
        <i data-lucide="menu"></i>
      </button>

      <div class="logo-title">RG Creator AI</div>
    </div>

    <!-- ONLY THREE DOTS -->
    <button class="more-btn"
      onclick="toggleMoreMenu()"
      aria-label="More">
      <i data-lucide="more-horizontal"></i>
    </button>

  </header>


  <!-- MORE MENU -->
  <div class="more-menu" id="moreMenu">

    <button class="more-item" onclick="shareConversation()">
      <i data-lucide="share-2"></i>
      <span>Share conversation</span>
    </button>

    <button class="more-item" onclick="pinConversation()">
      <i data-lucide="pin"></i>
      <span>Pin</span>
    </button>

    <button class="more-item" onclick="renameConversation()">
      <i data-lucide="pencil"></i>
      <span>Rename</span>
    </button>

    <button class="more-item" onclick="downloadPDF()">
      <i data-lucide="download"></i>
      <span>Download PDF</span>
    </button>

    <button class="more-item" onclick="exportDocs()">
      <i data-lucide="file-text"></i>
      <span>Export to Docs</span>
    </button>

    <button class="more-item delete" onclick="deleteChat()">
      <i data-lucide="trash-2"></i>
      <span>Delete</span>
    </button>

  </div>


  <!-- CHAT -->
  <main class="chat-area" id="chatArea">
    <div class="chat-container" id="chat">

      <div class="empty" id="emptyMessage">
        <div>
          <h2>RG Creator AI</h2>
          <p>How can I help you today?</p>
        </div>
      </div>

    </div>
  </main>


  <!-- COMPOSER -->
  <div class="composer-area">

    <div class="attachment-preview" id="attachmentPreview">
      <i data-lucide="paperclip"></i>
      <span class="file-name" id="fileName"></span>
      <button class="remove-file" onclick="removeAttachment()">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="composer">

      <!-- ATTACH -->
      <button class="composer-btn"
        onclick="document.getElementById('fileInput').click()"
        aria-label="Attach">
        <i data-lucide="plus"></i>
      </button>

      <input
        type="file"
        id="fileInput"
        hidden
        accept="image/*,video/*,.pdf,.txt,.doc,.docx"
        onchange="handleFile(event)"
      >

      <!-- TEXT -->
      <textarea
        id="prompt"
        rows="1"
        placeholder="Message RG Creator AI..."
        oninput="autoResize(this)"
        onkeydown="handleEnter(event)"
      ></textarea>

      <!-- VOICE -->
      <button class="composer-btn"
        id="voiceBtn"
        onclick="startVoice()"
        aria-label="Voice">
        <i data-lucide="mic"></i>
      </button>

      <!-- SEND -->
      <button class="composer-btn send-btn"
        onclick="sendMessage()"
        aria-label="Send">
        <i data-lucide="arrow-up"></i>
      </button>

    </div>
  </div>

</div>


<!-- ICON LIBRARY -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- PDF LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>

let selectedFile = null;
let conversationTitle = "RG Creator AI";

const chat = document.getElementById("chat");
const prompt = document.getElementById("prompt");
const emptyMessage = document.getElementById("emptyMessage");

lucide.createIcons();


/* ---------------- MENU ---------------- */

function toggleSideMenu(){

  document.getElementById("sideMenu").classList.toggle("open");

  document.getElementById("overlay").classList.toggle("show");

  document.getElementById("moreMenu").classList.remove("open");
}

function toggleMoreMenu(){

  document.getElementById("moreMenu").classList.toggle("open");

  document.getElementById("sideMenu").classList.remove("open");

  document.getElementById("overlay").classList.toggle(
    "show",
    document.getElementById("moreMenu").classList.contains("open")
  );
}

function closeMenus(){

  document.getElementById("sideMenu").classList.remove("open");
  document.getElementById("moreMenu").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}


/* ---------------- NEW CHAT ---------------- */

function newChat(){

  chat.innerHTML = `
    <div class="empty" id="emptyMessage">
      <div>
        <h2>RG Creator AI</h2>
        <p>How can I help you today?</p>
      </div>
    </div>
  `;

  prompt.value = "";
  removeAttachment();
  closeMenus();
}


/* ---------------- CAPABILITIES ---------------- */

function useCapability(name){

  const prompts = {

    "Content Writer":
      "Act as a professional content writer. Help me create high-quality content.",

    "Code Generator":
      "Act as an expert programmer. Help me write clean and working code.",

    "AI Image Generator":
      "Help me create a detailed prompt for generating an AI image.",

    "YouTube Tools":
      "Help me optimize my YouTube content with a title, description, keywords and strategy.",

    "Instagram":
      "Help me optimize my Instagram Reel with a title, caption, keywords and hashtags."
  };

  prompt.value = prompts[name] || "";
  autoResize(prompt);
  closeMenus();
  prompt.focus();
}


/* ---------------- FILE ---------------- */

function handleFile(event){

  const file = event.target.files[0];

  if(!file) return;

  selectedFile = file;

  document.getElementById("fileName").textContent = file.name;

  document.getElementById("attachmentPreview")
    .classList.add("show");

  lucide.createIcons();
}

function removeAttachment(){

  selectedFile = null;

  document.getElementById("fileInput").value = "";

  document.getElementById("attachmentPreview")
    .classList.remove("show");

  document.getElementById("fileName").textContent = "";
}


/* ---------------- TEXTAREA ---------------- */

function autoResize(el){

  el.style.height = "auto";

  el.style.height =
    Math.min(el.scrollHeight,150) + "px";
}

function handleEnter(event){

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();

    sendMessage();
  }
}


/* ---------------- VOICE ---------------- */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition) return;

  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = function(event){

    prompt.value +=
      (prompt.value ? " " : "") +
      event.results[0][0].transcript;

    autoResize(prompt);
  };

  recognition.start();
}


/* ---------------- SEND ---------------- */

async function sendMessage(){

  const text = prompt.value.trim();

  if(!text && !selectedFile) return;

  if(emptyMessage) emptyMessage.remove();

  const userId = "user-" + Date.now();
  const aiId = "ai-" + Date.now();

  const userText = text || "Attached file";

  addUserMessage(userText,userId);

  prompt.value = "";
  autoResize(prompt);

  const fileToSend = selectedFile;

  removeAttachment();

  addAIMessage("Thinking...",aiId,true);

  scrollToBottom();

  try{

    let attachment = null;

    if(fileToSend){

      attachment = await fileToBase64(fileToSend);
    }

    const response = await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        message:userText,

        file:attachment
      })
    });

    const data = await response.json();

    const aiElement =
      document.getElementById(aiId);

    if(!response.ok){

      aiElement.querySelector(".ai-text").textContent =
        data.error || "API Error";

      return;
    }

    aiElement.querySelector(".ai-text").textContent =
      data.reply || "No response.";

    aiElement.querySelector(".actions").style.display =
      "flex";

    lucide.createIcons();

    scrollToBottom();

  }catch(error){

    const aiElement =
      document.getElementById(aiId);

    aiElement.querySelector(".ai-text").textContent =
      "❌ Connection error. Please try again.";

    aiElement.querySelector(".actions").style.display =
      "flex";

  }

}


/* ---------------- ADD USER ---------------- */

function addUserMessage(text,id){

  const row = document.createElement("div");

  row.className = "message-row user-row";

  row.innerHTML = `

    <div class="user-content">

      <div class="user-bubble" id="${id}">
        ${escapeHTML(text)}
      </div>

      <div class="actions">

        <button class="action-btn"
          onclick="copyText(this,'${id}')">

          <i data-lucide="copy"></i>

          <span class="tooltip">Copy</span>

        </button>

        <button class="action-btn"
          onclick="editMessage('${id}')">

          <i data-lucide="pencil"></i>

          <span class="tooltip">Edit</span>

        </button>

      </div>

    </div>
  `;

  chat.appendChild(row);

  lucide.createIcons();

  addLongPress(row);
}


/* ---------------- ADD AI ---------------- */

function addAIMessage(text,id,thinking=false){

  const row = document.createElement("div");

  row.className = "message-row";

  row.innerHTML = `

    <div class="ai-content" id="${id}">

      <div class="ai-text ${thinking ? "thinking":""}">
        ${escapeHTML(text)}
      </div>

      <div class="actions"
        style="${thinking ? "display:none":"display:flex"}">

        <button class="action-btn"
          onclick="copyAI(this,'${id}')">

          <i data-lucide="copy"></i>
          <span class="tooltip">Copy</span>

        </button>

        <button class="action-btn"
          onclick="likeReply(this)">

          <i data-lucide="thumbs-up"></i>
          <span class="tooltip">Like</span>

        </button>

        <button class="action-btn"
          onclick="unlikeReply(this)">

          <i data-lucide="thumbs-down"></i>
          <span class="tooltip">Unlike</span>

        </button>

        <button class="action-btn"
          onclick="shareReply('${id}')">

          <i data-lucide="share-2"></i>
          <span class="tooltip">Share</span>

        </button>

        <button class="action-btn"
          onclick="regenerate('${id}')">

          <i data-lucide="refresh-cw"></i>
          <span class="tooltip">Regenerate</span>

        </button>

        <button class="action-btn"
          onclick="replyMore(this,'${id}')">

          <i data-lucide="more-horizontal"></i>
          <span class="tooltip">More</span>

        </button>

      </div>

    </div>
  `;

  chat.appendChild(row);

  lucide.createIcons();

  addLongPress(row);
}


/* ---------------- COPY ---------------- */

async function copyText(button,id){

  const element =
    document.getElementById(id);

  await navigator.clipboard.writeText(
    element.textContent
  );

  showTooltip(button,"Copied");
}

async function copyAI(button,id){

  const element =
    document.querySelector(
      "#" + id + " .ai-text"
    );

  await navigator.clipboard.writeText(
    element.textContent
  );

  showTooltip(button,"Copied");
}


/* ---------------- EDIT ---------------- */

function editMessage(id){

  const text =
    document.getElementById(id).textContent;

  prompt.value = text;

  autoResize(prompt);

  prompt.focus();
}


/* ---------------- LIKE ---------------- */

function likeReply(button){

  button.classList.add("active");

  const parent =
    button.parentElement;

  const unlike =
    parent.children[2];

  unlike.classList.remove("active");
}

function unlikeReply(button){

  button.classList.add("active");

  const parent =
    button.parentElement;

  const like =
    parent.children[1];

  like.classList.remove("active");
}


/* ---------------- SHARE ---------------- */

async function shareReply(id){

  const text =
    document.querySelector(
      "#" + id + " .ai-text"
    ).textContent;

  if(navigator.share){

    await navigator.share({
      title:"RG Creator AI",
      text:text
    });

  }else{

    await navigator.clipboard.writeText(text);
  }
}

async function shareConversation(){

  closeMenus();

  const text =
    document.getElementById("chat").innerText;

  if(navigator.share){

    await navigator.share({
      title:conversationTitle,
      text:text
    });

  }else{

    await navigator.clipboard.writeText(text);
  }
}


/* ---------------- REGENERATE ---------------- */

async function regenerate(id){

  const aiElement =
    document.getElementById(id);

  const text =
    aiElement.querySelector(".ai-text");

  text.textContent = "Regenerating...";
  text.classList.add("thinking");

  const previousUser =
    findPreviousUserMessage(aiElement);

  if(!previousUser) return;

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:previousUser
        })
      });

    const data = await response.json();

    text.textContent =
      data.reply || "No response.";

    text.classList.remove("thinking");

  }catch(error){

    text.textContent =
      "❌ Unable to regenerate.";

    text.classList.remove("thinking");
  }

  scrollToBottom();
}

function findPreviousUserMessage(aiElement){

  let row =
    aiElement.parentElement.previousElementSibling;

  while(row){

    const bubble =
      row.querySelector(".user-bubble");

    if(bubble) return bubble.textContent;

    row =
      row.previousElementSibling;
  }

  return null;
}


/* ---------------- MORE REPLY ---------------- */

function replyMore(button,id){

  const old =
    document.getElementById("replyPopup");

  if(old) old.remove();

  const menu =
    document.createElement("div");

  menu.id = "replyPopup";

  menu.style.position = "fixed";
  menu.style.background = "#1d1d1d";
  menu.style.border = "1px solid #333";
  menu.style.borderRadius = "14px";
  menu.style.padding = "7px";
  menu.style.zIndex = "200";
  menu.style.boxShadow = "0 12px 35px rgba(0,0,0,.6)";

  menu.innerHTML = `

    <button class="more-item"
      onclick="downloadReply('${id}')">
      <i data-lucide="download"></i>
      <span>Download</span>
    </button>

    <button class="more-item"
      onclick="cutReply('${id}')">
      <i data-lucide="scissors"></i>
      <span>Cut</span>
    </button>
  `;

  document.body.appendChild(menu);

  const rect =
    button.getBoundingClientRect();

  menu.style.left =
    Math.max(8,rect.left - 150) + "px";

  menu.style.top =
    Math.max(60,rect.top - 100) + "px";

  lucide.createIcons();

  setTimeout(()=>{

    document.addEventListener(
      "click",
      closeReplyPopup,
      {once:true}
    );

  },0);
}

function closeReplyPopup(){

  const menu =
    document.getElementById("replyPopup");

  if(menu) menu.remove();
}

function downloadReply(id){

  const text =
    document.querySelector(
      "#" + id + " .ai-text"
    ).textContent;

  const blob =
    new Blob([text],{
      type:"text/plain"
    });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = "RG-Creator-AI-Reply.txt";

  a.click();

  URL.revokeObjectURL(url);
}

function cutReply(id){

  const element =
    document.getElementById(id);

  element.parentElement.remove();
}


/* ---------------- TOP MENU ---------------- */

function pinConversation(){

  localStorage.setItem(
    "rgPinnedChat",
    document.getElementById("chat").innerText
  );

  closeMenus();
}

function renameConversation(){

  const name =
    prompt("Conversation name:",conversationTitle);

  if(name){

    conversationTitle = name.trim();

    document.querySelector(".logo-title").textContent =
      conversationTitle;
  }

  closeMenus();
}

function deleteChat(){

  chat.innerHTML = `
    <div class="empty" id="emptyMessage">
      <div>
        <h2>RG Creator AI</h2>
        <p>How can I help you today?</p>
      </div>
    </div>
  `;

  closeMenus();
}


/* ---------------- PDF ---------------- */

function downloadPDF(){

  closeMenus();

  const {jsPDF} = window.jspdf;

  const doc =
    new jsPDF();

  const text =
    document.getElementById("chat").innerText;

  const lines =
    doc.splitTextToSize(text,180);

  doc.text(lines,15,20);

  doc.save("RG-Creator-AI-Conversation.pdf");
}


/* ---------------- DOCS ---------------- */

function exportDocs(){

  closeMenus();

  const text =
    document.getElementById("chat").innerText;

  const blob =
    new Blob(
      [
        `<html>
        <body>
        <h1>RG Creator AI</h1>
        <pre style="font-family:Arial;white-space:pre-wrap">
        ${escapeHTML(text)}
        </pre>
        </body>
        </html>`
      ],
      {type:"application/msword"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = "RG-Creator-AI-Conversation.doc";

  a.click();

  URL.revokeObjectURL(url);
}


/* ---------------- FILE BASE64 ---------------- */

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = ()=>{

      const result =
        reader.result;

      resolve({

        name:file.name,

        mimeType:file.type,

        data:
          result.split(",")[1]
      });
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}


/* ---------------- TOOLTIP LONG PRESS ---------------- */

function addLongPress(container){

  const buttons =
    container.querySelectorAll(".action-btn");

  buttons.forEach(button=>{

    let timer;

    button.addEventListener(
      "pointerdown",
      ()=>{

        timer =
          setTimeout(()=>{

            button.classList.add("show-tip");

            setTimeout(()=>{

              button.classList.remove("show-tip");

            },1500);

          },450);
      }
    );

    button.addEventListener(
      "pointerup",
      ()=>{
        clearTimeout(timer);
      }
    );

    button.addEventListener(
      "pointerleave",
      ()=>{
        clearTimeout(timer);
      }
    );
  });
}


/* ---------------- UTIL ---------------- */

function showTooltip(button,text){

  const old =
    button.querySelector(".tooltip");

  if(old){

    const original =
      old.textContent;

    old.textContent = text;

    button.classList.add("show-tip");

    setTimeout(()=>{

      old.textContent = original;

      button.classList.remove("show-tip");

    },1000);
  }
}

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function scrollToBottom(){

  const area =
    document.getElementById("chatArea");

  area.scrollTop =
    area.scrollHeight;
}
