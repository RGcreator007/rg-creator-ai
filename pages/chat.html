<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RG Creator AI</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #222;
  background:#000;
  z-index:40;
}

.title{
  font-size:17px;
  font-weight:600;
  text-align:center;
}

.menu-btn,
.more-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border-radius:50%;
  font-size:25px;
}

.menu-btn:active,
.more-btn:active{
  background:#1c1c1c;
}

/* =========================
   CHAT
========================= */

#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 155px;
  scroll-behavior:smooth;
}

.message-row{
  width:100%;
  margin-bottom:25px;
}

.user-row{
  display:flex;
  justify-content:flex-end;
}

.ai-row{
  display:block;
}

.user-message{
  max-width:86%;
  background:#2a2a2a;
  border-radius:18px;
  padding:11px 14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.ai-message{
  width:100%;
  background:transparent;
  border:0;
  padding:0;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:16px;
}

.thinking{
  color:#888;
}

/* =========================
   ATTACHMENT IMAGE
========================= */

.message-image{
  display:block;
  max-width:270px;
  max-height:300px;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:8px;
}

.file-chip{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  padding:8px 10px;
  border-radius:10px;
  background:#202020;
  color:#ddd;
  font-size:13px;
}

/* =========================
   ACTIONS
========================= */

.actions{
  display:flex;
  align-items:center;
  gap:3px;
  margin-top:8px;
}

.action-btn{
  position:relative;
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#999;
  padding:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.action-btn:hover{
  color:#fff;
}

.action-btn svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   LONG PRESS LABEL
========================= */

.hold-label{
  position:fixed;
  z-index:9999;
  display:none;
  background:#222;
  color:#fff;
  padding:6px 9px;
  border-radius:7px;
  font-size:11px;
  white-space:nowrap;
  pointer-events:none;
}

/* =========================
   INPUT
========================= */

.input-area{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 12px 14px;
  background:linear-gradient(
    to top,
    #000 72%,
    rgba(0,0,0,.9)
  );
  z-index:30;
}

.input-box{
  display:flex;
  align-items:flex-end;
  gap:6px;
  min-height:58px;
  width:100%;
  padding:8px 8px 8px 11px;
  background:#171717;
  border:1px solid #333;
  border-radius:26px;
}

#prompt{
  flex:1;
  min-height:38px;
  max-height:130px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:16px;
  line-height:1.4;
  padding:8px 2px;
}

#prompt::placeholder{
  color:#777;
}

.icon-btn{
  position:relative;
  flex-shrink:0;
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#ccc;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.icon-btn:hover{
  color:#fff;
}

.icon-btn svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.send-btn{
  background:#fff;
  color:#000;
}

.send-btn:hover{
  background:#ddd;
  color:#000;
}

/* =========================
   ATTACHMENT PREVIEW
========================= */

.preview-list{
  display:none;
  gap:8px;
  overflow-x:auto;
  padding:0 0 8px 4px;
}

.preview-item{
  position:relative;
  min-width:76px;
  height:76px;
  border-radius:12px;
  overflow:hidden;
  background:#1c1c1c;
  border:1px solid #333;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-file{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:5px;
  font-size:10px;
  color:#ccc;
}

.remove-file{
  position:absolute;
  top:4px;
  right:4px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:#000;
  color:#fff;
  cursor:pointer;
}

/* =========================
   HIDDEN FILE INPUT
========================= */

#fileInput{
  display:none;
}

/* =========================
   CAPABILITIES
========================= */

.capabilities{
  display:none;
  position:fixed;
  left:12px;
  right:12px;
  bottom:82px;
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:18px;
  padding:9px;
  z-index:70;
  box-shadow:0 10px 35px rgba(0,0,0,.6);
}

.capability{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 10px;
  border-radius:12px;
  cursor:pointer;
}

.capability:hover{
  background:#292929;
}

.capability-icon{
  width:30px;
  text-align:center;
  font-size:20px;
}

.capability-name{
  font-size:15px;
}

/* =========================
   SIDE MENU
========================= */

.side-menu{
  position:fixed;
  top:0;
  left:-300px;
  width:290px;
  height:100%;
  background:#111;
  border-right:1px solid #292929;
  z-index:100;
  transition:.25s;
  padding:18px 14px;
  overflow-y:auto;
}

.side-menu.open{
  left:0;
}

.menu-title{
  font-size:18px;
  font-weight:600;
  margin:8px 8px 22px;
}

.menu-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 12px;
  border-radius:10px;
  color:#ddd;
  cursor:pointer;
}

.menu-item:hover{
  background:#222;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:90;
}

/* =========================
   MORE MENU
========================= */

.more-menu{
  display:none;
  position:fixed;
  right:12px;
  top:60px;
  width:245px;
  max-height:75vh;
  overflow-y:auto;
  background:#1d1d1d;
  border-radius:18px;
  padding:8px;
  z-index:120;
  box-shadow:0 10px 35px rgba(0,0,0,.6);
}

.more-item{
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 12px;
  border-radius:10px;
  color:#eee;
  cursor:pointer;
}

.more-item:hover{
  background:#2a2a2a;
}

.more-item svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   WELCOME
========================= */

.welcome{
  text-align:center;
  padding:100px 20px 30px;
  color:#aaa;
}

.welcome h2{
  color:#fff;
  font-size:22px;
  margin-bottom:8px;
}

.welcome p{
  margin:0;
  font-size:14px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .user-message{
    max-width:90%;
  }

  #chat{
    padding-left:12px;
    padding-right:12px;
  }

  .more-menu{
    right:8px;
    width:250px;
  }
}

</style>
</head>

<script>

/* =========================================
   STATE
========================================= */

let conversationHistory = [];

let attachments = [];

let lastQuestion = "";

let isSending = false;

const HISTORY_KEY =
  "rg_creator_ai_history";

const TITLE_KEY =
  "rg_creator_ai_title";


/* =========================================
   ELEMENTS
========================================= */

const chat =
  document.getElementById("chat");

const promptInput =
  document.getElementById("prompt");

const fileInput =
  document.getElementById("fileInput");

const previewList =
  document.getElementById("previewList");

const capabilities =
  document.getElementById("capabilities");

const sideMenu =
  document.getElementById("sideMenu");

const moreMenu =
  document.getElementById("moreMenu");

const overlay =
  document.getElementById("overlay");


/* =========================================
   INITIALIZE
========================================= */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    loadHistory();

    setupHoldLabels();

  }
);


/* =========================================
   AUTO RESIZE
========================================= */

promptInput.addEventListener(
  "input",
  function(){

    this.style.height =
      "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        130
      ) + "px";

  }
);


/* =========================================
   ENTER
========================================= */

promptInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================
   ATTACHMENT BUTTON
========================================= */

document
  .getElementById("attachButton")
  .addEventListener(
    "click",
    function(){

      fileInput.click();

    }
  );


fileInput.addEventListener(
  "change",
  async function(){

    const files =
      Array.from(
        fileInput.files || []
      );

    for(
      const file of files
    ){

      await addAttachment(file);

    }

    fileInput.value = "";

  }
);


/* =========================================
   ADD ATTACHMENT
========================================= */

async function addAttachment(file){

  const maxSize =
    12 * 1024 * 1024;

  if(
    file.size > maxSize
  ){

    addSystemMessage(
      "File is too large. Please use a file smaller than 12 MB."
    );

    return;

  }


  const allowed =
    file.type.startsWith("image/") ||
    file.type.startsWith("video/") ||
    file.type === "application/pdf" ||
    file.type === "text/plain" ||
    file.type === "application/msword" ||
    file.type ===
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document";


  if(!allowed){

    addSystemMessage(
      "This file type is not supported."
    );

    return;

  }


  try{

    const data =
      await readFileAsBase64(file);


    attachments.push({

      name:file.name,

      mimeType:
        file.type ||
        "application/octet-stream",

      data:data

    });


    renderPreviews();

  }catch(error){

    addSystemMessage(
      "Could not read the selected file."
    );

  }

}


/* =========================================
   READ FILE
========================================= */

function readFileAsBase64(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const result =
            String(
              reader.result || ""
            );

          const comma =
            result.indexOf(",");

          if(comma === -1){

            reject(
              new Error(
                "Invalid file data"
              )
            );

            return;

          }

          resolve(
            result.substring(
              comma + 1
            )
          );

        };

      reader.onerror =
        function(){

          reject(
            reader.error ||
            new Error(
              "File read error"
            )
          );

        };

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================
   PREVIEW
========================================= */

function renderPreviews(){

  previewList.innerHTML = "";

  if(!attachments.length){

    previewList.style.display =
      "none";

    return;

  }

  previewList.style.display =
    "flex";


  attachments.forEach(
    function(file,index){

      const item =
        document.createElement("div");

      item.className =
        "preview-item";


      if(
        file.mimeType.startsWith(
          "image/"
        )
      ){

        const img =
          document.createElement("img");

        img.src =
          "data:" +
          file.mimeType +
          ";base64," +
          file.data;

        item.appendChild(img);

      }else{

        const box =
          document.createElement("div");

        box.className =
          "preview-file";

        box.textContent =
          file.name;

        item.appendChild(box);

      }


      const remove =
        document.createElement("button");

      remove.className =
        "remove-file";

      remove.textContent =
        "×";

      remove.onclick =
        function(){

          attachments.splice(
            index,
            1
          );

          renderPreviews();

        };


      item.appendChild(remove);

      previewList.appendChild(item);

    }
  );

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

  if(isSending){

    return;

  }


  const text =
    promptInput.value.trim();


  if(
    !text &&
    !attachments.length
  ){

    return;

  }


  lastQuestion =
    text;


  const currentAttachments =
    attachments.map(
      file => ({
        name:file.name,
        mimeType:file.mimeType,
        data:file.data
      })
    );


  removeWelcome();


  /* USER */

  addUserMessage(
    text,
    currentAttachments
  );


  const aiRow =
    document.createElement(
      "div"
    );

  aiRow.className =
    "message-row ai-row";


  const aiMessage =
    document.createElement(
      "div"
    );

  aiMessage.className =
    "ai-message thinking";

  aiMessage.textContent =
    "Thinking...";


  aiRow.appendChild(
    aiMessage
  );


  chat.appendChild(
    aiRow
  );


  scrollChat();


  promptInput.value = "";

  promptInput.style.height =
    "auto";


  attachments = [];

  renderPreviews();


  isSending = true;


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:text,

            history:
              conversationHistory,

            attachments:
              currentAttachments

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data?.details ||
        data?.error ||
        "API request failed."
      );

    }


    const reply =
      data.reply ||
      "Sorry, I couldn't generate a response.";


    aiMessage.classList.remove(
      "thinking"
    );

    aiMessage.textContent =
      reply;


    addAIActions(
      aiRow,
      reply
    );


    /* HISTORY */

    conversationHistory.push({

      role:"user",

      text:text,

      attachments:
        currentAttachments.map(
          file => ({
            name:file.name,
            mimeType:file.mimeType
          })
        )

    });


    conversationHistory.push({

      role:"model",

      text:reply

    });


    saveHistory();


  }catch(error){

    aiMessage.classList.remove(
      "thinking"
    );

    aiMessage.textContent =
      "❌ " +
      error.message;

  }


  isSending = false;

  scrollChat();

}

/* =========================================

function createActionButton(
  type,
  label,
  callback
){

  const button =
    document.createElement(
      "button"
    );

  button.className =
    "action-btn";

  button.dataset.label =
    label;

  button.dataset.type =
    type;

  button.setAttribute(
    "aria-label",
    label
  );


  button.innerHTML =
    getIcon(type);


  button.addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      callback(button);

    }
  );


  return button;

}

/* =========================================
   REPLY MORE
========================================= */

function toggleReplyMenu(
  button,
  reply
){

  closeAllMenus();


  const menu =
    document.createElement(
      "div"
    );

  menu.className =
    "more-menu";

  menu.style.display =
    "block";

  menu.style.position =
    "fixed";


  const rect =
    button.getBoundingClientRect();


  menu.style.right =
    "auto";

  menu.style.left =
    Math.max(
      8,
      rect.left - 170
    ) + "px";


  menu.style.top =
    Math.max(
      60,
      rect.top - 110
    ) + "px";


  menu.innerHTML = `

    <div class="more-item"
      data-reply-download>
      ⬇️
      <span>Download</span>
    </div>

    <div class="more-item"
      data-reply-cut>
      ✂️
      <span>Cut</span>
    </div>

  `;


  document.body.appendChild(
    menu
  );


  menu
    .querySelector(
      "[data-reply-download]"
    )
    .onclick =
    function(){

      downloadText(
        reply,
        "RG-Creator-AI-Reply.txt"
      );

      menu.remove();

    };


  menu
    .querySelector(
      "[data-reply-cut]"
    )
    .onclick =
    function(){

      copyText(reply);

      menu.remove();

    };


  setTimeout(
    function(){

      document.addEventListener(
        "click",
        function closeReply(event){

          if(
            !menu.contains(
              event.target
            ) &&
            event.target !== button
          ){

            menu.remove();

            document.removeEventListener(
              "click",
              closeReply
            );

          }

        }
      );

    },
    0
  );

}


/* =========================================
   COPY
========================================= */

async function copyText(text){

  if(!text){

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch(error){

    const area =
      document.createElement(
        "textarea"
      );

    area.value =
      text;

    document.body.appendChild(
      area
    );

    area.select();

    document.execCommand(
      "copy"
    );

    area.remove();

  }

}

    }catch(error){}

  }else{

    await copyText(text);

  }

}

   HISTORY
========================================= */

  .getElementById(

    "click",
    function(){

      loadHistory();

      closeAllMenus();

    }

function saveHistory(){

  try{

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        conversationHistory
      )
    );

  }catch(error){

    console.error(
      "History save error:",
      error
    );

  }

}


function loadHistory(){

  try{

    const saved =
      localStorage.getItem(
        HISTORY_KEY
      );


    if(!saved){

      addWelcome();

      return;

    }


    const data =
      JSON.parse(saved);


    if(
      !Array.isArray(data) ||
      !data.length
    ){

      addWelcome();

      return;

    }


    conversationHistory =
      data;


    chat.innerHTML = "";


    for(
      let i = 0;
      i < data.length;
      i++
    ){

      const item =
        data[i];


      if(
        item.role === "user"
      ){

        addUserMessage(
          item.text || "",
          []
        );

      }else if(
        item.role === "model"
      ){

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "message-row ai-row";


        const message =
          document.createElement(
            "div"
          );

        message.className =
          "ai-message";

        message.textContent =
          item.text || "";


        row.appendChild(
          message
        );


        addAIActions(
          row,
          item.text || ""
        );


        chat.appendChild(
          row
        );

      }

    }


    scrollChat();

  }catch(error){

    conversationHistory = [];

    addWelcome();

  }

}

/* =========================================
   DOWNLOAD
========================================= */

function downloadText(
  text,
  filename
){

  const blob =
    new Blob(
      [text],
      {
        type:"text/plain"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    filename;

  document.body.appendChild(
    a
  );

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );

}

/* =========================================
   THEME
========================================= */

function toggleTheme(){

  const current =
    localStorage.getItem(
      "rg_creator_ai_theme"
    ) || "dark";


  const next =
    current === "dark"
      ? "light"
      : "dark";


  localStorage.setItem(
    "rg_creator_ai_theme",
    next
  );


  applyTheme(
    next
  );


  closeAllMenus();

}


function applyTheme(theme){

  if(theme === "light"){

    document.body.style.background =
      "#fff";

    document.body.style.color =
      "#111";

    document
      .querySelector(".topbar")
      .style.background =
      "#fff";

    document
      .querySelector(".input-area")
      .style.background =
      "#fff";

  }else{

    document.body.style.background =
      "#000";

    document.body.style.color =
      "#fff";

    document
      .querySelector(".topbar")
      .style.background =
      "#000";

  }

}

  localStorage.getItem(
    "rg_creator_ai_theme"

}


/* =========================================
   VOICE
========================================= */

document
  .getElementById(
    "voiceButton"
  )
  .addEventListener(
    "click",
    startVoice
  );


function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    navigator.language ||
    "en-IN";


  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0]
          .transcript;


      promptInput.value +=
        (
          promptInput.value
            ? " "
            : ""
        ) + text;


      promptInput.style.height =
        "auto";

      promptInput.style.height =
        Math.min(
          promptInput.scrollHeight,
          130
        ) + "px";

    };


  try{

    recognition.start();

  }catch(error){}

}

/* =========================================
   LONG PRESS TOOLTIP
========================================= */

function setupHoldLabels(){

  const buttons =
    document.querySelectorAll(
      "[data-label]"
    );


  buttons.forEach(
    function(button){

      let timer = null;


      function start(){

        clearTimeout(
          timer
        );


        timer =
          setTimeout(
            function(){

              showHoldLabel(
                button,
                button.dataset.label
              );

            },
            550
          );

      }


      function stop(){

        clearTimeout(
          timer
        );

        hideHoldLabel();

      }


      button.addEventListener(
        "pointerdown",
        start
      );

      button.addEventListener(
        "pointerup",
        stop
      );

      button.addEventListener(
        "pointerleave",
        stop
      );

      button.addEventListener(
        "pointercancel",
        stop
      );

    }
  );

}


function showHoldLabel(
  button,
  text
){

  const label =
    document.getElementById(
      "holdLabel"
    );


  const rect =
    button.getBoundingClientRect();


  label.textContent =
    text;


  label.style.display =
    "block";


  label.style.left =
    (
      rect.left +
      rect.width / 2 -
      label.offsetWidth / 2
    ) + "px";


  label.style.top =
    (
      rect.top -
      38
    ) + "px";

}


function hideHoldLabel(){

  document
    .getElementById(
      "holdLabel"
    )
    .style.display =
      "none";

}
