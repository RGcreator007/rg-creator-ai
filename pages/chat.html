
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Creator AI Chat</title>

<style>
body{
background:#0d1117;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

#chat{
height:60vh;
overflow-y:auto;
border:1px solid #333;
border-radius:10px;
padding:10px;
margin-bottom:10px;
background:#161b22;
}

.message{
margin:10px 0;
padding:10px;
border-radius:8px;
}

.user{
background:#2563eb;
text-align:right;
}

.ai{
background:#222;
}

textarea{
width:100%;
height:70px;
padding:10px;
border-radius:8px;
border:none;
margin-bottom:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
font-size:18px;
background:#16a34a;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#15803d;
}
</style>

</head>

<body>

<h1>🤖 RG Creator AI Chat</h1>

<div id="chat"></div>

<textarea id="prompt" placeholder="Type your message..."></textarea>

<button onclick="sendMessage()">Send</button>

<script>

async function sendMessage(){

const input=document.getElementById("prompt");

const text=input.value.trim();

if(!text)return;

const chat=document.getElementById("chat");

chat.innerHTML+=`<div class="message user">${text}</div>`;

input.value="";

chat.innerHTML+=`<div class="message ai">Thinking...</div>`;

chat.scrollTop=chat.scrollHeight;

const response=await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text
})

});

const data=await response.json();

chat.lastElementChild.innerHTML=data.reply||"Error";

chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
