<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="RG Creator AI — AI Chat"
  />

  <meta name="theme-color" content="#000000" />

  <title>AI Chat — RG Creator AI</title>

  <style>
    :root {
      --bg: #000000;
      --sidebar: #090909;
      --surface: #111111;
      --surface-2: #171717;
      --surface-3: #202020;
      --border: #292929;

      --text: #ffffff;
      --text-secondary: #b8b8b8;
      --text-muted: #777777;

      --accent: #ff0000;
      --danger: #ff4d4d;

      --user-bubble: #1b1b1b;

      --font:
        "Söhne",
        Inter,
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;

      --mono:
        "Söhne Mono",
        Consolas,
        Monaco,
        monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       APP
    ========================================================= */

    .chat-app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      width: 280px;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      z-index: 300;
    }

    .sidebar-top {
      padding: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-close {
      display: none;
    }

    .new-chat-btn {
      margin: 0 13px 12px;
      min-height: 43px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      transition: 0.18s ease;
    }

    .new-chat-btn:hover {
      background: var(--surface-2);
      border-color: #3b3b3b;
    }

    .new-chat-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* Search */

    .search-wrap {
      padding: 0 13px 12px;
    }

    .search-box {
      height: 39px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
    }

    .search-icon {
      color: var(--text-muted);
      font-size: 15px;
    }

    .search-box input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 12px;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    /* History */

    .history {
      flex: 1;
      overflow-y: auto;
      padding: 2px 9px 12px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .history-group {
      margin-bottom: 17px;
    }

    .history-label {
      padding: 5px 8px 7px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .history-item {
      width: 100%;
      min-height: 40px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 9px;
      background: transparent;
      color: var(--text-secondary);
      text-align: left;
      transition: 0.18s ease;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--surface);
      color: var(--text);
    }

    .history-item-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .history-more {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      opacity: 0;
      font-size: 16px;
      flex-shrink: 0;
    }

    .history-item:hover .history-more {
      opacity: 1;
    }

    .history-more:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .sidebar-bottom {
      padding: 10px 13px 14px;
      border-top: 1px solid var(--border);
    }

    .sidebar-link {
      width: 100%;
      min-height: 39px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 9px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      text-align: left;
    }

    .sidebar-link:hover {
      background: var(--surface);
      color: var(--text);
    }

    /* =========================================================
       SIDEBAR OVERLAY
    ========================================================= */

    .sidebar-overlay {
      display: none;
    }

    /* =========================================================
       MAIN CHAT
    ========================================================= */

    .chat-main {
      min-width: 0;
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* =========================================================
       CHAT TOP BAR
    ========================================================= */

    .chat-topbar {
      height: 62px;
      flex-shrink: 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(14px);
      z-index: 100;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mobile-menu-btn {
      display: none;
    }

    .model-selector {
      min-height: 38px;
      padding: 0 10px;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .model-selector:hover {
      background: var(--surface);
    }

    .model-status {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 7px rgba(255, 0, 0, 0.35);
    }

    .model-arrow {
      color: var(--text-muted);
      font-size: 11px;
    }

    .top-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      font-size: 19px;
      transition: 0.18s ease;
    }

    .top-icon-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    /* =========================================================
       CHAT AREA
    ========================================================= */

    .messages {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .messages-inner {
      width: min(100%, 850px);
      margin: 0 auto;
      padding: 30px 20px 165px;
    }

    /* Empty state */

    .empty-state {
      min-height: calc(100dvh - 250px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 0;
    }

    .empty-logo {
      width: 52px;
      height: 52px;
      margin-bottom: 17px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      display: grid;
      place-items: center;
      font-size: 23px;
    }

    .empty-state h1 {
      font-size: 24px;
      letter-spacing: -0.7px;
      margin-bottom: 8px;
    }

    .empty-state p {
      max-width: 390px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Suggestion cards */

    .suggestions {
      width: min(100%, 650px);
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .suggestion {
      min-height: 67px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text-secondary);
      text-align: left;
      transition: 0.18s ease;
    }

    .suggestion:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: #3b3b3b;
    }

    .suggestion strong {
      display: block;
      color: var(--text);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .suggestion span {
      font-size: 11px;
      line-height: 1.4;
    }

    /* =========================================================
       MESSAGE
    ========================================================= */

    .message {
      display: flex;
      flex-direction: column;
      margin: 0 0 28px;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.ai {
      align-items: flex-start;
    }

    /* User bubble */

    .user-bubble {
      max-width: min(82%, 620px);
      padding: 11px 14px;
      border-radius: 17px 17px 4px 17px;
      background: var(--user-bubble);
      border: 1px solid #2b2b2b;
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* AI response */

    .ai-response {
      width: 100%;
      color: var(--text);
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-response a {
      text-decoration: underline;
    }

    .ai-response code {
      font-family: var(--mono);
      font-size: 12px;
    }

    .ai-response pre {
      margin: 12px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #080808;
      overflow-x: auto;
      white-space: pre;
    }

    /* =========================================================
       MESSAGE ACTIONS
    ========================================================= */

    .message-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 7px;
    }

    .user .message-actions {
      justify-content: flex-end;
    }

    .message-action {
      min-width: 29px;
      height: 29px;
      padding: 0 6px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-size: 14px;
      transition: 0.16s ease;
    }

    .message-action:hover {
      background: var(--surface);
      color: var(--text);
    }

    .message-action.active {
      color: var(--text);
      background: var(--surface-2);
    }

    .action-label {
      font-size: 11px;
      margin-left: 3px;
    }

    /* =========================================================
       TYPING
    ========================================================= */

    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 5px 0 2px;
      margin-bottom: 28px;
    }

    .typing.show {
      display: flex;
    }

    .typing-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #999999;
      animation: typing 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    /* =========================================================
       COMPOSER
    ========================================================= */

    .composer-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 13px 16px 15px;
      background:
        linear-gradient(
          to top,
          #000000 65%,
          rgba(0, 0, 0, 0.92) 82%,
          rgba(0, 0, 0, 0)
        );
      z-index: 80;
    }

    .composer-wrap {
      width: min(100%, 850px);
      margin: 0 auto;
    }

    .composer {
      border: 1px solid var(--border);
      border-radius: 19px;
      background: var(--surface);
      padding: 9px 10px 9px 12px;
      transition: border-color 0.18s ease;
    }

    .composer:focus-within {
      border-color: #424242;
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 43px;
      max-height: 170px;
      padding: 4px 2px 9px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .composer textarea::placeholder {
      color: var(--text-muted);
    }

    .composer-toolbar {
      min-height: 37px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .composer-left,
    .composer-right {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .composer-btn {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border-radius: 9px;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 14px;
    }

    .composer-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .composer-send {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--text);
      color: #000000;
      display: grid;
      place-items: center;
      font-size: 16px;
      transition: 0.18s ease;
    }

    .composer-send:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .composer-send:disabled {
      opacity: 0.35;
      transform: none;
      cursor: default;
    }

    .composer-note {
      padding: 7px 3px 0;
      text-align: center;
      color: #555555;
      font-size: 9px;
      line-height: 1.4;
    }

    /* =========================================================
       ATTACHMENT PREVIEW
    ========================================================= */

    .attachments {
      display: none;
      flex-wrap: wrap;
      gap: 7px;
      padding: 2px 0 8px;
    }

    .attachments.show {
      display: flex;
    }

    .attachment {
      max-width: 180px;
      min-height: 32px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 10px;
    }

    .attachment-remove {
      width: 19px;
      height: 19px;
      border-radius: 5px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
    }

    .attachment-remove:hover {
      background: var(--surface-3);
      color: var(--text);
    }

    /* =========================================================
       CONTEXT MENU
    ========================================================= */

    .context-menu {
      position: fixed;
      width: 185px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #111111;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
    }

    .context-menu.show {
      display: block;
    }

    .context-item {
      width: 100%;
      min-height: 36px;
      padding: 0 9px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      text-align: left;
    }

    .context-item:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .context-item.danger:hover {
      color: var(--danger);
    }

    /* =========================================================
       TOAST
    ========================================================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      transform: translate(-50%, 15px);
      padding: 9px 13px;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 1500;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(86vw, 310px);
        transform: translateX(-105%);
        transition: transform 0.22s ease;
        box-shadow: 20px 0 50px rgba(0, 0, 0, 0.45);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-close {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: transparent;
        color: var(--text-secondary);
        font-size: 18px;
      }

      .sidebar-close:hover {
        background: var(--surface);
        color: var(--text);
      }

      .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.58);
        z-index: 250;
        display: none;
      }

      .sidebar-overlay.show {
        display: block;
      }

      .mobile-menu-btn {
        display: grid;
      }

      .chat-topbar {
        height: 58px;
        padding: 0 9px;
      }

      .model-selector {
        padding: 0 7px;
      }

      .messages-inner {
        padding: 22px 14px 165px;
      }

      .empty-state {
        min-height: calc(100dvh - 240px);
      }

      .empty-state h1 {
        font-size: 22px;
      }

      .suggestions {
        grid-template-columns: 1fr;
        width: 100%;
        max-width: 430px;
      }

      .suggestion {
        min-height: 58px;
      }

      .user-bubble {
        max-width: 88%;
        font-size: 13px;
      }

      .ai-response {
        font-size: 13px;
      }

      .composer-area {
        padding: 9px 9px calc(9px + env(safe-area-inset-bottom));
      }

      .composer {
        border-radius: 17px;
      }

      .composer-note {
        display: none;
      }

      .composer-btn .text-label {
        display: none;
      }

      .toast {
        bottom: 82px;
      }
    }

    @media (max-width: 390px) {
      .top-icon-btn {
        width: 34px;
        height: 34px;
      }

      .model-selector {
        font-size: 12px;
      }

      .message-actions {
        gap: 0;
      }

      .message-action {
        min-width: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="chat-app">

    <!-- =======================================================
         SIDEBAR
    ======================================================== -->

    <aside id="sidebar" class="sidebar">

      <div class="sidebar-top">

        <a href="index.html" class="sidebar-brand">
          <div class="brand-icon">✦</div>
          <div class="brand-title">RG Creator AI</div>
        </a>

        <button
          id="sidebarClose"
          class="sidebar-close"
          type="button"
          aria-label="Close sidebar"
        >
          ×
        </button>

      </div>

      <button
        id="newChatBtn"
        class="new-chat-btn"
        type="button"
      >
        <span class="new-chat-icon">＋</span>
        <span>New Chat</span>
      </button>

      <!-- Search -->
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon">⌕</span>

          <input
            id="chatSearch"
            type="search"
            placeholder="Search chats"
            autocomplete="off"
            aria-label="Search chats"
          />
        </div>
      </div>

      <!-- History -->
      <div id="history" class="history">

        <div class="history-group">
          <div class="history-label">Today</div>

          <button
            class="history-item"
            type="button"
            data-title="YouTube Shorts Ideas"
          >
            <span class="history-item-title">
              YouTube Shorts Ideas
            </span>

            <span class="history-more">⋯</span>
          </button>

          <button
            class="history-item"
            type="button"
            data-title="Website Code"
          >
            <span class="history-item-title">
              Website Code
            </span>

            <span class="history-more">⋯</span>
          </button>
        </div>

        <div class="history-group">
          <div class="history-label">Yesterday</div>

          <button
            class="history-item"
            type="button"
            data-title="Instagram Caption"
          >
            <span class="history-item-title">
              Instagram Caption
            </span>

            <span class="history-more">⋯</span>
          </button>
        </div>

        <div class="history-group">
          <div class="history-label">Previous 7 Days</div>

          <button
            class="history-item"
            type="button"
            data-title="Image Prompt"
          >
            <span class="history-item-title">
              Image Prompt
            </span>

            <span class="history-more">⋯</span>
          </button>

          <button
            class="history-item"
            type="button"
            data-title="Content Writing"
          >
            <span class="history-item-title">
              Content Writing
            </span>

            <span class="history-more">⋯</span>
          </button>
        </div>

      </div>

      <div class="sidebar-bottom">

        <button
          class="sidebar-link"
          type="button"
          onclick="showToast('Settings will be added to the profile menu')"
        >
          <span>⚙</span>
          <span>Settings</span>
        </button>

      </div>

    </aside>

    <div
      id="sidebarOverlay"
      class="sidebar-overlay"
    ></div>

    <!-- =======================================================
         CHAT MAIN
    ======================================================== -->

    <section class="chat-main">

      <!-- TOP BAR -->

      <header class="chat-topbar">

        <div class="topbar-left">

          <button
            id="mobileMenuBtn"
            class="top-icon-btn mobile-menu-btn"
            type="button"
            aria-label="Open sidebar"
          >
            ☰
          </button>

          <button
            id="modelSelector"
            class="model-selector"
            type="button"
            aria-label="Select AI model"
          >
            <span class="model-status"></span>
            <span>RG AI</span>
            <span class="model-arrow">▾</span>
          </button>

        </div>

        <div class="topbar-right">

          <button
            id="topNewChat"
            class="top-icon-btn"
            type="button"
            aria-label="New chat"
            title="New Chat"
          >
            ＋
          </button>

          <button
            id="topMore"
            class="top-icon-btn"
            type="button"
            aria-label="More options"
            title="More"
          >
            ⋯
          </button>

        </div>

      </header>

      <!-- MESSAGES -->

      <div
        id="messages"
        class="messages"
        aria-live="polite"
      >

        <div
          id="messagesInner"
          class="messages-inner"
        >

          <!-- EMPTY STATE -->

          <section id="emptyState" class="empty-state">

            <div class="empty-logo">✦</div>

            <h1>How can I help you?</h1>

            <p>
              Ask anything, write content, generate code,
              plan your next video or create something new.
            </p>

            <div class="suggestions">

              <button
                class="suggestion"
                type="button"
                data-prompt="Give me 5 creative YouTube Shorts ideas."
              >
                <strong>💡 Get ideas</strong>
                <span>
                  Give me creative ideas for my next content.
                </span>
              </button>

              <button
                class="suggestion"
                type="button"
                data-prompt="Write an engaging Instagram caption for a dance reel."
              >
                <strong>📸 Write content</strong>
                <span>
                  Create a caption, script or social post.
                </span>
              </button>

              <button
                class="suggestion"
                type="button"
                data-prompt="Create a responsive login page using HTML and CSS."
              >
                <strong>💻 Write code</strong>
                <span>
                  Generate or fix code for your project.
                </span>
              </button>

              <button
                class="suggestion"
                type="button"
                data-prompt="Create a cinematic image prompt for a futuristic city."
              >
                <strong>🖼️ Create an image</strong>
                <span>
                  Turn your idea into an image prompt.
                </span>
              </button>

            </div>

          </section>

          <!-- DYNAMIC MESSAGES ARE INSERTED HERE -->

          <div
            id="typingIndicator"
            class="typing"
            aria-label="AI is typing"
          >
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>

        </div>

      </div>

      <!-- =====================================================
           COMPOSER
      ====================================================== -->

      <div class="composer-area">

        <div class="composer-wrap">

          <div class="composer">

            <div
              id="attachments"
              class="attachments"
            ></div>

            <textarea
              id="messageInput"
              rows="1"
              maxlength="12000"
              placeholder="Ask anything..."
              aria-label="Message"
            ></textarea>

            <div class="composer-toolbar">

              <div class="composer-left">

                <button
                  id="attachBtn"
                  class="composer-btn"
                  type="button"
                  aria-label="Attach files"
                  title="Attach"
                >
                  <span>＋</span>
                  <span class="text-label">Attach</span>
                </button>

                <button
                  id="voiceBtn"
                  class="composer-btn"
                  type="button"
                  aria-label="Voice input"
                  title="Voice"
                >
                  <span>🎤</span>
                  <span class="text-label">Voice</span>
                </button>

                <input
                  id="fileInput"
                  type="file"
                  accept="image/*,.pdf,.txt,.csv,.doc,.docx"
                  multiple
                  hidden
                />

              </div>

              <div class="composer-right">

                <button
                  id="sendBtn"
                  class="composer-send"
                  type="button"
                  aria-label="Send message"
                  title="Send"
                >
                  ➤
                </button>

              </div>

            </div>

          </div>

          <div class="composer-note">
            RG Creator AI can make mistakes. Check important information.
          </div>

        </div>

      </div>

    </section>

  </div>

  <!-- =========================================================
       CONTEXT MENU
  ========================================================== -->

  <div
    id="contextMenu"
    class="context-menu"
  >

    <button
      class="context-item"
      type="button"
      data-action="copy"
    >
      <span>⧉</span>
      <span>Copy</span>
    </button>

    <button
      class="context-item"
      type="button"
      data-action="regenerate"
    >
      <span>↻</span>
      <span>Regenerate</span>
    </button>

    <button
      class="context-item"
      type="button"
      data-action="read"
    >
      <span>◉</span>
      <span>Read aloud</span>
    </button>

    <button
      class="context-item"
      type="button"
      data-action="share"
    >
      <span>↗</span>
      <span>Share</span>
    </button>

    <button
      class="context-item"
      type="button"
      data-action="save"
    >
      <span>☆</span>
      <span>Save to Favorites</span>
    </button>

    <button
      class="context-item danger"
      type="button"
      data-action="delete"
    >
      <span>⌫</span>
      <span>Delete</span>
    </button>

  </div>

  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
    role="status"
  ></div>

  <script>
    /* =========================================================
       ELEMENTS
    ========================================================= */

    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const sidebarClose = document.getElementById("sidebarClose");

    const newChatBtn = document.getElementById("newChatBtn");
    const topNewChat = document.getElementById("topNewChat");

    const modelSelector = document.getElementById("modelSelector");
    const topMore = document.getElementById("topMore");

    const messages = document.getElementById("messages");
    const messagesInner = document.getElementById("messagesInner");
    const emptyState = document.getElementById("emptyState");
    const typingIndicator = document.getElementById("typingIndicator");

    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    const attachBtn = document.getElementById("attachBtn");
    const voiceBtn = document.getElementById("voiceBtn");
    const fileInput = document.getElementById("fileInput");

    const attachments = document.getElementById("attachments");

    const chatSearch = document.getElementById("chatSearch");
    const contextMenu = document.getElementById("contextMenu");

    const toast = document.getElementById("toast");

    let selectedMessage = null;
    let selectedHistoryItem = null;
    let attachedFiles = [];
    let isGenerating = false;

    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(window.__rgChatToast);

      window.__rgChatToast = setTimeout(() => {
        toast.classList.remove("show");
      }, 2300);
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("show");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("show");
    }

    mobileMenuBtn.addEventListener("click", openSidebar);
    sidebarClose.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    /* =========================================================
       NEW CHAT
    ========================================================= */

    function startNewChat() {
      const dynamicMessages =
        messagesInner.querySelectorAll(".message");

      dynamicMessages.forEach((message) => message.remove());

      emptyState.style.display = "flex";

      typingIndicator.classList.remove("show");

      messageInput.value = "";
      attachedFiles = [];
      renderAttachments();

      autoResize();

      selectedMessage = null;

      closeSidebar();

      window.scrollTo(0, 0);

      messageInput.focus();

      showToast("New chat started");
    }

    newChatBtn.addEventListener("click", startNewChat);
    topNewChat.addEventListener("click", startNewChat);

    /* =========================================================
       MODEL SELECTOR
    ========================================================= */

    modelSelector.addEventListener("click", () => {
      showToast("Model selection will be connected to available Gemini models");
    });

    /* =========================================================
       TOP MORE
    ========================================================= */

    topMore.addEventListener("click", (event) => {
      showContextMenu(event.clientX, event.clientY);
    });

    /* =========================================================
       SEARCH
    ========================================================= */

    chatSearch.addEventListener("input", () => {
      const query = chatSearch.value.trim().toLowerCase();

      document
        .querySelectorAll(".history-item")
        .forEach((item) => {
          const title =
            item.dataset.title?.toLowerCase() || "";

          item.style.display =
            !query || title.includes(query)
              ? "flex"
              : "none";
        });
    });

    /* =========================================================
       HISTORY
    ========================================================= */

    document
      .querySelectorAll(".history-item")
      .forEach((item) => {

        item.addEventListener("click", (event) => {

          if (
            event.target.classList.contains("history-more")
          ) {
            event.stopPropagation();

            selectedHistoryItem = item;

            showContextMenu(
              event.clientX,
              event.clientY,
              "history"
            );

            return;
          }

          document
            .querySelectorAll(".history-item")
            .forEach((historyItem) => {
              historyItem.classList.remove("active");
            });

          item.classList.add("active");

          closeSidebar();

          showToast(
            "Chat history will be connected to the database"
          );
        });

      });

    /* =========================================================
       SUGGESTIONS
    ========================================================= */

    document
      .querySelectorAll(".suggestion")
      .forEach((button) => {

        button.addEventListener("click", () => {

          const prompt = button.dataset.prompt || "";

          messageInput.value = prompt;

          autoResize();

          messageInput.focus();

        });

      });

    /* =========================================================
       TEXTAREA AUTO RESIZE
    ========================================================= */

    function autoResize() {
      messageInput.style.height = "auto";

      const height = Math.min(
        messageInput.scrollHeight,
        170
      );

      messageInput.style.height = height + "px";
    }

    messageInput.addEventListener("input", autoResize);

    /* =========================================================
       ENTER TO SEND
    ========================================================= */

    messageInput.addEventListener("keydown", (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }

    });

    /* =========================================================
       SEND
    ========================================================= */

    sendBtn.addEventListener("click", sendMessage);

    async function sendMessage() {

      if (isGenerating) {
        return;
      }

      const text = messageInput.value.trim();

      if (!text && attachedFiles.length === 0) {
        messageInput.focus();
        return;
      }

      const prompt = text;

      messageInput.value = "";
      autoResize();

      emptyState.style.display = "none";

      renderAttachments();

      addUserMessage(prompt);

      /*
       * API connection is intentionally not placed here.
       * The next phase will connect chat.js to the Gemini
       * backend using a server-side API key.
       */

      setGenerating(true);

      await fakeConnectionPreview();

    }

    /* =========================================================
       TEMPORARY CONNECTION PREVIEW
    ========================================================= */

    function fakeConnectionPreview() {

      return new Promise((resolve) => {

        setTimeout(() => {

          setGenerating(false);

          addAIMessage(
            "AI Chat is ready for the Gemini API connection. The backend will be connected in the next step."
          );

          resolve();

        }, 650);

      });

    }

    /* =========================================================
       GENERATING STATE
    ========================================================= */

    function setGenerating(value) {

      isGenerating = value;

      sendBtn.disabled = value;

      if (value) {
        typingIndicator.classList.add("show");
      } else {
        typingIndicator.classList.remove("show");
      }

      scrollToBottom();

    }

    /* =========================================================
       ADD USER MESSAGE
    ========================================================= */

    function addUserMessage(text) {

      const message = document.createElement("article");

      message.className = "message user";

      const bubble = document.createElement("div");

      bubble.className = "user-bubble";
      bubble.textContent = text;

      const actions = document.createElement("div");

      actions.className = "message-actions";

      const copyBtn = createActionButton(
        "⧉",
        "Copy",
        () => copyText(text)
      );

      const editBtn = createActionButton(
        "✎",
        "Edit",
        () => editMessage(message, text)
      );

      actions.appendChild(copyBtn);
      actions.appendChild(editBtn);

      message.appendChild(bubble);
      message.appendChild(actions);

      messagesInner.insertBefore(
        message,
        typingIndicator
      );

      scrollToBottom();

      return message;

    }

    /* =========================================================
       ADD AI MESSAGE
    ========================================================= */

    function addAIMessage(text) {

      const message = document.createElement("article");

      message.className = "message ai";

      const response = document.createElement("div");

      response.className = "ai-response";

      response.textContent = text;

      const actions = document.createElement("div");

      actions.className = "message-actions";

      const copyBtn = createActionButton(
        "⧉",
        "Copy",
        () => copyText(text)
      );

      const likeBtn = createActionButton(
        "♡",
        "Like",
        () => toggleAction(likeBtn, "♡", "♥")
      );

      const unlikeBtn = createActionButton(
        "♧",
        "Unlike",
        () => toggleAction(unlikeBtn, "♧", "♣")
      );

      const shareBtn = createActionButton(
        "↗",
        "Share",
        () => shareText(text)
      );

      const regenerateBtn = createActionButton(
        "↻",
        "Regenerate",
        () => showToast("Regenerate will use the Gemini response API")
      );

      const moreBtn = createActionButton(
        "⋯",
        "More",
        (event) => {
          selectedMessage = {
            element: message,
            text
          };

          const rect =
            event.currentTarget.getBoundingClientRect();

          showContextMenu(
            rect.right,
            rect.bottom,
            "message"
          );
        }
      );

      actions.appendChild(copyBtn);
      actions.appendChild(likeBtn);
      actions.appendChild(unlikeBtn);
      actions.appendChild(shareBtn);
      actions.appendChild(regenerateBtn);
      actions.appendChild(moreBtn);

      message.appendChild(response);
      message.appendChild(actions);

      messagesInner.insertBefore(
        message,
        typingIndicator
      );

      scrollToBottom();

      return message;

    }

    /* =========================================================
       ACTION BUTTON
    ========================================================= */

    function createActionButton(
      icon,
      label,
      handler
    ) {

      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "message-action";
      button.setAttribute(
        "aria-label",
        label
      );
      button.title = label;

      button.textContent = icon;

      button.addEventListener(
        "click",
        handler
      );

      return button;

    }

    /* =========================================================
       COPY
    ========================================================= */

    async function copyText(text) {

      try {

        await navigator.clipboard.writeText(text);

        showToast("Copied");

      } catch (error) {

        showToast("Copy is not available");

      }

    }

    /* =========================================================
       EDIT USER MESSAGE
    ========================================================= */

    function editMessage(
      messageElement,
      originalText
    ) {

      messageInput.value = originalText;

      autoResize();

      messageInput.focus();

      messageElement.remove();

      showToast("Edit your message and send again");

    }

    /* =========================================================
       LIKE / UNLIKE
    ========================================================= */

    function toggleAction(
      button,
      normalIcon,
      activeIcon
    ) {

      const active =
        button.classList.toggle("active");

      button.textContent =
        active ? activeIcon : normalIcon;

    }

    /* =========================================================
       SHARE
    ========================================================= */

    async function shareText(text) {

      if (
        navigator.share
      ) {

        try {

          await navigator.share({
            title: "RG Creator AI",
            text
          });

          return;

        } catch (error) {

          return;

        }

      }

      await copyText(text);

      showToast("Response copied for sharing");

    }

    /* =========================================================
       SCROLL
    ========================================================= */

    function scrollToBottom() {

      requestAnimationFrame(() => {

        messages.scrollTo({
          top: messages.scrollHeight,
          behavior: "smooth"
        });

      });

    }

    /* =========================================================
       ATTACH FILES
    ========================================================= */

    attachBtn.addEventListener(
      "click",
      () => fileInput.click()
    );

    fileInput.addEventListener(
      "change",
      () => {

        const files =
          Array.from(fileInput.files || []);

        if (!files.length) {
          return;
        }

        attachedFiles =
          attachedFiles.concat(files);

        renderAttachments();

        /*
         * Actual file upload and multimodal Gemini
         * processing will be connected in the backend phase.
         */

        showToast(
          files.length === 1
            ? "File attached"
            : `${files.length} files attached`
        );

        fileInput.value = "";

      }
    );

    function renderAttachments() {

      attachments.innerHTML = "";

      if (!attachedFiles.length) {

        attachments.classList.remove("show");

        return;

      }

      attachments.classList.add("show");

      attachedFiles.forEach(
        (file, index) => {

          const item =
            document.createElement("div");

          item.className = "attachment";

          const icon =
            document.createElement("span");

          icon.textContent =
            file.type.startsWith("image/")
              ? "🖼️"
              : "📄";

          const name =
            document.createElement("span");

          name.textContent =
            file.name;

          name.style.overflow = "hidden";
          name.style.textOverflow = "ellipsis";
          name.style.whiteSpace = "nowrap";

          const remove =
            document.createElement("button");

          remove.type = "button";
          remove.className =
            "attachment-remove";

          remove.textContent = "×";

          remove.setAttribute(
            "aria-label",
            "Remove attachment"
          );

          remove.addEventListener(
            "click",
            () => {

              attachedFiles.splice(
                index,
                1
              );

              renderAttachments();

            }
          );

          item.appendChild(icon);
          item.appendChild(name);
          item.appendChild(remove);

          attachments.appendChild(item);

        }
      );

    }

    /* =========================================================
       VOICE INPUT
    ========================================================= */

    voiceBtn.addEventListener(
      "click",
      startVoiceInput
    );

    function startVoiceInput() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        showToast(
          "Voice input is not supported on this browser"
        );

        return;

      }

      const recognition =
        new SpeechRecognition();

      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      voiceBtn.classList.add("active");

      recognition.start();

      recognition.onresult = (event) => {

        const transcript =
          event.results[0][0].transcript;

        messageInput.value =
          messageInput.value
            ? messageInput.value + " " + transcript
            : transcript;

        autoResize();

      };

      recognition.onerror = () => {
        showToast("Voice input could not be started");
      };

      recognition.onend = () => {
        voiceBtn.classList.remove("active");
      };

    }

    /* =========================================================
       CONTEXT MENU
    ========================================================= */

    function showContextMenu(
      x,
      y,
      type = "general"
    ) {

      contextMenu.classList.add("show");

      const width =
        contextMenu.offsetWidth;

      const height =
        contextMenu.offsetHeight;

      const left =
        Math.min(
          x,
          window.innerWidth - width - 8
        );

      const top =
        Math.min(
          y,
          window.innerHeight - height - 8
        );

      contextMenu.style.left =
        Math.max(8, left) + "px";

      contextMenu.style.top =
        Math.max(8, top) + "px";

    }

    function hideContextMenu() {
      contextMenu.classList.remove("show");
    }

    document.addEventListener(
      "click",
      (event) => {

        if (
          !contextMenu.contains(event.target) &&
          event.target !== topMore
        ) {
          hideContextMenu();
        }

      }
    );

    /* =========================================================
       CONTEXT MENU ACTIONS
    ========================================================= */

    contextMenu
      .querySelectorAll(".context-item")
      .forEach((item) => {

        item.addEventListener(
          "click",
          async () => {

            const action =
              item.dataset.action;

            hideContextMenu();

            if (
              action === "copy" &&
              selectedMessage
            ) {

              await copyText(
                selectedMessage.text
              );

            } else if (
              action === "regenerate"
            ) {

              showToast(
                "Regenerate will be connected to Gemini"
              );

            } else if (
              action === "read"
            ) {

              readSelectedMessage();

            } else if (
              action === "share" &&
              selectedMessage
            ) {

              await shareText(
                selectedMessage.text
              );

            } else if (
              action === "save"
            ) {

              showToast(
                "Favorites will be added with account storage"
              );

            } else if (
              action === "delete"
            ) {

              if (
                selectedMessage &&
                selectedMessage.element
              ) {

                selectedMessage.element.remove();

                showToast("Message deleted");

              } else if (
                selectedHistoryItem
              ) {

                selectedHistoryItem.remove();

                showToast("Chat removed from this preview");

              }

            }

          }
        );

      });

    /* =========================================================
       READ ALOUD
    ========================================================= */

    function readSelectedMessage() {

      if (
        !selectedMessage ||
        !selectedMessage.text
      ) {

        showToast("Select an AI response first");

        return;

      }

      if (
        !("speechSynthesis" in window)
      ) {

        showToast(
          "Read aloud is not supported"
        );

        return;

      }

      window.speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          selectedMessage.text
        );

      utterance.rate = 1;
      utterance.pitch = 1;

      window.speechSynthesis.speak(
        utterance
      );

    }

    /* =========================================================
       INITIAL PROMPT FROM HOME
    ========================================================= */

    function loadInitialPrompt() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const urlPrompt =
        params.get("prompt");

      const storedPrompt =
        sessionStorage.getItem(
          "rgCreatorInitialPrompt"
        );

      const initialPrompt =
        urlPrompt || storedPrompt;

      if (initialPrompt) {

        messageInput.value =
          initialPrompt;

        sessionStorage.removeItem(
          "rgCreatorInitialPrompt"
        );

        autoResize();

        /*
         * Do not automatically send here.
         * User can review/edit the prompt first.
         */

        messageInput.focus();

      }

    }

    /* =========================================================
       ESCAPE KEY
    ========================================================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Escape") {

          closeSidebar();
          hideContextMenu();

        }

      }
    );

    /* =========================================================
       INITIALIZATION
    ========================================================= */

    loadInitialPrompt();
    autoResize();

  </script>

</body>
</html>
