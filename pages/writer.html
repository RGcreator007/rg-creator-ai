<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Content Writer — RG Creator AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Inter, Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    button,
    select,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      padding-bottom: 35px;
    }

    /* HEADER */

    .header {
      height: 64px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, .96);
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      background: #151515;
      color: #fff;
      font-size: 20px;
    }

    .brand {
      font-size: 17px;
      font-weight: 700;
    }

    .page-name {
      color: #888;
      font-size: 12px;
      margin-top: 2px;
    }

    .more-btn {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 23px;
    }

    /* MAIN */

    .container {
      width: min(900px, 100%);
      margin: auto;
      padding: 30px 18px 60px;
    }

    .hero {
      margin-bottom: 27px;
    }

    .hero h1 {
      font-size: 32px;
      line-height: 1.15;
      margin-bottom: 9px;
    }

    .hero p {
      color: #999;
      line-height: 1.5;
      font-size: 15px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* CATEGORY */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .category-btn {
      min-height: 70px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid #292929;
      background: #101010;
      color: #bbb;
      text-align: left;
    }

    .category-btn strong {
      display: block;
      color: #fff;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .category-btn span {
      font-size: 11px;
      color: #777;
    }

    .category-btn.active {
      border-color: #e52b2b;
      background: #190909;
    }

    /* TOOL */

    .tool-box {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 17px;
      padding: 16px;
    }

    .tool-box label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border-radius: 11px;
      border: 1px solid #333;
      background: #171717;
      color: #fff;
      outline: none;
    }

    /* INPUT */

    .input-box {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 17px;
      padding: 14px;
    }

    textarea {
      width: 100%;
      min-height: 145px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 15px;
      line-height: 1.55;
    }

    textarea::placeholder {
      color: #666;
    }

    /* OPTIONS */

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .option-box {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 14px;
    }

    /* GENERATE */

    .generate-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      transition: .2s;
    }

    .generate-btn:hover {
      background: #eee;
      transform: translateY(-1px);
    }

    .generate-btn:disabled {
      opacity: .55;
      transform: none;
    }

    /* RESULT */

    .result {
      display: none;
      margin-top: 28px;
    }

    .result-card {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 17px;
      overflow: hidden;
    }

    .result-header {
      padding: 15px;
      border-bottom: 1px solid #292929;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-title {
      font-size: 14px;
      font-weight: 700;
    }

    .result-status {
      color: #777;
      font-size: 11px;
    }

    .result-text {
      padding: 18px;
      color: #ddd;
      white-space: pre-wrap;
      line-height: 1.65;
      font-size: 14px;
      min-height: 180px;
    }

    .result-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #292929;
    }

    .action-btn {
      padding: 10px 5px;
      border-radius: 10px;
      border: 1px solid #303030;
      background: #161616;
      color: #ddd;
      font-size: 12px;
    }

    .action-btn:hover {
      background: #222;
    }

    /* MOBILE NAV */

    .bottom-nav {
      display: none;
    }

    @media (max-width: 650px) {

      .container {
        padding: 25px 14px 95px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .category-grid {
        grid-template-columns: 1fr 1fr;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .result-actions {
        grid-template-columns: 1fr 1fr;
      }

      .bottom-nav {
        position: fixed;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        bottom: 0;
        left: 0;
        right: 0;
        height: 68px;
        background: rgba(10,10,10,.97);
        border-top: 1px solid #292929;
        z-index: 50;
        backdrop-filter: blur(12px);
      }

      .nav-item {
        background: transparent;
        border: 0;
        color: #777;
        font-size: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      .nav-item .icon {
        font-size: 19px;
      }

      .nav-item.active {
        color: #fff;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- HEADER -->

    <header class="header">

      <div class="header-left">

        <button class="back-btn" onclick="goBack()">
          ←
        </button>

        <div>
          <div class="brand">RG Creator AI</div>
          <div class="page-name">Content Writer</div>
        </div>

      </div>

      <button class="more-btn" onclick="openMore()">
        ⋯
      </button>

    </header>


    <!-- MAIN -->

    <main class="container">

      <section class="hero">

        <h1>Content Writer</h1>

        <p>
          Create captions, scripts, ideas, blogs, marketing copy and more.
        </p>

      </section>


      <!-- CATEGORY -->

      <section class="section">

        <div class="section-title">
          What do you want to write?
        </div>

        <div class="category-grid">

          <button
            class="category-btn active"
            data-category="Social Media"
            onclick="selectCategory(this)"
          >
            <strong>📱 Social Media</strong>
            <span>Captions, bios & keywords</span>
          </button>

          <button
            class="category-btn"
            data-category="YouTube"
            onclick="selectCategory(this)"
          >
            <strong>▶️ YouTube</strong>
            <span>Titles, scripts & hooks</span>
          </button>

          <button
            class="category-btn"
            data-category="Writing"
            onclick="selectCategory(this)"
          >
            <strong>📝 Writing</strong>
            <span>Blogs, stories & articles</span>
          </button>

          <button
            class="category-btn"
            data-category="Marketing"
            onclick="selectCategory(this)"
          >
            <strong>📢 Marketing</strong>
            <span>Ads & product copy</span>
          </button>

        </div>

      </section>


      <!-- SPECIFIC TOOL -->

      <section class="section">

        <div class="section-title">
          Select a writing tool
        </div>

        <div class="tool-box">

          <label for="tool">
            Writing type
          </label>

          <select id="tool">

            <optgroup label="Social Media">

              <option value="Instagram Caption">
                Instagram Caption
              </option>

              <option value="Instagram Bio">
                Instagram Bio
              </option>

              <option value="Reel Caption">
                Reel Caption
              </option>

              <option value="Hashtags / Keywords">
                Hashtags / Keywords
              </option>

            </optgroup>


            <optgroup label="YouTube">

              <option value="YouTube Title">
                YouTube Title
              </option>

              <option value="YouTube Description">
                YouTube Description
              </option>

              <option value="Shorts Script">
                Shorts Script
              </option>

              <option value="Video Ideas">
                Video Ideas
              </option>

              <option value="YouTube Hook">
                YouTube Hook
              </option>

            </optgroup>


            <optgroup label="Writing">

              <option value="Blog">
                Blog
              </option>

              <option value="Article">
                Article
              </option>

              <option value="Story">
                Story
              </option>

              <option value="Rewrite">
                Rewrite
              </option>

              <option value="Improve Text">
                Improve Text
              </option>

            </optgroup>


            <optgroup label="Marketing">

              <option value="Advertisement">
                Advertisement
              </option>

              <option value="Product Description">
                Product Description
              </option>

              <option value="Promotional Copy">
                Promotional Copy
              </option>

            </optgroup>

          </select>

        </div>

      </section>


      <!-- INPUT -->

      <section class="section">

        <div class="section-title">
          Topic / Details
        </div>

        <div class="input-box">

          <textarea
            id="topic"
            placeholder="Example: Create a viral caption for a dance Reel..."
          ></textarea>

        </div>

      </section>


      <!-- OPTIONS -->

      <section class="section">

        <div class="options">

          <div class="option-box">

            <label for="tone">
              Tone
            </label>

            <select id="tone">

              <option value="Viral">
                Viral
              </option>

              <option value="Professional">
                Professional
              </option>

              <option value="Funny">
                Funny
              </option>

              <option value="Emotional">
                Emotional
              </option>

              <option value="Casual">
                Casual
              </option>

            </select>

          </div>


          <div class="option-box">

            <label for="length">
              Length
            </label>

            <select id="length">

              <option value="Short">
                Short
              </option>

              <option value="Medium" selected>
                Medium
              </option>

              <option value="Long">
                Long
              </option>

            </select>

          </div>

        </div>

      </section>


      <!-- GENERATE -->

      <section class="section">

        <button
          class="generate-btn"
          id="generateBtn"
          onclick="generateContent()"
        >
          ✦ Generate
        </button>

      </section>


      <!-- RESULT -->

      <section class="result" id="result">

        <div class="result-card">

          <div class="result-header">

            <div class="result-title">
              Generated Content
            </div>

            <div
              class="result-status"
              id="resultStatus"
            >
              Ready
            </div>

          </div>


          <div
            class="result-text"
            id="resultText"
          ></div>


          <div class="result-actions">

            <button
              class="action-btn"
              onclick="copyResult()"
            >
              Copy
            </button>

            <button
              class="action-btn"
              onclick="editResult()"
            >
              Edit
            </button>

            <button
              class="action-btn"
              onclick="regenerateContent()"
            >
              ↻ Regenerate
            </button>

            <button
              class="action-btn"
              onclick="shareResult()"
            >
              Share
            </button>

          </div>

        </div>

      </section>

    </main>


    <!-- MOBILE NAV -->

    <nav class="bottom-nav">

      <button
        class="nav-item"
        onclick="goHome()"
      >
        <span class="icon">⌂</span>
        <span>Home</span>
      </button>

      <button
        class="nav-item"
        onclick="goChat()"
      >
        <span class="icon">💬</span>
        <span>AI Chat</span>
      </button>

      <button
        class="nav-item active"
      >
        <span class="icon">✦</span>
        <span>Tools</span>
      </button>

      <button
        class="nav-item"
        onclick="goProfile()"
      >
        <span class="icon">◉</span>
        <span>Profile</span>
      </button>

    </nav>

  </div>


  <script>

    let selectedCategory = "Social Media";
    let lastGenerated = "";


    /* CATEGORY */

    function selectCategory(button) {

      document
        .querySelectorAll(".category-btn")
        .forEach(btn => {
          btn.classList.remove("active");
        });

      button.classList.add("active");

      selectedCategory = button.dataset.category;

      updateTools();

    }


    /* UPDATE TOOLS */

    function updateTools() {

      const tool = document.getElementById("tool");

      if (selectedCategory === "Social Media") {

        tool.innerHTML = `

          <option>Instagram Caption</option>
          <option>Instagram Bio</option>
          <option>Reel Caption</option>
          <option>Hashtags / Keywords</option>

        `;

      }


      if (selectedCategory === "YouTube") {

        tool.innerHTML = `

          <option>YouTube Title</option>
          <option>YouTube Description</option>
          <option>Shorts Script</option>
          <option>Video Ideas</option>
          <option>YouTube Hook</option>

        `;

      }


      if (selectedCategory === "Writing") {

        tool.innerHTML = `

          <option>Blog</option>
          <option>Article</option>
          <option>Story</option>
          <option>Rewrite</option>
          <option>Improve Text</option>

        `;

      }


      if (selectedCategory === "Marketing") {

        tool.innerHTML = `

          <option>Advertisement</option>
          <option>Product Description</option>
          <option>Promotional Copy</option>

        `;

      }

    }


    /* GENERATE */

    async function generateContent() {

      const topic =
        document.getElementById("topic")
          .value
          .trim();

      const tool =
        document.getElementById("tool").value;

      const tone =
        document.getElementById("tone").value;

      const length =
        document.getElementById("length").value;

      const button =
        document.getElementById("generateBtn");

      const result =
        document.getElementById("result");

      const resultText =
        document.getElementById("resultText");

      const status =
        document.getElementById("resultStatus");


      if (!topic) {

        alert("Please enter your topic or details.");

        return;

      }


      button.disabled = true;

      button.textContent = "Generating...";

      result.style.display = "block";

      status.textContent = "Generating";


      resultText.textContent =
        "RG Creator AI is preparing your content...";


      try {

        const message = `

You are the Content Writer inside RG Creator AI.

Writing category: ${selectedCategory}

Writing tool: ${tool}

Topic/details:
${topic}

Tone: ${tone}

Length: ${length}

Create the requested content.

Follow the user's requested format carefully.
Make the result useful, natural and ready to use.
Do not add unnecessary explanations.

        `.trim();


        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message
          })

        });


        const data = await response.json();


        if (!response.ok || !data.ok) {

          throw new Error(
            data?.error ||
            "Unable to generate content."
          );

        }


        lastGenerated = data.reply || "";

        resultText.textContent =
          lastGenerated;

        status.textContent = "Generated";


      } catch (error) {

        resultText.textContent =
          error.message ||
          "Something went wrong.";

        status.textContent = "Error";

      } finally {

        button.disabled = false;

        button.textContent = "✦ Generate";

      }

    }


    /* COPY */

    async function copyResult() {

      const text =
        document.getElementById("resultText")
          .textContent;

      if (!text) return;

      try {

        await navigator.clipboard.writeText(text);

        alert("Copied!");

      } catch {

        alert("Copy failed.");

      }

    }


    /* EDIT */

    function editResult() {

      const result =
        document.getElementById("resultText");

      result.contentEditable = "true";

      result.focus();

    }


    /* REGENERATE */

    function regenerateContent() {

      if (!lastGenerated) {

        alert("Generate content first.");

        return;

      }

      generateContent();

    }


    /* SHARE */

    async function shareResult() {

      const text =
        document.getElementById("resultText")
          .textContent;

      if (!text) return;


      if (navigator.share) {

        try {

          await navigator.share({

            title: "RG Creator AI",

            text

          });

        } catch {}

      } else {

        await copyResult();

      }

    }


    /* MORE */

    function openMore() {

      alert(
        "More options will be connected with RG Creator AI settings."
      );

    }


    /* NAVIGATION */

    function goBack() {

      history.back();

    }


    function goHome() {

      window.location.href = "/";

    }


    function goChat() {

      window.location.href =
        "/pages/chat.html";

    }


    function goProfile() {

      alert(
        "Profile & Settings will be added later."
      );

    }

  </script>

</body>
</html>
