<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RG Creator AI - Image Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 16px;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: auto;
    }

    /* TOP BAR */

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .back-btn {
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 32px;
      width: 42px;
      height: 42px;
      padding: 0;
      cursor: pointer;
    }

    .title-box h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
    }

    .title-box p {
      margin: 4px 0 0;
      color: #777;
      font-size: 13px;
    }

    /* PROMPT */

    .label {
      display: block;
      color: #999;
      font-size: 14px;
      margin-bottom: 9px;
    }

    #prompt {
      display: block;
      width: 100%;
      min-height: 130px;

      resize: vertical;

      border: 1px solid #292929;
      border-radius: 18px;

      outline: none;

      background: #111;
      color: #fff;

      padding: 16px;

      font-size: 16px;
      line-height: 1.5;
    }

    #prompt:focus {
      border-color: #555;
    }

    #prompt::placeholder {
      color: #666;
    }

    /* GENERATE BUTTON */

    #generateBtn {
      width: 100%;
      min-height: 52px;

      margin-top: 12px;

      border: 0;
      border-radius: 15px;

      background: #fff;
      color: #000;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    #generateBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* LOADING */

    #loading {
      display: none;

      text-align: center;

      color: #999;

      font-size: 14px;

      margin-top: 18px;
    }

    #loading.show {
      display: block;
    }

    /* ERROR */

    #error {
      display: none;

      margin-top: 18px;

      padding: 13px 14px;

      border-radius: 14px;

      background: #160b0b;

      border: 1px solid #3a2020;

      color: #ff8b8b;

      font-size: 14px;

      line-height: 1.5;
    }

    #error.show {
      display: block;
    }

    /* RESULT */

    #result {
      display: none;

      margin-top: 28px;
    }

    #result.show {
      display: block;
    }

    .result-title {
      color: #999;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .image-wrapper {
      overflow: hidden;

      border-radius: 18px;

      border: 1px solid #292929;

      background: #111;
    }

    #generatedImage {
      width: 100%;
      display: block;
      height: auto;
    }

    /* ACTIONS */

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .action {
      flex: 1;

      min-height: 48px;

      border: 1px solid #292929;

      border-radius: 14px;

      background: transparent;

      color: #fff;

      font-size: 15px;

      cursor: pointer;
    }

    .action:hover {
      background: #111;
    }

    @media (max-width: 480px) {

      body {
        padding: 14px 12px 30px;
      }

      .title-box h1 {
        font-size: 19px;
      }

      #prompt {
        min-height: 120px;
      }

    }
  </style>
</head>

<body>

  <main class="page">

    <!-- TOP BAR -->

    <div class="topbar">

      <button
        class="back-btn"
        type="button"
        onclick="goBack()"
        aria-label="Back"
      >
        ‹
      </button>

      <div class="title-box">

        <h1>AI Image Generator</h1>

        <p>Create images with RG Creator AI</p>

      </div>

    </div>


    <!-- PROMPT -->

    <label
      class="label"
      for="prompt"
    >
      Describe the image you want
    </label>

    <textarea
      id="prompt"
      placeholder="Example: A cinematic sunset over mountains, realistic photography..."
    ></textarea>


    <!-- GENERATE -->

    <button
      id="generateBtn"
      type="button"
      onclick="generateImage()"
    >
      Generate Image
    </button>


    <!-- LOADING -->

    <div
      id="loading"
    >
      Creating your image...
    </div>


    <!-- ERROR -->

    <div
      id="error"
    ></div>


    <!-- RESULT -->

    <section
      id="result"
    >

      <div class="result-title">
        Generated Image
      </div>

      <div class="image-wrapper">

        <img
          id="generatedImage"
          alt="AI generated image"
        >

      </div>


      <div class="actions">

        <button
          class="action"
          type="button"
          onclick="downloadImage()"
        >
          ↓ Download
        </button>

        <button
          class="action"
          type="button"
          onclick="generateImage()"
        >
          ↻ Regenerate
        </button>

      </div>

    </section>

  </main>


  <script>

    let imageBase64 = "";
    let imageMimeType = "image/png";


    /* BACK */

    function goBack() {

      if (window.history.length > 1) {

        window.history.back();

      } else {

        window.location.href = "../index.html";

      }

    }


    /* ERROR */

    function showError(message) {

      const error =
        document.getElementById("error");

      error.textContent = message;

      error.classList.add("show");

    }


    function clearError() {

      const error =
        document.getElementById("error");

      error.textContent = "";

      error.classList.remove("show");

    }


    /* GENERATE */

    async function generateImage() {

      const prompt =
        document
          .getElementById("prompt")
          .value
          .trim();


      const button =
        document.getElementById("generateBtn");

      const loading =
        document.getElementById("loading");

      const result =
        document.getElementById("result");


      clearError();


      if (!prompt) {

        showError(
          "Please describe the image you want."
        );

        document
          .getElementById("prompt")
          .focus();

        return;

      }


      button.disabled = true;

      button.textContent =
        "Generating...";

      loading.classList.add("show");

      result.classList.remove("show");


      try {

        const response =
          await fetch(
            "/api/image",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                prompt: prompt
              })
            }
          );


        let data;

        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "The server returned an invalid response."
          );

        }


        if (!response.ok) {

          throw new Error(
            data?.details ||
            data?.error ||
            `Image generation failed (${response.status}).`
          );

        }


        if (!data?.image) {

          throw new Error(
            "No image was returned by Gemini."
          );

        }


        imageBase64 =
          data.image;


        imageMimeType =
          data.mimeType ||
          "image/png";


        const image =
          document
            .getElementById(
              "generatedImage"
            );


        image.src =
          `data:${imageMimeType};base64,${imageBase64}`;


        result.classList.add("show");


        setTimeout(() => {

          result.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        }, 100);


      } catch (error) {

        console.error(
          "Image generation error:",
          error
        );


        showError(
          error?.message ||
          "Unable to generate the image."
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Generate Image";

        loading.classList.remove("show");

      }

    }


    /* DOWNLOAD */

    function downloadImage() {

      if (!imageBase64) {

        showError(
          "Generate an image first."
        );

        return;

      }


      try {

        const link =
          document.createElement("a");


        link.href =
          `data:${imageMimeType};base64,${imageBase64}`;


        let extension = "png";


        if (
          imageMimeType ===
          "image/jpeg"
        ) {

          extension = "jpg";

        } else if (
          imageMimeType ===
          "image/webp"
        ) {

          extension = "webp";

        }


        link.download =
          `rg-creator-ai-${Date.now()}.${extension}`;


        document.body.appendChild(link);

        link.click();

        link.remove();


      } catch (error) {

        console.error(
          "Download error:",
          error
        );


        showError(
          "Image download failed."
        );

      }

    }


    /* ENTER TO GENERATE */

    document
      .getElementById("prompt")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            generateImage();

          }

        }
      );

  </script>

</body>
</html>
