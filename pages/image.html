<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RG Creator AI — Image Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 900px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
    }

    .back {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }

    .subtitle {
      color: #aaa;
      margin-top: -20px;
      margin-bottom: 25px;
    }

    .box {
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      background: #080808;
      color: #fff;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #777;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #ddd;
      font-weight: 600;
    }

    select {
      width: 100%;
      background: #080808;
      color: #fff;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .generate {
      background: #fff;
      color: #000;
    }

    .generate:disabled {
      opacity: .5;
    }

    .status {
      color: #aaa;
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .result {
      display: none;
    }

    .result img {
      width: 100%;
      border-radius: 16px;
      display: block;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .secondary {
      background: #181818;
      color: #fff;
      border: 1px solid #303030;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="title">🖼️ AI Image</div>
    <a class="back" href="../index.html">Home</a>
  </div>

  <div class="subtitle">
    Create images from your ideas with RG Creator AI.
  </div>

  <div class="box">

    <label>What do you want to create?</label>

    <textarea id="prompt"
      placeholder="Describe the image you want to create..."></textarea>

  </div>

  <div class="box">

    <div class="row">

      <div>
        <label>Style</label>

        <select id="style">
          <option>Realistic</option>
          <option>Cinematic</option>
          <option>Anime</option>
          <option>3D</option>
          <option>Illustration</option>
          <option>Digital Art</option>
          <option>Photography</option>
          <option>Minimal</option>
        </select>
      </div>

      <div>
        <label>Aspect Ratio</label>

        <select id="ratio">
          <option>1:1</option>
          <option>16:9</option>
          <option>9:16</option>
          <option>4:5</option>
        </select>
      </div>

    </div>

  </div>

  <div class="box">

    <button class="generate" id="generateBtn">
      ✦ Generate Image
    </button>

    <div class="status" id="status">
      Ready.
    </div>

  </div>

  <div class="box result" id="result">

    <img id="generatedImage" alt="Generated image">

    <div class="actions">

      <button class="secondary" id="downloadBtn">
        ⬇️ Download
      </button>

      <button class="secondary" id="regenerateBtn">
        ↻ Regenerate
      </button>

      <button class="secondary" id="shareBtn">
        🔗 Share
      </button>

    </div>

  </div>

</div>

<script>

const promptInput = document.getElementById("prompt");
const styleInput = document.getElementById("style");
const ratioInput = document.getElementById("ratio");

const generateBtn = document.getElementById("generateBtn");
const regenerateBtn = document.getElementById("regenerateBtn");

const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const generatedImage = document.getElementById("generatedImage");

let lastPrompt = "";

async function generateImage() {

  const prompt = promptInput.value.trim();

  if (!prompt) {
    statusBox.textContent = "Please enter an image description.";
    return;
  }

  lastPrompt = prompt;

  generateBtn.disabled = true;
  regenerateBtn.disabled = true;

  resultBox.style.display = "none";

  statusBox.textContent = "Creating your image...";

  try {

    /*
      IMPORTANT:
      This endpoint will be connected to the RG Creator AI
      image-generation backend.
    */

    const response = await fetch("/api/image", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt: prompt,
        style: styleInput.value,
        ratio: ratioInput.value
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        data.error || "Image generation failed."
      );
    }

    if (!data.image) {
      throw new Error(
        "No image was returned by the server."
      );
    }

    generatedImage.src = data.image;

    resultBox.style.display = "block";

    statusBox.textContent = "Image generated successfully.";

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Error: " + error.message;

  } finally {

    generateBtn.disabled = false;
    regenerateBtn.disabled = false;
  }
}

generateBtn.addEventListener(
  "click",
  generateImage
);

regenerateBtn.addEventListener(
  "click",
  generateImage
);

document.getElementById("downloadBtn")
  .addEventListener("click", () => {

    if (!generatedImage.src) return;

    const link = document.createElement("a");

    link.href = generatedImage.src;
    link.download = "rg-creator-ai-image.png";

    link.click();
  });

document.getElementById("shareBtn")
  .addEventListener("click", async () => {

    if (!generatedImage.src) return;

    try {

      await navigator.share({
        title: "RG Creator AI",
        text: "Created with RG Creator AI",
        url: generatedImage.src
      });

    } catch (error) {

      console.log("Share cancelled.");

    }
  });

</script>

</body>
</html>
