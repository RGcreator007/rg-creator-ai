<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RG Creator AI - Image Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100%;
    }

    body {
      padding: 20px 16px 40px;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      padding: 0;
    }

    .title-area h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    .title-area p {
      margin: 4px 0 0;
      color: #888;
      font-size: 13px;
    }

    .generator {
      width: 100%;
    }

    .prompt-label {
      display: block;
      margin-bottom: 10px;
      color: #aaa;
      font-size: 14px;
    }

    #prompt {
      width: 100%;
      min-height: 130px;
      resize: vertical;

      background: #111;
      color: #fff;

      border: 1px solid #292929;
      border-radius: 18px;

      padding: 16px;
      font-size: 16px;
      line-height: 1.5;

      outline: none;
    }

    #prompt:focus {
      border-color: #555;
    }

    #prompt::placeholder {
      color: #666;
    }

    .generate-btn {
      width: 100%;
      margin-top: 14px;

      border: none;
      border-radius: 16px;

      background: #fff;
      color: #000;

      min-height: 52px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
      transition: opacity 0.2s;
    }

    .generate-btn:hover {
      opacity: 0.9;
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 18px;
      color: #999;
      font-size: 14px;
      text-align: center;
    }

    .status.show {
      display: block;
    }

    .result {
      display: none;
      margin-top: 28px;
    }

    .result.show {
      display: block;
    }

    .result-title {
      margin-bottom: 12px;
      color: #aaa;
      font-size: 14px;
    }

    .image-container {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
      border: 1px solid #292929;
    }

    #generatedImage {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .action-btn {
      flex: 1;
      min-height: 48px;

      border: 1px solid #292929;
      border-radius: 14px;

      background: #111;
      color: #fff;

      font-size: 15px;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #181818;
    }

    .error {
      display: none;

      margin-top: 18px;
      padding: 14px;

      border-radius: 14px;
      border: 1px solid #3a2020;

      background: #160d0d;
      color: #ff8b8b;

      font-size: 14px;
      line-height: 1.5;
    }

    .error.show {
      display: block;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px 30px;
      }

      .title-area h1 {
        font-size: 20px;
      }

      #prompt {
        min-height: 120px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- TOP BAR -->
    <div class="topbar">

      <button
        class="back-btn"
        onclick="goBack()"
        aria-label="Back"
      >
        ‹
      </button>

      <div class="title-area">
        <h1>AI Image Generator</h1>
        <p>Create images with RG Creator AI</p>
      </div>

    </div>


    <!-- GENERATOR -->
    <div class="generator">

      <label
        class="prompt-label"
        for="prompt"
      >
        Describe the image you want
      </label>

      <textarea
        id="prompt"
        placeholder="Example: A cinematic night city with neon lights, realistic photography..."
      ></textarea>


      <button
        id="generateBtn"
        class="generate-btn"
        onclick="generateImage()"
      >
        Generate Image
      </button>


      <div
        id="status"
        class="status"
      >
        Creating your image...
      </div>


      <!-- ERROR -->
      <div
        id="error"
        class="error"
      ></div>


      <!-- RESULT -->
      <div
        id="result"
        class="result"
      >

        <div class="result-title">
          Generated Image
        </div>

        <div class="image-container">

          <img
            id="generatedImage"
            alt="Generated AI image"
          >

        </div>


        <div class="image-actions">

          <button
            class="action-btn"
            onclick="downloadImage()"
          >
            ↓ Download
          </button>

          <button
            class="action-btn"
            onclick="generateImage()"
          >
            ↻ Regenerate
          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    let generatedImageData = "";
    let generatedMimeType = "image/png";


    function goBack() {

      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "../index.html";
      }

    }


    async function generateImage() {

      const promptElement =
        document.getElementById("prompt");

      const generateBtn =
        document.getElementById("generateBtn");

      const status =
        document.getElementById("status");

      const result =
        document.getElementById("result");

      const error =
        document.getElementById("error");

      const image =
        document.getElementById("generatedImage");


      const prompt =
        promptElement.value.trim();


      // Clear old error
      error.classList.remove("show");
      error.textContent = "";


      if (!prompt) {

        showError(
          "Please enter a description for the image."
        );

        promptElement.focus();

        return;
      }


      // Loading
      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";

      status.classList.add("show");

      result.classList.remove("show");


      try {

        const response = await fetch(
          "/api/image",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              prompt: prompt
            })
          }
        );


        let data = {};

        try {
          data = await response.json();
        } catch (jsonError) {
          throw new Error(
            "Server returned an invalid response."
          );
        }


        if (!response.ok) {

          throw new Error(
            data?.details ||
            data?.error ||
            `Image generation failed (${response.status}).`
          );

        }


        if (!data.image) {

          throw new Error(
            "No image was returned by the AI."
          );

        }


        generatedImageData =
          data.image;

        generatedMimeType =
          data.mimeType ||
          "image/png";


        image.src =
          `data:${generatedMimeType};base64,${generatedImageData}`;


        result.classList.add("show");


        // Scroll to result
        setTimeout(() => {

          result.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        }, 100);


      } catch (err) {

        console.error(
          "Image generation error:",
          err
        );

        showError(
          err.message ||
          "Something went wrong while generating the image."
        );

      } finally {

        generateBtn.disabled = false;
        generateBtn.textContent = "Generate Image";

        status.classList.remove("show");

      }

    }


    function showError(message) {

      const error =
        document.getElementById("error");

      error.textContent = message;
      error.classList.add("show");

    }


    function downloadImage() {

      if (!generatedImageData) {

        showError(
          "Generate an image first."
        );

        return;
      }


      try {

        const link =
          document.createElement("a");


        link.href =
          `data:${generatedMimeType};base64,${generatedImageData}`;


        const extension =
          generatedMimeType === "image/jpeg"
            ? "jpg"
            : generatedMimeType === "image/webp"
              ? "webp"
              : "png";


        link.download =
          `rg-creator-ai-${Date.now()}.${extension}`;


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

      } catch (error) {

        console.error(
          "Download error:",
          error
        );

        showError(
          "Image download failed."
        );

      }

    }


    // Enter = Generate
    // Shift + Enter = New line
    document
      .getElementById("prompt")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            generateImage();

          }

        }
      );

  </script>

</body>
</html>
